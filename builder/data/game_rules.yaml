# Game rules PoB doesn't enforce, or enforces more loosely than the game, for one patch.
# PoB's data has bases for weapon classes that aren't in the game yet, and its off-hand check
# (ItemsTab:IsItemValidForSlot) lets almost any one-hander go beside another. Skeletons, gear
# slots and rares all read this table (builder/data/rules.py). Check it against the patch notes
# and poe2db when the game changes; each rule lists its sources and how sure we are.

patch: "0.5.5"

weapon_classes:
  # Item classes that drop and can be used. Swords come with the Duelist in 1.0; axes, daggers,
  # claws and flails belong to classes not in the game yet. Their bases are in PoB's data, but
  # they don't drop, so they're never proposed as normal or rare items (a priced unique of such a
  # class would still be one: being on poe.ninja means it exists).
  released: [Bow, Crossbow, Staff, Talisman, One Hand Mace, Two Hand Mace, Spear, Wand, Sceptre]
  unreleased: [Claw, Dagger, Flail, One Hand Axe, One Hand Sword, Two Hand Axe, Two Hand Sword]
  confidence: high
  # THE USER, 24 Nov 2026 ~04:45 (card: "Can a player get rare Claws, Daggers, One/Two-Hand Swords, One/Two-Hand Axes or
  # Flails in the current league (0.5)?"): "Not yet: exclude"; the 1.0 preview option brings 1.0's back, asterisked
  # (rules._preview_rules). Kept out of skeletons (skeletons.main_hands, code_hands) and item options (normal_base_ok);
  # tests/test_searchb8_unreleased.py checks both switch states.
  sources:
    - "the user's card answer, 24 Nov 2026 (above)"
    - "AUDIT38 F11 (scratch/audit38/findings.md, 24 Nov 2026): 0 RARE listings of the 7 classes in Forbidden Rites or Runes of Aldur (11 trade searches, any state); only mod-less 'INCOMPLETE' placeholder uniques; poe2db's class pages and BaseItemTypes carry no release flag"
    - "https://www.notebookcheck.net/Path-of-Exile-2-is-going-1-0-but-I-m-still-wondering-where-the-rest-of-the-game-is.1379931.0.html"
    - "https://www.aoeah.com/news/4759--poe-2-055-new-ascendancies--class-changes"
    - "https://maxroll.gg/poe2/resources/poe-2-class-overview"

off_hand:
  # Main hand -> what the off hand may hold. Martial weapons are dual wielded only with the same
  # item class (so in this patch only One Hand Mace + One Hand Mace); spears and wands never go in
  # the off hand; a sceptre goes in the off hand beside a one-handed weapon, but two sceptres
  # can't be held together. Two-handed weapons take no off hand except a bow's quiver (Giant's
  # Blood dual wielding of two-handers isn't modeled).
  by_main_hand:
    One Hand Mace: [Shield, Focus, Sceptre, One Hand Mace]
    Spear: [Shield, Focus, Sceptre]
    Wand: [Shield, Focus, Sceptre]
    Sceptre: [Shield, Focus]
    Bow: [Quiver]
  confidence: medium
  conflicts:
    - "Spear + Sceptre: the wiki's spear page allows a sceptre beside a spear; its dual-wielding page
      says spears can't be held with any other weapon. PoB allows it and the user's Ritualist
      reference (benchmarks/reference/2b75c.txt) holds one, so it stays allowed until an in-game
      test says otherwise."
  sources:
    - "https://poe2wiki.net/wiki/Dual_wield"
    - "https://www.poe2wiki.net/wiki/Spears"
    - "https://www.poe2wiki.net/wiki/Master_Weapon"
    - "https://steamcommunity.com/app/2694490/discussions/0/596260925367967924"
  test_in_game: "Try a sceptre in the off hand beside a spear, and a one-handed mace beside a spear."
  # Passives that let a main hand hold one more off hand (RULE_AUDIT #7). A skeleton with such a
  # pair requires the passive (Skeleton.requires_passive; the search allocates it). PoB allows both
  # under the flags these lines parse to (ModParser "you can equip a focus while wielding a staff":
  # InstrumentsOfPower, "... non-unique sceptre while wielding a talisman": LordOfTheWilds;
  # ItemsTab:IsItemValidForSlot), and calculates Instruments of Power's own "50% reduced bonuses
  # gained from Equipped Focus" (CalcSetup EffectOfBonusesFromFocus).
  passive_exceptions:
    - main_hand: Staff
      sub_type: ""  # a caster staff. PoB's check takes any "Staff" type, quarterstaves too; in the
      # game the Quarterstaff is its own item class and the line says "Staff" (UNVERIFIED: no
      # in-game test). Left out until checked: a build the game won't allow is worse than a missed one.
      off_hand: Focus
      passive: Instruments of Power  # Disciple of Varashta notable (tree.json node 20701)
      sources: ["tree.json node 20701 stats", "PoB ModParser.lua:2620, ItemsTab.lua:2712-2716"]
    - main_hand: Talisman
      off_hand: Sceptre
      non_unique: true  # "a non-Unique Sceptre"
      passive: Lord of the Wilds  # keystone (tree.json node 61942); 50% less Spirit, 50% less Reservation Efficiency
      # The off-hand slot then takes no unique (gear.py SlotSpec.non_unique, set by inner.py from this
      # flag): the 9 unique sceptres stay out of that hand, as the game requires.
      sources: ["tree.json node 61942 stats", "PoB ModParser.lua:2621, ItemsTab.lua:2714-2715"]
    - main_hand: Two Hand Mace
      off_hand: Sceptre
      passive: Giant's Blood  # keystone: "You can wield Two-Handed Axes, Maces and Swords in one hand"
      named_only: true  # only for a request or code that names this pair: the open search's weapons don't change
      # (SEARCHB7) The pair live builds prove: example builds 6, 13 and 17 allocate Giant's Blood and hold a Two Hand
      # Mace + Sceptre.
      confidence: high  # (RESEARCH64 R64-7) seen in game: Mattjestic, youtube p88pl4DPTzE (9 Jun 2026, 0.5), 528 s:
      # Chober Chaber (a Two Hand Mace) beside Sylvan's Effigy (a Sceptre) in the off-hand slot
      sources: ["tree.json Giant's Blood stats", "PoB ModParser.lua:2619, ItemsTab.lua:2718-2721", "the user's example builds 6, 13, 17", "RESEARCH64 R64-7 (youtube p88pl4DPTzE, 528 s)"]
    # (SEARCHB8; the manager's 23:08 ruling: offer each off-hand kind PoB allows once a second source backs it, as the
    # Sceptre, named only) PoB's ItemsTab 2718-2721 is the first source for each. Axes and swords are unreleased (above),
    # so only the Two Hand Mace main hand is offered. Patch notes: 0.2.0 / 0.3.0 change the keystone's costs and Life; 0.3.0c
    # fixes "allocating the same weapon for each weapon set with the Giant's Blood Keystone"; none removes an off-hand kind
    # (no hit is not proof of no silent change). A Focus: R57-16 rated it MEDIUM-LOW and left it out; RESEARCH64 R64-7
    # raised it to MEDIUM (no sighting) and the manager (26 Nov 02:57) asked to offer it labelled MEDIUM: its own row below.
    # Never a Quiver (KeywordPopups: "only usable while you have a Bow equipped").
    - main_hand: Two Hand Mace
      off_hand: Two Hand Mace
      passive: Giant's Blood
      named_only: true
      confidence: high  # (RESEARCH57 R57-16, research/giants-blood-offhand-r57.md: HIGH for maces) dual two-handed maces: Maxroll's Sunder Totem Titan guide (0.1.1, archived 4 Apr 2025), "+14 to
      # Melee Skills from dual-wielding 2x Two-Handed Maces using Giant's Blood"; forum thread 3601232 (Dec 2024 - Feb 2025)
      # 0.3.0c's weapon-set fix ("the same weapon for each weapon set with the Giant's Blood Keystone") shows the pairing
      # is supported; KeywordPopups DualWield: "using two Martial Weapons, one in each hand"
      sources: ["PoB ItemsTab.lua:2718-2721", "maxroll.gg sunder-totem-titan-build-guide", "pathofexile.com forum 3601232", "RESEARCH57 R57-16", "patch 0.3.0c"]
    - main_hand: Two Hand Mace
      off_hand: Shield
      passive: Giant's Blood
      named_only: true
      confidence: high  # (R57-16) KeywordPopups Shield: "equipped in your off hand", no main-hand restriction; forum 3621333
      # (Dec 2024): "taking giant's blood to wield a two-hander while equipping a shield"; players' early-access forum posts ("go giant's blood and run 2h + shield"); the wiki's keystone
      # text in search snippets ("another one-handed or two-handed melee weapon or a shield")
      sources: ["PoB ItemsTab.lua:2718-2721", "RESEARCH57 R57-16", "KeywordPopups Shield", "pathofexile.com forum 3621333", "poe2wiki Giant's Blood (search snippet)"]
    - main_hand: Two Hand Mace
      off_hand: One Hand Mace
      passive: Giant's Blood
      named_only: true
      confidence: medium  # (R57-16: follows from the keystone + KeywordPopups DualWield; no page shows the exact pair) the wiki's keystone text (search snippet, above); deltiasgaming / sportskeeda: "one
      # two-handed weapon and one one-handed weapon". No live build seen
      sources: ["PoB ItemsTab.lua:2718-2721", "RESEARCH57 R57-16", "poe2wiki Giant's Blood (search snippet)", "deltiasgaming.com, sportskeeda.com"]
    - main_hand: Two Hand Mace
      off_hand: Focus
      passive: Giant's Blood
      named_only: true
      confidence: medium  # (RESEARCH64 R64-7: MEDIUM, no sighting; the manager 26 Nov 02:57: offer it, labelled MEDIUM)
      # KeywordPopups Focus: "Foci are armour items that are equipped in your off hand and require Intelligence to equip",
      # no main-hand condition (unlike the Quiver's "only usable while you have a Bow equipped"); Giant's Blood: "You can
      # wield Two-Handed Axes, Maces and Swords in one hand", which frees the off hand as for a Shield (HIGH, R57-16). PoB
      # allows it (ItemsTab.lua 2718-2719: beside a Giant's Blood mace, "Shield or Focus or Sceptre"). A Focus's lines are
      # mostly spell / Energy Shield: it pays a spell or minion main beside the mace more than an attack (the search decides).
      sources: ["PoB ItemsTab.lua:2718-2721", "RESEARCH64 R64-7", "KeywordPopups Focus", "RESEARCH57 R57-16"]

floor_blockers:
  # Item lines that pin a stat, so a request's floor on that stat can never be met while the item
  # is worn. Such items are never proposed under such a floor (a required unique still is). Without
  # this, Veil of the Night trapped gate 4's searches: it lifts -50% resistances to 0 in one move,
  # after which no resistance affix anywhere is worth anything, and the floors stay unmet.
  lines:
    "You have no Elemental Resistances": [resists.fire, resists.cold, resists.lightning]
    "Cannot have Energy Shield": [energy_shield]
    "You have no Spirit": [spare_spirit]
  confidence: high
  sources: ["PoB2 data: Data/Uniques (Veil of the Night, Immaculate Adherence, Kaom's Heart)"]

unique_only_bases:
  # Bases only uniques use (the Golden "demigod" items: Golden Visage, Golden Mantle, ...). PoB
  # tags them; they never drop as normal, magic or rare items.
  tags: [demigods]
  confidence: high
  sources: ["PoB2 data: Data/Bases/*.lua (tags demigods, not_for_sale)"]
