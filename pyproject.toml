[project]
name = "poe2-builder"
version = "0.1.0"
description = "Path of Exile 2 build optimizer driven by a headless Path of Building engine"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.161.1",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["builder"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
