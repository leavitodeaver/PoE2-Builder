    "Buff grants (40-59)% of damage Gained as Cold damage" (poe2db). The buff lasts 5 s plus 0.2 s per Rage spent (it
    spends all your Rage), and its 22 s cooldown recovers while it lasts (0.4.0c). Uptime from the build's maximum Rage
