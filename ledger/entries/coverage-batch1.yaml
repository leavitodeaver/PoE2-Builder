- id: gem-lunar-blessing-cold
  title: Lunar Blessing, damage gained as Cold while the buff lasts
  kind: gem_stat
  skill: Lunar Blessing
  applies_to: build
  match: '^wolf_lunar_blessing_all_damage_%_to_gain_as_cold_damage$'
