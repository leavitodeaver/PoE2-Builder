  title: Bastion of Light, Raise Shield inflicts Parried (50% more Attack damage taken, 2 s)
  kind: pob_gap
  match: '^Raise Shield inflicts Parried for (\d+) seconds on Hit$'
  replace: ['25% more Attack Damage while holding a Shield']
