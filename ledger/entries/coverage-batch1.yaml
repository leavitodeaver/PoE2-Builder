- id: ancestral-bond
  title: Ancestral Bond, your Totem Limit is doubled (PoB's totem limit +1; Spell Totem's count is models.totem_model's)
  kind: pob_gap
  match: '^Your Totem Limit is doubled$'
  replace: ['+1 to maximum number of Summoned Totems']
  confidence: reported
  notes: >-
    PoB's totem limit starts at 1 here; doubled is one more, so the stand-in adds +1 to PoB's ActiveTotemLimit,
    which PoB uses for a totem skill's ailment stacks (CalcOffence 5264: stacks x active totems) and "per Summoned
    Totem" lines (TotemsSummoned). A build with more totem limit from elsewhere gets only +1, not double (an
    undercount, not counted). Spell Totem's own count is models.totem_model's (MECHB4): it reads this line itself
    and doubles the gem level's limit (2 -> 4 at level 20), capped by free Spirit at 75 per totem; PoB's one-totem
    DPS is scaled there, not by this +1.
  sources: ["https://poe2db.tw/us/Ancestral_Bond"]
  test_in_game: "Place totems with Ancestral Bond: two of the same totem stay at once."
  status: proposed

- id: ancestral-bond-charges
