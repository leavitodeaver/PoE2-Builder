# Safrin's Resolve, Eshtera's Path, Zaida's Longevity (model: resist_rings) ---------------------------------------------

- id: resist-per-item
  title: Resistances per equipped item with a resistance modifier of an element (Safrin's, Eshtera's, Zaida's)
  kind: pob_gap
  model: resist_rings
  match: '^\+?(?:\(-?\d+--?\d+\)|-?\d+)% to (?:Fire|Cold|Lightning) and (?:Fire|Cold|Lightning) Resistances per Equipped Item with an? (?:Fire|Cold|Lightning) Resistance Modifier$'
  replace: []
  confidence: verified_by_you
  notes: >-
    builder/search/models.py resist_rings_model counts the equipped items with a resistance modifier of that element: its
    own, "+% to all Elemental Resistances", a two-element one that includes it, or a socketed rune granting it (the user's
    rule). Counted from the item lines at each resolve, so a gear or rune change shows from the next resolve.
  sources: ["https://poe2db.tw/us/Safrins_Resolve", "the user, 6 Nov 2026: 'yes. you can also put a rune with fire resist into a piece of gear and it those rings will count that item'"]
  test_in_game: "Equip the ring, then swap one item with a Fire Resistance modifier for one without: the ring's Cold and Lightning Resistance falls by its value."
  status: proposed

