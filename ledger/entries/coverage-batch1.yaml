- id: bastion-of-light-parried
  title: Bastion of Light, Raise Shield inflicts Parried (50% more Attack damage taken, 2 s)
  kind: pob_gap
  match: '^Raise Shield inflicts Parried for (\d+) seconds on Hit$'
  replace: ['25% more Attack Damage while holding a Shield']
  confidence: theory
  notes: >-
    Parried: "Takes substantially more Attack damage and cannot Evade"; the stat is
    attack_damage_taken_+%_final_from_parried, 50% more (poe2db Parry and Parried). From Raise Shield's hit it lasts 2 s.
    Reasonable play (the user's rule): you raise the shield to keep the boss Blinded (Bastion of Light's other line, 4 s
    Blind), so once every 4 s, and the boss is Parried 2 s of every 4: 50% more x half the time, counted as 25% more Attack
    Damage while holding a Shield. Attacks only; the time spent raising the shield isn't taken off your attacks.
  sources: ["https://poe2db.tw/us/Bastion_of_Light", "https://poe2db.tw/us/Parry", "https://poe2db.tw/us/Parried", "https://poe2db.tw/us/Blind"]
  test_in_game: "Raise your shield into a boss and hit it within 2 s: the hit should be 1.5x one outside the window."
  status: proposed

- id: tribute-stat
  title: "Tribute (Undying Hate's conquered passives): PoB parses \"+N to Tribute\" and the threshold lines itself; entry inert, retired"
  kind: pob_gap
  match: '^\+(\(\d+-\d+\)|\d+) to Tribute$'
  replace: []
  confidence: datamined
  notes: >-
    Retired (COV8; AUDIT14 A14-1). The old note said only Grand Tribute and Twice Bled read Tribute: WRONG. 25
    Undying Hate conquest notables (PassiveSkills AbyssJewelHistoricOverrideNotable_T_T_1 to _25) read "if you have
    at least 100 (200) Tribute" (maximum resistances, +1 maximum charges, Kingslayer's damage, an extra Poison
    stack, Aura effect, Spirit, Life, Mana...), and rage_decay_speed_+%_per_10_tribute reads it too (RESEARCH17 #89)
    (checked by AUDIT14: every Stats.json id holding "tribute" and its carriers in Mods, PassiveSkills and stat
    sets; PoB ModParser 172 / 1656 / 1699). PoB parses "+5 to Tribute" itself (ModCache 1061, Tribute BASE;
    CalcPerform 493 sums it into output.Tribute) and the threshold wordings (StatThreshold / PerStat on Tribute),
    and a pob_gap entry is consulted only for lines PoB ignores, so this entry never fired: retiring it moves no
    number. Nothing may drop Tribute lines on the old claim.
  sources: ["https://poe2db.tw/us/Undying_Hate"]
  test_in_game: "Not needed for the calculated numbers."
  status: retired  # COV8: PoB parses the Tribute lines itself (A14-1); the old "only two readers" note was wrong

