# Coverage audit, first batch (2026-11-06): the highest-ranked mechanics nothing counted
# (builder/ledger/coverage.py), translated into lines PoB calculates. Research: poe2db.tw
# (datamined from the game files), mainly its glossary https://poe2db.tw/us/Keywords. PoE2 0.5.x;
# recheck every one at the 1.0 refresh (11 Dec 2026).

# Conditions switched on by the build's skills ----------------------------------------------------

- id: RepeatableSpell
  title: The main skill is a spell that can Repeat
  kind: condition
  skill_types: [Spell, Multicastable]
  not_skill_types: [Instant, Channel]
  not_triggered: true
  confidence: datamined
  notes: >-
    PoB's skill type Multicastable is the game's Repeatable (poe2db's list of Repeating Skills: Spark, Fireball, Arc,
    Comet ...). KeywordPopups Repeat (game files 26476662): "[Trigger|Triggered] skills, Instant skills, and [Channelling]
    skills cannot Repeat", so the condition is off when the main skill is Instant or Channelling (its gem's types) or
    Triggered in PoB's calculation of the build: a meta gem (Cast on Critical, Cast on Dodge, Cast on Minion Death,
    Spellslinger ...) or another trigger support adds Triggered to the skills it supports, and skills only triggers
    fire carry it themselves (RESEARCH6, research/now-and-again.md; this was an overcount: those main spells got the 19%).
    None of PoB's 47 Spell + Multicastable gems is typed Instant or Channel today (checked: gems.json skillTypes, all 47), so that half is a guard. Bone Blast is
    on poe2db's list but not Multicastable in PoB's data: not counted (an undercount).
  sources: ["https://poe2db.tw/us/Repeating_Skills", "PoB skill data (skillTypes)", "game files KeywordPopups Repeat"]
  status: proposed

- id: CascadableSpell
  title: The main skill is a spell that can Echo (Cascadable)
  kind: condition
  skill_types: [Spell, Cascadable]
  confidence: datamined
  notes: "Cascadable: warcries and non-channelling spells that affect an area around you or a targeted location (poe2db)."
  sources: ["https://poe2db.tw/us/Cascadable_Skills", "PoB skill data (skillTypes)"]
  status: proposed

# Damage ----------------------------------------------------------------------------------------

- id: aftershock-chance
  title: Earthbreaker, chance for your Slams to cause an additional Aftershock
  kind: pob_gap
  match: '^(\d+)% chance for Slam Skills you use yourself to cause an additional Aftershock$'
  replace: ['Slam Skills have {1}% more DPS']
  confidence: datamined
  notes: >-
    "If not otherwise specified, the Aftershock will deal the same damage as the initial impact,
    in the same area" (poe2db glossary), so a boss inside the slam is hit again: the chance is
    extra hits on average. One forum report says it doesn't trigger from Falling Thunder
    (unverified).
    FORM (COV7, AUDIT8 A8-1, as COVD6's Hrimnor's Hymn): an Aftershock is a second hit, so a second ailment
    application, not a bigger one: "more DPS" (was "Slam Skills deal N% more Damage", which also made each Ignite,
    Bleed and Poison N% bigger, since PoB takes an ailment's base from the stored hit). The same for -mace, -shapeshift,
    -any and mountain-splitter.
  sources: ["https://poe2db.tw/us/Titan", "https://poe2db.tw/us/Keywords (Aftershock)"]
  test_in_game: "Slam a training dummy 20 times with Earthbreaker: about 5 slams show a second impact in the same place, for the same damage."
  status: proposed

- id: mountain-splitter
  title: Mountain Splitter, every third Slam causes 3 Aftershocks ahead and to the sides
  kind: pob_gap
  match: "^Every Third Slam skill that doesn't create Fissures which you use yourself causes (\\d+) additional Aftershocks"
  replace: ['Slam Skills have 11% more DPS']
  confidence: theory
  notes: >-
    The Aftershocks land ahead and to each side of the slam's area, not on it; a large boss is
    assumed to stand in one of the three, so every third slam adds one full hit (33% more per
    third slam, 11% over all slams). Slams that create Fissures don't count; the build's main
    slam is assumed not to.
  sources: ["https://poe2db.tw/us/Titan", "https://poe2db.tw/us/Keywords (Aftershock)"]
  test_in_game: "On a large boss, watch every third slam: count how many of the 3 extra Aftershocks hit it."
  status: proposed

- id: now-and-again-repeat
  title: Now and Again, chance for Repeatable spells to Repeat
  kind: pob_gap
  match: '^Repeatable Spells have (\d+)% chance to Repeat$'
  replace: ['if:RepeatableSpell {g1*0.95}% more Spell Damage']
  confidence: theory
  notes: >-
    A Repeat performs the part of the spell that fires its projectiles or effects again from the
    same use (poe2db); assumed a full copy hitting the boss, so the chance is extra hits. "Skills
    take 5% longer to perform for each time they Repeat" costs about 5% of the gain.
  sources: ["https://poe2db.tw/us/Repeating_Skills", "https://poe2db.tw/us/Chronomancer"]
  test_in_game: "Cast Spark (or another Repeatable spell) 50 times at a dummy: about 10 casts fire twice."
  status: proposed

- id: now-and-again-echo
  title: Now and Again, chance for Cascadable spells to Echo
  kind: pob_gap
  match: '^Cascadable Spells have (\d+)% chance to Echo$'
  replace: ['if:CascadableSpell {g1*0.95}% more Spell Damage']
  confidence: theory
  notes: >-
    An Echo affects the same targeted location again after a delay (poe2db): against a boss standing in the area, one more
    hit of the spell; the chance is extra hits on average, less 5% for the delay that moves it later. A Cascadable
    spell won't Echo "while Repeating" (KeywordPopups Cascadable): the use still Echoes, its Repeat doesn't; for a
    spell that can do both, models.repeat_echo_model corrects the pair to 1 + .95(r + e) (MECH46, MECH47; MEDIUM).
  sources: ["https://poe2db.tw/us/Cascadable_Skills", "https://poe2db.tw/us/Chronomancer"]
  test_in_game: "Cast an area spell at a dummy 50 times: about 10 casts hit the spot a second time."
  status: proposed

- id: blackflame-withered-fire
  title: Blackflame, Withered also increases Fire Damage taken
  kind: pob_gap
  match: '^Withered you inflict also increases Fire Damage taken$'
  replace: []
  confidence: datamined
  notes: >-
    Blackflame's Ignites deal Chaos instead of Fire, so the ring's own damage gains nothing from
    it; other Fire damage would (not counted, an undercount).
  sources: ["https://poe2db.tw/us/Blackflame"]
  test_in_game: "Not needed for a Blackflame chaos-ignite build."
  status: retired  # COV7: uniques-batch8.yaml uniques-blackflame-withered-fire-taken counts it from the build's Withered stacks (COVD8; AUDIT12 A12-4)

- id: veilpiercer-dark-whisper
  title: Veilpiercer, Dark Whispers while a cursed enemy is in your Presence
  kind: pob_gap
  match: '^Gain (\d+) Dark Whispers? every second there is a Cursed Enemy in your Presence$'
  replace: ['40% increased Curse Magnitudes']
  confidence: datamined
  notes: >-
    Each Dark Whisper gives 4% increased Curse Magnitudes, up to 10 (40%); they last 8 s, refreshed
    on gain, so a cursed boss in your Presence keeps 10 after 10 s. When they expire you lose 3% of
    Life, Mana and Energy Shield each over 4 s (not counted). Without a curse the line does nothing.
  sources: ["https://poe2db.tw/us/Veilpiercer", "https://poe2db.tw/us/Dark_Whispers"]
  test_in_game: "Curse a boss with Veilpiercer equipped and stay near it: the Dark Whisper buff reaches 10 stacks."
  status: proposed

- id: skysliver-min-or-max
  title: Skysliver, damage rolls only its minimum or maximum (same average)
  kind: pob_gap
  match: '^Rolls only the minimum or maximum Damage value for each Damage Type$'
  replace: []
  confidence: datamined
  notes: "50% minimum, 50% maximum for each damage type (poe2db glossary): the average is unchanged. Lucky damage would gain (not counted)."
  sources: ["https://poe2db.tw/us/Keywords (Skysliver)"]
  test_in_game: "Hit a dummy: each hit shows one of exactly two numbers per damage type."
  status: proposed

- id: decimating-strike
  title: Decimating Strike, the first hit on a full-life boss removes 5-30% of its life
  kind: pob_gap
  match: '^Decimating Strike$'
  replace: ['21% more Damage']
  confidence: theory
  notes: >-
    "Hits against Full Life Enemies remove between 5% and 30% of Life, before the damage of the Hit is applied" (poe2db).
    Against a boss, once, at the start: the fight against the rest of its life is shorter by that share, so the boss dies
    1/(1 - f) as fast. What decides 5% or 30% isn't published: the middle, 17.5%, is assumed, so x1.21 counted as the
    equivalent 21% more Damage (5% would be x1.05, 30% x1.43). A boss that heals to full or has phases that reset to full
    life would give it again (not counted).
  sources: ["https://poe2db.tw/us/Decimating_Strike"]
  test_in_game: "Hit a full-life map boss once with a weak skill: note how much of its life bar goes on that first hit, beyond the hit's own damage. Repeat on three bosses to see what decides the share."
  status: proposed

# Defences --------------------------------------------------------------------------------------

- id: harmony-within
  title: Harmony Within, hit damage taken from Mana first while Mana is above Life
  kind: pob_gap
  model: harmony
  match: '^Hit damage is taken from Mana before Life if your current Mana is higher than your current Life$'
  replace: ['flag:HarmonyWithin']
  confidence: theory
  notes: >-
    Reads like 100% Mind over Matter for hits while Mana is above Life (poe2db; no cap stated).
    Counted (builder/search/models.py harmony_model) as 100% of damage taken from Mana before Life,
    only when the build's unreserved Mana is above its Life (the manager's ruling, 6 Nov 2026: the
    line's own text decides it), both pools assumed full. Out of scope: a fight where Mana drains
    below Life, and whether a hit bigger than the Mana overflows into Life.
  sources: ["https://poe2db.tw/us/Oracle", "https://web.poecdn.com/forum/view-thread/3889065 (snippet only)"]
  test_in_game: "With more Mana than Life, take a boss hit: check how much came off Mana and whether Life moved."
  status: proposed

# Gem stats PoB never reads (kind gem_stat, builder/search/models.py gem_stat_model) ------------

- id: gem-mana-tempest-lightning
  title: Mana Tempest, Empowered Spells gain damage as Lightning
  kind: gem_stat
  skill: Mana Tempest
  applies_to: build
  match: '^non_skill_base_all_damage_%_to_gain_as_lightning_with_spells_from_buff$'
  replace: ['Gain 1% of Damage as Extra Lightning Damage with Spells']
  uptime: mana_tempest
  stats: [mana_tempest_mana_cost_%_to_add_to_cost_per_second]  # the storm's drain, read by the uptime model
  confidence: theory
  notes: >-
    "Empowered Spells Gain (40-78)% of damage as Lightning Damage" (poe2db; 78% at level 20), for mana-costing
    spells while you stand in the storm. The storm costs 1% of maximum Mana per second plus 30% of the Mana and Life
    spent in it, and ends when you leave it or run out of Mana. Uptime from the build's own Mana, regeneration and
    spending (models.mana_tempest_uptime, the user's rule of 6 Nov 2026): up for good if regeneration covers it all,
    otherwise while the Mana lasts, recast once it has refilled. A main skill that costs no Mana (triggered by a
    meta gem, a Life-cost spell) gets 0, as in game (MECHC3's model change, on main). Not counted: the 2 s its
    effects linger after you leave the storm (0.4.0; a small undercount).
  sources: ["https://poe2db.tw/us/Mana_Tempest", "the user, 6 Nov 2026: uptimes from cooldowns, costs and regeneration"]
  test_in_game: "Hit a dummy with your spell outside and then inside the storm: about 1.78x inside with the gem at 20. Time how long a storm lasts in a boss fight."
  status: proposed

- id: gem-mana-tempest-split
  title: Mana Tempest, Empowered Spells split to additional targets (no other target on a boss)
  kind: gem_stat
  skill: Mana Tempest
  match: '^mana_tempest_empowered_spells_split_to_X_additional_targets$'
  replace: []
  confidence: datamined
  sources: ["https://poe2db.tw/us/Mana_Tempest"]
  test_in_game: "Not needed for boss damage."
