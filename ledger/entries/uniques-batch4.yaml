# On-kill (RESEARCH2's lone-boss target, as uniques-batch2.yaml) --------------------------------------------------------

- id: uniques-palm-dreamer-gloom-shrine
  title: Palm of the Dreamer, Grants effect of Dreaming Gloom Shrine (slain enemies explode)
  kind: pob_gap
  match: '^Grants effect of Dreaming Gloom Shrine$'
  replace: []
  absorbed_by: "on-kill sources aren't counted against the lone-boss target (conditions.py, flasks.py; no adds modelled)"
  confidence: theory
  notes: >-
    The game's definition (KeywordPopups UniqueShrineChaos, "Dreaming Gloom Shrine"): "Slain enemies explode, dealing
    Chaos damage equal to a quarter of their maximum Life." That is the whole effect named by the line; the generic
    Gloom Shrine's "Gain Damage as Extra Chaos Damage" part (KeywordPopups GloomShrine) is not in this definition,
    and the sceptre carries its own "Gain 27% of Damage as Extra Chaos Damage" line, which PoB parses. So the line is
    an on-kill effect, 0 against a lone boss under the tool's premise (scratch/manager/research/boss-fight-kills.md).
    Whether the dreaming shrine also grants the generic Gloom Shrine's extra chaos: UNVERIFIED (the definitions say
    no; not tested in game).
  sources: ["https://poe2db.tw/us/Palm_of_the_Dreamer", "data/game-26476662/tables/KeywordPopups.json (UniqueShrineChaos, GloomShrine)",
            "scratch/manager/research/boss-fight-kills.md"]
  test_in_game: "Hold the sceptre: does the buff bar show a Gloom Shrine, and does the character sheet's extra chaos rise above the sceptre's own 27%?"
  status: proposed
