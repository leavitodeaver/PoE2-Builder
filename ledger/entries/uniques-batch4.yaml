  sources: ["https://poe2db.tw/us/Blessed_Bonds", "builder/search/conditions.py (EXPOSURE_SOURCE, _exposure_source)",
            "data/game-26476662/tables/KeywordPopups.json (Exposure)"]
  test_in_game: "Ignite a dummy wearing the gloves: its Cold Resistance shows 20 lower for 4 s."
  status: proposed

