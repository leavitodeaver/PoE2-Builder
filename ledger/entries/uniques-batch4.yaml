  kind: pob_gap
  model: debuff_uptimes
  match: '^Inflict Cold Exposure on Igniting an Enemy$'
  replace: []
  confidence: datamined
  notes: >-
    builder/search/conditions.py reads it for the boss's Cold Exposure box: EXPOSURE_SOURCE matches "Inflict Cold
