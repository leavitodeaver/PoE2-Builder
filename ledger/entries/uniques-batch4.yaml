# Misparses that aren't (the audit's "condition lost" is PoB's own calculation) --------------------------------------

- id: uniques-parse-mageblood-per-duplicate
  title: "Mageblood, All Mage's Legacies have X% increased effect per duplicate Mage's Legacy: PoB multiplies by the duplicates"
  kind: parse_checked
  match: "^All Mage's Legacies have (\\(\\d+-\\d+\\)|\\d+)% increased effect per duplicate Mage's Legacy you have$"
  confidence: datamined
  notes: >-
    ModParser.lua 5650 stores the line as MagesLegacyEffect INC num with no condition, which the audit read as
    "per duplicate lost". It isn't: the only reader of MagesLegacyEffect is CalcPerform.lua 1550-1577 (with the
    MagebloodEquipped flag), which counts each Legacy's stacks, sums (stacks - 1) over them as totalDuplicates and
    scales every Legacy's effects by 1 + totalDuplicates x MagesLegacyEffect / 100. One Mageblood with one Legacy has
    no duplicates, so the line adds nothing, as in the game (checked: grep MagesLegacyEffect over PoB's Modules and
    Classes: ModParser 5650 and CalcPerform 1568 only). The same text from the mod
    UniqueIncreasedMagesLegacyEffectPerDuplicateMagesLegacy (the audit's "exclusive" source) is this line.
  sources: ["vendor/PathOfBuilding-PoE2/src/Modules/ModParser.lua (5650)",
            "vendor/PathOfBuilding-PoE2/src/Modules/CalcPerform.lua (1550-1577)", "https://poe2db.tw/us/Mageblood"]
  test_in_game: "With one Mageblood, a Legacy's numbers on the character sheet equal the Legacy's own text."
  status: proposed

