- id: items-physical-rolls-minimum-or-maximum
  title: Rune of Culmination, Physical damage rolls only its minimum or maximum (same average)
  kind: pob_gap
  match: '^Rolls only the minimum or maximum Damage value for Physical Damage$'
  replace: []
  confidence: datamined
  notes: >-
    As skysliver-min-max (coverage-batch1.yaml) for the Physical part only: 50% minimum, 50% maximum (poe2db
    glossary), so the average hit and the average Bleed / stun built from it are unchanged, which is what PoB already
    counts. Not counted: anything that reads a hit's spread rather than its average (Lucky / Unlucky damage would gain
    from it; LOW, an undercount where a build has Lucky physical damage). Source: Rune of Culmination (quarterstaff,
    one-hand mace).
  sources: ["https://poe2db.tw/us/Keywords (Skysliver)", "game files Mods.json (Rune of Culmination)"]
  test_in_game: "Hit a dummy: each hit's Physical part shows one of exactly two numbers."
  status: proposed

- id: items-full-life-enemies-cannot-evade
  title: Carved Cunning, enemies on Full Life can't Evade your Hits, under PoB's "Is the enemy on Full Life?" box
  kind: pob_gap
  match: '^Enemies which are on Full Life cannot Evade your Hits$'
  replace: ["Your Hits can't be Evaded against Enemies on Full Life"]
  confidence: datamined
  notes: >-
    PoB's flag CannotBeEvaded under its enemy FullLife condition (ModParser "your hits can't be evaded" with the tag
    "against enemies on full life"), the same switch the play guide's "Boss on Full Life" row reads
    (conditionEnemyFullLife). Our boss box stays off, so the line counts 0 until something sets it: an UNDERCOUNT,
    LOW. A boss without Energy Shield leaves Full Life at the first hit that reaches Life; a boss preset with Energy
    Shield (bosses.life_share_of_pool) stays on Full Life while its ES is taken off, about ES / (Life + ES) of the
    fight, which the box doesn't read yet (routed: a share for the box, as Culling Strike's pool share). Moves only
    attacks, the hits a boss can Evade. Source: the rune Carved Cunning (helmet).
  sources: ["vendor/PathOfBuilding-PoE2/src/Modules/ModParser.lua (your hits can't be evaded; against enemies on full life)",
            "vendor/PathOfBuilding-PoE2/src/Modules/ConfigOptions.lua (conditionEnemyFullLife)"]
  test_in_game: "Against a full-life target, attack hits show no evasion misses until the first hit lands."
  status: proposed

- id: items-non-curse-aura-magnitudes
  title: Increased Magnitudes of Non-Curse Auras from your Skills, as PoB's aura effect
  kind: pob_gap
  match: '^(\d+)% increased Magnitudes of Non-Curse Auras from your Skills$'
  replace: ['{1}% increased Effect of Non-Curse Auras from your Skills']
  confidence: datamined
  notes: >-
    The game's stat non_curse_aura_effect_+% (Stats.json; the game now words aura effect as "Magnitudes"), which PoB
