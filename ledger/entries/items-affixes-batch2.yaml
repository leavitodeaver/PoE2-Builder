# Item lines (affixes, Desecrated mods, runes) the coverage audit ranked open, closed by COV16 (13 Nov 2026; PoB
# bb52d6b, game files build 26476662). Each translation is to a line PoB parses itself for the same game wording
# (ModParser.lua cited); tests/test_engine_ledger.py parses every replacement and checks the modifiers. Recheck at the
# 1.0 refresh (11 Dec 2026) and at each PoB update.

- id: items-increased-poison-chance
  title: Increased chance to Poison, as PoB's INC PoisonChance
  kind: pob_gap
  match: '^(\d+)% increased chance to Poison$'
  replace: ['{1}% increased to Poison']
  confidence: datamined
  notes: >-
    The game's stat poison_chance_+% ("increased", so it scales the base chance; Stats.json). PoB reads the line's
    numbers and stat (INC PoisonChance, the modNameList key "to poison") but leaves the word "chance" over, and PoB
    never applies a line with leftover text (Classes/Item.lua `not modLine.extra`), so the line counted nothing. The
    replacement drops the word only: the same INC PoisonChance, which CalcOffence multiplies into the base chance
    (base * (1 + inc / 100), capped at 100%). It moves nothing without a base Poison chance, as in the game. Sources:
    the Desecrated jewel prefix AbyssModJewelPrefixPoisonChanceAndMagnitude (15%) and gloves suffix
    AbyssModGlovesUlamanSuffixPoisonChance ((20-30)%).
  sources: ["vendor/PathOfBuilding-PoE2/src/Modules/ModParser.lua (modNameList: to poison)",
            "vendor/PathOfBuilding-PoE2/src/Modules/CalcOffence.lua (flat ailment chance: Bleed, Poison)",
            "game files Stats.json poison_chance_+%"]
  test_in_game: "With a 20% base Poison chance, 50% increased chance to Poison shows 30% on the skill's tooltip."
  status: proposed

