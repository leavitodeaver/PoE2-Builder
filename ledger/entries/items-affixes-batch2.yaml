- id: items-claw-life-and-mana-per-hit
  title: Claw implicit "Grants N Life and Mana per Enemy Hit", as PoB's claw implicit form for each
  kind: pob_gap
  match: '^Grants (\d+) Life and Mana per Enemy Hit$'
  replace: ['Grants {1} Life per Enemy Hit', 'Grants {1} Mana per Enemy Hit']
  confidence: datamined
  notes: >-
    The game's stat local_life_and_mana_gain_per_target (one value for both). PoB's own claw bases carry "Grants N Life
    per Enemy Hit" (Data/Bases/claw.lua), so the same form for Life and for Mana. Sources: the Maraketh claw implicits
    LifeAndManaOnHitImplicitMarakethClaw1-3 (6 / 10 / 14).
  sources: ["vendor/PathOfBuilding-PoE2/src/Data/Bases/claw.lua", "game files Stats.json local_life_and_mana_gain_per_target"]
  test_in_game: "Each enemy hit with the claw gives the Life and the Mana."
  status: proposed

- id: items-attack-added-chaos-from-life
  title: Attacks have added Chaos damage equal to N% of maximum Life, as PoB's added damage with its "% of maximum life" tag
  kind: pob_gap
  match: '^Attacks have added Chaos damage equal to (\d+)% of maximum Life$'
  replace: ['Adds 1 to 1 Chaos Damage to Attacks equal to {1}% of maximum Life']
  confidence: datamined
  notes: >-
    The game's stat attack_added_chaos_damage_%_of_maximum_life (HandWrapsUniqueMutatedVaalGlobalChaosGemLevel, a
    suffix, 1-3%). PoB parses the Physical form ("attacks have added physical damage equal to N% of maximum life":
    PhysicalMin / Max BASE 1 under PercentStat Life) but not the Chaos one; the replacement is the same construction
    for Chaos (added Chaos to Attacks, 1 to 1, scaled by PoB's PercentStat tag "equal to N% of maximum life").
  sources: ["vendor/PathOfBuilding-PoE2/src/Modules/ModParser.lua (attacks have added physical damage equal to; equal to N% of maximum life)",
            "game files Stats.json attack_added_chaos_damage_%_of_maximum_life"]
  test_in_game: "With 2,000 Life and 2%, an attack's tooltip shows 40 to 40 added Chaos damage."
  status: proposed
