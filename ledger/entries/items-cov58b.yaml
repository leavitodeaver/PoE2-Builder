- id: model-read-cov58b-skyfall-comet-spawn-count
  title: "Skyfall creates 3 Comet-Spawn a cast, 6 when it consumes a Verisium Infusion (models.SKYFALL_PER_CAST / SKYFALL_PER_INFUSED_CAST, MECHB62 / MECHB64)"
  kind: model
  model: skyfall_minions
  stats: ["verisium_comet_number_of_minions_to_create", "active_skill_consumes_a_verisium_infusion"]
  skill: [Skyfall]
  confidence: MEDIUM-LOW
  notes: >-
    verisium_comet_number_of_minions_to_create is 3 on SkyfallPlayer and 3 on SkyfallInfusedPlayer (constant stats, game
    26650308; skyfall.csd "Creates {0} Temporary Minions"); RESEARCH58 R58-7 reads the Infused set as adding its 3
    (poe2db's Verisium-Infused set: "Creates 6 Temporary Minions"; MEDIUM-HIGH), = SKYFALL_PER_CAST 3 /
    SKYFALL_PER_INFUSED_CAST 6. active_skill_consumes_a_verisium_infusion (implicit on SkyfallPlayer; ActiveSkills
    skyfall: "Consumes a Verisium Infusion, if possible, to increase the number of Minions summoned") is
    Assumptions.skyfall_infused's consumer: the share of casts finding a Verisium Infusion (the build's supply shared
    evenly with every other consumer, MEDIUM-LOW). skyfall_minion_model: 3 + 3 x share a cast x 20 s, at most the
    Limit, scales the Comet-Spawn's Full DPS entry. A link only.
  sources: ["builder/search/models.py (SKYFALL_PER_CAST, SKYFALL_PER_INFUSED_CAST, skyfall_minion_model)", "builder/search/assumptions.py (skyfall_minions, skyfall_infused)"]
  status: proposed

