  stats: ["support_active_skill_consume_enemy_freeze_to_apply_chill"]
  skill: [Biting Frost II]
  confidence: MEDIUM-LOW
  notes: >-
    The game's text: "Freezes Consumed by Supported Skills Chill the target" (gem_stat_descriptions.csd, 26650308).
    conditions reads the stat from the main skill's supports (FREEZE_CONSUME_CHILL_STAT -> stats["_freeze_consume_chill"]);
    consume_chill_share gives each consumed Freeze (models.immobilised_share's consumed period) Chill's default 8 s x
    PoB's ChillDuration, one more independent term in chilled_share, which sets the boss Chilled for the "vs Chilled"
