- id: model-gem6-frostfire-consume
  title: "Frostfire's Freeze consume on Ignite is the condition resolver's consume cut"
  kind: model
  model: conditions
  stats: ["remove_freeze_on_ignite"]
  skill: [Frostfire]
  confidence: theory
  notes: >-
    "Supported Skills Consume Freeze from Enemies they Ignite" (gem_stat_descriptions). PoB gives the supported skill the
    SkillConsumesFreeze type (sup_int.lua SupportFrostfirePlayer addSkillTypes), the bridge reports it (activeSkills
    `consumes`), and conditions._type_consumes takes it off the boss's Frozen share (MECH55's consume cut). That is the
    stat's effect on the Frozen share. Left for MECH-A (routed, the ledger's support-frostfire-unique-ignite says the
    same): the weight of Frostfire's Ignite bonus is the Frozen share, where the game boosts one Ignite per consumed
    Freeze for that Ignite's own duration (an UNDERCOUNT of the bonus while the supported skill Ignites more often than
    the boss is Frozen, an overcount otherwise; not measured).
  sources: ["SupportFrostfirePlayer, GrantedEffectStatSets (build 26476662)", "gem_stat_descriptions.csd (remove_freeze_on_ignite)",
            "vendor PoB sup_int.lua SupportFrostfirePlayer", "builder/search/conditions.py (_type_consumes)"]
  test_in_game: "Freeze a dummy, Ignite it with the supported skill: the Freeze ends at once."
  status: proposed
