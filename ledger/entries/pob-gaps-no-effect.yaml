  status: proposed

- id: no-effect-spell-projectile-chain-fork
  title: Spell projectiles chain or fork (chains and forks can't hit the same target again)
  kind: pob_gap
  match: '^Projectiles from Spells (Chain [+\d()-]+ times|Fork)$'
  replace: []
  confidence: community_confirmed
  notes: >-
    As no-effect-fork-projectile: a chain or fork looks for a different target. (checked: RESEARCH9 #18y,
    scratch/manager/research/no-effect-chain-fork.md: Chain holds, KeywordPopups Chain "Enemies cannot be targeted
    more than once in the same Chain", terrain chains included (they only redirect a miss); exception: chaining
    through boss adds, not modelled (no preset has adds). Fork: probably holds, MEDIUM: the game text is silent, a
    PoE1 developer answer says no, poe2wiki's group rule; in-game test #53.)
  sources: ["https://www.poe2wiki.net/wiki/Chain", "https://www.poe2wiki.net/wiki/Forking"]
