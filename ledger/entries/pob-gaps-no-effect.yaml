- id: no-effect-extra-charge-chance
  title: Chance to gain an additional Charge, or to gain up to your maximum (counted in the charges held, not by PoB)
  kind: pob_gap
  match: '^\d+% chance when you gain an? (?:(?:Power|Frenzy|Endurance) )?Charge to gain an additional (?:\w+ )?Charge|^Gain an additional (?:(?:Power|Frenzy|Endurance) )?Charge when you gain|^\d+% chance to gain an additional random Charge when you gain a Charge|^\d+% chance that if you would gain (?:Power|Frenzy|Endurance) Charges, you instead gain up to( your maximum number of (?:Power|Frenzy|Endurance) Charges)?$|^your maximum number of (?:Power|Frenzy|Endurance) Charges$'
  replace: []
  confidence: theory
  notes: >-
    PoB has no effect for these lines; the condition resolver counts them in the charges held
    (conditions._extra_charges and charges_with_refresh, MECH44, 11 Nov 2026). Charges refresh together on each
    gain (KeywordPopups Charges), so the count held is the expected charges gained since the last gap of one
    duration, at most the maximum. "X% chance when you gain a Charge to gain an additional" adds one more
    charge per gain at X% (summed, at most one extra per gain); a random extra Charge gives a third of its chance
    to each of Power, Frenzy and Endurance (assumed). Charge Profusion's 30% (II: also 15% random) counts on
    the charges of the skills it supports. "X% chance that if you would gain Charges, you instead gain up to
    your maximum": a fill holds the maximum until the charges drop; beside a skill that consumes the charge
    it's labelled, not counted. The "per 10 Tribute" lines are
    labelled, not counted (Tribute isn't modelled). Game files: stat_descriptions.csd stats
    chance_to_gain_1_more_{power,frenzy,endurance,random,}charge_% and
    gain_maximum_<k>_charges_on_<k>_charge_gained_%_chance; sources in Mods, PassiveSkills (power_charges7,
    frenzy_charges7_, endurance_charges9, power_endurance_charges3/6, the Oracle charge nodes, two ascendancy
    nodes), SoulCoreStats and SupportChargeProfusionPlayer(Two).
  sources: ["https://poe2db.tw/us/Lust_for_Power", "https://poe2db.tw/us/Avidity", "data/game-26476662 stat_descriptions.csd", "builder/search/conditions.py (_extra_charges, _charges_held)"]
  test_in_game: "With a charge source and one of these lines, watch the charge count on your buff bar in a boss fight: it should sit higher than without the line, and at the maximum after a fill until no gain comes for one charge duration."
  absorbed_by: "builder/search/conditions.py counts these lines in the charges held (one more charge per gain at the extra chance; a fill holds the maximum until the charges drop)"
  status: proposed

- id: no-effect-extra-combo-on-gain
  title: Gain an additional Combo when you gain Combo (only speeds up Combo)
  kind: pob_gap
  match: '^When you gain Combo, gain an additional Combo$'
  replace: []
  confidence: reported
  notes: "As no-effect-extra-combo: Combo consumers are calculated at the Combo they require."
  sources: ["https://poe2db.tw/us/Martial_Adept", "https://poe2db.tw/us/Combo"]
  test_in_game: "Use a Combo skill: it reaches its required Combo in half as many hits; its damage per use doesn't change."
  absorbed_by: "PoB calculates a Combo skill at the Combo it requires, as if always reached; faster Combo would let it be used more often (not counted: the use rate is PoB's)"
  status: proposed

- id: no-effect-infinite-curse-duration
  title: Curses / Withered you inflict have infinite duration (read by the custom models, not by PoB)
  kind: pob_gap
  match: '^(Curses you inflict have infinite Duration|Withered you inflict has infinite Duration)$'
  replace: []
  confidence: reported
  notes: >-
    PoB applies a build's curses always up and reads Withered from the stack count we set, so the
    line does nothing in PoB. It moves the build through the custom models (RULE_AUDIT #1, MECH42,
    11 Nov 2026; before, this entry called it absorbed, out of date once curses had a recast and
    Withered a duration): models.curse_uses casts a hand-cast curse once instead of every 7.4 s, so
    it costs the main skill no time; conditions._withered_stacks keeps all 10 Withered stacks with
    any Withered source (the build-up at the fight's start taken as instant).
  sources: ["https://poe2db.tw/us/Incessant_Cacophony", "https://poe2db.tw/us/Cospri%27s_Will"]
  test_in_game: "Curse a boss once and check the curse never falls off."
  absorbed_by: "models.curse_uses (no recasts) and conditions._withered_stacks (10 stacks)"
  status: proposed

- id: no-effect-debuffs-on-you
  title: Ailments, curses, bleeding and Armour Break on you (no checked defence includes them)
  kind: pob_gap
  match: '^(All Damage taken from Hits while (Bleeding|Poisoned) Contributes to Magnitude of Chill on you|[+(\d-]+\)?% reduced Duration of Curses on you|You take Fire Damage instead of Physical Damage from Bleeding|\d+% reduced Armour Break taken)$'
  replace: []
  confidence: verified_by_you
  notes: >-
    The optimizer checks life, energy shield, mana, resistances, maximum hit taken, block and
    evade; none of these lines changes them. They do change how a fight goes.
  sources: ["builder/request/constraints.py (the checked defences)", "https://poe2db.tw/us/Loreweave"]
  test_in_game: "Not needed for the checked numbers."
  status: proposed

