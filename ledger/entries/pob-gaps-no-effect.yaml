# Lines Path of Building ignores that don't change anything the optimizer calculates: sustained
# single-target boss DPS and the defences it checks (life/ES/mana pools, resistances, maximum hit
# taken, block, evade). Recording them keeps a result's list of PoB blind spots to real gaps.
# They still work in game; only their effect on these numbers is nil.
# An empty `replace` means "no effect on what's calculated".

- id: no-effect-movement-speed
  title: Movement speed alone (lines naming Attack, Cast, Damage, Energy Shield or Recharge too, or a two-line mod's first half, are left out)
  kind: pob_gap
  match: '^(?!.*(Attack|Cast|Energy Shield|Recharge|Damage|\balso$)).*Movement Speed'
  replace: []
  confidence: verified_by_you
  notes: >-
    Narrowed (COV9; AUDIT12 A12-2, RESEARCH9 #18w): the old pattern 'Movement Speed' also swallowed Jiquani's
    Thesis's "Increases and Reductions to Movement Speed also" (its other half raises Energy Shield Recharge: now
    items-jiquanis-thesis-movement-to-es-recharge) and two lines whose other half is Attack / Cast Speed (Exclusive
    mods no live 0.5 unique carries: RESEARCH9). The 15 lines it still takes (coverage-report.json) are movement only:
    Movement Speed Penalty lines, Tamed Beasts', Queen of the Forest's, while Sprinting, per Chest opened, on Burning /
    Chilled / Shocked ground. Movement speed doesn't shorten a dodge roll (distance per roll; MEDIUM, RESEARCH9).
  sources: ["Movement speed doesn't enter PoB's DPS or the checked defences", "scratch/manager/research/no-effect-movement-speed.md"]
  status: approved

- id: no-effect-remnant-range
  title: Remnant pickup range (no effect only while the player walks onto every Remnant; clashes with counting standing still)
  kind: pob_gap
  match: '^Remnants can be collected from \d+% further away$'
  replace: []
  confidence: verified_by_you
  notes: >-
    Retitled COV9 (RESEARCH9 #18x): pickup range moves nothing only under the builder's play note that the player
    walks onto every Remnant. That play clashes with conditions that count standing still (stationary lines, a
    planted totem's or ground's position), and nothing links the two: a build counting both counts two plays that
    clash, unless its Remnants appear within pickup range, when this line is what makes standing still possible. The
    base pickup radius and where each Remnant kind appears are UNVERIFIED (research #52, in-game test). MECH-C /
    MECH-A label the clash in the Remnant model.
  sources: ["Pickup range; the Explosive Transmutation assumption uses Remnant creation rates", "scratch/manager/research/no-effect-remnant-range.md"]
  status: approved

- id: no-effect-flee
  title: Making enemies Flee (no effect on a Unique boss)
  kind: pob_gap
  match: '(?i)\b(cause (bleeding )?(enemies|monsters?) to flee|chance to flee)\b'
  replace: []
  confidence: datamined
  notes: >-
    Flee has no damage part, and every Unique-rarity monster carries MonsterUnique7, monster_chance_to_not_flee_% 100
    (Mods.json, the rarity mod set MonsterUnique1-14; the boss presets are Unique rarity), so on a boss these lines
    do nothing (RESEARCH20 #117, HIGH; checked there: every use of monster_chance_to_not_flee_% is one of the three
    rarity mods MonsterUnique7 / MonsterRare7 / MonsterMagic7; a second source for the mod itself was not fetched).
    They still work on Magic monsters (50% chance not to flee). Lines today: Exclusive unique mods on Flee on block,
    on hit, on flask use, Bleeding enemies on hit, and socketed Chance to Flee supports.
  sources: ["data/game-26476662/tables/Mods.json MonsterUnique7", "scratch/manager/research/block-plan-cull-flee-fated-end.md"]
  test_in_game: "Not needed for the calculated numbers."
  status: proposed

