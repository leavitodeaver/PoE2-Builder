- id: no-effect-crowd-control-duration
  title: "Pin duration (retired COV9: the boss's Pinned uptime is modelled since MECH46, so these lines are an open undercount, not \"no effect\")"
  kind: pob_gap
  match: '^\d+% (increased|reduced) Pin [Dd]uration$'
  replace: []
  confidence: verified_by_you
  notes: >-
    The user, 11 Nov 2026: count Pin / Hinder / Armour Break durations. Hinder (and Blind) durations scale each
    inflicting line's duration in the debuff uptimes, and Armour Break Duration the 12 s Fully Broken
    (models.duration_scale / full_break_duration, MECH44). RETIRED (COV9; AUDIT12 A12-1, an UNDERCOUNT): since
    MECH46 conditions.py sets conditionEnemyPinned from the main skill's Pin buildup (_immobilised("Pin", "Pinned"),
    Pinned 3 s, models.IMMOBILISE_DURATION), so "against Pinned enemies" lines count at the Pinned share and a
    longer Pin raises it. That model does not read pin_duration_+% yet (models.py's IMMOBILISE_DURATION comment,
    checked on origin/main 315867c and MECH-A's master 9072708: no reader of pin_duration), so the coverage lists
    these lines as gaps until MECH-A reads them; zeroing them here would hide the undercount.
  sources: ["data/game-26476662 stat_descriptions.csd: pin_duration_+%, hinder_duration_+%, armour_break_and_sundered_armour_duration_+%", "KeywordPopups Pinned: 3 s; Hinder: 4 s; ArmourBreak: Fully Broken 12 s"]
  status: retired  # COV9: MECH46 models the Pinned uptime; pin_duration_+% is an open undercount for MECH-A (A12-1)

- id: no-effect-parry
  title: Parry area (holds) and stun threshold while parrying (no effect only because Heavy Stun on you from parrying isn't modelled)
  kind: pob_gap
  match: '^\d+% increased (Parry Hit Area of Effect|Stun Threshold while Parrying)$'
  replace: []
  confidence: verified_by_you
  notes: >-
    COV9 (RESEARCH10 #18z): Area holds: since 0.4.0 "Parry now always hits the enemy you parried, regardless of
    distance" (patch notes), and Parry's retaliation reach doesn't change which hits are parried (melee within 1 m,
    projectiles within 1.5 m). Stun Threshold while Parrying: parrying builds Heavy Stun on you, with 40% less
    threshold while parrying (Parry's game text: "Parrying causes you to accumulate Heavy Stun buildup"); the parry
    plan doesn't count time lost to that Heavy Stun (a possible OVERCOUNT of parry_plan, MEDIUM, MECH-C's label), so
    this line's effect, a smaller loss, has nothing to act on: no effect only for that reason.
  sources: ["0.4.0 patch notes (Parry hits the parried enemy at any distance)", "game files: Parry's stat set and description", "scratch/manager/research/no-effect-parry.md", "scratch/manager/research/parry-player-heavy-stun.md"]
  status: approved

- id: no-effect-offering-life
  title: "Offering life (no effect only while the spike is assumed to survive: Offering uptime assumes the boss never kills it)"
  kind: pob_gap
  match: '^Offerings have \d+% increased Maximum Life$'
  replace: []
  confidence: verified_by_you
  notes: >-
    Retitled COV9 (RESEARCH10 #18aa, RESEARCH11 #58): Offerings "are themselves damageable Minions and their Buffs
    are lost if they die" (KeywordPopups). The builder's Offering uptime assumes the spike survives its 6 / 6 / 8 s;
    under that assumption more spike Life changes nothing. Spike Life is 18% (Pain, Power / Soul) or 35% (Bone) of
    the level's monster Life (poe2db Offering_Spike), about 1.5-16K before modifiers, so a pinnacle area hit very
    probably kills one: if the boss reaches it, the uptime is an OVERCOUNT and this line would win some of it back.
    How often boss hits reach the spike: LOW, unknown (MECH-B labels the uptime "spike assumed out of the boss's
    areas").
  sources: ["How sturdy the offering spike is; its effect is calculated separately", "game files KeywordPopups Offering", "https://poe2db.tw/us/Offering_Spike", "scratch/manager/research/no-effect-offering-life.md", "scratch/manager/research/offering-spike-life.md"]
  status: approved

