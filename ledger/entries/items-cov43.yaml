# "if you haven't Dodge Rolled Recently" (Kurgal's Gaze in boots: Mana Cost Efficiency; Rune of Acrobatics in boots:
# Armour). PoB ignores both lines (the audit), so they counted 0: an UNDERCOUNT. MECH88's condition kind
# not_dodge_rolled_recently (8de68af3 on main, train 81: conditions.not_dodge_rolled_recently, 1 - 4 s / the roll cadence: 20% of
# the fight at a roll every 5 s, 0 for a build that relies on rolling; LOW) gives the share; the lines count at it.

- id: NotDodgeRolledRecently
  title: Share of the fight with no Dodge Roll in the past 4 seconds
  kind: condition
  not_dodge_rolled_recently: true
  shown_for: '(?:if you haven''t Dodge Rolled Recently$|^LedgerShare:NotDodgeRolledRecently$)'
  confidence: theory
  sources: ["builder/search/conditions.py (not_dodge_rolled_recently, MECH88)", "builder/search/assumptions.py (ledger_conditions)"]
  notes: >-
    shown_for also matches the item stand-in "LedgerShare:NotDodgeRolledRecently" (bridge sourceLines' shares): on
    items a `share:` line replaces its line in place, so the plain text alone would never switch the condition on
    (COV43; the items-cov35 / coverage-batch1 precedent).
  status: proposed

- id: items-armour-if-not-dodge-rolled-recently
  title: 'Rune of Acrobatics, "N% increased Armour if you haven''t Dodge Rolled Recently" at NotDodgeRolledRecently'
  kind: pob_gap
  match: '^(\d+(?:\.\d+)?)% increased Armour if you haven''t Dodge Rolled Recently$'
  replace: ['share:NotDodgeRolledRecently {1}% increased Armour']
  confidence: theory
  notes: >-
    PoB's own "N% increased Armour" (Armour INC) at the share of the fight with no roll in the past 4 s (MECH88's
    condition; the roll cadence LOW). PoB ignores the conditional line, so it counted 0.
  sources: ["vendor/PathOfBuilding-PoE2/src/Data/ModRunes.lua (Rune of Acrobatics, boots)"]
  status: proposed

