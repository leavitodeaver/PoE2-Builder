# COV43 (COV-A): item lines a custom model already reads (model-read entries, `replace: []`), so the audit counts them
# as modelled and the search re-scores items carrying them with a real trial (models.item_read_by_models). Each was
# checked to feed a number (DPS, a defence floor, charges, flasks), not a play row alone: the function named in
# `sources` reads the line and its result reaches the score. Left open on purpose (no number moves): Guiding Palm's
# Guided Shrines (models.guided_shrine_notes: a labelled 0), "N metres to Dodge Roll distance if you haven't Dodge
# Rolled Recently" (models.dodge_roll skips it), "N% increased Guard gained" (scales the modelled Guard sources only,
# not PoB's own Guard skills), sprint lines (recovery.sprint_row: a play row).

- id: model-read-lucky-crit-against-parried
  title: 'Ulaman''s Gaze, "Critical Hit chance is Lucky against Parried enemies" (models.parry_line_mods, MECH87)'
  kind: pob_gap
  model: parry
  match: '^Critical Hit chance is Lucky against Parried enemies$'
  replace: []
  confidence: theory
  notes: >-
    models.ULAMANS_GAZE: CritChanceLucky under PoB's ParryActive at the parry plan's share (MECH87, e6188820; MEDIUM).
  sources: ["builder/search/models.py (ULAMANS_GAZE, parry_line_mods)"]
  status: proposed

