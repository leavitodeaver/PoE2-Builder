- id: play-row-sprint-lines
  title: '"N% increased Movement Speed / Evasion Rating while Sprinting", the sprint Life loss and Emergent Protection''s sprint Guard (recovery.sprint_row, MECHC34: a play row)'
  kind: pob_gap
  model: sprint
  play_row: true
  match: '^(\d+(?:\.\d+)?% increased (Movement Speed|Evasion Rating) while Sprinting|Lose \d+(?:\.\d+)?% of maximum Life per second while Sprinting|When you stop Sprinting, gain Guard equal to \d+(?:\.\d+)?% of maximum Life per second spent Sprinting, up to a maximum of \d+(?:\.\d+)?%, for \d+(?:\.\d+)? seconds)$'
  replace: []
  confidence: theory
  notes: >-
    recovery.sprint_row (MECHC34; RESEARCH26 R26-22, MEDIUM): sprinting between boss repositions, a row only (a sprint
    ends on any skill use and a hit knocks you down), so every "while Sprinting" line is 0 in the headline (PoB's
    Condition:Sprinting is never set). The row reads SPRINT_SPEED and SPRINT_EVASION (numbers), SPRINT_GUARD (Emergent
    Protection), SPRINT_LIFE_LOSS (a cost). Left open: the three lines the row only names, with no value
    (SPRINT_NAMED: "Cannot be Heavy Stunned while Sprinting", "Your speed is Unaffected by Slows while Sprinting",
    "N% increased Runic Ward Regeneration Rate while Sprinting").
  sources: ["builder/search/recovery.py (SPRINT_SPEED, SPRINT_EVASION, SPRINT_GUARD, SPRINT_LIFE_LOSS, sprint_row)"]
  status: proposed

- id: no-effect-mark-of-the-abyssal-lord
  title: 'Essence of the Abyss, "Bears the Mark of the Abyssal Lord": a crafting mark, no effect on what''s calculated'
  kind: pob_gap
  match: '^Bears the Mark of the Abyssal Lord$'
  replace: []
  confidence: datamined
  notes: >-
    Mods EssenceAbyssPrefix / EssenceAbyssSuffix, one stat each: essence_abyss_guaranteed_pick (value 1). poe2db's Essence
    of the Abyss: "Removes a random modifier and augments a Rare item with a new guaranteed modifier", Mark of the Abyssal
    Lord, with no stat of its own described. No skill, passive or other table uses the stat (checked: every row of every
    table in game 26650308 whose stat fields hold its index: only those two Mods and ModType; PoB: its stat description
    only). It marks the item for a later Abyssal craft; the character's numbers don't move. The patch-notes archive has
    no hit for it (no hit is not evidence of absence).
