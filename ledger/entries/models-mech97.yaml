- id: model-read-mech97-all-attack-damage-electrocutes
  title: '"All damage with Attacks Contributes to Electrocution Buildup" (models.electrocute_attack_mods)'
  kind: pob_gap
  model: electrocute_attack
  match: '^All damage with Attacks Contributes to Electrocution Buildup$'
  replace: []
  confidence: datamined
  notes: >-
    HandWrapsUniqueLightningDamageCanElectrocute1 (stat all_attack_damage_can_electrocute). PoB parses none of it, and
    its Electrocute builds from no damage type by default (Data.lua buildupTypes.Electrocute ScalesFrom empty; KeywordPopups
    Electrocute: "Only Lightning damage from Hits with specific skills or effects Contributes"). The model adds PoB's own
    <Type>CanElectrocute flags (CalcOffence canDoAilment 5012) for all five damage types on Attacks only (KeywordFlag
    Attack), so an Attack Hit's whole damage builds Electrocute through PoB's buildup. This entry only says the model
    reads the line.
  sources: ["vendor/PathOfBuilding-PoE2/src/Modules/CalcOffence.lua:4999-5016", "builder/search/models.py electrocute_attack_mods"]
  status: proposed

