- id: gem-active-curse-level-cap
  title: "Curses can't apply above a level: 0 at gem level 18 and up"
  kind: gem_stat
  match: '^skill_curses_cannot_apply_to_targets_above_level$'
  replace: []
  skill: ["Despair", "Elemental Weakness", "Enfeeble", "Repulsion", "Temporal Chains", "Vulnerability"]
  confidence: datamined
  notes: >-
    'Curse does not apply to enemies above level {0}' (skill_stat_descriptions.csd): 72 at gem level 14, 78 at 17, 0
    (no cap) from 18 (GrantedEffectStatSetsPerLevel, Despair and the other five). The search sockets active gems at
    level 20 (context.GEM_LEVEL) and item-granted ones at 18 (granted_rolls.ENDGAME_LEVEL), so it never caps a curse.
    A build with a lower gem would need it.
  sources: ["data/game-26476662/tables/GrantedEffectStatSetsPerLevel.json", "builder/search/context.py GEM_LEVEL"]
  test_in_game: "Not needed for boss damage."
  status: proposed
