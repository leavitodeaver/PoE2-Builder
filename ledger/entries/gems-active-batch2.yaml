# Active-gem stats PoB never reads, batch 2 (COVC2, 12 Nov 2026): the next rows of the coverage audit's gem-stat ranking
# and the stats COVC1 left unclear. Skill lists are the active skills (not supports: COV-E's) whose stat set carries the
# stat in the data dump (data/pob-bb52d6b368/coverage.json); the same stat on any other skill stays open.
# Values are the game's (data/game-26476662/tables GrantedEffectStatSets / ...PerLevel, scratch/covc2/gv.py in cov3).
# "No effect" records were each checked: no line in any stat description (.csd) of build 26476662, no reader in PoB
# (vendor src, every .lua outside the skill data and stat descriptions), none in our code (scratch/covc2/check.py).

# 1. PoB counts it another way ----------------------------------------------------------------------------------------

- id: gem-active-pob-arrow-flag
  title: "Fires arrows: PoB's stat map makes it the Arrow keyword"
  kind: gem_stat
  match: '^skill_can_fire_arrows$'
  replace: []
  skill: ["Bow Shot", "Detonating Arrow", "Electrocuting Arrow", "Escape Shot", "Freezing Salvo", "Gas Arrow",
          "Ice Shot", "Lightning Arrow", "Lightning Rod", "Magnetic Salvo", "Phantasmal Arrow",
          "Poisonburst Arrow", "Rain of Arrows", "Shockchain Arrow", "Snipe", "Spiral Volley",
          "Stormcaller Arrow", "Tornado Shot", "Toxic Growth", "Vine Arrow"]
  confidence: datamined
  notes: >-
    The audit lists it as 'PoB maps the stat to nothing' because its map entry holds no modifier, only skillFlag =
    "arrow" (Data/SkillStatMap.lua 1799). CalcActiveSkill.lua 576-577 sets that flag for any non-zero mapped stat, and
    646-648 turns it into KeywordFlag.Arrow, which arrow modifiers need. The stat's game text is the projectile count
    ('Fires {0} Arrows', skill_stat_descriptions.csd, paired with base_number_of_projectiles, which PoB maps to
    ProjectileCount). So PoB counts both. (checked: every SkillStatMap.lua and Data/Skills entry with only a
    skillFlag, against the open ranking: this is the only one open; scratch/covc2 in cov3.) For COV-A: the audit could
    count a skillFlag map as read.
  sources: ["vendor/PathOfBuilding-PoE2/src/Data/SkillStatMap.lua 1799-1801",
           "vendor/PathOfBuilding-PoE2/src/Modules/CalcActiveSkill.lua 576-577, 646-648",
           "data/game-26476662/files skill_stat_descriptions.csd"]
  test_in_game: "Not needed for boss damage."
  status: proposed
- id: gem-active-pob-not-melee
  title: "Attacks that aren't Melee: PoB never gives these stat sets the melee flag"
  kind: gem_stat
  match: '^attack_is_not_melee_override$'
  replace: []
  skill: ["Crackling Palm", "Fan the Flames", "Freezing Explosion", "Gelid Palm", "Herald of Blood",
          "Herald of Ice", "Herald of Thunder", "Herald of the Royal Queen", "Meteors", "Moonbeam",
          "Vivid Stampede"]
  confidence: datamined
  notes: >-
    The game marks these attacks (Herald explosions and bolts, palm bursts and bolts, Fan the Flames, Meteors,
    Moonbeam, Vivid Stampede) as not Melee. PoB's melee flag comes only from a stat set's baseFlags
    (CalcActiveSkill.lua 170-179), and none of these sets has melee = true (checked: every PoB stat set carrying the
    stat, 13 sets of 11 skills; SkillType.Melee absent from each skill's types too). So PoB gives them no Melee
    modifiers, as in the game.
  sources: ["vendor/PathOfBuilding-PoE2/src/Modules/CalcActiveSkill.lua 170-179, 527-541",
           "vendor/PathOfBuilding-PoE2/src/Data/Skills (each skill's statSets baseFlags)"]
  test_in_game: "Not needed for boss damage."
  status: proposed

# 2. Read by our models ----------------------------------------------------------------------------------------------

- id: gem-active-model-mark-limit
  title: "One Mark of each type on an enemy: the Mark model counts one"
  kind: model
  model: marks
  stats: ["number_of_marks_allowed_per_type"]
  skill: ["Bloodhound's Mark", "Freezing Mark", "Predator's Mark", "Sniper's Mark", "Voltaic Mark"]
  confidence: datamined
  notes: >-
    number_of_marks_allowed_per_type 1 ('Limit {0} Marked target', skill_stat_descriptions.csd): each Mark can be on
    one enemy at a time. The tool's fight is one boss, and models.mark_model counts one Mark on it at a time
    (marks[:1]), which keeps within the limit.
  sources: ["builder/search/models.py mark_model", "data/game-26476662/files skill_stat_descriptions.csd"]
  test_in_game: "Not needed for boss damage."
  status: proposed

# 3. Translated -----------------------------------------------------------------------------------------------------

- id: gem-active-shattering-spite-ailments
  title: "Shattering Spite: 50% less Magnitude of Damaging Ailments"
  kind: gem_stat
  match: '^active_skill_damaging_ailment_effect_\+%_final$'
  replace: ["1% more Magnitude of Damaging Ailments you inflict"]
  skill: ["Shattering Spite"]
  confidence: datamined
  notes: >-
    active_skill_damaging_ailment_effect_+%_final -50 on the skill's only stat set ('{0}% less Magnitude of Damaging
    Ailments inflicted', skill_stat_descriptions.csd). PoB has the stat in its skill data but maps it to nothing, so
    its Ignite, Bleeding and Poison from the explosion were counted at full magnitude: an overcount. Counted as more
    AilmentMagnitude (PoB's Poison, Bleed and Ignite keywords) for this skill.
  sources: ["vendor/PathOfBuilding-PoE2/src/Data/Skills/act_dex.lua (ShatteringSpitePlayer)",
           "data/game-26476662/files skill_stat_descriptions.csd", "https://poe2db.tw/us/Shattering_Spite"]
  test_in_game: "Shattering Spite with a Bleed or Ignite source: the ailment from the explosion is half the size of the same hit's from another skill."
  status: proposed

