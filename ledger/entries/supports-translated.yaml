- id: support-spectral-volley-own-projectiles
  title: Spectral Volley, 60% less Damage for the attack's own projectiles
  kind: gem_stat
  support: true
  skill: Spectral Volley
  support_stats: ['support_spectral_arrows_damage_+%_final_with_non_spectral_projectiles']
  match: '^support_spectral_arrows_damage_\+%_final_with_non_spectral_projectiles$'
  replace: ['1% more Damage']
  confidence: datamined
  notes: >-
    "Supported Skills deal 60% less Damage when not fired from Spectral Projectiles" (constant -60 on
    SupportSpectralVolleyPlayer). PoB maps none of the support's stats (its statSets have no statMap) and counts the
    attack's own projectiles at full damage, so a Bow or Spear attack with it was rated 1/0.4 = 2.5x too high (an
    overcount). Everything PoB counts of the attack is its own projectiles, so the line goes on the whole skill. The
    Spectral Projectiles ("Attacks with Supported Skills create a Spectral Projectile", at most 5, which "will fire if no
    Spectral Projectiles have been created in the last 3 seconds", at 20% more Damage) aren't counted by PoB or the tool
    (checked: grep -i spectral in PoB Modules/*.lua, builder/search/*.py, engine/bridge.lua, 12 Nov 2026: only Spectral
    Shield Throw and Summon Spectral Wolf, other skills), so the
    support is now a loss until MECH-B counts them (supports-parts.yaml support-spectral-volley-spectral-damage).
  sources: ["SupportSpectralVolleyPlayer, GrantedEffectStatSets (build 26476662)", "https://poe2db.tw/us/Spectral_Volley"]
  test_in_game: "Compare a supported attack's tooltip damage with and without Spectral Volley: 0.4x."
  status: proposed

# COVE5 (12 Nov 2026, AUDIT6 A6-1): the Slow Potency support's Slow Magnitude, counted on Chill as COV-B's
# passives-slow-magnitude-chill counts the same stat on the tree.

- id: support-slow-potency-chill
  title: Slow Potency, 15% increased Slow Magnitude on the supported skill's Debuffs (counted on its Chill)
  kind: gem_stat
  support: true
  skill: Slow Potency
  support_stats: ['base_debuff_slow_magnitude_+%']
  match: '^base_debuff_slow_magnitude_\+%$'
  replace: ['1% increased Magnitude of Chill you inflict']
  confidence: theory
  notes: >-
    base_debuff_slow_magnitude_+% 15 (constant on SupportSlowPotencyPlayer; PoB's skill data maps none of it: checked,
    sup_dex.lua SupportSlowPotencyPlayer has no statMap and SkillStatMap.lua has no base_debuff_slow_magnitude, 12 Nov
    2026). KeywordPopups SlowMagnitudeModifier: "applies to Debuffs you inflict that Slow enemies, and scales only the
    specific Magnitude that slows the target"; Chill is "an Ailment that Slows the afflicted target" (KeywordPopups
    Chill), so on the supported skill's Chill it is increased Chill magnitude, which PoB reads per skill
    (EnemyChillMagnitude in CalcOffence.lua 5687 and CalcPerform.lua 1340) up to Chill's 50% maximum. The same reading
    as passives-slow-magnitude-chill (COV-B) and RULE_AUDIT A6-1. The line is tagged to the supported skill only. Not
    counted: harder Slows from Hinder, Maim or Temporal Chains (PoB models no Slow magnitude for them; the tool's hit-rate
    models read none: UNVERIFIED, as the passives entry). Assumption: Slow Magnitude doesn't raise Chill's maximum.
  sources: ["SupportSlowPotencyPlayer, GrantedEffectStatSets (build 26476662)", "KeywordPopups SlowMagnitudeModifier, Chill"]
  test_in_game: "Chill a dummy with a fixed cold hit, with and without Slow Potency on the skill: the Chill's slow rises 15% (until 50%)."
  status: proposed

- id: support-frostfire-unique-ignite
  title: Frostfire, 25% more Magnitude of Ignite on Frozen Unique enemies (counted while the boss is Frozen)
  kind: gem_stat
  support: true
  skill: Frostfire
  support_stats: ['support_frostfire_ignite_effect_+%_final_vs_frozen_unique_enemies']
  match: '^support_frostfire_ignite_effect_\+%_final_vs_frozen_unique_enemies$'
  replace: ['1% more Magnitude of Ignite against Frozen Enemies']
  confidence: theory
  notes: >-
    "25% more Magnitude of Ignite inflicted on Frozen Unique enemies with Supported Skills" (constant 25 on
    SupportFrostfirePlayer). PoB's sup_int.lua maps only the gem's other 50%, ignite_effect_+%_final_against_frozen_enemies,
    as AilmentMagnitude MORE for Ignite against an enemy Frozen (checked: no statMap or SkillStatMap.lua entry names
    support_frostfire_*, 12 Nov 2026). This line is written the same way, so it counts at the share of the fight the
    condition resolver gives the boss Frozen (conditionEnemyFrozen, MECH-A's models.immobilised_share). The boss is a
    Unique, so the "Unique" part holds. Today that share comes from the main skill's own Freeze buildup only, and the
    supported skill "cannot cause Freeze buildup" (never_freeze, which PoB reads: CannotFreeze sets FreezeBuildupAvg to 0,
    CalcOffence.lua 5584). So with Frostfire on the main skill both its 50% and this 25% count 0 until another skill's
    Freezes are counted (MECH-A). Then the weight wants care: the support also Consumes the Freeze on Ignite
    (remove_freeze_on_ignite, which nothing reads), so one Ignite per Freeze gets the bonus, and that Ignite lasts its own
    duration after the Freeze is gone; the Frozen share is not the right weight (for MECH-A).
  sources: ["SupportFrostfirePlayer, GrantedEffectStatSets (build 26476662)", "gem_stat_descriptions.csd", "PoB sup_int.lua SupportFrostfirePlayer"]
  test_in_game: "Ignite a Frozen Unique with a fixed hit, with and without Frostfire: the Ignite is 1.5 x 1.25 = 1.875x."
  status: proposed

- id: support-elemental-armament-per-ailment
  title: Elemental Armament III, 12% more Attack Damage per Elemental Ailment on the enemy (each counted while the boss has it)
  kind: gem_stat
  support: true
  skill: Elemental Armament III
  support_stats: ['support_elemental_armament_attack_damage_+%_final_per_elemental_ailment_on_target']
  match: '^support_elemental_armament_attack_damage_\+%_final_per_elemental_ailment_on_target$'
  replace: ['1% more Attack Damage against Ignited Enemies', '1% more Attack Damage against Chilled Enemies',
            '1% more Attack Damage against Frozen Enemies', '1% more Attack Damage against Shocked Enemies',
            '1% more Attack Damage against Electrocuted Enemies']
  additive: [conditionEnemyIgnited, conditionEnemyChilled, conditionEnemyFrozen, conditionEnemyShocked,
             conditionEnemyElectrocuted]
  confidence: theory
  notes: >-
    "Supported Skills deal 12% more Attack Damage for each Elemental Ailment on Enemies they Hit" (constant 12 on
    SupportElementalArmamentPlayerThree; PoB maps none of it: checked, sup_*.lua and SkillStatMap.lua, 12 Nov 2026).
    KeywordPopups ElementalAilments: "Ignite, Chill, Freeze, Shock, and Electrocute", so one line per ailment, each on
    PoB's enemy condition, counted at the share of the fight the condition resolver gives the boss that ailment (as PoB
    writes "increased damage for each type of elemental ailment on enemy", ModParser.lua 3876). The supported skill
    "cannot inflict Elemental Ailments" (cannot_inflict_elemental_ailments, which PoB reads), so the ailments must come
    from other skills. Where the resolver sets them from the main skill's own ailments, a main skill with this support
    gets ~0 until other skills' ailments are counted (MECH-A). The game adds them (1 + 0.12n), PoB would multiply the five
    lines (1.12^n: +1.2% too much with two on, +10% with all five), so `additive:` sizes each line from the number of the
    five boxes on (models.additive_value, COVE7): exact with every counted box on, under 1% low while the uptime
    weighing turns one off.
  sources: ["SupportElementalArmamentPlayerThree, GrantedEffectStatSets (build 26476662)", "KeywordPopups ElementalAilments"]
  test_in_game: "Hit a Chilled and Shocked dummy with and without the support: 24% more."
  status: proposed

