- id: support-alignment-damage
  title: Alignment I/II, 30% / 40% more Projectile Damage on attacks matching the indicated direction (at a match share, LOW)
  kind: gem_stat
  support: true
  skill: [Alignment I, Alignment II]
  support_stats: ['support_called_shots_projectile_damage_+%_final_when_matching_direction']
  match: '^support_called_shots_projectile_damage_\+%_final_when_matching_direction$'
  replace: ['1% more Projectile Damage']
  share: alignment
  confidence: theory
  notes: >-
    "Supported Skills deal 30% more Projectile Damage when Attacking in indicated direction" (40% on Alignment II;
    constants on SupportAlignmentPlayer / PlayerTwo; PoB maps none of the support's stats: checked, grep of called_shot in
    PoB Modules/*.lua and SkillStatMap.lua, 12 Nov 2026: none). "Supported Skills indicate one of four directions, changing
    indicated direction when an Attack with Supported Skill matches that direction" (40 degrees' allowance,
    called_shot_angle_allowance_degs). Against one boss each match moves the direction off the boss, so the player steps
    round it before the next match (RESEARCH10; the manager's revised ruling, 12 Nov 2026 ~09:52, replacing COVE3's
    count on every attack, an overcount). Counted at the matched share of attacks: one match per 1.5 s (the hidden
    called_shot_aiming_delay_ms 1000, meaning UNVERIFIED, plus the reposition; LOW, models.ALIGNMENT_MATCH_SECONDS)
    against the skill's attack rate: Alignment II at 3 attacks/s is x1.09, not x1.40. Rests on the four directions being
    fixed on screen, the gem text's natural reading (UNVERIFIED; if they turned with the character every attack would
    match).
  sources: ["SupportAlignmentPlayer, SupportAlignmentPlayerTwo, GrantedEffectStatSets (build 26476662)",
            "https://poe2db.tw/us/Alignment_I", "scratch/manager/research/alignment-aiming-delay.md (RESEARCH10)"]
  test_in_game: "Attack a dummy as fast as possible in the indicated direction: does the next direction show at once or after ~1 s? Then circle a target and count matched hits per 10 s (open #56)."
  status: proposed

