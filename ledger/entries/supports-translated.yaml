  title: Echoing Cry, 40% less Damage on the supported Warcry
  kind: gem_stat
  support: true
  skill: Echoing Cry
  support_stats: ['support_echoing_cry_damage_+%_final']
  match: '^support_echoing_cry_damage_\+%_final$'
