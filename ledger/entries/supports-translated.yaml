# COVE3 (12 Nov 2026): the manager's rulings on COVE2's questions.

- id: support-fluke-damage
  title: Fluke / Ixchel's Torment, between 40% less and 60% more Damage on the skills the meta triggers (even spread, LOW)
  kind: gem_stat
  support: true
  to: triggered
  sum: true
  factor: 0.5
  skill: [Fluke, Ixchel's Torment]
  support_stats: ['support_randomise_lower_damage_+%_final', 'support_randomise_higher_damage_+%_final']
  match: '^support_randomise_(lower|higher)_damage_\+%_final$'
  replace: ['1% more Damage']
  confidence: theory
  notes: >-
    "Skills Triggered by Supported Skills deal between 40% less and 60% more Damage" (constants -40 and 60 on
    SupportFlukePlayer and SupportFlukePlayerTwo). The support goes on the skill that triggers (PoB: requireSkillTypes
    Triggers, so it sits in the meta gem's effect list, not the spells'), and PoB maps none of its stats (checked: grep of
    support_randomise in PoB Modules/*.lua and SkillStatMap.lua: none, 12 Nov 2026). Each trigger rolls its own value
    (poe2db's Fluke page: "randomly raised or lowered when Triggered"); the distribution is the game's and not in the
    files, so the manager's ruling (12 Nov 2026) counts the middle of the range, an even spread: (-40 + 60) / 2 = 10% more
    Damage on each skill the meta triggers. A flat average where the game decides the roll: LOW, named in COVE3's report,
    for the user. The cost recovery (between 0% and 20% of cost) isn't counted.
  sources: ["SupportFlukePlayer, SupportFlukePlayerTwo, GrantedEffectStatSets (build 26476662)",
            "https://poe2db.tw/us/Fluke"]
  test_in_game: "Hit a dummy many times with a triggered spell, with and without Fluke: the average of its hits, about 1.10x."
  status: proposed

