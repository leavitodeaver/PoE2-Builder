- id: support-alignment-damage
  title: Alignment I/II, 30% / 40% more Projectile Damage on attacks matching the indicated direction (at a match share, LOW)
  kind: gem_stat
  support: true
  skill: [Alignment I, Alignment II]
  support_stats: ['support_called_shots_projectile_damage_+%_final_when_matching_direction']
  match: '^support_called_shots_projectile_damage_\+%_final_when_matching_direction$'
  replace: ['1% more Projectile Damage']
  share: alignment
  confidence: theory
  notes: >-
    "Supported Skills deal 30% more Projectile Damage when Attacking in indicated direction" (40% on Alignment II;
    constants on SupportAlignmentPlayer / PlayerTwo; PoB maps none of the support's stats: checked, grep of called_shot in
    PoB Modules/*.lua and SkillStatMap.lua, 12 Nov 2026: none). "Supported Skills indicate one of four directions, changing
    indicated direction when an Attack with Supported Skill matches that direction" (40 degrees' allowance,
    called_shot_angle_allowance_degs). Against one boss each match moves the direction off the boss, so the player steps
    round it before the next match (RESEARCH10; the manager's revised ruling, 12 Nov 2026 ~09:52, replacing COVE3's
    count on every attack, an overcount). Counted at the matched share of attacks: one match per 1.5 s (the hidden
    called_shot_aiming_delay_ms 1000, meaning UNVERIFIED, plus the reposition; LOW, models.ALIGNMENT_MATCH_SECONDS)
    against the skill's attack rate: Alignment II at 3 attacks/s is x1.09, not x1.40. Rests on the four directions being
    fixed on screen, the gem text's natural reading (UNVERIFIED; if they turned with the character every attack would
    match).
  sources: ["SupportAlignmentPlayer, SupportAlignmentPlayerTwo, GrantedEffectStatSets (build 26476662)",
            "https://poe2db.tw/us/Alignment_I", "scratch/manager/research/alignment-aiming-delay.md (RESEARCH10)"]
  test_in_game: "Attack a dummy as fast as possible in the indicated direction: does the next direction show at once or after ~1 s? Then circle a target and count matched hits per 10 s (open #56)."
  status: proposed

- id: support-alignment-projectiles
  title: Alignment III, 4 additional Projectiles on attacks matching the indicated direction (at a match share, LOW)
  kind: gem_stat
  support: true
  skill: Alignment III
  support_stats: ['support_called_shots_additional_projectiles_when_matching_indicated_direction']
  match: '^support_called_shots_additional_projectiles_when_matching_indicated_direction$'
  replace: ['Skills fire an additional Projectile']
  share: alignment
  confidence: theory
  notes: >-
    "Supported Skills fire 4 additional Projectiles when Attacking in indicated direction" (constant 4 on
    SupportAlignmentPlayerThree; PoB maps none). Counted at the matched share of attacks, as support-alignment-damage
    (RESEARCH10: ~0.9 extra Projectiles per attack at 3 attacks/s, not 4), as an average Projectile count (PoB counts
    chance-based extra Projectiles the same way, CalcOffence.lua 1451). How many of them hit a single boss is PoB's own
    projectile rules (MECH-B owns it).
  sources: ["SupportAlignmentPlayerThree, GrantedEffectStatSets (build 26476662)", "https://poe2db.tw/us/Alignment_I",
            "scratch/manager/research/alignment-aiming-delay.md (RESEARCH10)"]
  status: proposed

- id: support-spectral-volley-own-projectiles
  title: Spectral Volley, 60% less Damage for the attack's own projectiles
  kind: gem_stat
  support: true
  skill: Spectral Volley
  support_stats: ['support_spectral_arrows_damage_+%_final_with_non_spectral_projectiles']
  match: '^support_spectral_arrows_damage_\+%_final_with_non_spectral_projectiles$'
  replace: ['1% more Damage']
  confidence: datamined
  notes: >-
    "Supported Skills deal 60% less Damage when not fired from Spectral Projectiles" (constant -60 on
    SupportSpectralVolleyPlayer). PoB maps none of the support's stats (its statSets have no statMap) and counts the
    attack's own projectiles at full damage, so a Bow or Spear attack with it was rated 1/0.4 = 2.5x too high (an
    overcount). Everything PoB counts of the attack is its own projectiles, so the line goes on the whole skill. The
    Spectral Projectiles ("Attacks with Supported Skills create a Spectral Projectile", at most 5, which "will fire if no
    Spectral Projectiles have been created in the last 3 seconds", at 20% more Damage) aren't counted by PoB or the tool
    (checked: grep -i spectral in PoB Modules/*.lua, builder/search/*.py, engine/bridge.lua, 12 Nov 2026: only Spectral
    Shield Throw and Summon Spectral Wolf, other skills), so the
    support is now a loss until MECH-B counts them (supports-parts.yaml support-spectral-volley-spectral-damage).
  sources: ["SupportSpectralVolleyPlayer, GrantedEffectStatSets (build 26476662)", "https://poe2db.tw/us/Spectral_Volley"]
  test_in_game: "Compare a supported attack's tooltip damage with and without Spectral Volley: 0.4x."
  status: proposed

# COVE5 (12 Nov 2026, AUDIT6 A6-1): the Slow Potency support's Slow Magnitude, counted on Chill as COV-B's
# passives-slow-magnitude-chill counts the same stat on the tree.

- id: support-slow-potency-chill
  title: Slow Potency, 15% increased Slow Magnitude on the supported skill's Debuffs (counted on its Chill)
  kind: gem_stat
  support: true
  skill: Slow Potency
  support_stats: ['base_debuff_slow_magnitude_+%']
  match: '^base_debuff_slow_magnitude_\+%$'
  replace: ['1% increased Magnitude of Chill you inflict']
  confidence: theory
  notes: >-
    base_debuff_slow_magnitude_+% 15 (constant on SupportSlowPotencyPlayer; PoB's skill data maps none of it: checked,
    sup_dex.lua SupportSlowPotencyPlayer has no statMap and SkillStatMap.lua has no base_debuff_slow_magnitude, 12 Nov
    2026). KeywordPopups SlowMagnitudeModifier: "applies to Debuffs you inflict that Slow enemies, and scales only the
    specific Magnitude that slows the target"; Chill is "an Ailment that Slows the afflicted target" (KeywordPopups
    Chill), so on the supported skill's Chill it is increased Chill magnitude, which PoB reads per skill
    (EnemyChillMagnitude in CalcOffence.lua 5687 and CalcPerform.lua 1340) up to Chill's 50% maximum. The same reading
    as passives-slow-magnitude-chill (COV-B) and RULE_AUDIT A6-1. The line is tagged to the supported skill only. Not
    counted: harder Slows from Hinder, Maim or Temporal Chains (PoB models no Slow magnitude for them; the tool's hit-rate
    models read none: UNVERIFIED, as the passives entry). Assumption: Slow Magnitude doesn't raise Chill's maximum.
  sources: ["SupportSlowPotencyPlayer, GrantedEffectStatSets (build 26476662)", "KeywordPopups SlowMagnitudeModifier, Chill"]
  test_in_game: "Chill a dummy with a fixed cold hit, with and without Slow Potency on the skill: the Chill's slow rises 15% (until 50%)."
  status: proposed
