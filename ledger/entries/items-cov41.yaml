- id: model-read-low-mana-flask-recovery
  title: '"N% more Recovery if used while on Low Mana" (flasks.low_mana_more)'
  kind: pob_gap
  model: flask_recovery
  match: '^(\(\d+-\d+\)|\d+(?:\.\d+)?)% more Recovery if used while on Low Mana$'
  replace: []
  confidence: theory
  notes: >-
    flasks.LOW_MANA_MORE / low_mana_more (MECHC34, PATCH_CHECK K5-3), read in recovery_per_second (flasks.py 787) and
    the Mana flask's ES / Ward readers (638), and the play guide's flask row (play_guide.py 391): the Mana flask is drunk
    at Low Mana on purpose, so its recovery is multiplied by 1 + N%. PoB parses the line only in part (leftover "if used",
    a Life-flask stat), so it never applies it. Mods FlaskIncreasedRecoveryOnLowMana1-5.
  sources: [builder/search/flasks.py (LOW_MANA_MORE, low_mana_more, recovery_per_second), builder/search/play_guide.py 391]
  status: proposed
