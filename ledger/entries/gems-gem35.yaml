- id: model-gem35-grenades-a-throw
  title: "Every grenade of a throw bursts on a lone boss (an UNDERCOUNT before: PoB scores one burst whatever the projectile count)"
  kind: model
  model: grenade_count
  stats: ["fixed_projectile_spread", "active_skill_projectile_speed_+%_variation_final_if_multiple_projectiles"]
  skill: [Grenade, Explosive Grenade, Flash Grenade, Gas Grenade, Oil Grenade, Voltaic Grenade, Cluster Grenade]
  confidence: MEDIUM-LOW
  notes: >-
    RESEARCH46 R46-12 (research/fireball-ember-grenade-hits-r46.md). Every grenade stat set carries fixed_projectile_spread
    (30; Cluster Grenade 50), read as a total arc in degrees (MEDIUM: monster sets show it, no text gives the unit), so a
    throw's N grenades (PoB's ProjectileCount) land within ~1.16 m (Cluster 1.9 m) sideways of the middle one at R45-1's
    ~4.5 m throw (LOW), +-15% along it with several (the variation stat). Each grenade hits nothing in flight and bursts
    in its own area, so the projectile group rule (KeywordPopups Projectile) doesn't cap the bursts. models.grenade_count_model:
    the bursts whose area (PoB's AreaOfEffectRadius of the scored set + the boss's hit radius) reaches the boss with the
    spread's middle on it, as a DPS MORE with HIT_CUT_PER_USE; rows at N - 1 (LOW) and the throw 2 m short. Sets with no
    hit (Oil Ground, Gas Grenade's Poison Cloud) taken as one ground (whether they stack UNVERIFIED, the lower reading).
    Cluster Grenade: cluster_grenade_model's primaries (cluster_throw), each with its own minis. Run and Gun's chance on a
    grenade goes to PoB's ProjectileCount (run_and_gun_model).
  sources: ["builder/search/models.py (GRENADE_BURST_SETS, grenade_count_model, cluster_throw, run_and_gun_model)",
