- id: model-gem35-verglas-crystal-shatter
  title: "Verglas: Damage Gained as extra Cold from the Ice Crystals you destroy (an UNDERCOUNT before: PoB maps none of its stats)"
  kind: model
  model: verglas
  stats: ["support_crystalshatter_buff_damage_%_gained_as_extra_cold_per_2000_crystal_life", "support_crystalshatter_buff_duration",
          "support_crystalshatter_buff_crystal_life_destroyed_in_past_duration"]
  skill: [Verglas]
  confidence: MEDIUM-LOW
  notes: >-
    RESEARCH47 R47-3. gem_stat_descriptions.csd: "Destroying an Ice Crystal grants Supported Skills {0}% of Damage Gained
    as extra Cold for {1} seconds, per two thousand maximum Life of the destroyed Ice Crystal" (1%, 6 s). PoB has the gem
    and maps neither stat. The game's runtime stat support_crystalshatter_buff_crystal_life_destroyed_in_past_duration is
    read as the buff summing the Life destroyed in the past 6 s (MEDIUM-LOW; a row with one crystal at a time). The
    build's own crystals: Frost Wall's side groups (one segment a wall, the lower reading; the segment count is a RESEARCH
    question) when something breaks it (ICE_BREAKERS, a Freeze consumer, Vruun's Aftermath Warcries, or the main skill's
    hits dealing its Life within 8 s), Frozen Locus's side groups (broken before its 10 s), Midnight Zenith's crystals the
    build breaks (GEM36: MECHB55's midnight_zenith_model steps, models.midnight_breaks; an expiring one gives nothing).
    GEM36, RESEARCH48: the buff SUMS every crystal destroyed in the past 6 s (R48-6, MEDIUM) and the total is floored
    (MEDIUM-LOW; models.verglas_expected, the breaks random in time), each crystal floored on its own a row; Frost Wall's
    12,714 is each segment's Life (R48-7, HIGH-MEDIUM); a break takes the segments its breaker reaches (R49-4,
    HIGH-MEDIUM: Glacial Cascade's spike 2, a Freeze consumer or own hits 1, a Vruun's Aftermath Warcry the wall, ~7 at
    gem 20 LOW; GEM37, R51-4, LOW: Fragmentation Rounds 2, Gelid Palm 4, Embrace The Fall the wall), rows at 1 / 3 /
    5 / 9 segments a break; Glacial Bolt's two walls a bolt counted (R48-8, HIGH-MEDIUM; Ice Shards, Permafrost
    Bolts and Hailstorm Rounds make no crystals). Not counted: Grim Pillars, the Ice Seeds line, crystals the boss
    breaks, a main-skill Frost Wall's own. A DamageGainAsCold BASE on the main skill at the fight's average.
  sources: ["builder/search/models.py (verglas_model)", "builder/search/assumptions.py (Assumptions.verglas)",
            "data/game-26650308/tables/Stats.json", "data/game-26650308/files/data/statdescriptions/gem_stat_descriptions.csd (38220-38222)",
            "vendor/PathOfBuilding-PoE2-v0.23.1/src/Data/Skills/sup_int.lua (SupportVerglasPlayer)"]
  test_in_game: "Verglas on Frostbolt, two Frost Wall segments destroyed within 6 s: does the Cold gain double (summed) or stay one crystal's?"
  status: proposed

