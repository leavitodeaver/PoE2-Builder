- id: model-gem17-elemental-sundering-ailments
  title: "Elemental Sundering: one explosion per Freeze / Ignite / Shock it consumes, nothing without them (PoB scored an explosion always)"
  kind: model
  model: ailment_set
  stats: []
  skill: [Elemental Sundering]
  confidence: MEDIUM
  notes: >-
    models.ailment_set_model (GEM17). Game: ActiveSkills elemental_sundering "emit a pulse that Consumes Freeze, Shock and
    Ignite on a number of nearby enemies, Allies and Corpses. The pulse itself deals no damage, but each Ailment Consumed
    causes an explosion of the corresponding elemental damage type". PoB scores its Cold / Fire / Lightning sets alone
    with no ailment check: probe POE2T2190 (no ailment source) kept Cold at 634.4 (an OVERCOUNT: the game gives 0).
    DPS = Cold x Frozen share + Fire x Ignited share + Lightning x Shocked share (MECH-A's uptimes after the consume
    cut, which take Sundering's own consumes off); with no ailment held at 1% of PoB's set, not 0 (at 0 the next pass
    reads every set as 0 and the model loses its scale: probe POE2T2191; PoB rounds a MORE product to two decimals, so
    0.1% read as 0: probe POE2T2193). Allies' and corpses' ailments not counted (labelled).
  sources: ["builder/search/models.py (ailment_set_model)", "data/game-26650308/tables/ActiveSkills.json (elemental_sundering)",
            "scratch/gem17/probe_sets5.json (POE2T2190)"]
  test_in_game: "Optional: Elemental Sundering on a boss with no ailment: no damage."
