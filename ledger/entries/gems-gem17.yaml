- id: model-gem17-snipe-icy-blast-freeze
  title: "Snipe: the Icy Blast only when its release consumes a Freeze (PoB scored it always); a release is the arrow plus its explosion"
  kind: model
  model: ailment_set
  stats: ["perfectly_timed"]
  skill: [Snipe]
  confidence: MEDIUM
  notes: >-
    models.ailment_set_model (GEM17), hooked in Assumptions after the gated-set hook. Game: ActiveSkills snipe
    "Releasing with Perfect Timing causes the arrow to explode on impact and Consume Freeze on directly Hitting.
    Consuming Freeze enhances the explosion". PoB scores Arrow, Explosion and Icy Blast (SnipeFrozenExplosionPlayer)
    alone with no Freeze check: probe POE2T2190 (no Freeze source) kept Icy Blast at 945.1 vs Explosion 308.8, Arrow
    45.6 (an OVERCOUNT, x2.7 over arrow + explosion). DPS = Arrow + Explosion x (1 - f) + Icy Blast x f, f the boss's
    Frozen share after the consume cut; every release Perfectly Timed (as conditions reads Snipe's consume). The arrow and
    explosion together (an UNDERCOUNT before). Icy Blast with no Freeze gets the result x 0.9 so the search keeps a fed set.
  sources: ["builder/search/models.py (ailment_set_model)", "data/game-26650308/tables/ActiveSkills.json (snipe)",
