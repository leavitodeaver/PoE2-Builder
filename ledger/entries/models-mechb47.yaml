  kind: model
  model: ward_freed_time
  skill: ["Voltaic Barrier"]
  confidence: theory
  notes: >-
    An UNDERCOUNT GEM27 found (probe POE2T5715): the press model charged the main skill for each pressed Ward-cost skill
    at its planned rate before the Ward plan ran, so with no Runic Ward pool (the barrier's press scale 0) Lightning
