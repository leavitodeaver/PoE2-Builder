# Lines PoB calculates wrongly -------------------------------------------------------------------

- id: keeper-of-the-arc-dot
  title: Keeper of the Arc, alternating less damage over time (PoB's parse of it moves nothing)
  kind: pob_wrong
  match: '^Take (\d+)% less Damage over time$'
  replace: ['{g1/2}% less Damage over Time taken']
  confidence: datamined
  notes: >-
    The crown alternates every 5 s between this and less damage from Hits; counted as the average. PoB parses the line
    (ModCache: DamageTaken MORE -40 with flags=8, the Dot flag), but its damage-taken-over-time multipliers don't read
    that mod: COV20's probe (AUDIT27 A13-23; POE2T2443, scratch/cov20/probe_keeper.py, the current variant on a fresh
    build) gave {Chaos,Physical}TakenDotMult 1.0 with PoB's own text, the same as with no helmet, and 0.8 with this
    entry; the hit line (keeper-of-the-arc) went 1.0 -> 0.8 too. So PoB counts the line 0 (an UNDERCOUNT before this
    entry, not the always-on overcount this entry's title said until COV20), and both lines now count half. Whether any
    other PoB calculation reads a Dot-flagged DamageTaken mod wasn't probed (UNVERIFIED); replacing the line removes it
    either way.
  sources: ["https://poe2db.tw/Keeper_of_the_Arc"]
  status: approved
