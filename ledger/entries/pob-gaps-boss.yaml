  match: '^Adapt to the highest Elemental Damage Type of each Hit you take$'
  replace: []
  confidence: datamined
  sources: ["https://poe2db.tw/Reactive_Growth"]
  status: approved

- id: no-effect-alternating-header
  title: '"Alternating every 5 seconds:" (the lines under it are corrected individually)'
  kind: pob_gap
  match: '^Alternating every \d+ seconds:$'
  replace: []
  confidence: datamined
  sources: ["https://poe2db.tw/Keeper_of_the_Arc"]
  status: approved

# Defences --------------------------------------------------------------------------------------

- id: unlucky-enemy-damage
  title: Damage of enemies hitting you is Unlucky
  kind: pob_gap
  match: '^Damage of Enemies Hitting you is Unlucky$'
  replace: ['4% less Damage taken from Hits', '3% less Damage taken from Hits']
  confidence: reported
  notes: >-
    Unlucky rolls twice and keeps the lower: the average falls by (max-min)/(3*(max+min)), 6.67% for
    a +-20% damage spread and 10% for +-30%. Boss Damage Spread is +-20% (poe2db's datamined monster
    blocks: the Arbiter of Ash, all three King in the Mists, The Blind Beast, The Sunburst Queen, Goliath; spells too:
    the Arbiter's Fireball rolls x1.5 max/min), so 6.67% (RESEARCH3, research/unlucky-boss-damage.md; it was 8%, a
    small overcount of defences). PoB reads whole percents only ("6.67% less" parses as ".67% less"), so it's written
    as 4% and 3% less (x0.9312: 6.88%, 0.21 points high); the -low-life, -physical and -lightning entries the same. MEDIUM-HIGH. Against Armour, physical hits lose slightly more (lower rolls lose more
    to Armour): a small understatement there.
  sources: ["https://poe2db.tw/us/Oracle", "https://poe2db.tw/Unlucky"]
  status: proposed

- id: unlucky-enemy-damage-chance
  title: Chance for damage of enemies hitting you to be Unlucky
  kind: pob_gap
  match: '^(\(\d+-\d+\)|\d+)% chance for Damage of Enemies Hitting you to be Unlucky$'
  replace: ['{g1*0.0667}% less Damage taken from Hits']
  confidence: reported
  notes: "Chance x the 6.67% for always Unlucky (boss Damage Spread +-20%: unlucky-enemy-damage)."
  sources: ["https://poe2db.tw/Unlucky"]
  status: proposed

- id: unlucky-enemy-damage-low-life
  title: Damage of enemies hitting you is Unlucky on Low Life
  kind: pob_gap
  match: '^Damage of Enemies Hitting you is Unlucky while you are on Low Life$'
  replace: ['4% less Damage taken from Hits while on Low Life', '3% less Damage taken from Hits while on Low Life']
  confidence: reported
  sources: ["https://poe2db.tw/Unlucky"]
  status: proposed

- id: unlucky-enemy-physical
  title: Physical damage of enemies hitting you is Unlucky
  kind: pob_gap
  match: '^Physical Damage of Enemies Hitting you is Unlucky$'
  replace: ['4% less Physical Damage taken from Hits', '3% less Physical Damage taken from Hits']
  confidence: reported
  sources: ["https://poe2db.tw/Unlucky"]
  status: proposed

- id: unlucky-enemy-lightning
  title: Lightning damage of enemies hitting you is Unlucky
  kind: pob_gap
  match: '^Lightning Damage of Enemies Hitting you is Unlucky$'
  replace: ['4% less Lightning Damage taken', '3% less Lightning Damage taken']
  confidence: reported
  notes: "PoB has no 'Lightning damage taken from Hits'; lightning damage over time is rare."
  sources: ["https://poe2db.tw/The_Burrower", "https://poe2db.tw/Unlucky"]
  status: proposed

- id: reactive-growth
  title: Reactive Growth, less damage taken per matching Adaptation
  kind: pob_gap
  match: '^(\d+)% less Damage taken of each Elemental Damage Type per matching Adaptation$'
  replace: ['{1}% less Fire Damage taken', '{1}% less Cold Damage taken', '{1}% less Lightning Damage taken']
  confidence: reported
  notes: >-
    Up to 3 Adaptations, gained from the element of each Hit taken. A boss that mostly uses one
    element keeps all three on it (27% less); assumed one per element, as against a mixed boss.
  sources: ["https://poe2db.tw/Reactive_Growth", "https://poe2db.tw/Adaptation"]
  status: proposed

- id: keeper-of-the-arc
  title: Keeper of the Arc, alternating less damage from Hits
  kind: pob_gap
  match: '^Take (\d+)% less Damage from Hits$'
  replace: ['{g1/2}% less Damage taken from Hits']
  confidence: reported
  notes: >-
    The crown alternates every 5 s between less damage from Hits and less damage over time, so
    Hits get the reduction half the time. Counted as the average; a single big hit may land in
    the other phase.
  sources: ["https://poe2db.tw/Keeper_of_the_Arc"]
  status: proposed

- id: adaptive-skin
  title: Adaptive Skin, maximum resistance of elements you were hit by
  kind: pob_gap
  match: '^\+(\d+)% to Maximum Resistances of each Elemental Damage Type you have been Hit with Recently$'
  replace: ['+{1}% to all Maximum Elemental Resistances']
  confidence: reported
  notes: "Assumes the boss has hit you with an element within 4 s before its biggest hit of that element."
  sources: ["https://poe2db.tw/Adaptive_Skin"]
  status: proposed

# Damage ----------------------------------------------------------------------------------------

- id: melting-flames
  title: Melting Flames, Fire damage taken by enemies you've ignited
  kind: pob_gap
  match: '^Enemies Ignited by you permanently take \d+% increased Fire Damage for each second they have ever been Ignited by you, up to a maximum of (\d+)%$'
  replace: ['Enemies Ignited by you take {1}% increased Fire Damage']
  confidence: datamined
  notes: "Permanent once earned; capped after 10 s of total Ignite on the boss."
  sources: ["https://poe2db.tw/Melting_Flames"]
  status: approved

- id: lucky-spell-crits
  title: Chance for spell critical hits to be Lucky
  kind: pob_gap
  match: '^(\(\d+-\d+\)|\d+)% chance for Spell Damage with Critical Hits to be Lucky$'
  replace: ['{g1*0.04}% more Spell Damage']
  confidence: theory
  notes: >-
    Lucky keeps the better of two damage rolls: +(max-min)/(6*average), 6.7% for a +-20% spread.
    Times the chance and an assumed 60% of hits being critical.
  sources: ["https://poe2db.tw/us/Lucky"]
  status: proposed

- id: aggravate-bleed-on-hit
  title: Chance to Aggravate Bleeding on hit
  kind: pob_gap
  match: '^(\(\d+-\d+\)|\d+)% chance to Aggravate Bleeding on (?:targets you Hit with Attacks|Hit)$'
  replace: ['{600*g1/(100+6*g1)}% more Damage with Bleeding']
  confidence: theory
  notes: >-
    Aggravated Bleeding deals damage as if the target were moving (100% more). Share of bleed time
    aggravated, for chance p at 2 hits per second on 5 s bleeds, is about 6p/(1+6p) (10% -> 38%).
    Assumes a stationary boss; don't also set the enemy as moving.
    LOW, A FLAT RATE THE BUILD DECIDES (CLAUDE.md rule 2; COVD7, FIX_QUEUE; COV7): 2 hits per second and a 5 s Bleed
    are fixed here, not the build's own hits per second and Bleed duration. At 10% chance, 1 - 0.9^(hits/s x 5 s) of
    Bleed time is aggravated: 41% at 1 hit/s, 65% at 2, 88% at 4, against the 38% this formula gives (RESEARCH3:
    ~65% vs ~38% at 2 hits/s): an undercount for most builds, an overcount only below ~0.9 hits/s. Ledger translations are applied to item and passive text before any calculation, so they can't read
    the build's rate: it needs a model (share = 1 - (1 - p)^(hits/s x Bleed duration), the share of Bleed time an
    aggravation covers), which is models.py / conditions.py work, routed to MECH-A (FIX_QUEUE "the Aggravate share
    model"). The on-crit, always-on-crit and Empowered entries below carry the same flat rate plus a fixed crit
    share (50%) or Empowered share (10%): the same model should take the build's crit chance and Empowered rate.
  sources: ["https://poe2db.tw/us/Aggravated_Bleeding", "https://poe2db.tw/us/Bleeding"]
  status: proposed

- id: aggravate-bleed-on-crit
  title: Chance to Aggravate Bleeding on critical hit
  kind: pob_gap
  match: '^(\(\d+-\d+\)|\d+)% chance to Aggravate Bleeding on targets you Critically Hit with Attacks$'
  replace: ['{300*g1/(100+3*g1)}% more Damage with Bleeding']
  confidence: theory
  notes: "As the on-hit chance, with half of hits assumed critical. LOW: flat hit rate and crit share (see aggravate-bleed-on-hit; model routed to MECH-A)."
  sources: ["https://poe2db.tw/us/Aggravated_Bleeding"]
  status: proposed

- id: aggravate-bleed-always-on-crit
  title: Aggravate Bleeding on critical hit
  kind: pob_gap
  match: '^Aggravate Bleeding on targets you Critically Hit with Attacks$'
  replace: ['75% more Damage with Bleeding']
  confidence: theory
  notes: "As the on-hit chance with p = 50% (half of hits assumed critical). LOW: flat hit rate and crit share (see aggravate-bleed-on-hit; model routed to MECH-A)."
  sources: ["https://poe2db.tw/us/Aggravated_Bleeding"]
  status: proposed

- id: aggravate-bleed-empowered
  title: Chance to Aggravate Bleeding with Empowered attacks
  kind: pob_gap
  match: '^(\d+)% chance to Aggravate Bleeding on targets you Hit with Empowered Attacks$'
  replace: ['{60*g1/(100+0.6*g1)}% more Damage with Bleeding']
  confidence: theory
  notes: "As the on-hit chance, with about 10% of attacks empowered against a single boss. LOW: flat hit rate and Empowered share (see aggravate-bleed-on-hit; model routed to MECH-A)."
  sources: ["https://poe2db.tw/us/Aggravated_Bleeding", "https://poe2db.tw/Empowered_Skills"]
  status: proposed

- id: aggravate-bleed-jagged-ground
  title: Bleeding aggravated against enemies on Jagged Ground
  kind: pob_gap
  match: '^(\d+)% chance for Bleeding to be Aggravated when Inflicted against Enemies on Jagged Ground$'
  replace: ['if:JaggedGround {g1*0.4}% more Damage with Bleeding']
  confidence: theory
  notes: "Each new bleed is aggravated with this chance while the boss stands on your Jagged Ground (40% of the time assumed)."
  sources: ["https://poe2db.tw/us/Jagged_Ground", "https://poe2db.tw/us/Aggravated_Bleeding"]
  status: proposed

- id: spike-pit
  title: Spike Pit, enemies in your Jagged Ground take more damage
  kind: pob_gap
  match: '^Enemies in Jagged Ground you create take (\d+)% increased Damage$'
  replace: ['if:JaggedGround {g1*0.4}% more Damage']
  confidence: theory
  notes: "Bosses move; the boss assumed in your Jagged Ground 40% of the time."
  sources: ["https://poe2db.tw/Spike_Pit", "https://poe2db.tw/us/Jagged_Ground"]
  status: proposed

