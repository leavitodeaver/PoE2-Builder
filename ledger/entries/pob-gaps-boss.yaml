# Mechanics Path of Building ignores, as their effect on a sustained single-target boss fight.
# Research (2026-10, PoE2 0.5.x): exact texts and numbers from poe2db.tw (datamined from the
# game files); boss behaviour from community guides. Uptimes that depend on how a fight goes are
# fixed assumptions stated in `notes`, labelled `theory`. Every corrected number in a result is
# shown with an asterisk and this confidence.
#
# Unique lines appear with their roll range in PoB's data ("(15-30)%") and rolled on an equipped
# item ("22%"), so unique patterns accept both.

# Conditions switched on by the build's skills ----------------------------------------------------

- id: GlorySkill
  title: Uses a skill that requires Glory
  kind: condition
  skill_text: '\bGlory\b'
  # Only a skill that spends Glory counts (its usage rule has this stat): the text alone also matched skills that build
  # or mention Glory without using it, which switched on Call Upon the Deep and Thrill of the Fight (an overcount)
  usage_stat: active_skill_requires_X_glory
  # and only while the build's own Glory pays for one use per 6 s on a boss, the rate Call Upon the Deep and Thrill of
  # the Fight assume (models.glory_uses, from the game files' Glory sources; Thrill's one per 12 s is then undercounted
  # between one per 12 s and one per 6 s)
  glory_every: 6
  confidence: datamined
  sources: ["Glory skills' gem descriptions (Hammer of the Gods, Spear of Solaris, Banners, Ancestral Cry ...)"]
  status: approved

- id: SpellEcho
  title: Uses Spell Echo
  kind: condition
  skills: '^Spell Echo'
  confidence: datamined
  sources: ["Support gem name"]
  status: approved

- id: JaggedGround
  title: Creates Jagged Ground
  kind: condition
  skills: 'Jagged Ground'
  skill_text: 'Jagged Ground'
  confidence: reported
  sources: ["https://poe2db.tw/us/Jagged_Ground (Earthquake, Jagged Ground I, Stampede, Furious Slam)"]
  status: approved

# Witchhunter: Witchbane and No Mercy -----------------------------------------------------------

- id: witchbane-concentration
  title: Witchbane gives enemies Concentration (needed by No Mercy)
  kind: pob_gap
  match: '^Enemies have Maximum Concentration equal to \d+% of their Maximum Life$'
  replace: ['flag:Witchbane']
  confidence: datamined
  sources: ["https://poe2db.tw/Witchbane", "https://poe2db.tw/Concentration"]
  status: approved

- id: witchbane-rest
  title: Witchbane's Concentration break and regain (part of No Mercy's model)
  kind: pob_gap
  match: '^(Break enemy Concentration on Hit equal to \d+% of Damage Dealt|Enemies regain \d+% of Concentration every second.*)$'
  replace: []
  confidence: datamined
  sources: ["https://poe2db.tw/Witchbane"]
  status: approved

- id: no-mercy
  title: No Mercy, more damage by missing Concentration
  kind: pob_gap
  match: '^Deal up to (\d+)% more Damage to Enemies based on their missing Concentration$'
  replace: ['if:Witchbane {g1*0.9}% more Damage']
  confidence: reported
  notes: >-
    Concentration is 30% of the boss's life and only regenerates after 5 s without Hits, so after
    the first 30% of its life the bonus is at its maximum. Averaged over a long fight about 90% of
    the maximum. Needs Witchbane for enemies to have Concentration at all.
  sources: ["https://poe2db.tw/No_Mercy", "https://poe2db.tw/Witchbane",
            "https://pcgamer.com/games/rpg/path-of-exile-2-mercenary-build"]
  status: retired  # COVB4: the flat 90% overcounted; passives-batch3.yaml passives-model-no-mercy counts it from the build's Hit share

# Lines with no effect on a single boss ----------------------------------------------------------

