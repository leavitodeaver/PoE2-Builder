- id: unlucky-enemy-damage-runic-ward
  title: Warding Rune of Bodyguards (Bonded), damage of enemies hitting you is Unlucky if your Runic Ward was damaged Recently
  kind: pob_gap
  # PoB's rune data (ModRunes.lua 6301-6305, the bonded block) and our audit export hold it as two lines, each parsed
  # alone; the first half and the joined text carry the 4% / 3%, the second half is unlucky-enemy-damage-runic-ward-tail
  # (no effect of its own), so the bonus is applied once whichever way the item holds it (COV22)
  match: '^Damage of Enemies Hitting you is Unlucky if( your Runic Ward has been damaged Recently)?$'
  replace: ['share:RunicWardDamaged 4% less Damage taken from Hits', 'share:RunicWardDamaged 3% less Damage taken from Hits']
  confidence: theory
  notes: >-
    COV22 (MECHC15's switch): counted at the share of the fight the Ward was damaged Recently, the condition
    RunicWardDamaged (Assumptions.ward_damaged_share: Runic Reprieve channelled into the boss's hits as far as the
    build's Ward regeneration pays for them, 1 - exp(-4 s x blocked hits a second), LOW; without Runic Reprieve 0). As
    the other part-time conditions: whole from 99.5% of the fight, else 0 in PoB and the share left for the search's
    part-time weighing (ledger_part_time). The 4% / 3% as unlucky-enemy-damage-full-life (6.67% for the bosses' +-20%
    Damage Spread; PoB reads whole percents only). Before: counted 0, an UNDERCOUNT for a Runic Reprieve build.
    The Warding Rune of Bodyguards' Bonded line (FIX_QUEUE RESEARCH6: "when Runic Ward was damaged recently", one of the
    four missing Unlucky lines; the other three: Full Life has unlucky-enemy-damage-full-life, and "while Cursed with
    Vulnerability" / "with a Magic Ring Equipped" have no player source in the exported tables (COV10), so no entry).
    PoB applies neither half (the audit's export: "PoB ignores the line" for both; neither is in ModCache.lua), so it
    adds nothing today. How Runic Ward is damaged (corrected by COV18 after AUDIT26 A26-1; COV14 wrote it is damaged
    only by fatal damage, which was WRONG): (1) fatal damage: "If you take damage that would cause your Life to reach 0
    while you have Runic Ward, you will drop to 1 Life and your Runic Ward will take the remaining damage" (KeywordPopups
    Ward, game 26476662); (2) while channelling Runic Reprieve, hit damage: "While Channelling this Skill ... damage you
    take from Hits is also removed from Runic Ward" (ActiveSkills runic_reprieve; its stat set carries
    non_ward_damage_taken_from_blocked_hits_is_taken_to_ward_as_well; poe2db Runic_Reprieve: "Lose Runic Ward on Block
    equal to the damage you took from that Hit"). (checked: every Stats id holding "ward" with damage / taken / absorb /
    before / lose and their carriers in all tables (COV18, AUDIT26): Runic Reprieve's stats are the ones that move hit
    damage onto Ward; all_damage_from_hits_is_taken_from_ward_before_life has no carrier; a Soul Core's
    damage_cannot_be_taken_from_ward stops Ward taking damage; poe2db Runic_Reprieve.) Open (UNVERIFIED): whether
    spending Ward as a cost (Runic Infusion and Olroth's Hubris supports, a Soul Core's
    attack_spend_x%_maximum_ward_for_added_physical_damage, Olrovasara's per-50-Ward-cost line) counts as Ward "damaged";
    nothing is excluded on it. The count: 6.67% less Damage taken from Hits (unlucky-enemy-damage) x the share of the
    fight within 4 s of Ward taking damage, which for a Runic Reprieve build is about the share of the fight within 4 s
    of a hit taken while channelling it (the boss preset's hits and the build's channel time); fatal damage absorbed adds
    a little in a fight the build survives. That share is MECH-C's (the Ward lane), landed with MECHC15 (no source, 0, per the user's rule; never the always-on
    6.67%). It also counts only
    while the rune's Bonded lines apply (Wisdom of the Maji, or a Fox Idol in the item: COV13).
  sources: ["vendor/PathOfBuilding-PoE2/src/Data/ModRunes.lua (Warding Rune of Bodyguards, bonded)",
            "builder/search/assumptions.py (ward_damaged_share, MECHC15)",
            "data/game-26476662/tables/KeywordPopups.json (Ward)", "data/game-26476662/tables/ActiveSkills.json (runic_reprieve)",
            "https://poe2db.tw/us/Runic_Reprieve", "https://poe2db.tw/Unlucky"]
  status: proposed

