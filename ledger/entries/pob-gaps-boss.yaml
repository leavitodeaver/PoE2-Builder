            "https://maxroll.gg/poe2/resources/ritualist-ascendancy-overview"]
  status: approved

- id: no-effect-fork-projectile
  title: Additional projectile when forking (forks can't hit the same target again)
  kind: pob_gap
  match: 'chance for an additional Projectile when Forking$'
  replace: []
  confidence: community_confirmed
  sources: ["https://poe2db.tw/us/Fork", "https://www.poe2wiki.net/wiki/Forking"]
  status: approved

- id: no-effect-splash
  title: Splash damage (hits other enemies, not the one struck)
  kind: pob_gap
  match: '^(Strikes deal Splash Damage|Strike Skills you use yourself with Maces have \d+% chance to deal Splash Damage)$'
  replace: []
  confidence: community_confirmed
  sources: ["https://poe2db.tw/Splash_Damage", "https://poe2db.tw/Split_the_Earth"]
  status: approved

- id: no-effect-run-and-gun
  title: Run and Gun extra projectiles while moving (PoB doesn't parse it; counted by a model for the skills whose projectiles can all hit one target)
  kind: pob_gap
  match: '^Projectile Attacks have a \d+% chance to fire two additional Projectiles while moving$'
  replace: []
  confidence: reported
  notes: >-
    PoB leaves the line unparsed (ModCache nil). KeywordPopups Projectile: only one Projectile in the group can
    hit each target unless otherwise specified. The user (11 Nov 2026): count it for the exceptions, labelled.
    models.run_and_gun_model (MECH44) counts it for projectiles_can_shotgun skills (2 x the chance over the
    projectile count, as more damage) and for skills firing in sequence (projectiles_crossbow_barrage,
    projectiles_barrage: PoB's own TwoAdditionalProjectilesChance), while firing on the move with a skill usable
    while moving and not standing still; other skills get none.
  sources: ["https://poe2db.tw/Run_and_Gun", "https://www.poe2wiki.net/wiki/Projectile_behaviour", "data/game-26476662 GrantedEffectStatSets (projectiles_can_shotgun, projectiles_crossbow_barrage, projectiles_barrage)"]
  absorbed_by: "builder/search/models.py run_and_gun_model, for shotgun and sequence-fired skills used while moving"
  status: approved

- id: no-effect-extra-combo
  title: Chance to build additional Combo (only speeds up Combo; consumers are calculated separately)
  kind: pob_gap
  match: '^\d+% Chance to build an additional Combo on Hit$'
  replace: []
  confidence: reported
  sources: ["https://poe2db.tw/Chakra_of_Rhythm", "https://poe2db.tw/us/Combo"]
  absorbed_by: "PoB calculates a Combo skill at the Combo it requires, as if always reached; faster Combo would let it be used more often (not counted: the use rate is PoB's)"
  status: approved

- id: no-effect-presence-aggravate
  title: Aggravate Bleeding when enemies enter your Presence (a boss enters once, before it bleeds)
  kind: pob_gap
  match: '^Aggravate Bleeding on Enemies when they Enter your Presence$'
  replace: []
  confidence: reported
  sources: ["https://poe2db.tw/us/Aggravated_Bleeding"]
  status: approved

- id: no-effect-adapt
  title: Reactive Growth's adaptation rule (modeled by its damage-taken line)
