- id: lucky-spell-crits
  title: Chance for spell critical hits to be Lucky (counted by the bridge's LuckyHitsChance hook since MECHB10; this entry adds nothing)
  kind: pob_gap
  match: '^(\(\d+-\d+\)|\d+)% chance for Spell Damage with Critical Hits to be Lucky$'
  replace: []
  confidence: theory
  notes: >-
    Retired as a translation (COV9, paired with MECH-B's 41bfdcc, MECHB10; they must land in the same train). It was
    '{g1*0.04}% more Spell Damage': a flat 6.7% Lucky gain for every spell times an assumed 60% of spell hits
    critting, an UNDERCOUNT ~4.5x for lightning spells (RESEARCH3: the gain follows the spell's damage spread) and
    wrong for any build not critting 60%. Now engine/bridge.lua's parseMod hook turns the line into PoB's own
    LuckyHitsChance on Spell hits in the crit pass (Condition:CriticalStrike; CalcOffence rolls min/3 + 2max/3 for
    the Lucky share), so the spell's own spread and the build's own crit chance decide it (Spark L20 at 36% crit,
    100%: x1.1594 = RESEARCH3's formula; MECH-B's engine test). The replacement is empty so nothing is counted
    twice; the entry stays active only so the coverage audit records the line as counted (absorbed_by) instead of a
    gap.
  absorbed_by: "engine/bridge.lua's parseMod hook (MECHB10): the line becomes PoB's LuckyHitsChance on Spell hits while critting"
  sources: ["https://poe2db.tw/us/Lucky"]
  status: proposed

- id: aggravate-bleed-on-hit
  title: Chance to Aggravate Bleeding on hit
  kind: pob_gap
  match: '^(\(\d+-\d+\)|\d+)% chance to Aggravate Bleeding on (?:targets you Hit with Attacks|Hit)$'
  replace: ['{600*g1/(100+6*g1)}% more Damage with Bleeding']
  confidence: theory
  notes: >-
    Aggravated Bleeding deals damage as if the target were moving (100% more). Share of bleed time
    aggravated, for chance p at 2 hits per second on 5 s bleeds, is about 6p/(1+6p) (10% -> 38%).
    Assumes a stationary boss; don't also set the enemy as moving.
    LOW, A FLAT RATE THE BUILD DECIDES (CLAUDE.md rule 2; COVD7, FIX_QUEUE; COV7): 2 hits per second and a 5 s Bleed
    are fixed here, not the build's own hits per second and Bleed duration. At 10% chance, 1 - 0.9^(hits/s x 5 s) of
    Bleed time is aggravated: 41% at 1 hit/s, 65% at 2, 88% at 4, against the 38% this formula gives (RESEARCH3:
    ~65% vs ~38% at 2 hits/s): an undercount for most builds, an overcount only below ~0.9 hits/s. Ledger translations are applied to item and passive text before any calculation, so they can't read
    the build's rate: it needs a model (share = 1 - (1 - p)^(hits/s x Bleed duration), the share of Bleed time an
    aggravation covers), which is models.py / conditions.py work, routed to MECH-A (FIX_QUEUE "the Aggravate share
    model"). The on-crit, always-on-crit and Empowered entries below carry the same flat rate plus a fixed crit
    share (50%) or Empowered share (10%): the same model should take the build's crit chance and Empowered rate.
  sources: ["https://poe2db.tw/us/Aggravated_Bleeding", "https://poe2db.tw/us/Bleeding"]
  status: proposed

- id: aggravate-bleed-on-crit
  title: Chance to Aggravate Bleeding on critical hit
  kind: pob_gap
  match: '^(\(\d+-\d+\)|\d+)% chance to Aggravate Bleeding on targets you Critically Hit with Attacks$'
  replace: ['{300*g1/(100+3*g1)}% more Damage with Bleeding']
  confidence: theory
  notes: "As the on-hit chance, with half of hits assumed critical. LOW: flat hit rate and crit share (see aggravate-bleed-on-hit; model routed to MECH-A)."
  sources: ["https://poe2db.tw/us/Aggravated_Bleeding"]
  status: proposed

