# Defences --------------------------------------------------------------------------------------

- id: unlucky-enemy-damage
  title: Damage of enemies hitting you is Unlucky
  kind: pob_gap
  match: '^Damage of Enemies Hitting you is Unlucky$'
  replace: ['4% less Damage taken from Hits', '3% less Damage taken from Hits']
  confidence: reported
  notes: >-
    Unlucky rolls twice and keeps the lower: the average falls by (max-min)/(3*(max+min)), 6.67% for
    a +-20% damage spread and 10% for +-30%. Boss Damage Spread is +-20% (poe2db's datamined monster
    blocks: the Arbiter of Ash, all three King in the Mists, The Blind Beast, The Sunburst Queen, Goliath; spells too:
    the Arbiter's Fireball rolls x1.5 max/min), so 6.67% (RESEARCH3, research/unlucky-boss-damage.md; it was 8%, a
    small overcount of defences). PoB reads whole percents only ("6.67% less" parses as ".67% less"), so it's written
    as 4% and 3% less (x0.9312: 6.88%, 0.21 points high); the -low-life, -physical and -lightning entries the same. MEDIUM-HIGH. Against Armour, physical hits lose slightly more (lower rolls lose more
    to Armour): a small understatement there.
  sources: ["https://poe2db.tw/us/Oracle", "https://poe2db.tw/Unlucky"]
  status: proposed

- id: unlucky-enemy-damage-chance
  title: Chance for damage of enemies hitting you to be Unlucky
