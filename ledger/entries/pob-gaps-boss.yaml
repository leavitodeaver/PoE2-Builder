# Mechanics Path of Building ignores, as their effect on a sustained single-target boss fight.
# Research (2026-10, PoE2 0.5.x): exact texts and numbers from poe2db.tw (datamined from the
# game files); boss behaviour from community guides. Uptimes that depend on how a fight goes are
# fixed assumptions stated in `notes`, labelled `theory`. Every corrected number in a result is
# shown with an asterisk and this confidence.
#
# Unique lines appear with their roll range in PoB's data ("(15-30)%") and rolled on an equipped
# item ("22%"), so unique patterns accept both.

# Conditions switched on by the build's skills ----------------------------------------------------

- id: GlorySkill
  title: Uses a skill that requires Glory
  kind: condition
  skill_text: '\bGlory\b'
  usage_stat: active_skill_requires_X_glory
  confidence: datamined
  notes: >-
    Retired (COV14): its two readers, Call Upon the Deep and Thrill of the Fight, assumed one Glory skill use per 6 s /
    12 s (flat rates, against the user's rule); they now read GloryUsesPast6s / GloryBuff6s, shares from the build's
    own Glory (models.glory_uses).
  sources: ["Glory skills' gem descriptions (Hammer of the Gods, Spear of Solaris, Banners, Ancestral Cry ...)"]
  status: retired

- id: GloryUsesPast6s
  title: Glory skill uses in the past 6 seconds
  kind: condition
  # Only a skill that spends Glory switches it on (its usage rule has this stat; the text alone also matched skills that
  # build or mention Glory without using it: an overcount, fixed before COV14)
  skill_text: '\bGlory\b'
  usage_stat: active_skill_requires_X_glory
  # A count, not on / off: the build's Glory skill uses per second on the boss (models.glory_uses: each Glory skill's
  # cost against the Glory the build's main skill makes, at most one gain per 0.5 s, none while its instance is up) x
  # the 6 s window, the average number used in the past 6 s, uncapped; no Glory the model counts: 0
  glory_window: 6
  glory_count: true
  shown_for: "Requires Glory in the past"
  confidence: theory
  sources: ["https://poe2db.tw/Call_Upon_the_Deep", "https://poe2db.tw/Glory"]
  status: proposed

- id: GloryBuff6s
  title: Up for 6 seconds after consuming Glory
  kind: condition
  skill_text: '\bGlory\b'
  usage_stat: active_skill_requires_X_glory
  # A share: min(1, 6 s x the build's Glory skill uses per second, models.glory_uses), each use renewing the 6 s
  glory_window: 6
  shown_for: "Consuming Glory grants you"
  confidence: theory
  sources: ["https://poe2db.tw/Thrill_of_the_Fight", "https://poe2db.tw/Glory"]
  status: proposed

- id: SpellEcho
  title: Uses Spell Echo (retired, no reader)
  kind: condition
  skills: '^Spell Echo'
  confidence: datamined
  notes: >-
    Its only reader was rhythm-of-ice's 'if:SpellEcho' (retired by COVB4: passives-batch3.yaml
    passives-model-rhythm-of-ice counts the main spell's echoed casts, Spell Echo, Zarokh's Refrain and Now and
    Again included) (checked, COV8: SpellEcho over ledger/, builder/, engine/ and tests/).
  sources: ["Support gem name"]
  status: retired  # COV8: no reader since rhythm-of-ice was retired (FIX_QUEUE, COVB4's findings)

- id: WarcriesRecently
  title: Different Warcries used Recently
  kind: condition
  warcries_recently: true
  confidence: theory
  notes: >-
    A share, not on / off: Assumptions.warcries_recently sums each different Warcry's share of the fight it was used in
    the past 4 s (its uses per second from the build: cooldown, else duration, else the press default, LOW), so a
    `share:WarcriesRecently` line counts its value x that sum (COV13; Escalation).
  sources: ["https://poe2db.tw/Escalation", "https://poe2db.tw/us/Recently"]
  status: proposed

- id: JaggedGround
  title: Creates Jagged Ground
  kind: condition
  skills: 'Jagged Ground'
  skill_text: 'Jagged Ground'
  confidence: reported
  sources: ["https://poe2db.tw/us/Jagged_Ground (Earthquake, Jagged Ground I, Stampede, Furious Slam)"]
  status: approved

