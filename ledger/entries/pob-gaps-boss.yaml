    Counts the cap (60%) x the share of the fight within 6 s of a Glory skill use: min(1, 6 s x the build's Glory skill
    uses per second, models.glory_uses); no Glory the model counts: 0 (COV14; before, a flat half of the cap, "one use per
    12 s", against the user's rule on flat rates). One use reaches the cap: 3% per Glory and the cheapest Glory skill in
    models.GLORY_SKILLS / GLORY_FROM_LIFE costs 20 (Spear of Solaris, Starborn Onslaught, Hammer of the Gods, Molten
    Blast), 3 x 20 = 60 (checked: the 12 entries there; a Glory skill outside them gets no rate, so counts 0, an
