- id: model-stats-energy-penalty
  title: A skill's own Energy penalty (Incinerate, Flame Breath, Flame Wall, Solar Orb) in the Energy it feeds a meta
    skill (Energy model)
  kind: model
  model: energy
  stats: ["active_skill_energy_generated_+%_final"]
  skill: [Incinerate, Flame Breath, Flame Wall, Solar Orb]
  confidence: datamined
  notes: "MECHB4 (mech2 7466324, train 7; COVC9 recorded it): the bridge reports the stat per skill (energyFinal) and
    models.energy_model multiplies the Energy a meta skill gains from the main skill's own use (crit, ailment, melee
    hit, cast) by (1 + it/100): Incinerate and Flame Breath -98 (x0.02), Flame Wall and Solar Orb -50 (x0.5), from
    GrantedEffectStatSets (PoB act_int.lua holds the same values). Its reach is UNVERIFIED (the stat has no game text);
    block, dodge, Energy Shield lost, minion death and charm gains are left untouched. Covered only once MECHB4's
    commit is on main."
  sources: ["builder/search/models.py energy_model (MECHB4)", "data/game-26476662/tables GrantedEffectStatSets",
            "https://poe2db.tw/us/Incinerate"]
  status: approved
