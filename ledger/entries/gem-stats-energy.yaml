# Meta skills' Energy stats the Energy model reads (COV2, 12 Nov 2026). PoB reads none of these stats; the Energy model
# (builder/search/models.py: META_GEMS, gem_energy, energy_rate, META_SUPPORTS, energy_model) prices each meta skill's
# triggers from them, as constants taken from the game files (build 26476662), not from PoB's skill data. Kind
# `model` with `stats`: nothing is applied from here; the coverage audit counts the listed stats of the listed skills as
# "fed to a custom model". `skill` names the skills (as the data dump names them) whose stat the model reads; the same
# stat on another skill stays open.
#
# Left open on purpose (not read, or read only for some skills): Feral Invocation (models.NOT_MODELED_YET), Reaper's
# Invocation (models.NO_ENERGY_ON_A_BOSS: Energy on kills, none counted on a boss), Curse on Block, Cast on Melee
# Stun and Cast on Melee Kill (models.DEPRECATED, MECH's evidence there), generic_ongoing_trigger_maximum_energy (the
# Invocations' 500 store: the model names it in its explanation but its rate doesn't read it), skill_maximum_energy_+%
# (Energy Capacitor),
# generic_ongoing_trigger_does_not_use_energy (Trail of Caltrops), base_skill_cannot_generate_energy (Midnight Zenith),
# Savage Fury's wild_beast_* (another Energy). Listed for the mechanics lane in COV2's report.

- id: model-stats-energy-gain
  title: Meta skills' increased Energy from their level (Energy model)
  kind: model
  model: energy
  stats: ["energy_generated_+%"]
  skill: [Barrier Invocation, Cast on Block, Cast on Charm Use, Cast on Critical, Cast on Dodge, Cast on Elemental Ailment,
          Cast on Minion Death, Elemental Invocation, Fire Spell on Melee Hit, Spellslinger, "Thundergod's Wrath",
          Boundless Energy I, Boundless Energy II]
  confidence: datamined
  notes: "models.gem_energy: 3% a level above 1 (Elemental Invocation 3.6%) from GrantedEffectStatSetsPerLevel;
    Boundless Energy I and II 35% and 45% (models.META_SUPPORTS)."
  sources: ["builder/search/models.py META_GEMS, gem_energy, META_SUPPORTS", "https://poe2db.tw/us/Cast_on_Critical"]
  status: approved

- id: model-stats-energy-cost
  title: A triggered spell's Energy cost, and triggering at the socketed spells' total (Energy model)
  kind: model
  model: energy
  stats: ["generic_ongoing_trigger_1_maximum_energy_per_Xms_total_cast_time",
          "generic_ongoing_trigger_maximum_energy_is_total_of_socketed_skills",
          "generic_ongoing_trigger_triggers_at_maximum_energy"]
  skill: [Cast on Block, Cast on Charm Use, Cast on Critical, Cast on Dodge, Cast on Elemental Ailment, Cast on Minion Death,
          Fire Spell on Melee Hit, "Thundergod's Wrath",
          SupportBarrierInvocationPlayer, SupportElementalInvocationPlayer, SupportMetaCastFireSpellOnHitPlayer,
          SupportMetaCastLightningSpellOnHitPlayer, SupportMetaCastOnBlockPlayer, SupportMetaCastOnCharmUsePlayer,
          SupportMetaCastOnCritPlayer, SupportMetaCastOnDodgePlayer, SupportMetaCastOnElementalAilmentPlayer,
          SupportMetaCastOnMinionDeathPlayer, SupportSpellslingerPlayer]
  confidence: datamined
  notes: "models.energy_model: one round of triggers costs the sum over the socketed spells of 100 x base cast time
    (10 Energy per 0.1 s), and the rate is Energy gained per second over that sum."
  sources: ["builder/search/models.py energy_model (cost = sum(100 * cast_time)), energy_rate"]
  status: approved

