- id: model-gem31-mirror-of-refraction-copies
  title: "Mirror of Refraction: a mirror every 2 s shattered by the main Spell's spare projectiles, one copy of the nova on the boss at most"
  kind: model
  model: mirror_of_refraction
  stats: ["base_cooldown_modifiable_repeat_interval_ms", "cooldown_recovery_modifiers_also_apply_to_repeat_interval",
          "base_number_of_projectiles", "base_mirror_of_refraction_limit"]
  skill: [Mirror of Refraction]
  confidence: theory
  notes: >-
    models.mirror_of_refraction_model (GEM31), hooked in Assumptions after repeat_interval_model. PoB scores the skill as
    a Buff with no damage (an UNDERCOUNT for a multi-projectile Spell). A mirror every 2 s at gem level 20 (3.9 s at 1;
    PoB act_int.lua MirrorOfRefractionPlayer, the game's text: Cooldown Recovery applies), limit 4, 8 s; a Spell
    Projectile that hits one is copied 7 times (+0.1 a quality point) in a nova round it. One nova from one source at one
    time: at most one copy hits the boss (RESEARCH35 R35-15, MEDIUM), with chance min(1, k x 2 asin(r / d) / 360), d the
    fight distance (mirrors appear in your Presence; LOW). The shattering projectile is taken as spent (UNVERIFIED), so
    only spare projectiles (N - 1 of a Spell's N: one hits a lone boss a cast) feed it: min(1 / I, casts x (N - 1))
    shatters a second, each p more hits of the skill: DPS x (1 + shatters x p / casts). x1 with one projectile a cast,
    or for skills whose every projectile already hits by our score (SHOTGUN / SEQUENCE skills, Nova Projectiles). Not
    counted: copies copied again (an undercount). The limit adds nothing while spares shatter each mirror as it comes.
  sources: ["builder/search/models.py (mirror_of_refraction_model)", "vendor/PathOfBuilding-PoE2/src/Data/Skills/act_int.lua (MirrorOfRefractionPlayer)",
            "data/game-26650308/files/data/statdescriptions/specific_skill_stat_descriptions/mirror_of_refraction.csd",
