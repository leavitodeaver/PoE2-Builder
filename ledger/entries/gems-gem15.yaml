# GEM15 (GEM lane, 16 Nov 2026): gem stats PoB never reads, now modelled.

- id: model-gem15-cast-speed-over-time-cost
  title: "Bonestorm, Flameblast, Volcano: cast speed also raises their per-minute (channelling) cost (PoB keeps it fixed: an overcount of mana sustain)"
  kind: model
  model: over_time_cost
  stats: ["cast_speed_modifiers_apply_to_over_time_cost"]
  skill: [Bonestorm, Flameblast, Volcano]
  confidence: MEDIUM
  notes: >-
    models.over_time_cost_model (GEM15): each per-minute cost set to its level's raw cost x the skill's cast speed
    multiplier (bridge activeSkills overTimeCost: calcLib.mod Speed, as CalcOffence 1293) through PoB's
    Base<resource>CostOverride, which replaces only the per-minute cost (Volcano's upfront Mana stays). Game text: "Modifiers
    to cast speed also affect this skill's cost". Probe POE2T2135: +20% Cast Speed raised Bonestorm's Speed 8.8 -> 10.56
    and Volcano's 1.25 -> 1.5 with ManaPerSecondCost unchanged (60, 61); the override x1.2 gave 72 / 73. Linear in the
    whole multiplier is MEDIUM (no source gives a formula).

- id: model-gem15-cannot-be-empowered-by-warcries
  title: "Resonating Shield: cannot be Empowered by Warcries (PoB Empowers it like any Melee attack: an overcount)"
  kind: model
  model: warcry_proof
  stats: ["cannot_be_empowered_by_warcries"]
  skill: [Resonating Shield]
  confidence: HIGH
  notes: >-
    models.warcry_proof_model (GEM15): with Resonating Shield the main skill, each warcry's <Name>EmpoweredAttacks gets
    -1000 tagged to it, so PoB's Num<Warcry>Empowers stays unset (CalcPerform 2204-2211 adds Empowers only above 0).
    Probe POE2T2140: Infernal Cry gave it 2 Empowers at 18% uptime, Full DPS 48.0 -> 57.0, though the game text says
    "Cannot be [Empowered] by [Warcry|Warcries]". Player carrier ResonatingShieldPlayer only (checked: Stats,
    GrantedEffectStatSets, PerLevel, Mods, PassiveSkills of build 26650308; one monster set too).

