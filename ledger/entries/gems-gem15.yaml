# GEM15 (GEM lane, 16 Nov 2026): gem stats PoB never reads, now modelled.

- id: model-gem15-cast-speed-over-time-cost
  title: "Bonestorm, Flameblast, Volcano: cast speed also raises their per-minute (channelling) cost (PoB keeps it fixed: an overcount of mana sustain)"
  kind: model
  model: over_time_cost
  stats: ["cast_speed_modifiers_apply_to_over_time_cost"]
  skill: [Bonestorm, Flameblast, Volcano]
  confidence: MEDIUM
  notes: >-
    models.over_time_cost_model (GEM15): each per-minute cost set to its level's raw cost x the skill's cast speed
    multiplier (bridge activeSkills overTimeCost: calcLib.mod Speed, as CalcOffence 1293) through PoB's
    Base<resource>CostOverride, which replaces only the per-minute cost (Volcano's upfront Mana stays). Game text: "Modifiers
    to cast speed also affect this skill's cost". Probe POE2T2135: +20% Cast Speed raised Bonestorm's Speed 8.8 -> 10.56
    and Volcano's 1.25 -> 1.5 with ManaPerSecondCost unchanged (60, 61); the override x1.2 gave 72 / 73. Linear in the
    whole multiplier is MEDIUM (no source gives a formula).

- id: model-gem15-cannot-be-empowered-by-warcries
  title: "Resonating Shield: cannot be Empowered by Warcries (PoB Empowers it like any Melee attack: an overcount)"
  kind: model
  model: warcry_proof
  stats: ["cannot_be_empowered_by_warcries"]
  skill: [Resonating Shield]
  confidence: HIGH
  notes: >-
    models.warcry_proof_model (GEM15): with Resonating Shield the main skill, each warcry's <Name>EmpoweredAttacks gets
    -1000 tagged to it, so PoB's Num<Warcry>Empowers stays unset (CalcPerform 2204-2211 adds Empowers only above 0).
    Probe POE2T2140: Infernal Cry gave it 2 Empowers at 18% uptime, Full DPS 48.0 -> 57.0, though the game text says
    "Cannot be [Empowered] by [Warcry|Warcries]". Player carrier ResonatingShieldPlayer only (checked: Stats,
    GrantedEffectStatSets, PerLevel, Mods, PassiveSkills of build 26650308; one monster set too).

- id: no-effect-gem15-incinerate-maximum-stages
  title: "Incinerate's maximum stages: 1 stage worth 0% (the stages are vestigial), so PoB's 0 stages changes nothing"
  kind: gem_stat
  match: '^incinerate_maximum_stages$'
  replace: []
  stats: ["incinerate_maximum_stages"]
  skill: [Incinerate]
  confidence: datamined
  notes: >-
    Game files 26650308 GrantedEffectStatSets IncineratePlayer: incinerate_maximum_stages 1,
    incinerate_damage_+%_final_per_stage 0 (also incinerate_gain_stage_every_x_ms 250, fuel 1000 / 5000). PoB maps the
    maximum to Multiplier:IncinerateMaxStages and the per-stage damage to a MORE per Multiplier:IncinerateStage, which
    nothing sets (grep of PoB's Modules / Classes / Data, engine/ and builder/: only the skill's own lines and two
    ModParser lines). At 0% a stage, any stage count gives the same damage. Fuel is MECH79's model.

- id: no-effect-gem15-feast-of-flesh-no-spell-damage
  title: "Feast of Flesh deals no spell damage: PoB gives it none either (probe)"
  kind: gem_stat
  match: '^base_deal_no_spell_damage$'
  replace: []
  stats: ["base_deal_no_spell_damage"]
  skill: [Feast of Flesh]
  confidence: datamined
  notes: >-
    Probe POE2T2148 (scratch/gem15/probe_noeffect.py, real PoB, Feast of Flesh the main skill after the search's setup):
    its one stat set "Feast of Flesh" scores AverageHit 0, AverageDamage 0, TotalDPS 0, and the build's FullDPS 0. Its
    PoB set has no damage stats (act_int.lua FeastOfFleshPlayer: area, recovery duration, corpses, movement). So the
    game's "deals no spell damage" is already what PoB scores: nothing to subtract.

- id: no-effect-gem15-fragmentation-rounds-explosion-fires-no-projectiles
  title: "Fragmentation Rounds' Vs Frozen explosion fires no projectiles: PoB doesn't multiply it by projectiles (probe)"
  kind: gem_stat
  match: '^projectiles_are_not_fired$'
  replace: []
  stats: ["projectiles_are_not_fired"]
  skill: [Fragmentation Rounds]
  confidence: datamined
  notes: >-
    The stat is on the "Vs Frozen" set only (act_str.lua FragmentationRoundsPlayer; no base_number_of_projectiles there).
    Probes POE2T2148 / POE2T2149 (scratch/gem15/probe_noeffect*.py, real PoB, each set in its own environment): Vs Frozen
    ProjectileCount 2, AverageDamage 8,343, TotalDPS = AverageDamage x Speed (6,152 = 8,343 x 0.737); with "Skills fire
    an additional Projectile" its ProjectileCount went 2 -> 3 and AverageDamage stayed 8,343. So PoB scores one
    explosion per use, as the game's text means. The Projectile set's fragments are models' shotgun_fragments (GEM2).

