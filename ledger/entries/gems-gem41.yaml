# GEM41 (24 Nov 2026): COV57's gem-stat rows (scratch/cov57/offense.txt in the COV-A folder), the GEM lane.
- id: gem-gem41-cascade-aftershock-offset
  title: "cascade_aftershock_additional_offset_distance: moves only cascade Aftershocks (Tectonic Slams, Mountain Splitter), none of which the four carrying skills get counted"
  kind: gem_stat
  match: '^cascade_aftershock_additional_offset_distance$'
  replace: []
  stats: ["cascade_aftershock_additional_offset_distance"]
  skill: [Shockwave Totem, Falling Thunder, Rolling Slam, Volcanic Steps]
  confidence: MEDIUM
  notes: >-
    The offset shifts where a skill's cascade Aftershocks land ("ahead and to each side of the initial area"). Cascade
    Aftershocks come from two sources only (checked: every stat whose id holds "cascade_aftershock" across every game
    table with a stat field, build 26650308: number_of_dual_cascade_aftershocks on SupportSlamAftershocksPlayer =
    Tectonic Slams, num_cascade_aftershocks_every_third_slam on PassiveSkills AscendancyWarrior1Notable3 =
    Mountain Splitter; no Mods row; patch notes: Mountain Splitter 0.4.0, the one entry). Tectonic Slams' Aftershock is
    an uncounted part (supports-parts.yaml part:tectonic_aftershock), so its offset moves nothing we count. Mountain
    Splitter is counted (one of its three Aftershocks on the boss, LOW) only for a Slam Attack you use yourself:
    Shockwave Totem (-5; its own types hold no Slam or Attack, a totem's) and Volcanic Steps (+2; triggered) never get
    it. Falling Thunder (-5 units: closer) and Rolling Slam (+10 units, 1 m further out than its 1.4 / 1.8 m slams)
    do: the offset moves Mountain Splitter's geometry, which no data gives (its LOW one-of-three already spans 0 for a
    small boss to 3 for a huge one). UNVERIFIED: whether Rolling Slam's +1 m makes its Mountain Splitter Aftershocks
    miss a boss more often (an OVERCOUNT inside that LOW row, for RESEARCH: the in-game test #29). None of COV57's four
    builds (ex05 ex08 ex09 ex21: Shockwave Totem as a side skill) carries Tectonic Slams or Mountain Splitter.
  sources: ["data/game-26650308/tables/GrantedEffectStatSets.json", "data/game-26650308/tables/PassiveSkills.json",
            "ledger/entries/coverage-batch1.yaml (mountain-splitter)", "scratch/gem41/statuse.py"]
  test_in_game: "Titan with Mountain Splitter: Rolling Slam vs Falling Thunder on a large boss, count the cascade Aftershocks that hit it."
  status: proposed

- id: model-gem41-ghost-dance-repeat
  title: "Ghost Dance: Cooldown Recovery on its Shroud interval (read by recovery.ghost_dance_income, MECHC51); its 3 maximum Shrouds"
  kind: model
  model: recovery
  stats: ["cooldown_recovery_modifiers_also_apply_to_repeat_interval", "ghost_dance_max_stacks"]
  skill: [Ghost Dance]
  confidence: MEDIUM
  notes: >-
    recovery.ghost_dance_income (MECHC27, MECHC51) divides base_cooldown_modifiable_repeat_interval_ms by the skill's
    Cooldown Recovery Rate (the bridge's cooldownRecovery), as "Modifiers to Cooldown Recovery Rate also apply" says.
    Its "lost a Shroud recently" share uses the mean rates (a Shroud lost at the next hit when hits come faster than
    Shrouds; else every hit loses one), where the maximum of 3 never binds; a stock of up to 3 matters only for bunched
    hits after a long gap (an UNDERCOUNT of Energy Shield there, MECH-C's model; defence, not damage).
  sources: ["builder/search/recovery.py (ghost_dance_income)"]
  test_in_game: "Not needed."
  status: proposed

- id: model-gem41-melee-attack-totem
  title: "Shockwave Totem is a Melee Attack totem (is_melee_attack_totem): 'Melee Attack Skills have +N to maximum number of Summoned Totems' raises its limit"
  kind: model
  model: totem_count
  stats: ["is_melee_attack_totem"]
  skill: [Shockwave Totem]
  confidence: MEDIUM
  notes: >-
    GrantedEffectStatSets ShockwaveTotemPlayer (26650308) holds is_melee_attack_totem, its only carrier (checked:
    every table with a stat field); poe2db's Shockwave Totem shows it among the hidden stats and tags the gem Melee.
    The skill's own types (the game's ActiveSkills shockwave_totem and PoB's) hold neither Attack nor Melee, so PoB's
    "Melee Attack Skills have +1 to maximum number of Summoned Totems" (SkillType Melee + Attack tags; Ancestral
    Artifice, PassiveSkills totems14, whose other stat is melee_attack_skills_additional_totems_allowed; the Ulaman mace
    prefix AbyssModAllMacesUlamanPrefixMaximumMeleeAttackTotems) never reached its Totem Limit. The flag read as making
    those lines apply (MEDIUM: no game text says so; poe2db and poe2wiki don't say either). engine/bridge.lua's
    totemLimit tabulates the limit as for a Melee Attack skill when the skill carries the stat and reports the lines'
    share (meleeAttackTotemAdded); models.totem_count_model counts the totems and gives the count without them as a row.
    Ancestral Warrior Totem (Melee but not Attack in both type lists, no such stat) is left as PoB has it (UNVERIFIED).
  sources: ["data/game-26650308/tables/GrantedEffectStatSets.json", "https://poe2db.tw/us/Shockwave_Totem",
            "https://poe2db.tw/us/Ancestral_Artifice", "scratch/gem41/probe_totem.py"]
  test_in_game: "Shockwave Totem with and without Ancestral Artifice: how many totems can be placed?"
  status: proposed

- id: gem-gem41-crystal-shatter-area
  title: "ice_crystal_shatter_detonation_area_of_effect_+%_final (Glacial Bolt's wall +50%; 0 on PoB's Frost Wall): area only, no damage on a lone boss"
  kind: gem_stat
  match: '^ice_crystal_shatter_detonation_area_of_effect_\+%_final$'
  replace: []
  stats: ["ice_crystal_shatter_detonation_area_of_effect_+%_final"]
  skill: [Glacial Bolt, Frost Wall]
  confidence: LOW
  notes: >-
    Game files (26650308): on GlacialBoltWallPlayer (+50) and a Rogue Exile's Frost Wall only; the player's FrostWallPlayer
    stat set doesn't carry it (PoB's export still lists it at 0 there: no effect either way) (checked:
    scratch/gem41/statuse.py over every table with a stat field). It widens each Ice Crystal's shatter explosion. The
    crystals are cast at the boss and PoB scores one explosion hit (the wall's own part); how many crystals' explosions
    overlap one boss isn't counted by PoB or us (UNVERIFIED whether several reach it: an undercount at most). So no number
    we count moves with it; read as moving nothing (LOW).
  sources: ["data/game-26650308/tables/GrantedEffectStatSets.json (GlacialBoltWallPlayer)", "builder/search/models.py (VRUUN_MAKERS note)"]
  test_in_game: "Glacial Bolt's wall shattered beside a large boss: count the explosion hits."
  status: proposed

