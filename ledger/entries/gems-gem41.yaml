  skill: [Whirling Slash, Whirlwind Lance]
  confidence: MEDIUM
  notes: >-
    PoB's statMap (act_dex.lua WhirlingSlashPlayer / WhirlwindLance: radiusExtra MORE per WhirlwindStageAfterFirst, at
    most 2) reads it (read, not probed: it moves only the radius PoB displays). The Whirlwind's 1.8 m storm forms on its
