- id: model-gem41-fissure-limits
  title: "Forge Hammer's 'Limit 10 Fissures' and Molten Crash's 'Limit 8 Fissures' with the build's Limit sources: the Fissure count model's cap"
  kind: model
  model: fissure_count_model
  stats: ["forge_hammer_base_maximum_number_of_fissures", "molten_crash_max_number_of_fissures"]
  skill: [Forge Hammer, Molten Crash]
  confidence: MEDIUM-LOW
  notes: >-
    Assumptions.fissure_limit -> stat_limit (GEM41): the stat at the gem's level (10 / 8), doubled by Overabundance III
    (skill_has_double_limit; adds not doubled, the lower reading), + Overabundance I / II's base_limit_+, + the "+N to
    Limit" lines whose types reach the skill (assumptions.LIMIT_LINES: "Skills", "Fissure Skills", and "for Elemental
    Skills" on Forge Hammer, a Fire skill). Forge Hammer has the Limit type (R57-6: 10 -> 11 with Overabundance I / II,
    HIGH). Molten Crash has none, so no Overabundance; the lines taken to reach it (R58-9, MEDIUM-LOW: GGG's 0.4.0
    "described as a Limit"; unwired, it stays 8). models.fissure_count_model holds a use's Fissures to it (MECHB48's
    reading of the Limit as a per-use cap); it binds only when a use's Fissures pass it.
  sources: ["builder/search/assumptions.py (stat_limit, fissure_limit, LIMIT_LINES)", "builder/search/models.py (FISSURE_LIMIT_STATS)",
            "C:/PROJECTS/PoE2 Builder/scratch/manager/research/limit-lines-entangle-fissures-r57.md",
            "C:/PROJECTS/PoE2 Builder/scratch/manager/research/limit-lines-without-limit-type-r58.md"]
  test_in_game: "Molten Crash with 'Fissure Skills have +1 to Limit': do 9 Fissures stay up?"
  status: proposed

