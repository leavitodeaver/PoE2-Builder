  kind: pob_gap
  model: rolling
  play_row: true
  match: '^Take \d+(?:\.\d+)?% less Damage from Hits while Dodge Rolling$'
  replace: []
  confidence: theory
  notes: >-
    recovery.ROLLING_LESS (MECHC38): a row at the build's share of the fight spent dodge rolling, not in the defences
