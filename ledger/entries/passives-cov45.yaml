- id: play-row-bulwark-rolling-less
  title: 'Bulwark, "Take N% less Damage from Hits while Dodge Rolling" (recovery.rolling_less_row, MECHC38: a play row)'
  kind: pob_gap
  model: rolling
  play_row: true
  match: '^Take \d+(?:\.\d+)?% less Damage from Hits while Dodge Rolling$'
  replace: []
  confidence: theory
  notes: >-
    recovery.ROLLING_LESS (MECHC38): part-time, it applies only while you are dodge rolling (the build's rolling share
    of the fight, the "Time spent dodge rolling" row), so a play row with "without it / with it" values, not in the
    defences: the user's 9 Nov uptime rule ("if something isn't active at least 7% of the time, it's basically
    worthless": an effect up under ~7% of the fight can be left out) and the play guide's "without it / with it" design.
    PoB's Condition:InDodgeRoll stays off. If a model ever counts it in the headline, `play_row` must go.
  sources: ["builder/search/recovery.py (ROLLING_LESS, rolling_less_row)", "builder/search/assumptions.py (Bulwark row)"]
  status: proposed

