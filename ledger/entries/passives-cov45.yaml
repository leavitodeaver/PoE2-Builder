- id: model-read-mech90-inner-turmoil-volatility
  title: 'Inner Turmoil''s Volatility and the lines its model reads: "Gain 1 Volatility on inflicting an Elemental Ailment", "Take no Damage from Volatility", "Maximum Volatility is N", "N% increased / reduced Volatility Explosion delay" (models.volatility_model, MECH90)'
  kind: pob_gap
  model: volatility
  match: '^(Gain 1 Volatility on inflicting an Elemental Ailment|Take no Damage from Volatility|Maximum Volatility is \d+|\d+(?:\.\d+)?% (increased|reduced) Volatility Explosion delay)$'
  replace: []
  confidence: theory
  notes: >-
    models.volatility_model (92d2bba6, train 93): with Inner Turmoil, Volatility played as an attack-then-pause cycle when
    it pays: "1% less Damage" for the pauses and Volatile Power's gain, through hand_mods; the cap (VOLATILITY_MAX) and the
    explosion delay (VOLATILITY_DELAY) set the cycle; "Take no Damage from Volatility" (the same notable) is why the cycle
    costs no Life. Without Inner Turmoil the model gives 0, so the cap / delay lines then move nothing. Left open: Growing
    Peril's per-Volatility Chaos DoT and Precise Volatility's crit (the model says "not counted (lower)"), Volatility on
    Kill / Stunned / Instability.
  sources: ["builder/search/models.py (INNER_TURMOIL, VOLATILITY_MAX, VOLATILITY_DELAY, volatility_model)"]
  status: proposed

- id: model-read-mech89-conditional-dodge-roll-distance
  title: 'Lioneye''s Glare "+2 metres to Dodge Roll distance if you haven''t Dodge Rolled Recently" and Tactical Retreat "+0.5 metres ... while Surrounded" (models.dodge_roll, MECHB3 / MECH89)'
  kind: pob_gap
  model: dodge_roll
  match: '^\+\d+(?:\.\d+)? metres? to Dodge Roll distance (if you haven''t Dodge Rolled Recently|while Surrounded)$'
  replace: []
  confidence: theory
  notes: >-
    models.dodge_roll reads both (DODGE_DISTANCE): every reader of the roll distance rolls every DODGE_EVERY 2 s, so a
    build has always rolled within Recently (4 s) and the "+2 metres if you haven't" bonus never applies (MECH89's label;
    0 by the game's words, not dropped); "while Surrounded" counts only with the unique that lowers the enemies needed to
    one (a play condition). (The manager 18:15, 19 Nov, from MECH90.)
  sources: ["builder/search/models.py (DODGE_DISTANCE, dodge_roll)"]
  status: proposed

