- id: model-read-mechc42-last-stand
  title: 'Last Stand and its small, "N% increased Attack Damage while you have no Life Flask uses left" (flasks.no_life_uses_model, MECHC42)'
  kind: pob_gap
  model: flasks
  match: '^\d+(?:\.\d+)?% increased Attack Damage while you have no Life Flask uses left$'
  replace: []
  confidence: theory
  notes: >-
    flasks.NO_LIFE_USES / no_life_uses_model (train 92): "N% increased Attack Damage" x the share of the fight the Life
    Flask has no use left (1 when drunk the moment a use fills or with no Life Flask, 0 when held back; MEDIUM), added to
    the build through assumptions' hand_mods. PoB's Condition:NoLifeFlaskUsesLeft is set only by its configuration box.
  sources: ["builder/search/flasks.py (NO_LIFE_USES, no_life_uses_model)", "builder/search/assumptions.py (hand_mods)"]
  status: proposed

