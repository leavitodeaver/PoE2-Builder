# MECH96 (MECH-A lane, 20 Nov 2026): lines a MECH-A model or bridge hook reads (empty replace: nothing is added to PoB,
# so nothing counts twice; PoB applies none of these lines itself).

- id: model-read-mech96-poison-from-bleed-base
  title: '"Chance to Poison is calculated from your base chance to inflict Bleeding instead" (bridge installBaseChanceSwap)'
  kind: pob_gap
  model: base_chance_swap
  match: '^Chance to Poison is calculated from your base chance to inflict Bleeding instead$'
  replace: []
  confidence: datamined
  notes: >-
    Way of the Stonefist's form of the Desecrated gloves suffix (HandWrapsAbyssModGlovesUlamanSuffixPoisonChance, stat
    base_poison_chance_is_bleed_chance_instead; MECH96, an UNDERCOUNT for a Bleed-based build and an OVERCOUNT for one
    with its own Poison base: PoB parses nothing of it). With the line on any equipped item, the bridge's ModList /
    ModDB Sum hook answers PoB's flat-ailment base query for Poison (CalcOffence 5540) with Bleed's base chance; Poison's
    increases and MORE terms stay its own. This entry only says the bridge reads the line.
  sources: ["engine/bridge.lua (BASE_CHANCE_SWAPS, installBaseChanceSwap, setBaseChanceSwap)"]
  status: proposed

