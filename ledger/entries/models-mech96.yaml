- id: model-read-mech96-minion-gruelling-madness
  title: '"Minions have N% chance to inflict Gruelling Madness on Hit" (models.madness_stacks)'
  kind: pob_gap
  model: boss_power
  match: '^Minions have (\(\d+-\d+\)|\d+)% chance to inflict Gruelling Madness on Hit$'
  replace: []
  confidence: theory
  notes: >-
    The minion staff's line (MECH96, an UNDERCOUNT before: read by nothing; PoB's ModCache 8719 / 8728 leave text over).
    models.madness_stacks: N% x the build's minion hits a second (conditions.minion_hits), 10 held at one inflict per
    2 s or more; it feeds Gruelling Madness's Slowing Potency on the boss (models.madness_slow_mods: +10% per stack past
    the first on every Slow, bridge installBossSlow) and Sadist's Mercy's Power line (presence_power). This entry only
    says a model reads the line.
  sources: ["builder/search/models.py (MADNESS_MINION, madness_stacks, madness_slow_mods)"]
  status: proposed

