- id: model-read-mech96-marks-consumed-remark
  title: '"When your Marks are Consumed, they have N% chance to Mark another Enemy within N metres" (0 against the boss)'
  kind: pob_gap
  model: none
  match: '^When your Marks are Consumed, they have (\(\d+-\d+\)|\d+)% chance to Mark another Enemy within (\d+) metres$'
  replace: []
  confidence: theory
  notes: >-
    The Marksman influence gloves forms (HandWrapsMarksmanInfluenceIncreasedMarkDuration1 / 2; MECH96). Counted as 0 for
    the boss score, labelled: by its own words the new Mark goes on "another Enemy", never the one whose Mark was
    Consumed, so the boss gains no Mark from it; on a preset with adds it Marks an add, which feeds no boss damage in our
    model (a Mark-consume line on an add's Mark would, read nowhere today: an undercount there, small). PoB parses
    nothing of it (no ModCache entry whole). This entry only records the reading.
  sources: ["the line's own text (PoB ModItem.lua HandWrapsMarksmanInfluenceIncreasedMarkDuration1 / 2)"]
  status: proposed

