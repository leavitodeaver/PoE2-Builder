- id: no-effect-gem1-removed-meta-gems
  title: "Curse on Block, Cast on Melee Kill, Cast on Melee Stun: removed from the game (models.DEPRECATED); their stats change nothing"
  kind: gem_stat
  match: '.*'
  replace: []
  skill: [Curse on Block, Cast on Melee Kill, Cast on Melee Stun, SupportMetaCastCurseOnBlockPlayer,
          SupportMetaCastOnMeleeKillPlayer, SupportMetaCastOnMeleeStunPlayer]
  confidence: datamined
  notes: >-
    The three are in models.DEPRECATED: never picked, and a PoB code that has one gets no triggers from it, said in the
    guide. (checked, by the lane that set DEPRECATED: data/game-*/live.json reaches them by no uncut tier, base item,
    passive or collection unique; poe2db shows them with no tier or source; the user found no Curse on Block in game on 7
    Nov.) The Support* names are each meta gem's own hidden support (the triggered spells' side). Scoped to these six
    skills only: the same stat ids on live meta gems stay open.
  sources: ["builder/search/models.py (DEPRECATED)", "https://poe2db.tw/us/Curse_on_Block",
            "https://poe2db.tw/us/Cast_on_Melee_Kill", "https://poe2db.tw/us/Cast_on_Melee_Stun"]
  test_in_game: "Not needed."
  status: proposed

