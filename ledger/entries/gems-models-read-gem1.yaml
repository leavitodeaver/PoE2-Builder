# Gem stats PoB never reads that our own models already read (GEM1, 14 Nov 2026). Each reader was read on 922f138
# (train 41) before crediting: the file and line of the read are in each entry's sources. These entries move no build:
# they close the coverage audit's rows for stats a model already counts. `skill` limits each entry to the skills whose
# stat the model reads; the same stat on other skills stays open (e.g. Salvo's Seals, Feral Invocation's Energy).
# A stat whose model counts only part of its effect (an ailment consumed but not what the consume pays for) is NOT
# here: those stay open, listed in scratch/manager/workers/GEM1.report.md.

- id: model-gem1-invocation-max-energy
  title: An Invocation stores at most 500 Energy (Energy model, a spell costing more is never triggered)
  kind: model
  model: energy
  stats: ["generic_ongoing_trigger_maximum_energy"]
  skill: [Barrier Invocation, Spellslinger, "Reaper's Invocation", Elemental Invocation]
  confidence: datamined
  notes: >-
    models.INVOCATION_MAX_ENERGY = 500 (the stat's value on every Invocation, game files 26476662); energy_triggers puts a
    socketed spell whose Energy cost is over it at 0 triggers with a note. Read as a constant, not from the gem: the value
    is 500 at every level in the game files. Feral Invocation carries it too but is in models.NOT_MODELED_YET (its clone
    uses Attacks), so it stays open.
  sources: ["builder/search/models.py (INVOCATION_MAX_ENERGY, META_GEMS invocation: True, the too_big branch)"]
  test_in_game: "Not needed: the cap is the game's data."
  status: proposed

