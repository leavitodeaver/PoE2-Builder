- id: model-gem24-link-multiple-charges-per-action
  title: "skill_can_add_multiple_charges_per_action: read by MECHC43's one-Charge-of-each-type-a-use rule (link; no number moves)"
  kind: model
  model: charges_per_use
  stats: ["skill_can_add_multiple_charges_per_action"]
  confidence: MEDIUM
  notes: >-
    conditions.MULTI_CHARGE_STAT (MECHC43, train 94, 96732d2d; RESEARCH33 R33-17, MEDIUM / UNVERIFIED for PoE2): a main
    skill without the flag gets its charge lines of one type joined as one chance a use (1 - prod(1 - e_i)); with it
    (from the skill's own stats or a support's), the lines add. The resolver asks the main skill's levelStats and
    supportStats for the stat, so every carrier (Orb of Storms, Galvanic Field, Twister, Elemental Storm, Killing Palm,
    Siphoning Strike, Wing Blast, the Heralds' explosions) is read: no skill limit here. The flagged skills' extra hits
    a use are MECHC43's open undercount (its comment).
  sources: ["builder/search/conditions.py (MULTI_CHARGE_STAT and its comment; the resolver's _multi_charge)",
            "C:/PROJECTS/PoE2 Builder/scratch/manager/research/multiple-charges-per-action.md (R33-17)"]
  status: proposed

