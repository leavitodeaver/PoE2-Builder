- id: model-read-es-from-life-flask
  title: '"Life Recovery from Flasks also applies to Energy Shield" (Assumptions.es_flask_income)'
  kind: pob_gap
  model: flasks
  match: '^Life Recovery from Flasks also applies to Energy Shield( during Effect)?$'
  replace: []
  confidence: theory
  notes: >-
    flasks.ES_FROM_LIFE_FLASK in Assumptions.es_flask_income (MECHC23, AUDIT33 A33-1; assumptions.py 3318): Energy Shield
    from the Life flask at its own use rate (flasks.es_recovery_per_second) into recovery's EnergyShieldFlaskRecovery,
    where PoB applies it only to a Life flask whose effect isn't removed at full Life (Shavronne's Satchel). The "during
    Effect" form (a Life flask's own line, FlaskZealotsOathUnique__1) is read the same way: a Life flask recovers only
    during its effect. Replaces COV27's parsed_unused entry unused-life-flask-recovery-applies-to-es (retired).
  sources: [builder/search/flasks.py (ES_FROM_LIFE_FLASK), builder/search/assumptions.py (es_flask_income)]
  status: proposed

