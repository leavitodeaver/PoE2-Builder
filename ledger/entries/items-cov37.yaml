# COV37 (COV-A), 16 Nov 2026: item lines a model already reads, so the audit counts them (each model's regex and its live
# caller checked by hand; scratch/cov37/leads.py lists the rows). These entries only say a model reads the line: an empty
# replace adds nothing to PoB. The model's own labels and confidence stay as its lane wrote them.

- id: model-read-companion-limit
  title: '"You can have two / any number of Companions of different types" (models.companion_limit)'
  kind: pob_gap
  model: companion_limit
  match: '^You can have (two|any number of) Companions of different types$'
  replace: []
  confidence: theory
  notes: >-
    models.COMPANION_TWO / COMPANION_ANY in companion_limit, called from assumptions.py 2525 (the Companion limit: groups
    past it deal nothing, one per type). Trusted Kinship + Yriel's Fostering read as 2 (the user's ruling, memory
    mod-wording-sets-vs-adds); Sylvan's Effigy any number. PoB ignores both lines.
  sources: [builder/search/models.py (COMPANION_TWO, COMPANION_ANY, companion_limit), builder/search/assumptions.py 2525]
  status: proposed

- id: model-read-companion-per-type
  title: '"N% increased Damage per each different Companion in your Presence" (models.companion_per_type_model)'
  kind: pob_gap
  model: companion_per_type
  match: '^(\(\d+(?:\.\d+)?-\d+(?:\.\d+)?\)|\d+(?:\.\d+)?)% (increased|reduced) Damage per each different Companion in your Presence$'
  replace: []
  confidence: theory
  notes: >-
    models.COMPANION_PER_TYPE in companion_per_type_model, called from assumptions.py 2539 with the Companions the limit
    keeps (Idol of Grold). PoB ignores the line.
  sources: [builder/search/models.py (COMPANION_PER_TYPE, companion_per_type_model), builder/search/assumptions.py 2539]
  status: proposed

- id: model-read-puppet-master
