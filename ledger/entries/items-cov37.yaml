- id: model-read-dodge-distance-rolled-recently
  title: '"-N metres to Dodge Roll distance if you''ve Dodge Rolled Recently" (models.dodge_roll; Lioneye''s Glare)'
  kind: pob_gap
  model: dodge_roll
  match: '^-(\d+(?:\.\d+)?) metres? to Dodge Roll distance if you''ve Dodge Rolled Recently$'
  replace: []
  confidence: theory
  notes: >-
    models.dodge_roll counts a distance line whose condition is "if you've Dodge Rolled Recently" (the model rolls every
    DODGE_EVERY s, so it holds): Lioneye's Glare's downside. Its "+2 metres ... if you haven't Dodge Rolled Recently" the
    model rates 0, and "+0.5 metres ... while Surrounded" only with "Require N fewer enemies": both left open here, as
    model-dodge-roll-distance left them.
  sources: [builder/search/models.py (DODGE_DISTANCE, dodge_roll)]
  status: proposed

