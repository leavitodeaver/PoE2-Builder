- id: model-read-glory-lines
  title: 'Glory retained on use, Banner Glory generation, Glory when your Marks Activate (models.glory_lines)'
  kind: pob_gap
  model: glory
  match: '^((\(\d+-\d+\)|\d+(?:\.\d+)?)% chance for Skills to retain 40% of Glory on use|(\(\d+-\d+\)|\d+(?:\.\d+)?)% (increased|reduced) Glory generation for Banner Skills|A random Skill that requires Glory generates (\d+(?:\.\d+)?)% of its maximum Glory when your Marks Activate)$'
  replace: []
  confidence: theory
  notes: >-
    models.GLORY_RETAIN / GLORY_INC ("for Banner Skills": banner_inc, Banner skills only) / GLORY_MARK in glory_lines,
    which glory_plan (models.py 8869) turns into the build's Glory skill uses (retain: the Glory a use consumes x (1 - 0.4 x
    the chance); mark: glory_mark_rate). PoB ignores all three. ("increased Glory generation" lines for Tribute stay
    unread there and aren't matched here.)
  sources: [builder/search/models.py (GLORY_RETAIN, GLORY_INC, GLORY_MARK, glory_lines, glory_plan)]
  status: proposed

