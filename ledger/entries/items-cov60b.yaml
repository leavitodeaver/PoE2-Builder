- id: model-mech110-herald-of-plague-spread
  title: "Herald of Plague: Poison spread from killed adds onto the boss (MECH110 / MECH111)"
  kind: model
  model: skill_models
  stats: ["herald_of_agony_poison_spread_on_kill_radius_base_magnitude_to_grant"]
  skill: [Herald of Plague]
  confidence: MEDIUM
  notes: >-
    The id models.HERALD_OF_PLAGUE_ENTRY names (models.py 10882; the entry was missing). Checked in the code: the stat
    gives Herald of Plague's spread ("killing a Poisoned enemy spreads its Poison to other nearby enemies"); PoB maps it
    to PoisonProlifRange and reads that nowhere. MECH110's model (models.py 10861-10882; assumptions.py 5864): kills
    only from the boss preset's adds (0 on a lone boss), one Poison an add at the main skill's chance, onto the boss
    with half its duration left (MEDIUM-LOW), every add taken within the radius (UNVERIFIED; the row: out of reach, 0):
    so the radius's value itself is not read, the mechanic it grants is. MECH111 / R61-15 refine it.
  sources: ["builder/search/models.py (Herald of Plague)", "builder/search/assumptions.py",
            "research/herald-of-plague-spread-r61.md (R61-15)"]
  status: proposed

