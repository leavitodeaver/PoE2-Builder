# COV46 (19 Nov 2026): item lines MECH91 found unread (MECH91.report.md, Handover 21:48, part 7).

# Painter's Servant as Way of the Stonefist's Fists of Stone: its "33% of Elemental Damage Converted to Fire Damage"
# (UniqueElementalDamageConvertToFire1) becomes HandWrapsUniqueElementalDamageConvertToFire1, whose one stat
# physical_damage_can_ignite_freeze_shock (game 26650308 Stats 26298) the game describes over two lines
# ("[Physical] damage from [Hit|Hits] [Contributes] to [Flammability] and\n[Ignite] [Magnitudes], [Freeze] Buildup, and
# [Shock] Chance", stat_descriptions.csd 103271-103273). The stat is on that mod alone (checked: every game 26650308
# table row whose stat fields hold 26298: Mods HandWrapsUniqueElementalDamageConvertToFire1 and ModType only,
# scratch/cov45/stat_users.py; PoB ModItemExclusive 5315 the same mod; poe2db's Fists of Stone page, as saved in
# builder/data/stonefist_uniques.json, gives Painter's Servant these two lines). PoB parses neither half (no ModCache entry), so the line counted 0: an UNDERCOUNT for a
# Stonefist build whose hits deal Physical damage. PoB has no single line for exactly these three flags ("All Damage
# from Hits Contributes to Shock Chance" also lets Fire / Cold / Chaos Shock; "Physical damage from Hits Contributes to
# Chill Magnitude and Freeze Buildup" also Chills), so the first half becomes PoB's three raw flags; the second half
# carries nothing.

- id: items-painters-servant-physical-ignite-freeze-shock-first-line
  title: 'Painter''s Servant (Fists of Stone), "Physical damage from Hits Contributes to Flammability and" + "Ignite Magnitudes, Freeze Buildup, and Shock Chance": PoB''s PhysicalCanIgnite / PhysicalCanFreeze / PhysicalCanShock'
  kind: pob_gap
  match: '^Physical damage from Hits Contributes to Flammability and$'
  replace: ['mod:PhysicalCanIgnite FLAG 1', 'mod:PhysicalCanFreeze FLAG 1', 'mod:PhysicalCanShock FLAG 1']
  confidence: datamined
  notes: >-
    The flags are the ones PoB's own lines of the same meaning set: "(%a+) damage from (%a+) spells contributes to
    flammability and ignite magnitudes" -> <Type>CanIgnite (ModParser 2614), "Physical damage from Hits Contributes to
    Chill Magnitude and Freeze Buildup" -> PhysicalCanFreeze (ModCache 6427), "All Damage from Hits Contributes to Shock
    Chance" -> PhysicalCanShock (ModCache 3792). The hand-wraps text comes from builder/search/stonefist.py, which now
    applies the ledger to a transformed unique's lines (COV46).
  sources: ["data/game-26650308/tables/Mods.json (HandWrapsUniqueElementalDamageConvertToFire1)",
            "data/game-26650308/files/data/statdescriptions/stat_descriptions.csd (physical_damage_can_ignite_freeze_shock)",
            "vendor/PathOfBuilding-PoE2/src/Data/ModItemExclusive.lua 5315", "vendor/PathOfBuilding-PoE2/src/Modules/ModParser.lua 2614, 3020",
            "C:/PROJECTS/PoE2 Builder/scratch/manager/workers/MECH91.report.md (Handover 21:48, part 7)"]
  status: proposed

- id: items-painters-servant-physical-ignite-freeze-shock-second-line
  title: 'Painter''s Servant (Fists of Stone), "Ignite Magnitudes, Freeze Buildup, and Shock Chance" (second half; counted by the first)'
  kind: pob_gap
  match: '^Ignite Magnitudes, Freeze Buildup, and Shock Chance$'
  replace: []
  confidence: datamined
  notes: Carried by items-painters-servant-physical-ignite-freeze-shock-first-line (the game's one stat, split over two lines).
