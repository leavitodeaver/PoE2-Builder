# Idol of Egrin (sceptre rune, bonded): "Curse zones erupt after N% reduced delay". MECH90's engine/bridge.lua parseMod
# rule (train 95) parses it as PoB's CurseDelay INC -N (RESEARCH33 R33-9, HIGH: the stat base_curse_delay_+%, which
# SkillStatMap 2769-2770 maps to CurseDelay for gems; CalcOffence 1577-1580 reads it), so PoB now counts it on every
# parse; models.curse_uses reads the delay. The audit's coverage.json (15 Nov) predates the rule, hence this entry: it
# adds nothing (an empty replacement, so nothing counts twice) and records the line as counted.
- id: items-idol-of-egrin-curse-zone-delay
  title: 'Idol of Egrin (sceptre), "Curse zones erupt after N% reduced delay": the bridge''s parse rule makes it PoB''s CurseDelay (MECH90)'
  kind: pob_gap
  match: '^Curse zones erupt after (\d+(?:\.\d+)?)% (?:reduced|increased) delay$'
  replace: []
  confidence: datamined
  absorbed_by: "engine/bridge.lua's parseMod rule (MECH90, train 95): the line becomes PoB's CurseDelay INC (reduced: negative)"
  notes: >-
    Proven by MECH90's engine test tests/test_mech90.py test_idol_of_egrin_curse_zone_delay_is_curse_delay. PoB's own
    bonded-mod rules decide when the rune's bonded line is active.
  sources: ["engine/bridge.lua (Idol of Egrin's parse rule)", "C:/PROJECTS/PoE2 Builder/scratch/manager/research/INDEX.md (R33-9)",
            "vendor/PathOfBuilding-PoE2/src/Data/SkillStatMap.lua 2769-2770"]
  status: proposed
