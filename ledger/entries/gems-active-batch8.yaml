# COVC12 (12 Nov 2026): the Last Lament's Requiem, as PoB scores it on a searched build (COVC12 POE2T1421-1422).
# A 60 s search for Compose Requiem (Witchhunter, The Last Lament) ended with PoB's "Compose Requiem" effect (the ammo)
# as the calculated skill at 1.52 uses/s and 1,407 DPS, no anguish cap, and the Requiem shot itself at speed 0:
# - PoB maps no `base_deal_no_damage` (checked: grep of PoB's src outside Data/Skills finds it only in
#   StatDescriptions; SkillStatMap has only minions_deal_no_damage), so the ammo effect is scored as a crossbow attack;
# - the shot takes its bolt count from the ammo effect (CalcOffence.lua 381-397), which has none
#   (crossbow_ammo_has_no_ammo), so PoB's reload formula (CalcOffence.lua 3019-3036) gives it 0 uses a second. PoB
#   reads neither crossbow_ammo_has_no_ammo nor crossbow_skill_has_no_ammo (checked: grep of PoB's src outside
#   Data/Skills: none; PoB's skill data: CrossbowRequiemAmmoPlayer and CrossbowRequiemPlayer only).

- id: gem-active-requiem-fires-freely
  title: "Requiem: fired freely while it lasts (no ammunition, no reload)"
  kind: gem_stat
  match: '^crossbow_skill_has_no_ammo$'
  replace: ["Bolts fired by Crossbow Attacks have 1% chance to not expend Ammunition"]
  factor: 100
  stats: ["crossbow_skill_has_no_ammo"]
  skill: ["Requiem"]
  confidence: datamined
  notes: >-
    The game's description of the shot (CrossbowRequiemPlayer, also PoB's skill data): "Does not use Ammunition and can
    be fired freely until the Requiem ends". Counted as PoB's ChanceToNotConsumeAmmo 100 on the shot, so PoB gives it
    its firing rate with no reload (CalcOffence.lua 3036). The fight's share it's up (12 s per 42 s) is the anguish cap
    (usage.anguish_rate, model-stats-compose-requiem-anguish), applied on top.
  sources: ["vendor/PathOfBuilding-PoE2/src/Data/Skills/act_str.lua CrossbowRequiemPlayer",
            "vendor/PathOfBuilding-PoE2/src/Modules/CalcOffence.lua 381-407, 3019-3036",
            "https://poe2db.tw/us/Compose_Requiem"]
  test_in_game: "With the Requiem up, fire it for its 12 s: no reload pauses."
  status: proposed

- id: gem-active-compose-requiem-deals-no-damage
  title: "Compose Requiem (the ammo effect) deals no damage"
  kind: gem_stat
  match: '^base_deal_no_damage$'
  replace: ["1% less Damage"]
  factor: 100
  stats: ["base_deal_no_damage"]
  skill: ["Compose Requiem"]
  confidence: datamined
  notes: >-
    Its only stat set carries base_deal_no_damage, it has no Damage skill type, and its description only composes the
    Requiem (checked: PoB's skill data CrossbowRequiemAmmoPlayer; poe2db's Compose Requiem page shows "base deal no damage
    [1]" and "Does not use Ammunition"). PoB scores it as a crossbow attack (1,407 DPS on COVC12's searched build); counted
    as 100% less Damage on it, so the search calculates the Requiem shot instead. base_deal_no_damage on PoB's other
    187 skills is not reviewed here (open, COVC12's report).
  sources: ["vendor/PathOfBuilding-PoE2/src/Data/Skills/act_str.lua CrossbowRequiemAmmoPlayer",
            "https://poe2db.tw/us/Compose_Requiem"]
  test_in_game: "Not needed: the skill only composes the Requiem."
  status: proposed

# skill_specific_stat_description_mode (COVC12; header corrected by COV18 for AUDIT23 A23-1 / AUDIT26): PoB marks it
# "-- Display Only" (SkillStatMap), but on player skills its value picks game text for a real mechanic. The two entries
# below are read by the tool's own models; COVC12's report has 10 more (open, routed, or PoB's own statMap: Voltaic
# Fulmination's corpseExplosionLifeMultiplier, sup_dex.lua 2096). summon_water_djinn.csd has a block, but no stat set
# carries the stat there (checked: scratch/covc12/where.py over GrantedEffectStatSets).
# COVC12 also wrote that on 14 other skills carrying it no .csd block names it. That was WRONG (AUDIT23 A23-1): a plain
# `grep -rl skill_specific_stat_description_mode` over data/game-26476662/files/data/statdescriptions finds 27 files,
# and 12 of the 14 have a block with text (game 26476662, COV18):
#   Convalescence "Cooldown is {0} seconds"; Corpse Beetles "Summons {0} Beetle per [Corpse] consumed"; Emergency Reload
#   "Number of each clip's Empowered bolts is equal to the maximum Ammunition of the clip"; Frostflame Nova "Hits enemies
#   every 0.5 seconds until affected Ignite expires"; Fulmination "Hits up to 8 enemies"; Rain of Arrows "Modifiers to
#   Projectile speed apply to arrow landing frequency"; Righteous Descent "Will Consume a Fragment of Divinity within 3
#   metres of you or targeted location when you leap to become Empowered"; Ruzhan (summon_fire_djinn.csd) "Attacks with
#   Ruzhan's Zealotry when you use a damaging Skill with a 4 second cooldown, inflicting enemies Struck with Exposure";
#   Tempest Bell "Can be Ancestrally Boosted as though a Strike"; Toxic Domain "Each enemy can have up to 1 Pustule
#   attached" (MECH-B's pustule cap); Toxic Growth "Pustules store expected damage of Poisons inflicted on them";
#   Whirlwind Lance "Collapse deals Melee damage".
# For Ancestral Cry and The Stars Answer no .csd file in the export holds the stat (checked: the same grep; poe2db not
# checked), so what it does there is UNVERIFIED. None of the 14 is zeroed or dropped here: each stays open as a
# mechanic for its lane (COV18's report).

- id: model-stats-rapid-shot-heat-lockout
  title: "Rapid Shot: can't fire or reload for 10 s on reaching maximum Heat (Heat model)"
  kind: model
  model: heat
  stats: ["skill_specific_stat_description_mode"]
  skill: [Rapid Shot]
  confidence: datamined
  notes: >-
    rapid_shot.csd: "Cannot fire or reload for {0} seconds on reaching maximum Heat" (milliseconds_to_seconds; value
    10000). MECH-B's heat model (models.py RAPID_SHOT, HEAT_LOCKOUT) reads the gem's value as the lockout and counts
    Rapid Shot at its share of the fight.
  sources: ["builder/search/models.py Rapid Shot's Heat (MECHB4)",
            "data/game-26476662/files/data/statdescriptions/specific_skill_stat_descriptions/rapid_shot.csd"]
  status: approved

- id: model-stats-explosive-transmutation-trigger
  title: "Explosive Transmutation: Triggers Transmutation Explosion on picking up a Remnant (Remnant trigger model)"
  kind: model
  model: remnants
  stats: ["skill_specific_stat_description_mode"]
  skill: [Explosive Transmutation]
  confidence: datamined
  notes: >-
    transmutation_reservation.csd: "Trigger Transmutation Explosion on picking up a Remnant". PoB has no trigger for
    it; Assumptions.wanted gives the explosion a trigger rate from the build's own Remnant sources (REMNANT_SOURCES),
    capped by its cooldown (assumptions.py module docstring).
  sources: ["builder/search/assumptions.py Explosive Transmutation, REMNANT_SOURCES",
            "data/game-26476662/files/data/statdescriptions/specific_skill_stat_descriptions/transmutation_reservation.csd"]
  status: approved
