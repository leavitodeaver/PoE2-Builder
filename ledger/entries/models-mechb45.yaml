- id: model-mechb45-crossbow-sequence-projectiles
  title: "Crossbow skills' additional projectiles fire in sequence and all hit one target (models.crossbow_sequence_model)"
  kind: model
  model: crossbow_sequence_model
  skill: ["Crossbow Shot", "Explosive Shot", "High Velocity Rounds", "Glacial Bolt", "Rapid Shot", "Armour Piercing Rounds",
          "Ice Shards", "Shockburst Rounds", "Requiem"]
  confidence: theory
  notes: >-
    An UNDERCOUNT: probe POE2T4663 (Rapid Shot, High Velocity Rounds, Armour Piercing Rounds with 1, 2, 3 projectiles:
    the same TotalDPS). KeywordPopups 122 (game 26650308): "Multiple Projectiles fired from a single Crossbow skill can
    all hit the same target, and single-Projectile skills fire additional Projectiles in sequence". PoB means to count
    them (SkillStatMap: crossbow_barrage_attack_time_ratio_% -> BarrageAttackTimePenalty; CalcOffence 1114-1126) but
    the path needs SkillType.Barrageable, which no crossbow skill has. Applied here as PoB intends: DPS x the projectile
    count, attack time + ratio% per additional projectile (10% on Crossbow Shot, Explosive Shot, High Velocity Rounds,
    Glacial Bolt: MEDIUM). Rapid Shot, Armour Piercing Rounds, Ice Shards, Shockburst Rounds, Requiem carry no ratio:
    PoB's default 100% (x1), UNVERIFIED, the 10% reading a row. Ammunition per extra bolt UNVERIFIED (taken as none).
    Run and Gun's crossbow chance reaches it through PoB's ProjectileCount.
  sources: [builder/search/models.py (crossbow_sequence_model), builder/search/assumptions.py (after Frost Darts),
            "data/game-26650308/tables/KeywordPopups.json (Crossbow)", "data/game-26650308/tables/GrantedEffectStatSets.json",
            scratch/mechb45/p4663.log]
  status: proposed

