- id: gem-gem32-caltrops-nothing-weapon-when-unarmed
  title: "Caltrops' replace_main_hand_unarmed_attack_stats_with_nothing_type: no effect with a weapon held; unarmed PoB keeps the bare-hand attack (a negligible overcount)"
  kind: gem_stat
  match: '^replace_main_hand_unarmed_attack_stats_with_nothing_type$'
  skill: [Caltrops]
  replace: []
  stats: ["replace_main_hand_unarmed_attack_stats_with_nothing_type"]
  confidence: LOW
  notes: >-
    Both Caltrops sets carry it (TriggeredCaltropsPlayer, the Caltrops support's; TriggeredTrailOfCaltropsPlayer, Trail
    of Caltrops'), with no stat text (its meaning read from its name: the unarmed attack's stats become a "nothing"
    weapon's, UNVERIFIED). Probe POE2T5821 (scratch/gem32/probe5821.log, a Lightning Arrow build, real PoB): the
    support's Caltrops hit 25.76 with the Fanatic Bow held and 0.48 with no weapon; Trail of Caltrops' 107.5 with the bow
    (PoB disables Trail with no weapon). So PoB attacks with the held weapon: the support's set has
    active_skill_has_%_standard_scaling_attack_damage 75, which PoB maps to a 0.75 base multiplier on the weapon's hit
    (SkillStatMap.lua 2179, its own note: "Should be getting value from default attack on weapon if it exists"), and the
    stat here concerns the unarmed case only. With a weapon: no effect. Unarmed: the game would give a "nothing" weapon
    where PoB keeps the class's bare-hand damage (0.48 a hit here): a negligible OVERCOUNT for an unarmed Caltrops
    build, not modelled (the Concoctions' fix, bridge installConcoctionsNotUnarmed, is for skills whose text says they
    are not Unarmed Attacks; Caltrops' text doesn't).
  sources: ["scratch/gem32/probe5821.log", "vendor/PathOfBuilding-PoE2/src/Data/SkillStatMap.lua (2179)",
            "vendor/PathOfBuilding-PoE2/src/Data/Skills/sup_dex.lua (TriggeredCaltropsPlayer)",
            "vendor/PathOfBuilding-PoE2/src/Data/Skills/act_dex.lua (TriggeredTrailOfCaltropsPlayer)"]
  test_in_game: "Caltrops' tooltip damage with a weapon and unarmed."
  status: proposed

- id: gem-gem32-warcry-minimum-benefit
  title: "warcry_minimum_benefit_if_monster_power_present: no effect against a Unique boss (its 20 Power already gives each warcry 2-4 Empowers)"
  kind: gem_stat
  match: '^warcry_minimum_benefit_if_monster_power_present$'
  skill: [Arctic Howl, Ferocious Roar, Fortifying Cry, Infernal Cry, Seismic Cry]
  replace: []
  stats: ["warcry_minimum_benefit_if_monster_power_present"]
  confidence: MEDIUM
  notes: >-
    No stat text (checked: every .csd under data/game-26650308/files/data/statdescriptions) and PoB reads it nowhere
    (Modules/, SkillStatMap.lua); from its name, a floor on a warcry's Power-based benefit when any enemy Power is
    counted (the floor's size UNVERIFIED). Against the tool's boss, PoB counts WarcryPower 20 (ConfigOptions 727: "Power
    is assumed to be 20 if your target is a Boss"; KeywordPopups Power: "Unique monsters always have 20 Power"), and
    each warcry's Empowers are floor(min(20, cap) / per): Arctic Howl 20 / 5 = 4 (cap 50), Ferocious Roar 20 / 8 = 2
    (cap 64), Infernal Cry and Seismic Cry 20 / 10 = 2 (cap 50) (PoB's act_str.lua warcry_empowers_per_X_monster_power
    / _mp_cap, CalcPerform 2201-2204). A floor of 1 (the plain reading of "minimum benefit") can't bind at 2 or more;
    Fortifying Cry carries no per-Power stat in PoB's data, its benefit taken as PoB gives it. No number moves for a lone
    Unique boss; with weaker enemies only (not the tool's fight) the floor would matter.
  sources: ["vendor/PathOfBuilding-PoE2/src/Data/Skills/act_str.lua", "vendor/PathOfBuilding-PoE2/src/Modules/CalcPerform.lua (2201-2204)",
            "vendor/PathOfBuilding-PoE2/src/Modules/ConfigOptions.lua (727)"]
  test_in_game: "Not needed for a lone boss."
  status: proposed

