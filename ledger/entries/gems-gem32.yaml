- id: model-gem32-link-nova-on-own-sets
  title: "projectiles_nova on a skill's own stat set: Cold-Infused Spark, Empowered Sparks' Spark and Runeforged Blades are counted at one hit a use or none"
  kind: model
  model: nova_projectiles
  stats: ["projectiles_nova"]
  skill: [Spark, Empowered Sparks, Runeforged Blades]
  confidence: MEDIUM-LOW
  notes: >-
    GEM29's nova_projectiles_model leaves out the skills whose own stat set fires in a circle (models.py above
    NOVA_STAT); what counts them instead:
    Spark (its Cold-Infused set): one hit a cast on a lone boss (MECHB49, RESEARCH38 R38-13, SPARK_HEADLINE_HITS 1;
    entry model-mechb45-projectile-group-exceptions), which is PoB's own count; a circle with one spark aimed at the
    boss gives the same one (R31-11 (b)'s aimed reading, GEM29's headline), so nothing changes. The unaimed reading
    (R39-12's row, N x 2 asin(r / d) / 360 of a cast's sparks in the boss's arc) would be below one at range: not
    applied (the same headline as Nova Projectiles).
    Empowered Sparks (TriggeredEmpoweredSparkPlayer's Cold-Infused set): GEM27's empowered_sparks_model counts each
    triggered Spark at PoB's one-hit use (model-gem27-empowered-sparks), the same as Spark's one.
    Runeforged Blades (TriggeredRuneforgedBladesPlayer, 7 blades in a nova): "The Projectiles cannot Hit the enemy from
    which they originated" (SupportRuneforgedBladesPlayer's text, PoB other.lua 14719): none hits the lone boss the
    Consume came from, and PoB scores the blades at 0 (GEM26's sweep, scratch/gem26/probe_sweep.json: Boneshatter
    26.38 and Spark 50.27 Full DPS with and without the support; the blades' useRates TotalDPS 0). MECH98 counts the
    support's Consume of the Full Break (conditions.RUNEFORGED, fe311996, train 112). The blades' hits on adds aren't counted (a lone boss).
    Not linked here: Cluster Grenade's Mini Grenades (PoB and the search score one of its two stat sets, never both:
    an UNDERCOUNT lead with a geometry question, GEM32's report). A link only.
  sources: ["builder/search/models.py (NOVA_STAT note, SPARK_HEADLINE_HITS, empowered_sparks_model)",
            "builder/search/conditions.py (RUNEFORGED)", "scratch/gem26/probe_sweep.json",
            "vendor/PathOfBuilding-PoE2/src/Data/Skills/other.lua (SupportRuneforgedBladesPlayer, TriggeredRuneforgedBladesPlayer)"]
  status: proposed

