  kind: model
  model: guard
  stats: ['gain_X_guard_on_heavy_stun_per_10_strength', 'guard_on_stun_guard_duration_ms']
  skill: ['Vanguard I', 'Vanguard II']
  confidence: MEDIUM
  notes: >-
    MECHC40's a792074c (train 89): on the supported main skill's Heavy Stuns of the boss (models.heavy_stun_rate), 4 / 6
