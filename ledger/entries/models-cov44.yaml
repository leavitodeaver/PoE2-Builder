# COV44 (COV-A; from MECH89's d502bdc4 in train 88): gem stats a custom model now reads (kind: model with `stats`, the
# models-cov43.yaml form).

- id: model-mech89-rending-apex-final-strike-break
  title: 'Rending Apex, "Final Strikes of Supported Skills Break Armour equal to N% of Attack Damage dealt" (conditions.final_strike_break, MECH89)'
  kind: model
  model: armour_break
  stats: ['final_strike_attack_damage_%_dealt_as_armour_break']
  skill: ['Rending Apex']
  confidence: LOW
  notes: >-
    MECH89 (d502bdc4, train 88; an UNDERCOUNT before, nothing read it; PoB maps the stat to nothing). On the main skill
    (Ice Strike, Tempest Flurry, Shred, Primal Strikes: all in models.COMBO_SEQUENCES): one Final Strike a combo, its hit
    = the last set's per-use damage, over the combo's time, feeding the boss's Armour Broken cycle (conditions
    FINAL_BREAK_STAT, _final_break). On a side skill 0, labelled. LOW: the combo taken as never broken (MECH89's label).
    Its tests: tests/test_mech89.py test_rending_apex_breaks_with_the_final_strike_once_a_combo,
    test_rending_apex_on_ice_strike_fully_breaks_the_boss.
  sources: ["builder/search/conditions.py (FINAL_BREAK_STAT, final_strike_break, _final_break)"]
  status: proposed

- id: model-mechc40-fortifying-cry-guard
  title: 'Fortifying Cry''s Guard per 5 enemy Power and its Power cap (recovery.event_guard via assumptions, MECHC40)'
  kind: model
  model: guard
  stats: ['shielding_cry_grant_X_guard_per_5_mp', 'shielding_cry_grant_X_guard_per_5_mp_mp_cap']
  skill: ['Fortifying Cry']
  confidence: MEDIUM
  notes: >-
    MECHC40's a792074c (train 89; an UNDERCOUNT before, PoB sets no Guard): the cry's level stat X (read from PoB's
    levelStats) x the boss's Power counted up to the cap in 5s (a lone Unique boss's 20 Power: 4 x X) for 4 s, at the
    cry's own uses; up all fight in PoB's Guard pool (full_guard_mods), else a row. The cap is the constant
    FORTIFY_POWER_CAP 20, the gem's fixed stat (PoB Data/Skills/act_str.lua 6121: 20, the same at every level).
  sources: ["builder/search/recovery.py (FORTIFY_GUARD_STAT, FORTIFY_POWER_CAP, event_guard)", "builder/search/assumptions.py (Fortifying Cry's Guard)"]
  status: proposed

- id: model-mechc40-vanguard-heavy-stun-guard
