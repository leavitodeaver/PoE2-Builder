- id: model-read-mechb41-empower-keep
  title: '"Skills which Empower an Attack have N% chance to not count that Attack" (models.empower_keep_model, Assumptions.empowered_uses)'
  kind: pob_gap
  model: empower_keep
  match: '^Skills which Empower an Attack have (\(\d+-\d+\)|\d+)% chance to not count that Attack$'
  replace: []
  confidence: theory
  notes: >-
    Serle's Grit (unique one-hand mace, (10-20)%) and the rune Legacy of Serle's Grit (bonded, 20%), MECHB41, an
    UNDERCOUNT: PoB leaves the line unparsed (ModCache 9407-9409: nil). Each Empowered Attack that doesn't count leaves the
    count for another, so n counted become n / (1 - p) (chances added; held below 100%). Handed to PoB as
    ExtraEmpoweredAttacks MORE, which multiplies every Warcry's Empower count (CalcPerform 2209-2210); the Empowering skills
    PoB doesn't count (Arctic Howl, the one-per-use ones) take it in Assumptions.empowered_uses for an Attack main skill.
    This entry only says a model reads the line.
  sources: ["builder/search/models.py (EMPOWER_KEEP, empower_keep, keep_factor, empower_keep_model)",
            "builder/search/assumptions.py (empowered_uses' keep factors; the empower_keep_model call before the Empowered gain hook)"]
  status: proposed

