# MECH-B's model entries (MECHB41).

- id: model-mechb41-arctic-howl-empowered-cold
  title: "Arctic Howl's Empowered attacks: one per 5 Power, each adding the Howl's Cold (models.unbuffed_warcry_empowers, arctic_howl_cold)"
  kind: model
  model: arctic_howl_cold
  stats: ["wolf_warcry_empowered_attack_cold_damage_min_per_5_power_up_to_cap",
          "wolf_warcry_empowered_attack_cold_damage_max_per_5_power_up_to_cap"]
  skill: ["Arctic Howl"]
  confidence: theory
  notes: >-
    PoB makes no Warcry buff for Arctic Howl (its stat sets lack warcry_count_power_from_enemies, the one stat SkillStatMap
    maps to a Warcry GlobalEffect; GEM14 / MECHB33), so its Num ArcticHowlEmpowers is 0, and it maps neither Cold stat
    (checked: both ids appear in vendor PoB src only in Data/Skills/act_str.lua): its Empowered attacks' Cold scored 0 (an
    UNDERCOUNT). Now: floor(min(Power, 50) / 5) Empowered attacks a use (warcry_empowers_per_X_monster_power 5, its cap 50;
    Echoing Cry's less Power first), at the share of the fight the boss is Frozen ("If an enemy is Frozen or a Frozen enemy
    is Hit"; warcry_empowers, LOW lower reading), and the main Attack's Empowered share adds the level's flat range (121-186
    at level 20) as "Adds X to Y Cold Damage to Attacks". The stat id says "per 5 Power up to cap" but the text
    (arctic_howl.csd) gives a flat range: the text is taken (the lower reading; Vruun's Aftermath's precedent), the id's
    reading (x Power / 5) in the note: UNVERIFIED which holds (RESEARCH). Not counted: the buff's added Cold for Allies'
    Attacks (wolf_warcry_buff_cold_damage_*: minions), Empowered Slams' Chilled Ground.
  sources: [builder/search/models.py (ARCTIC_HOWL, UNBUFFED_WARCRIES, unbuffed_warcry_empowers, arctic_howl_cold),
            builder/search/assumptions.py (empowered_uses' unbuffed-Warcry branch and `only`; the Howl call beside Echoing Cry's)]
  test_in_game: "RESEARCH: is the Empowered attacks' added Cold per 5 Power (x4 at 20 Power) or the flat range shown?"
  status: proposed

