- id: items-full-runic-ward-max-elemental-resistances
  title: Warding Rune of Hollowing (Bonded), +1% to all Maximum Elemental Resistances while on full Runic Ward, at the build's full Runic Ward share
  kind: pob_gap
  match: '^\+(\d+)% to all Maximum Elemental Resistances while on full Runic Ward$'
  replace: ['share:RunicWardFull +{1}% to all Maximum Elemental Resistances']
  confidence: theory
  notes: >-
    PoB ModRunes.lua 6323 (Hollowing's Bonded line). PoB has no "while on full Runic Ward" pattern (`grep -i "full runic
    ward" ModParser.lua`: 0; probe POE2T2527: leftover text, so PoB drops the line): 0 before. The stand-in parses whole
    (ElementalResistMax BASE 1), counted at RunicWardFull's share: 1 minus the Missing share for a build with a Runic
    Ward pool, all fight for one that never spends it. With no Ward pool: 0 (whether an empty pool is "full" is
    UNVERIFIED). A time average of a maximum resistance: the floors see the average.
  sources: ["vendor/PathOfBuilding-PoE2/src/Data/ModRunes.lua:6323", "https://poe2db.tw/us/Warding_Rune_of_Hollowing"]
  test_in_game: "With the rune Bonded, compare the maximum resistances on the character sheet with Ward full and after spending some."
  status: proposed
