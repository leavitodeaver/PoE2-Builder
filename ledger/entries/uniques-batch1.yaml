- id: uniques-rite-of-passage
  title: Rite of Passage, a charm used when you kill a Rare or Unique enemy, and its Possessed by Spirit effects
  kind: pob_gap
  match: '^(?:Used when you kill a Rare or Unique enemy|Possessed by Spirit Of The \w+ for (?:\(\d+-\d+\)|\d+) seconds on use)$'
  replace: []
  absorbed_by: "flasks.py KILL_TRIGGER: a charm used on killing a Rare or Unique counts no uptime in a boss fight"
  confidence: theory
  notes: >-
    flasks.uptime returns 0 for a charm whose text says "used when you kill", so its on-use Possession never counts.
    "Possessed by Spirit Of The ..." appears on no other unique in PoB's export (checked: uniques.json text search).
  sources: ["https://poe2db.tw/us/Rite_of_Passage", "builder/search/flasks.py (KILL_TRIGGER)"]
  test_in_game: "None needed for a lone boss: the charm fires as the boss dies."
  status: proposed

# No effect on what's calculated ----------------------------------------------------------------------------------

- id: uniques-slow-magnitude
  title: Debuffs you inflict have increased Slow Magnitude (The Prisoner's Manacles, Grip of Kulemak)
  kind: pob_gap
  match: '^Debuffs you inflict have (\(\d+-\d+\)|\d+)% increased Slow Magnitude$'
  replace: []
  confidence: datamined
  notes: >-
    "This modifier applies to Debuffs you inflict that Slow enemies, and scales only the specific Magnitude that slows
    the target" (KeywordPopups SlowMagnitudeModifier). A slower boss acts less often, which in game lowers the damage
    you take and the boss hits that feed "when Hit" lines; the tool's boss preset hits at a fixed rate and its
    defence checks are per hit, so nothing it calculates moves (checked: builder/search/*.py reads no slow magnitude;
    PoB ignores the line). Bosses take 50% less Slow effect (KeywordPopups Slow).
  sources: ["data/game-26476662/tables/KeywordPopups.json (SlowMagnitudeModifier, Slow)", "https://poe2db.tw/us/The_Prisoners_Manacles"]
  test_in_game: "Not needed for the numbers; in game, a slowed boss's attacks come visibly slower."
  status: retired
  retired_note: >-
    Retired (COVD7, AUDIT6 A6-1): the line is not "no effect". Chill is an Ailment and so a Debuff that Slows, and
    its one magnitude is its Slow (KeywordPopups SlowMagnitudeModifier, Chill, Ailments), so the line raises Chill's
    magnitude. passives-batch1.yaml passives-slow-magnitude-chill (COVB4, 7ddc03b) owns both the passive form and
    the unique's "(12-30)%" range form and translates it to Chill magnitude; this entry zeroed The Prisoner's
    Manacles' and Grip of Kulemak's lines wherever it matched first (an undercount).

- id: uniques-abyssal-wasting-duration
  title: Grip of Kulemak, Abyssal Wasting you inflict has Infinite Duration
  kind: pob_gap
  match: '^Abyssal Wasting you inflict has Infinite Duration$'
