# Misparses read by hand -----------------------------------------------------------------------------------------

- id: parse-facebreaker-unarmed-mace
  title: 'Facebreaker, "Can Attack as though using a One Handed Mace while both of your hand slots are empty": PoB keeps the condition in CalcSetup'
  kind: parse_checked
  match: '^Can Attack as though using a One Handed Mace while both of your hand slots are empty$'
  confidence: datamined
  notes: >-
    ModParser.lua parses the line to the flag CanAttackAsOneHandMaceUnarmed with no tag (what the audit flagged), but
    CalcSetup.lua applies the flag only when the Weapon 1 slot is empty ("if (not env.player.itemList["Weapon 1"])
    and env.modDB:Flag(nil, "CanAttackAsOneHandMaceUnarmed")"), so the "while" is kept for the main hand. The off
    hand isn't checked: a build with an empty main hand and something in the off hand would count it where the game
    wouldn't (UNVERIFIED whether the search ever builds that: an item for SEARCH).
  sources: ["vendor/PathOfBuilding-PoE2/src/Modules/ModParser.lua (can attack as though using a one handed mace)",
            "vendor/PathOfBuilding-PoE2/src/Modules/CalcSetup.lua (Facebreaker)", "https://poe2db.tw/us/Facebreaker"]
  test_in_game: "With Facebreaker and both hands empty, a One Handed Mace skill is usable; equip an off-hand item and it greys out."
  status: proposed
