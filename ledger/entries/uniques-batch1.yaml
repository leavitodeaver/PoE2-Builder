# Energy model inputs at a unique's rolled range ------------------------------------------------------------------
# The Energy model's own entries (custom-models.yaml) match only a single number ("9% chance ..."). A unique from
# PoB's data carries its range ("(6-12)% chance ..."), and the bridge's sourceLines passes PoB's modLine.line,
# which keeps the range (Classes/Item.lua: "This might describe a range of values"), so the model never saw these
# lines on a unique the search proposes. These read the range at PoB's default roll, its middle
# (Main.lua defaultItemAffixQuality 0.5), as PoB rolls every other line of the item.

- id: uniques-meta-energy-range
  title: Grip of Kulemak, Meta Skills gain (10-16)% increased Energy (Energy model input, middle roll)
  kind: pob_gap
  model: energy
  match: '^Meta Skills gain \((\d+)-(\d+)\)% increased Energy$'
  replace: ['mult:MetaEnergy {(g1+g2)/2}']
  confidence: datamined
  notes: "As custom-models.yaml meta-energy, at the middle of the roll (PoB's default roll)."
  sources: ["https://poe2db.tw/us/Grip_of_Kulemak", "ledger/entries/custom-models.yaml (meta-energy)"]
  test_in_game: "As meta-energy: a Cast on Critical's Energy bar fills about 13% faster with the ring."
  status: proposed

- id: uniques-energy-refund-range
  title: Heart of the Well, (6-12)% chance for Trigger skills to refund half of Energy Spent (Energy model input, middle roll)
  kind: pob_gap
  model: energy
  match: '^\((\d+)-(\d+)\)% chance for Trigger skills to refund half of Energy Spent$'
  replace: ['mult:EnergyRefund {(g1+g2)/2}']
  confidence: reported
  notes: "As custom-models.yaml meta-energy-refund (cost x (1 - chance/200)), at the middle of the roll."
  sources: ["https://poe2db.tw/us/Heart_of_the_Well", "ledger/entries/custom-models.yaml (meta-energy-refund)"]
  test_in_game: "As meta-energy-refund: over 100 triggers, about 9 leave half their Energy in the bar."
  status: proposed

# On-kill lines: absorbed by the tool's boss-fight assumption ------------------------------------------------------
# The tool fights one boss, and treats every on-kill source as giving nothing until the boss dies
# (builder/search/conditions.py: "on kill (nothing dies on a single boss)", for charges, Rage and buffs alike;
# flasks.py: "in a boss fight nothing dies"). That is the tool's assumption, not a game rule: bosses that summon
# adds would feed these lines in game. These entries record that the lines fall under it.

- id: uniques-charge-on-kill
  title: Beira's Anguish, Nascent Hope, chance to gain a Charge when you kill an enemy
  kind: pob_gap
  match: '^(\(\d+-\d+\)|\d+)% Chance to gain a Charge when you kill an enemy$'
  replace: []
  absorbed_by: "nothing dies on a single boss (conditions.py on-kill sources; flasks.py)"
  confidence: theory
  sources: ["https://poe2db.tw/us/Beiras_Anguish", "https://poe2db.tw/us/Nascent_Hope", "builder/search/conditions.py"]
  test_in_game: "None needed for a lone boss; on a map, charges rise on kills."
  status: proposed

