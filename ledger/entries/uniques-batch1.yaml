# Unique items' lines, first batch (COVD1, 12 Nov 2026): the highest-ranked unique lines the coverage audit
# (builder/ledger/coverage.py) found uncounted, translated into lines PoB calculates, recorded as absorbed by an
# assumption the tool already makes, or recorded as changing nothing it calculates. Lines that need a model are in
# scratch/manager/workers/COVD1.report.md for the mechanics lanes, and stay open here.
#
# Game files: data/game-26476662/tables (KeywordPopups.json for keyword definitions). Unique texts: PoB's export
# (data/pob-bb52d6b368/uniques.json). A unique line appears with its roll range ("(15-20)%") in PoB's data and rolled
# ("17%") on an imported item, so patterns accept both: (\(\d+-\d+\)|\d+). PoE2 0.5.x; recheck at the 1.0 refresh.

# Translations -----------------------------------------------------------------------------------------------------

- id: uniques-lightning-skills-chain
  title: Levinstone (and Loreweave), Lightning Skills Chain +1 times
  kind: pob_gap
  match: '^Lightning Skills Chain \+(\d+) times$'
  replace: ['Non-Projectile Chaining Lightning Skills Chain +{1} times']
  confidence: datamined
  notes: >-
    PoB has no "lightning skills chain" form; its nearest, "non-projectile chaining lightning skills chain +N times"
    (ModParser.lua), adds ChainCountMax to skills of types Chains and Lightning that aren't projectiles (Arc, ...).
    Lightning projectile skills that chain (Lightning Arrow ...) miss it: an undercount only where a "per remaining
    chain" or "for each time it has chained" line reads the count. Against one boss an extra chain adds no hit on the
    boss itself: the game's Chain keyword says "Enemies cannot be targeted more than once in the same Chain"
    (KeywordPopups Chain), and PoB's single-target numbers move only through ChainRemaining / Chain-count lines
    (CalcOffence.lua ChainMax, ChainRemaining).
  sources: ["data/game-26476662/tables/KeywordPopups.json (Chain)", "https://poe2db.tw/us/Levinstone",
            "vendor/PathOfBuilding-PoE2/src/Modules/ModParser.lua (non-projectile chaining lightning skills chain)"]
  test_in_game: "With Levinstone and Arc on a pack, count Arc's chains with and without the ring: one more."
  status: proposed

- id: uniques-yoke-ailment-types
  title: Yoke of Suffering, enemies take increased Damage per Elemental Ailment type on them (first half of a two-line mod)
  kind: pob_gap
  match: '^Enemies take (\(\d+-\d+\)|\d+)% increased Damage for each Elemental Ailment type among$'
  replace: ['Enemies take {1}% increased Damage for each Elemental Ailment type among your Ailments on them']
  confidence: datamined
  notes: >-
    PoB's export breaks the mod over two lines ("... among" / "your Ailments on them"), so its parser reads neither,
    though ModParser.lua has the whole sentence: one DamageTaken INC per ailment the boss has (Frozen, Chilled,
    Ignited, Shocked, Electrocuted, and PoE1's Scorched, Brittle and Sapped, which nothing sets in PoE2). The game's
    Elemental Ailments are Ignite, Chill, Freeze, Shock and Electrocute (KeywordPopups ElementalAilments), the same
    five. Which ailments are on the boss is the condition resolver's (MECH-A's) uptime, as for every other line
    that reads them.
  sources: ["data/game-26476662/tables/KeywordPopups.json (ElementalAilments)", "https://poe2db.tw/us/Yoke_of_Suffering",
            "vendor/PathOfBuilding-PoE2/src/Modules/ModParser.lua (for each elemental ailment type among your ailments on them)"]
  test_in_game: "Hit a dummy with a fixed-damage hit while it is Shocked, then Shocked and Chilled: the second hit is bigger by the line's percentage."
  status: proposed

- id: uniques-yoke-ailment-types-second-line
  title: Yoke of Suffering, second half of the two-line mod ("your Ailments on them")
  kind: pob_gap
  match: '^your Ailments on them$'
  replace: []
  confidence: datamined
  notes: "Carried by uniques-yoke-ailment-types, which translates the whole sentence from its first line."
  sources: ["data/pob-bb52d6b368/uniques.json (Yoke of Suffering)"]
  test_in_game: "As uniques-yoke-ailment-types."
  status: proposed

- id: uniques-knocks-back-on-hit
  title: Tyranny's Grip, Knocks Back Enemies on Hit
  kind: pob_gap
