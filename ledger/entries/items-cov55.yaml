# COV55 (23 Nov 2026): lines and gem stats a model on main reads (COV43's rule: marked only where the model's own code reads
# the line or stat and the result reaches a number). Checked against origin/main cf2744a7 (train 132). Each entry adds nothing
# to PoB: it says which model reads it (a link only, no second count).
#
# Left open on purpose (each read in the code):
# - tempest_bell_damage_+%_final_per_time_hit, tempest_bell_physical_damage_%_as_elemental_per_ailment: tempest_bell_model
#   says they are not counted; bell_hit_limit and bell_shockwave_cooldown_ms on Hollow Focus (its own values 1 and 100, not
#   this model's);
# - cooldown_recovery_modifiers_also_apply_to_repeat_interval on Ghost Dance and Time of Need (not checked for a reader here);
# - base_number_of_tempest_bells_allowed: read only by Train 133's all-Bells row, not on this base and not the headline;
# - the other number_of_X_allowed rows: the bridge's generic instanceLimit reads them, but whether each reaches a number
#   (duration_press_rate, only for a pressed duration skill) hasn't been checked skill by skill.

- id: model-read-cov55-tempest-bell-extra-hits
  title: '"Tempest Bells are destroyed after an additional N Hits" read by the Tempest Bell model (models.BELL_EXTRA_HITS)'
  kind: pob_gap
  model: tempest_bell
  match: '^Tempest Bells are destroyed after an additional (\(\d+-\d+\)|\d+) Hits?$'
  replace: []
  confidence: theory
  notes: >-
    models.tempest_bell_model adds N to the Bell's hit limit, which caps its shockwaves a second, on a main Tempest Bell.
    A Bell beside another main skill isn't counted (the model's own note). A link only.
  sources: ["builder/search/models.py (BELL_EXTRA_HITS, tempest_bell_model)"]
  status: proposed

- id: model-read-cov55-tempest-bell-constants
  title: "bell_hit_limit and bell_shockwave_cooldown_ms (Tempest Bell) held by the Tempest Bell model's constants"
  kind: model
  model: tempest_bell
  stats: ["bell_hit_limit", "bell_shockwave_cooldown_ms"]
  skill: [Tempest Bell]
  confidence: theory
  notes: >-
    Constant readers: both are ConstantStats, the same at every level (GrantedEffectStatSets 26650308: TempestBellPlayer
    bell_hit_limit 10, TempestBellShockwavePlayer bell_shockwave_cooldown_ms 300), and equal models.BELL_LIMIT_BASE and
    BELL_WAVE_EVERY, which cap the shockwaves a Bell makes. Hollow Focus's own values (1, 100) are not covered. A link only.
  sources: ["builder/search/models.py (BELL_LIMIT_BASE, BELL_WAVE_EVERY)"]
  status: proposed

