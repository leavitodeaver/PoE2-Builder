- id: model-read-cov55-align-fate-recovery
  title: "cooldown_recovery_modifiers_also_apply_to_repeat_interval (Align Fate) applied by models.align_fate_rate"
  kind: model
  model: align_fate
  stats: ["cooldown_recovery_modifiers_also_apply_to_repeat_interval"]
  skill: [Align Fate]
  confidence: theory
  notes: >-
