  kind: model
  model: gated_set
  stats: ["active_skill_consumes_a_fire_infusion"]
  skill: [Fireball]
  confidence: LOW
  notes: >-
    ActiveSkills fireball (26650308): "The explosion Consumes a Fire Infusion if possible to launch a ring of smaller
    firebolts". PoB's "Firebolts" set (12 projectiles, active_skill_consumes_a_fire_infusion) has no "-Infused" label,
    so gems.py's Infused gate (fire- / cold- / lightning-infused) never reached it and the search could score it with no
    Infusion source. models.gated_set_model via GATED_SETS / GATED_ADDS / INFUSED_GATED (GEM34), the share from
