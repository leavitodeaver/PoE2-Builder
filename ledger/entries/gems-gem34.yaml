    + Firebolts x share; with none the Firebolts set gets the Projectile x 0.9 so the search keeps the Projectile set.
    The headline takes ONE firebolt (PoB's one-set number) hitting the lone boss: LOW (whether the ring launched from
    the explosion hits the struck boss, and how many, is a RESEARCH question; R44-10 kept Fireball one part). The
    Explosion set, if scored, is left as it was (R44-10).
  sources: ["builder/search/models.py (GATED_SETS, INFUSED_GATED, gated_set_model)",
