- id: model-gem19-siphoning-strike-shock
  title: "Siphoning Strike: the shockwave only when the Strike finds the boss Shocked (PoB scored one on every Strike)"
  kind: model
  model: shock_set
  stats: []
  skill: [Siphoning Strike]
  confidence: MEDIUM
  notes: >-
    models.shock_set_model (GEM19), hooked in Assumptions after the Heavy Stun sets'. Game: ActiveSkills siphoning_strike
    "If the target is Shocked, Consume their Shock to release a Lightning shockwave around the target and grant you a
    Power Charge". PoB scores the "Shockwave" set as if every Strike made one: probe POE2T3411 kept it at 386.2 vs the
    Dash's 69.7 (an OVERCOUNT, x5.5). The Strike never Shocks (SiphoningStrikePlayer never_shock; no stat removes it:
    checked every table's stat columns for never_shock / virtual_never_shock, 18 skill and support stat sets carry it,
    no Mods row), so the Shock comes from the build's other skills (each group's uses a second at the search's press
    choices x HitChance x its Shock chance per hit, PoB's ShockChance, which the bridge's useRates rows didn't
    carry (probe POE2T3426) until MECH86's ShockChancePerHit (train 76; GEM20's probe POE2T3457 reads it)) and Shocked Ground: Assumptions.shock_set_share, the share of Strikes that
    find the boss Shocked, consumed on the next Strike then 1 s immune (conditions.consumed_share). DPS = Dash +
    Shockwave x that share. None: 0 shockwaves; a Shockwave set scored with none gets the Dash x 0.9 (a Damage line) so
    the search keeps the Dash. The Power Charge on a consume is not counted here (MECH-C's charges).
  sources: ["builder/search/models.py (shock_set_model)", "builder/search/assumptions.py (shock_set_share)",
            "data/game-26650308/tables/ActiveSkills.json (siphoning_strike)",
            "data/game-26650308/tables/GrantedEffectStatSets.json (SiphoningStrikePlayer)",
            "scratch/gem18/probe_sets6.json (POE2T3411)", "scratch/gem19/probe_shock.json"]
  test_in_game: "Optional: Siphoning Strike on an unshocked boss: no shockwave."
  status: proposed

