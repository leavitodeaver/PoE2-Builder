- id: model-gem44-spirit-vessel-per-socketed
  title: "Spirit Vessel deals 20% more Damage per different socketed Skill (the bridge's Spirit Vessel block)"
  kind: model
  model: spirit_vessel
  stats: ["spirit_vessel_damage_+%_final_per_skill_socketed_in_meta_gem"]
  skill: [Spirit Vessel]
  confidence: datamined
  notes: >-
    The game (26650308, active_skill_gem_stat_descriptions.csd): "Spirit Vessel deals {0}% more Damage per different
    socketed Skill"; PoB other.lua SpiritVesselPlayer gives the stat 20 and maps it to nothing. engine/bridge.lua's
    installSpiritVessel adds Damage MORE 20 x the different socketed skills to the companion's skill (MORE -100 with
    none). Shown on real PoB by tests/test_engine_models.py's Spirit Vessel test: two socketed skills give the
    companion 1.4 / 1.2 of one's AverageDamage. The 20 is the bridge's own number, not read from the stat: if the gem's
    value changes, the bridge must follow (named).
  sources: ["engine/bridge.lua (installSpiritVessel)", "tests/test_engine_models.py (Spirit Vessel test)"]
  test_in_game: "Not needed: the gem's own text."
  status: proposed

