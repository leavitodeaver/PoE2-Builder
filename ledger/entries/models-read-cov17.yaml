# Item lines PoB doesn't parse that a custom model already reads, which the coverage audit still called uncounted
# (COV17: scratch/cov17/modelread.py matched every uncounted item line against the search's module-level patterns;
# each one here was checked against the code that uses the pattern). The models read the lines themselves (bridge
# sourceLines), so these entries add nothing (replace: []); they tell the audit the line is counted.

- id: model-remnant-pickup-counts-twice
  title: Chance for Remnants you pick up to count as picking up an additional Remnant (Remnant rates)
  kind: pob_gap
  model: remnant_supply
  match: '^(\d+(?:\.\d+)?)% chance for Remnants you pick up to count as picking up an additional Remnant$'
  replace: []
  confidence: datamined
  notes: >-
    The item wording of the stat passives-model-remnant-effects-twice covers (one stat, two wordings: assumptions.py
    DUPLICATE_PICKUP reads both): that share of pickups counts twice in the Infusion supply and the Remnant-trigger
    rate. MECHC12's recovery.remnant_income doesn't read it (Life / Mana per Remnant not doubled: an undercount,
    routed to MECH-C in COV17's report).
  sources: ["builder/search/assumptions.py (DUPLICATE_PICKUP, duplicate_pickups)"]
  test_in_game: "Collect 20 Infusion Remnants: about 3 grant two Infusions at 15%."
  status: proposed

- id: model-dodge-roll-distance
  title: Dodge Roll distance (the dodge roll model)
  kind: pob_gap
  model: dodge_roll
  match: '^\+?(\d+(?:\.\d+)?) metres? to Dodge Roll distance$'
  replace: []
  confidence: reported
  notes: >-
    models.dodge_roll (DODGE_DISTANCE) adds it to the roll's base (DODGE_ROLL_METRES) (x movement speed, LOW), which the
    distance-based conditions read (stats _dodge_roll). Conditional wordings ("if you haven't Dodge Rolled Recently",
    "while Surrounded") are rated by the model case by case and aren't claimed here.
  sources: ["builder/search/models.py (DODGE_DISTANCE, dodge_roll)"]
  test_in_game: "Not needed for the calculated numbers."
  status: proposed

- id: model-dodge-roll-speed
  title: Faster / slower Dodge Roll (the dodge roll model)
  kind: pob_gap
  model: dodge_roll
  match: '^(\d+(?:\.\d+)?)% (faster|slower) Dodge Roll$'
  replace: []
  confidence: reported
  notes: "models.dodge_roll (DODGE_SPEED): the roll's time divided by 1 + the sum."
  sources: ["builder/search/models.py (DODGE_SPEED, dodge_roll)"]
  test_in_game: "Not needed for the calculated numbers."
  status: proposed

