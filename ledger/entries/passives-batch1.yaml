# Passive tree lines, first batch (COV-B lane, COVB1, 12 Nov 2026; PoB bb52d6b, game files build 26476662).
# Top of the coverage audit's ranking for the tree's lines (small, notable, keystone, ascendancy), overcounts first.
# Each entry is one of:
#   - parse_checked: a line the audit's misparse check flags whose effect on the numbers was read by hand and is right;
#   - a model entry (`model:`, empty `replace`): a line the tool's own models already read from the build's lines
#     (builder/search/conditions.py, assumptions.py, models.py), which the audit couldn't see; nothing is applied;
#   - pob_gap: a translation into lines PoB calculates.
# Recheck every one at the 1.0 refresh (11 Dec 2026) and at each PoB update.

# Misparses ----------------------------------------------------------------------------------------------------------

- id: passives-parse-rage-on-melee-hit
  title: '"Gain N Rage on Melee Hit": PoB''s flag only allows Rage; the tool''s Rage model applies the melee restriction'
  kind: parse_checked
  match: '^Gain [(\d.\-)]+ Rage on Melee Hit$'
  confidence: datamined
  notes: >-
    PoB parses the line to the flag Condition:CanGainRage alone (Data/ModCache.lua), so the audit saw the melee
    restriction lost. The flag gives no Rage by itself: CalcPerform.lua (line ~784) takes Rage stacks from the
    configuration's Multiplier:RageStack (ConfigOptions multiplierRage), capped at MaximumRage. The tool sets that
    configuration from builder/search/conditions.py rage_held, which takes a line as a Rage source only if
    `qualifies(text, main_types)`: "melee" in the text requires a Melee main skill (QUALIFIERS). So a build whose
    main skill isn't Melee gets no Rage from this line, and a Melee one gets it at its hit rate (one hit every 0.5 s,
    KeywordPopups Rage). The Axe form ("Gain N Rage on Melee Axe Hit", 3 small passives) is NOT closed here: the
    qualifier checks Melee but not the Axe, an overcount for a Melee build without an Axe (routed to the mechanics
    lane in COVB1's report; closed since MECHC2's Axe check: passives-batch4.yaml passives-parse-rage-on-melee-axe-hit).
  sources: ["vendor/PathOfBuilding-PoE2/src/Data/ModCache.lua (Gain 1 Rage on Melee Hit)",
            "vendor/PathOfBuilding-PoE2/src/Modules/CalcPerform.lua (Condition:CanGainRage, Multiplier:RageStack)",
            "builder/search/conditions.py (rage_held, _rage_gain, qualifies)", "KeywordPopups Rage (game files)"]
  test_in_game: "With a non-melee main skill and this passive, the Rage bar stays empty while hitting a boss; with a melee skill it fills."
  status: proposed

# Lines the tool's own models read -----------------------------------------------------------------------------------

- id: passives-model-elemental-equilibrium
  title: Elemental Equilibrium, Infusion Remnants of the next element (Infusion supply)
  kind: pob_gap
  model: infusion_supply
  match: '^Create (Lightning|Cold|Fire) Infusion Remnants instead of (Fire|Lightning|Cold)$'
  replace: []
  confidence: datamined
  notes: >-
    builder/search/assumptions.py infusion_supply: when the build has the keystone's first line (EQUILIBRIUM) every
    Remnant the build makes shifts element by EQUILIBRIUM_SHIFT (Fire to Lightning, Lightning to Cold, Cold to Fire),
    which is the three lines together; the other two lines are the same keystone, read through it.
  sources: ["builder/search/assumptions.py (EQUILIBRIUM, EQUILIBRIUM_SHIFT, infusion_supply)", "https://poe2db.tw/us/Elemental_Equilibrium"]
  test_in_game: "With the keystone, Frost Bomb's Remnant grants a Fire Infusion."
  status: proposed

- id: passives-model-remnants-reappear
  title: Storm's Recollection, Remnants reappear once after being collected (Remnant rates)
  kind: pob_gap
  model: remnant_supply
  match: '^Remnants you create reappear once, \d+(\.\d+)? seconds? after being collected$'
  replace: []
  confidence: datamined
  notes: >-
    builder/search/assumptions.py (REAPPEAR): each Remnant is collected twice, both in the Remnant rate the
    Explosive Transmutation assumption uses and in the Infusion supply. The delay before it reappears isn't counted
    (it only moves the second pickup later in a long fight). Since MECHC15 / COV17 (COV23's note) it also counts in the Life / Mana Remnant recovery and in every Remnant pickup line: assumptions.remnant_multiplier, which Assumptions passes to recovery.remnant_income.
  sources: ["builder/search/assumptions.py (REAPPEAR, infusion_supply, the Remnant rate, remnant_multiplier)", "builder/search/recovery.py (remnant_income)", "https://poe2db.tw/us/Storm%27s_Recollection"]
  test_in_game: "Collect a Remnant: it comes back once a few seconds later."
  status: proposed

