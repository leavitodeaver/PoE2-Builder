  title: Chance to create an additional Remnant (Remnant rates)
  kind: pob_gap
  model: remnant_supply
  match: '^(\d+(\.\d+)?)% chance to create an additional Remnant$'
  replace: []
  confidence: datamined
  notes: "builder/search/assumptions.py ADDITIONAL_REMNANT: the build's Remnant rate x (1 + the summed chance). Since MECHC15 / COV17 (COV23's note) it also counts in the Life / Mana Remnant recovery and in every Remnant pickup line: assumptions.remnant_multiplier, which Assumptions passes to recovery.remnant_income. Still not read by infusion_supply (an undercount of Infusions: listed in COVB1's report; infusion_supply reads only the 'additional Infusion Remnant' wording)."
