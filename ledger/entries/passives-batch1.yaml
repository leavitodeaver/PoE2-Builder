# Translations ------------------------------------------------------------------------------------------------------

- id: passives-slow-magnitude-chill
  title: Debuffs you inflict have increased Slow Magnitude (counted on Chill)
  kind: pob_gap
  match: '^Debuffs you inflict have (\(\d+-\d+\)|\d+)% increased Slow Magnitude$'
  replace: ['{1}% increased Magnitude of Chill you inflict']
  confidence: theory
  notes: >-
    KeywordPopups SlowMagnitudeModifier: "applies to Debuffs you inflict that Slow enemies, and scales only the
    specific Magnitude that slows the target". Chill is an Ailment, Ailments are Debuffs (KeywordPopups Ailments),
    and Chill's one magnitude is its Slow (KeywordPopups Chill), so for Chill the line is "increased Magnitude of
    Chill you inflict", which PoB parses (EnemyChillMagnitude) and caps at Chill's maximum (CalcOffence.lua, 50% by
    default). Chill moves the numbers through lines that read its magnitude (CalcPerform.lua). The line also slows
    Hindered, Maimed and Temporal Chains-cursed bosses harder; PoB models no Slow magnitude for those and none of
    the checked numbers reads one (UNVERIFIED for every source: a boss slowed harder hits less often, which the
    tool's hit-rate models don't read). The Hazards-only form ("Debuffs inflicted by Hazards have ...") isn't matched
    and stays open. Assumption: Slow Magnitude doesn't raise Chill's 50% maximum.
    One owner for the pattern (AUDIT6 A6-1, COVB4): this entry, for passives and items alike (The Prisoner's
    Manacles, Grip of Kulemak: PoB's range "(12-30)%" and a rolled value); uniques-batch1.yaml uniques-slow-magnitude
    ("no effect") matched the same lines and zeroed them, an undercount of the unique's Chill magnitude: COV-D retires
    it (routed). As files load alphabetically this entry already wins for both forms.
  sources: ["KeywordPopups SlowMagnitudeModifier, Chill, Ailments (game files, build 26476662)",
            "vendor/PathOfBuilding-PoE2/src/Modules/CalcOffence.lua (EnemyChillMagnitude, ChillMax)",
            "data/game-26476662 Stats: debuff_slow_magnitude_+%"]
  test_in_game: "Chill a dummy with a fixed cold hit, with and without the passive: the Chill's slow % on the dummy's debuff rises by the line's share (until 50%)."
  status: proposed
