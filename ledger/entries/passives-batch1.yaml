- id: passives-model-debuff-durations
  title: Armour Break, Hinder and Blind duration (debuff uptimes)
  kind: pob_gap
  model: debuff_uptimes
  match: '^\d+(\.\d+)?% (increased|reduced) (Armour Break|Hinder|Blind) [Dd]uration$'
  replace: []
  confidence: datamined
  notes: >-
    builder/search/models.py duration_scale (MECH44): Hinder and Blind lines scale each inflicting line's duration
    in the debuff uptimes (conditions._debuff_source), Armour Break the 12 s Fully Broken (full_break_duration, read
    by the Armour Break uptime). PoB itself drops these lines (the Armour Break one parses as "increased Armour" with
    "Break Duration" left over, and PassiveTree.lua applies no line with leftover text: no Armour overcount).
  sources: ["builder/search/models.py (DURATION_LINE, duration_scale, full_break_duration)",
            "builder/search/conditions.py (_debuff_source, the Armour Break uptime)",
            "vendor/PathOfBuilding-PoE2/src/Classes/PassiveTree.lua (mods with extra text not applied)",
            "KeywordPopups ArmourBreak: Fully Broken 12 s; Hinder: 4 s"]
  test_in_game: "Fully Break a dummy's Armour with and without the passive: the broken icon lasts 12 s x (1 + the increase)."
  status: proposed

