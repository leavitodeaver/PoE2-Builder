    The node's two text lines are parsed as one: ExtraAura (allies only) GainMainHandDmgFromParent and
    Multiplier:MainHandDamageToAllies 25, which PoB applies to allies' attacks. Nothing reaches the player's own hits.
  sources: ["vendor/PathOfBuilding-PoE2/src/Modules/ModParser.lua (allies in your presence gain added attack damage)"]
  test_in_game: "n/a (parse check)."
  status: proposed

