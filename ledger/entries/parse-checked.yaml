- id: parse-offhand-equip-flags
  title: 'Instruments of Power / Lord of the Wilds: the "while wielding" is the equip rule itself'
  kind: parse_checked
  match: '^You can equip (a Focus while wielding a Staff|a non-Unique Sceptre while wielding a Talisman)$'
  confidence: datamined
  notes: >-
    ModParser.lua flags InstrumentsOfPower / LordOfTheWilds; ItemsTab.lua IsItemValidForSlot reads them to allow the
    pair. The search builds both pairs only with the passive allocated (game_rules.yaml off_hand.passive_exceptions,
    Skeleton.requires_passive; Lord of the Wilds' off hand takes no unique, gear.py SlotSpec.non_unique).
  sources: ["vendor/PathOfBuilding-PoE2/src/Modules/ModParser.lua (you can equip a focus / a non-unique sceptre)",
            "vendor/PathOfBuilding-PoE2/src/Classes/ItemsTab.lua (IsItemValidForSlot)"]
  test_in_game: "n/a (parse check)."
  status: proposed

- id: parse-conquered-also-grant
  title: 'Timeless jewels'' "Conquered Small Passive Skills also grant X": X goes through the normal parser'
  kind: parse_checked
  match: '^Conquered Small Passive Skills also grant (Minions deal |)\(?[\d.\-]+\)?% increased (Attack |Spell |)damage$'
  confidence: datamined
  notes: >-
    ModParser.lua "conquered (%w+) Passive Skills also grant (.*)$" returns a JewelFunc that parses X with parseMod on
    each conquered node of that type, so X keeps its own Attack / Spell flag or minion wrapper. The audit sees only the
    JewelFunc, not the inner modifier.
  sources: ["vendor/PathOfBuilding-PoE2/src/Modules/ModParser.lua (conquered ... Passive Skills also grant)"]
  test_in_game: "n/a (parse check)."
  status: proposed

