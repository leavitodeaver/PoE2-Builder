# Passive tree lines, second batch (COV-B lane, COVB2, 12 Nov 2026; PoB bb52d6b, game files build 26476662).
# The open tree lines left after batch 1, by the audit's score, overcounts first. Most of what is still open needs a
# model (routed in COVB2's report); these are the lines settled with evidence:
#   - pob_gap with replace: a translation into lines PoB calculates;
#   - pob_gap with an empty replace: "no effect on what the optimizer calculates" (boss DPS and the checked numbers:
#     Life / Energy Shield / Mana / Ward pools, maximum hit taken, resistances, block, evade, spare Spirit, and the
#     optional recovery against the boss: builder/request/schema.py Floors). Each says why, with what was checked.
# Recheck every one at the 1.0 refresh (11 Dec 2026) and at each PoB update.

# Translations -------------------------------------------------------------------------------------------------------

- id: passives-spirit-reservation-negative
  title: Self Sacrificing, "-20% increased Spirit Reservation Efficiency" (PoB drops the negative; an overcount of Spirit)
  kind: pob_gap
  match: '^-(\d+)% increased Spirit Reservation Efficiency$'
  replace: ['{1}% reduced Spirit Reservation Efficiency']
  confidence: datamined
  notes: >-
    The Oracle notable Self Sacrificing (oracle_self_sacrificing5_) holds base_spirit_reservation_efficiency_+% -20 and
    reservation_efficiency_+%_of_minion_skills 40 (game files PassiveSkills / Stats). The 0.5 tree prints the first as
    "-20% increased Spirit Reservation Efficiency" (the 0.4 tree printed "20% reduced Spirit Reservation Efficiency of
    Skills"). PoB's ModCache parses the printed line as BASE -20 with " increased " left over, and PassiveTree.lua
    applies no line with leftover text, so the -20% was dropped: every Oracle build taking the notable reserved less
    Spirit than in game (spare Spirit and the auras / persistent skills that fit were overcounted). "N% reduced" is
    the same INC modifier PoB parses for "N% increased Spirit Reservation Efficiency" (ModCache, e.g. 20% increased ->
    SpiritReservationEfficiency INC 20; ModParser form "spirit reservation efficiency"), read by CalcDefence.lua.
  sources: ["data/game-26476662 PassiveSkills oracle_self_sacrificing5_ (Stat1Value -20: base_spirit_reservation_efficiency_+%)",
            "vendor/PathOfBuilding-PoE2/src/TreeData/0_5/tree.lua and 0_4/tree.lua (Self Sacrificing's text)",
            "vendor/PathOfBuilding-PoE2/src/Data/ModCache.lua (-20% increased ... leftover text; N% increased -> INC N)"]
  test_in_game: "As an Oracle, note an aura's Spirit reservation, allocate Self Sacrificing: the reservation rises by 25% (1/0.8)."
  status: proposed

