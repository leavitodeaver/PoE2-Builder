- id: passives-no-effect-knockback-on-you
  title: Less Knockback distance for Hits you Block (knockback on you)
  kind: pob_gap
  match: '^\d+% less Knockback Distance for Blocked Hits$'
  replace: []
  confidence: datamined
  notes: >-
    How far a Blocked hit pushes you. The tool's boss fight places you by a chosen distance (conditions.natural_distance)
    and reads no knockback on you; no checked number reads it. (Knockback you inflict is NOT recorded here: Tempest
    Bell's shockwave area grows with knockback, poe2db Knockback, so those lines stay open.)
  sources: ["KeywordPopups Knockback", "builder/request/schema.py Floors (the checked numbers)", "https://poe2db.tw/us/Knockback"]
  test_in_game: "Not needed."
  status: proposed

- id: passives-no-effect-deflected-ailments-on-you
  title: Staunch Deflection, Deflected Hits cannot Maim you or make you Bleed
  kind: pob_gap
  match: '^Deflected Hits cannot inflict (Maim|Bleeding) on you$'
  replace: []
  confidence: datamined
  notes: >-
    Ailments and Maim the boss inflicts on you aren't modelled: no condition in builder/search/conditions.py sets you
    Bleeding or Maimed from the boss's hits ("Armour while Bleeding" is a never-on line in the audit: nothing switches
    PoB's Condition:Bleeding on), and no checked number reads them. Only Deflected hits are named, so the line can't
    touch a self-inflicted ailment either. Recheck when the boss's ailments on you are modelled.
  sources: ["builder/search/conditions.py (no setter for your Bleeding / Maimed)", "coverage audit: never-on Condition:Bleeding"]
  test_in_game: "Not needed."
  status: proposed

- id: passives-no-effect-stun-on-you
  title: Your Heavy Stun buildup emptying faster, Light Stun immunity after a Stun (being stunned is not modelled)
  kind: pob_gap
  match: >-
    ^(Your Heavy Stun buildup empties \d+% faster( if you've successfully Parried Recently)?|You cannot be Light Stunned if you've been Stunned Recently|\d+% increased Stun Threshold during Empowered Attacks)$
  replace: []
  confidence: datamined
  notes: >-
    Whether the boss stuns you isn't calculated: the player's Stun Threshold isn't a checked number (Floors; the
    approved no-effect-parry entry says the same for the threshold while parrying), builder/search/models.py reads
    Stun thresholds only for the boss (heavy_stun_rate), and every "if you have been (Heavy) Stunned Recently" line is
    never-on in the audit. Recheck when a model of the boss stunning you lands: the "when Stunned" lines (Quick
    Recovery's regeneration, Volatility when Stunned, Last Stand) would need these to set its rate.
  sources: ["builder/request/schema.py Floors", "builder/search/models.py (heavy_stun_rate: the boss's threshold)",
            "ledger/entries/pob-gaps-no-effect.yaml no-effect-parry", "coverage audit: never-on Condition:StunnedRecently"]
  test_in_game: "Not needed."
  status: proposed

