# Eonyr's Thunder's explosion can't Electrocute: no number moves (MECH105's check, 24 Nov).
- id: gem-cov57-voltaic-fulmination-cannot-electrocute
  title: "Voltaic Fulmination can't Electrocute: nothing of ours gives it Electrocute buildup"
  kind: gem_stat
  match: '^cannot_electrocute$'
  replace: []
  skill: [Voltaic Fulmination]
  confidence: datamined
  notes: >-
    The flag is on Eonyr's Thunder's triggered explosion (TriggeredLightningDetonateDeadPlayer). PoB has no SkillStatMap
    entry for it, and no number of ours needs one: PoB rates the explosion at Speed 0 (GEM26), its damage is added by
    models.voltaic_fulmination_model as damage only, and the explosion sits in the main skill's group, which
    buildup_others skips, so no Electrocute buildup is ever read from it (checked by MECH105, 24 Nov: SkillStatMap exact
    key; builder/ for readers). The support's own never_shock is mapped (CannotShock).
  sources: ["vendor/PathOfBuilding-PoE2/src/Data/Skills/sup_dex.lua (TriggeredLightningDetonateDeadPlayer)",
            "ledger/entries/gems-gem26.yaml", "MECH105.report.md (b)"]
  status: proposed
