- id: model-read-cov57-charge-regulation-tick
  title: "Charge Regulation's tick (one of each Charge every N s) read by conditions' charge resolver (MECHC58)"
  kind: model
  model: charge_regulation
  stats: ["consume_frenzy_power_and_endurance_charge_every_x_ms"]
  skill: [Charge Regulation]
  confidence: MEDIUM
  notes: >-
    conditions.REGULATION_EVERY_STAT read from the gem's levelStats (10 s, +120 ms a quality %): the tick joins each
    kind's consumers at 1 / interval, and charge_held_share works out the share of the fight each bonus is up
    (Assumptions.regulation_mods). A link only.
  sources: ["builder/search/conditions.py (REGULATION, REGULATION_EVERY_STAT, charge_held_share)"]
  status: proposed

