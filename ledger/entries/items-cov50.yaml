# MECH88: Dark Staff's granted Dark Pact. Assumptions.unbuilt_grants reads the build's "Grants Skill:" lines
# (GRANTED_SKILL) and, for Dark Pact / Abyssal Pact (models.PACTS), the line's level (models.PACT_LEVEL) into
# models.pact_model: one cast's unscaled damage against the main skill's damage in the cast's 0.7 s, 0 unless it pays.
- id: model-read-cov50-dark-pact
  title: 'Dark Staff, "Grants Skill: Level N Dark Pact" (Assumptions.unbuilt_grants, models.pact_model, MECH88)'
  kind: pob_gap
  model: pacts
  match: '^Grants Skill: Level (\(\d+-\d+\)|\d+) Dark Pact$'
  replace: []
  confidence: theory
  notes: >-
    PoB has no skill for Dark Pact (no DarkPact in its Skills data; MECH88's check), so it builds nothing from the line.
    models.pact_model reads the line's level: 13% of the largest minion's Life (or, with none, your own Life, 100% more)
    plus the level's base Chaos, UNSCALED, against the main skill's damage in 0.7 s: counted only as rows, 0 in the
    headline unless a cast beats it (named an UNDERCOUNT then: its press isn't modelled).
  sources: ["builder/search/assumptions.py (unbuilt_grants)", "builder/search/models.py (PACTS, PACT_LEVEL, pact_model)"]
  status: proposed

