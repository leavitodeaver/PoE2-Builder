# MECHC48's routing (21:20): Way of the Stonefist's form of The Master's Reach's recoup line gets the Open Weakness
# stand-in items-recoup-life-open-weakness gives the plain line (COV33), for both pools. One game stat for both,
# recoup_%_of_damage_taken_from_enemies_with_open_weakness_as_life_and_energy_shield (Stats 27176, game 26650308;
# mod HandWrapsUniqueRecoupLifeEnergyShieldOpenWeakness1). PoB part-parses it (ModCache 4872: DamageTaken BASE with the
# leftover " from enemies with an Open Weakness Recouped as Life and Energy Shield"), so it applies nothing.
- id: items-cov50-recoup-life-es-open-weakness
  title: Way of the Stonefist's The Master's Reach, N% of damage taken from enemies with an Open Weakness Recouped as Life and Energy Shield, at the boss's Open Weakness share
  kind: pob_gap
  match: '^(\d+)% of damage taken from enemies with an Open Weakness Recouped as Life and Energy Shield$'
  replace: ['share:OpenWeakness {1}% of Damage taken Recouped as Life', 'share:OpenWeakness {1}% of Damage taken Recouped as Energy Shield']
  confidence: theory
  notes: >-
    As items-recoup-life-open-weakness: PoB's LifeRecoup and EnergyShieldRecoup (ModParser 441 / 448) at OpenWeakness's
    share (conditions.open_weakness_up: the boss has an Open Weakness for MECH-A's share of the fight's time). Applied
    through stonefist.ledger_corrected on the transformed unique's text. Each pool gets the full N% (PoB's
    own reading of its "Recouped as Life, Mana and Energy Shield" lines, ModCache 2458, gives each pool the full value).
    COV51: RESEARCH39 R39-8 (MEDIUM, research/recoup-life-and-es-each-full-r39.md) settles the headline as the full N%
    each (KeywordPopups Recoup recovers "the stated resource equal to a percentage of the damage you took", per resource;
    the 55-65% form converts a Life-only 80-100% line, so a split would leave about a third of the Life); the split
    reading (N/2 each) is a LOW row, Assumptions.stonefist_recoup_split_rows. PoB parses nothing of the line, so these
    stand-ins are its only reader.
  sources: ["vendor/PathOfBuilding-PoE2/src/Data/ModCache.lua:4872", "vendor/PathOfBuilding-PoE2/src/Modules/ModParser.lua:441-448", "data/game-26650308/tables/Stats.json (27176)"]
  test_in_game: "Wear The Master's Reach under Way of the Stonefist against a boss and compare Life and Energy Shield recouped from its hits inside and outside the highlighted segments."
  status: proposed
