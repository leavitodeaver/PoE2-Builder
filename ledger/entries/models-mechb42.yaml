  confidence: theory
  notes: >-
    arctic_howl.csd: "[Buff] grants [Allies] {0} to {1} added [Cold] damage to [Attack|Attacks]" (37 to 56 at level 20),
    "[Buff] duration is {0} seconds" (base_skill_effect_duration 8 s); the skill: "If an enemy is Frozen or a Frozen enemy
    is Hit, this Skill ... grants your Allies added Cold damage". KeywordPopups Allies: minions and other players, "You do
    not count as your own Ally". PoB maps neither stat (checked: both ids appear in vendor PoB src only in
    Data/Skills/act_str.lua's stat list and the arctic_howl stat description file), so minion builds with the Howl scored
