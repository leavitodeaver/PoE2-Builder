- id: model-mechb42-arctic-howl-ally-buff
  title: "Arctic Howl's buff: added Cold to Allies' (your minions') Attacks while the boss is Frozen (models.arctic_howl_buff)"
  kind: model
  model: arctic_howl_buff
  stats: ["wolf_warcry_buff_cold_damage_min_per_5_power_up_to_cap",
          "wolf_warcry_buff_cold_damage_max_per_5_power_up_to_cap"]
  skill: ["Arctic Howl"]
  confidence: theory
  notes: >-
    arctic_howl.csd: "[Buff] grants [Allies] {0} to {1} added [Cold] damage to [Attack|Attacks]" (37 to 56 at level 20),
    "[Buff] duration is {0} seconds" (base_skill_effect_duration 8 s); the skill: "If an enemy is Frozen or a Frozen enemy
    is Hit, this Skill ... grants your Allies added Cold damage". KeywordPopups Allies: minions and other players, "You do
    not count as your own Ally". PoB maps neither stat (checked: both ids appear in vendor PoB src only in
    Data/Skills/act_str.lua's stat list and the arctic_howl stat description file), so minion builds with the Howl scored
    0 of it (an UNDERCOUNT). Now "Minions' Attacks deal 37 to 56 additional Cold Damage" x min(1, the Howl's uses/s x its
    buff Duration, PoB's useRates) x the share of the fight the boss is Frozen (LOW lower reading, as its Empowers). The
    stat id says "per 5 Power up to cap", the text a flat range: the text taken (lower), UNVERIFIED (RESEARCH, with
    model-mechb41-arctic-howl-empowered-cold's question). Not counted: the quality's Allies' Freeze buildup; the
    Endurance-Charge cooldown bypass.
  sources: [builder/search/models.py (ARCTIC_HOWL_BUFF, arctic_howl_buff),
            builder/search/assumptions.py (the Howl buff call beside arctic_howl_cold)]
  test_in_game: "RESEARCH: is the buff's added Cold per 5 Power (x4 at 20 Power) or the flat range shown?"
  status: proposed

- id: model-mechb42-living-lightning-zaps
