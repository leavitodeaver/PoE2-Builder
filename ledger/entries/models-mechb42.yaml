- id: model-mechb42-living-lightning-zaps
  title: "Living Lightning: 3 Zaps a minion, one minion per Lightning hit of the supported skill (models.living_lightning_model)"
  kind: model
  model: living_lightning_model
  stats: ["living_lightning_maximum_number_of_attacks", "living_lightning_beam_attack_time_ms",
          "chance_to_trigger_living_lightning_on_lightning_damage_%", "base_number_of_living_lightning_allowed"]
  skill: ["Living Lightning", "Living Lightning II"]
  confidence: theory
  notes: >-
    An OVERCOUNT where its group is in Full DPS (probe POE2T4627: Lightning Arrow 61 DPS, PoB's Living Lightning entry
    304). The game (triggered_living_lightning.csd): Triggered on dealing Lightning damage with the supported skill, a
    0.2 s cooldown, "Limit 5 Minions" (II: 8), "Minions Attack every 0.14 seconds", "Minions disperse after 3 Attacks".
    PoB scores a minion attacking all fight. Now: R = min(the supported skill's hits a second, 1 / the trigger's
    cooldown, the limit / (3 x 0.14 s)), 0 without a Lightning hit; DPS = R x 3 x one Zap's damage (PoB's minion
    AverageDamage, bridge minionSkillHit), an added damage source; PoB's own entry scaled to 0 (Objective.entry_scales).
    MEDIUM: one hit on the boss a use of the supported skill (lower for a skill hitting it more often).
  sources: [builder/search/models.py (LIVING_LIGHTNING, LL_*, living_lightning_model),
            builder/search/assumptions.py (living_lightning; its hook after Riven Armour)]
  status: proposed

