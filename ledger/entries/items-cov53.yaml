# COV53 (23 Nov 2026): gem stats a model on main reads by its own stat id (COV43's rule: marked only where the model's own
# code reads the stat from the skill's level / support stats and the result reaches a number; a stat named only in a
# comment, counted 0, or used only to detect another mechanic stays open). Checked against origin/main 4c545564 (train
# 129). Each entry adds nothing to PoB: it says which model reads the stat (a link only, no second count).
#
# Left open on purpose (each grepped): base_is_projectile (bridge.lua sets it on a granted skill's definition, no reader);
# number_of_branching_fissures (fissure_count_model reads it only to say the branches are 0 at the boss, LOW: counted 0);
# daze_on_hit_vs_enemies_at_full_life (conditions' Daze model lists Opening Move at 0, "only the fight's opening hit");
# pillar_of_flame_consume_ignite_to_create_X_pillars (conditions.CONSUME_STATS uses it to see the Ignite consumed; the
# pillars themselves aren't counted, and Flame Pillar is "never obtainable", context.py) and
# support_active_skill_consume_enemy_freeze_to_apply_chill (Biting Frost II: the consumption is read, the Chill it applies
# isn't, by that id).

- id: model-read-cov53-flame-breath-free-window
  title: "channelled_skill_suppress_ongoing_rage_cost_for_first_X_ms (Rampage) read by conditions' Rage model (FLAME_BREATH_FREE_STAT)"
  kind: model
  model: rage
  stats: ["channelled_skill_suppress_ongoing_rage_cost_for_first_X_ms"]
  skill: [Rampage]
  confidence: theory
  notes: >-
    conditions.FLAME_BREATH_FREE_STAT, read from the skill's levelStats in conditions (~10134) and assumptions (~4627):
    the channel's Rage-free window (4 s + quality), in which the skill can't gain Rage. A link only.
  sources: ["builder/search/conditions.py (FLAME_BREATH_FREE_STAT)", "builder/search/assumptions.py (~4627)"]
  status: proposed

