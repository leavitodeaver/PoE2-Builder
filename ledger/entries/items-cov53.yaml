# MECHB50 (on main since train 109): models.KILLS_DESTROYED, read over the build's lines in assumptions (~3405) into
# stats["_kills_destroyed"], which models.add_corpse_rate turns into 0 corpses from the adds the build kills.
- id: model-read-cov53-kills-destroyed
  title: 'The rare gloves line "Enemies killed by your Hits are destroyed" (models.KILLS_DESTROYED -> add_corpse_rate)'
  kind: pob_gap
  model: corpses
  match: '^Enemies killed by your Hits are destroyed$'
  replace: []
  confidence: theory
  notes: >-
    models.KILLS_DESTROYED (MECHB50, an OVERCOUNT before: PoB leaves the line unparsed, ModCache 7326): a destroyed enemy
    leaves no corpse, so the adds the build kills give none (all its add kills taken as by Hits, UNVERIFIED share,
    labelled there); the explosion's own damage to the boss isn't counted (an undercount, labelled). This entry only
    says a model reads the line.
  sources: ["builder/search/models.py (KILLS_DESTROYED, add_corpse_rate)", "builder/search/assumptions.py (~3405)"]
  status: proposed
