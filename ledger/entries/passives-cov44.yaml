# COV44 (18 Nov 2026): passive lines another part of the code already does (the passives-cov43.yaml precedent).

- id: no-effect-necromantic-talisman-amulet-to-minions
  title: 'Necromantic Talisman, "All bonuses from Equipped Amulet apply to your Minions instead of you": PoB does it by the node'
  kind: pob_gap
  match: '^All bonuses from Equipped Amulet apply to your Minions instead of you$'
  replace: []
  confidence: theory
  notes: >-
    PoB parses the line to nothing (ModCache 5611) but does the keystone by its node: with node 39935 allocated the
    Amulet's mods go to env.talismanModList, not the player (CalcSetup 1549), the minions get them (CalcPerform 1101) and
    the Amulet leaves the player's item list (CalcPerform 1233). Probe POE2T3907: Life 1323 under the Talisman with or
    without a "+50 to maximum Life" Amulet (1239 vs 1187 without it). COV44 made bridge.sourceLines follow the same test,
    so our models don't read the Amulet's lines as the player's either. A Talisman an item grants (Flesh Crucible's
    keystone variant / Vaal Cultivation outcome) isn't node 39935, and PoB kept the Amulet on the player there (probe
    POE2T3918); the bridge's initEnv wrapper now puts the node in spec.allocNodes for that call (grantedTalismanNode),
    so PoB's own code moves the Amulet then too.
  sources: ["vendor PoB Modules/CalcSetup.lua 1549-1555, CalcPerform.lua 1100-1103 / 1230-1233", "engine/bridge.lua (sourceLines' toMinions)"]
  status: proposed

- id: model-read-heavy-drinker-guard
  title: 'Heavy Drinker, "Life Flasks applied to you grant Guard for N seconds equal to N% of the Life Recovery per Second they apply" (recovery.event_guard, MECHC40)'
  kind: pob_gap
  model: guard
  match: '^Life Flasks applied to you grant Guard for \d+(?:\.\d+)? seconds equal to \d+(?:\.\d+)?% of the Life Recovery per Second they apply$'
  replace: []
  confidence: theory
  notes: >-
    MECHC40's a792074c (train 89): recovery.DRINKER_GUARD, the Life flask's recovery over its duration at its uses
    (flasks.uses_per_second), into event_guard (up all fight: PoB's Guard pool; else a row).
  sources: ["builder/search/recovery.py (DRINKER_GUARD, event_guard)"]
  status: proposed

- id: model-read-train91-passive-lines
  title: '"... against Enemies that have exited / entered your Presence Recently" (conditions.PRESENCE_RECENTLY, MECH90) and Intricate Sigils'' "N% more Charm Charges gained" (flasks.CHARM_GAIN_MORE, MECHC41)'
  kind: pob_gap
  model: conditions
  match: '^(.+ against Enemies that have (exited|entered) your Presence Recently|\d+(?:\.\d+)?% (more|less) Charm Charges gained)$'
  replace: []
  confidence: theory
  notes: >-
    Train 91. MECH90's dfce1d5d (conditions.presence_recently_mods): each line handed to PoB without its condition at
    1 - e^(-4 r), r the boss's re-entries into your Presence a second (models.presence_reentries) (Decisive Retreat; the
    entered-Presence crit line). MECHC41's 4a5e635b: "N% more Charm Charges gained" multiplies the charms' charge gain
    (flasks.CHARM_GAIN_MORE, charm_gain_more; PoB parses it, CharmChargesGained MORE, and no calculation reads it): the
    MECH-C item COV44 routed. A passive translation adds lines, it never removes PoB's own.
  sources: ["builder/search/conditions.py (PRESENCE_RECENTLY, presence_recently_mods)", "builder/search/flasks.py (CHARM_GAIN_MORE)"]
  status: proposed
