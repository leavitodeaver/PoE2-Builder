  match: '^Projectiles Pierce enemies with Fully Broken Armour$'
  replace: []
  confidence: theory
  notes: >-
    Passthrough Rounds (COV40's route). PoB parses PierceCount +1 under the player's Condition ArmourFullyBroken, which
    nothing sets (PoB sets only the enemy's): it never applies. On a lone boss a pierce adds a hit only through a return:
