- id: model-gem20-gas-arrow-ignite-explosion
  title: "Gas Arrow: a cloud explodes only if the boss is Ignited while it lasts or a Detonator hits it (PoB scored the Explosion on every arrow)"
  kind: model
  model: gas_arrow
  stats: []
  skill: [Gas Arrow]
  confidence: MEDIUM
  notes: >-
    models.gas_arrow_model + Assumptions.gas_arrow_share (GEM20). Game (26650308): ActiveSkills gas_arrow "The cloud
    will detonate if hit by a [Detonator] skill or if an [Ignite|Ignited] enemy touches it, creating a fiery explosion";
    GasArrowGasDegenPlayer 4 s, number_of_poison_cloud_allowed 6, display_statset_no_hit_damage;
    GasArrowGasExplosionPlayer 100% Physical to Fire. RESEARCH30 R30-2 (a): an Ignited boss sets off each cloud at once;
    waiting clouds go at the next Ignite (HIGH rule, MEDIUM self-feeding). PoB scores each set alone: probe POE2T3441
    kept "Explosion" 162.4 vs Arrow 38.0 / Poison Cloud 88.6 (a fake hit in PoB; the cloud's damage is its Poison) at
    every use (an OVERCOUNT). Share of clouds that explode = 1 - (1 - Detonated) x (1 - P), P = 1 - (1 - u)^((d + w) /
    d): the boss Ignited at some moment of the cloud's life w (4 s, less when the 6-cloud limit replaces the oldest), u
    the Ignited share from conditions.ailment_uptime over the resolver's other Ignites and grounds plus the main skill's
    own (the explosions' at uses x share: a fixed point from 0). Hits = Arrow + Explosion x share (a DPS line, the
    scored set's ailments stay); with no Ignite and no Detonator the Explosion set gets the Arrow x 0.9 (a Damage line).
    The Explosion's own Ignite stays whole where it is scored (a small OVERCOUNT where clouds don't all explode); an
    exploded cloud's Poison: RESEARCH30 R30-5 (3): the cloud Poisons the boss once every 2 s while it lives (LOW-MEDIUM;
    attack speed doesn't change it), 2-3 a full cloud (taken as life / 2 s + 0.5), and the explosion destroys it
    (MEDIUM); a cloud's average life from the Ignite / Detonator rate above; PoB's one Poison a use scaled by that
    (AilmentMagnitude MORE) where the Poison Cloud set is scored; elsewhere the cloud's Poison isn't in the scored set
    (an UNDERCOUNT, named).
  sources: ["builder/search/models.py (gas_arrow_model)", "builder/search/assumptions.py (gas_arrow_share)",
            "data/game-26650308/tables/ActiveSkills.json (gas_arrow)",
            "data/game-26650308/tables/GrantedEffectStatSets.json (GasArrowPlayer, GasArrowGasDegenPlayer, GasArrowGasExplosionPlayer)",
            "scratch/manager/research/gem19-skill-questions.md (R30-2 a)", "scratch/gem20/probe_gas.json", "scratch/gem20/probe_gas2.json"]
  test_in_game: "Optional: Gas Arrow on a boss nothing Ignites: the clouds never explode."
  status: proposed

- id: model-gem20-frozen-locus-crystal-breaks
