  kind: model
  model: frozen_locus
  stats: []
  skill: [Frozen Locus]
  confidence: MEDIUM-LOW
  notes: >-
    models.frozen_locus_model + Assumptions.locus_breaks (GEM20). Game (26650308): ActiveSkills frozen_locus "call
    forth an Ice Crystal which can be damaged by you and enemies. If the Crystal is destroyed it causes an icy
    explosion"; FrozenLocusPlayer 10 s, limit 1, no cooldown; frost_wall_maximum_life 9,536 and +832% damage taken from
    enemies at gem 20; KeywordPopups IceCrystals "Skills which Consume Freeze will instantly shatter Ice Crystals". PoB
    scores the Explosion at every cast: probe POE2T3441 254.3 at 0.98 casts a second (an OVERCOUNT). Breakers (RESEARCH30
    R30-2 (b); checked every GrantedEffectStatSets row for destroy_frost_wall_segment_on_hit and
    support_warcries_explode_ice_crystals): Freeze consumers (conditions.side_consumes), Fragmentation Rounds, Glacial
    Cascade, Gelid Palm, Embrace The Fall, Warcries supported by Vruun's Aftermath, each at its triggered rate or the
    search's press choice. The boss's damaging uses are a LOW row, not the headline (RESEARCH30 R30-5 (1), the manager
    01:50: enemies can damage it, HIGH, but nothing aims at it: no collision since 0.4.0, not a MonsterVarieties row, no
    stat or report; a boss area hit covering it may break it, MEDIUM-LOW). Nothing in the build breaks it: held at 1%.
    Explosions a second = q / (cast + q / R), q = 1 - e^(-10 R). Expiry and recast not counted (UNVERIFIED); the
    player's ordinary hits on the crystal's Life not counted (an UNDERCOUNT, named). Frozen Locus as the main skill only.
  sources: ["builder/search/models.py (frozen_locus_model)", "builder/search/assumptions.py (locus_breaks)",
            "data/game-26650308/tables/ActiveSkills.json (frozen_locus)", "data/game-26650308/tables/KeywordPopups.json (IceCrystals)",
            "scratch/manager/research/gem19-skill-questions.md (R30-2 b)", "scratch/gem20/probe_gas.json", "scratch/gem20/probe_gas2.json"]
  test_in_game: "Optional: Frozen Locus beside a boss with nothing breaking it: how long until the boss's hits break it."
  status: proposed

- id: model-gem20-magnetic-salvo-lingering-arrows
  title: "Magnetic Salvo: a missile explodes only by a lingering Lightning arrow, destroying it (PoB scored every missile exploding)"
  kind: model
  model: magnetic_salvo
  stats: []
  skill: [Magnetic Salvo]
  confidence: MEDIUM
  notes: >-
    models.magnetic_salvo_model + Assumptions.lingering_arrows (GEM20). Game (26650308): ActiveSkills magnetic_salvo
    "The missiles explode if they land close to a lingering bolt or arrow, dealing more damage in a larger area but
    destroying that bolt or arrow in the process"; MagneticSalvoPlayer 8 projectiles. PoB scores each set alone: probe
    POE2T3441 kept "Explosion" 82.6 vs Impact 42.5 (an OVERCOUNT). The arrows (RESEARCH30 R30-2 (c); no stat names them:
    checked magnetic_salvo stat descriptions and every stat holding "lingering" / "magnetic"): Lightning Rod (HIGH) and
    Shockchain Arrow's Lightning Rod (MEDIUM), one a use, counted; Stormcaller Arrow (1) and Stormblast Bolts (3 a shot)
    MEDIUM-LOW, a row in the note. Share of missiles exploding e = min(1, arrows a second / (uses x ProjectileCount));
    DPS = Impact x (1 - e) + Explosion x e. No arrows: the Explosion set gets the Impact x 0.9 (a Damage line). Extra
    arrows a use from more projectiles not read (an UNDERCOUNT).
  sources: ["builder/search/models.py (magnetic_salvo_model)", "builder/search/assumptions.py (lingering_arrows)",
            "data/game-26650308/tables/ActiveSkills.json (magnetic_salvo, lightning_rod, shockchain_arrow, stormcaller_arrow)",
