  status: proposed

- id: model-read-guard-gained
  title: '"N% increased / reduced Guard gained" (recovery._guard_inc, every modelled Guard source)'
  kind: pob_gap
  model: guard
  match: '^\d+(?:\.\d+)?% (increased|reduced) Guard gained$'
  replace: []
  confidence: theory
  notes: >-
    recovery.GUARD_GAINED / _guard_inc scale every Guard the models give: Mana Flask and charm Guard, sprint Guard, and
    since MECHC40's a792074c (train 89) event_guard's Fortifying Cry, Vanguard, Savage Hit, Heavy Drinker and Warding
    Rune sources; up all fight, the Guard goes in PoB's Guard pool (full_guard_mods), else a row. COV43 left the line open
    because PoB's own Guard skills weren't scaled: PoB sets no Guard at all (checked: GuardAbsorbLimit, the pool PoB's
    CalcDefence 3045 / 3063 reads, has no setter in PoB's Data/ or ModParser; the two Guard-type skills, Encase in Jade
    and Nature's Exchange, map none). Not scaled: Encase in Jade's Guard (a play row only, MECHC37) and the item Guard
    lines no model reads yet (Duality's per Combo, Olroth's Resolve's, Decree of Flight's).
  sources: ["builder/search/recovery.py (GUARD_GAINED, _guard_inc, event_guard, mana_flask_guard)"]
  status: proposed

- id: model-read-event-guard
  title: 'Carved Mischief''s Savage Hit Guard and Warding Rune of Protection''s timed Guard (recovery.event_guard, MECHC40)'
  kind: pob_gap
  model: guard
  match: '^(Gain Guard equal to \d+(?:\.\d+)?% of maximum Life for \d+(?:\.\d+)? seconds on taking Savage Hit|Every \d+(?:\.\d+)? seconds, gain Guard equal to \d+(?:\.\d+)?% of maximum Runic Ward for \d+(?:\.\d+)? seconds)$'
  replace: []
  confidence: theory
  notes: >-
    MECHC40's a792074c (train 89): recovery.SAVAGE_GUARD (the boss's landed hits whose type reaches 15% of Life after
    mitigation, KeywordPopups SavageHit) and WARD_TIMER_GUARD (PoB's Runic Ward, every N s for D s) feed event_guard: Guard
    up all fight goes in PoB's Guard pool (full_guard_mods, the manager's 18 Nov ruling (ii)), part-time Guard is a row
    (ruling (b)), as COV43's model-read-guard-sources (Mana Flask, charms).
  sources: ["builder/search/recovery.py (SAVAGE_GUARD, WARD_TIMER_GUARD, event_guard)"]
  status: proposed
