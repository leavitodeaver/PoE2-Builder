# MECHC46 (6775842d): Nebuloch's crit line. conditions.NEBULOCH_CRIT (an exact match on the line) makes every enabled
# Attack gem an Endurance Charge consumer and sets the main Attack's crit chance to the share of its uses that find a
# charge (assumptions NEBULOCH_TAG, a CritChance OVERRIDE blend). PoB leaves the line unparsed (ModCache 6636 maps it to
# nil), so no negation.
- id: model-read-mechc46-nebuloch
  title: 'Nebuloch, "Attacks consume an Endurance Charge to Critically Hit" (conditions.NEBULOCH_CRIT, MECHC46)'
  kind: pob_gap
  model: nebuloch
  match: '^Attacks consume an Endurance Charge to Critically Hit$'
  replace: []
  confidence: theory
  notes: >-
    conditions.NEBULOCH_CRIT (MECHC46, train 104): the build's Attacks spend an Endurance Charge a use when they have
    one (the charge flow's consumers), and the main Attack's uses that find one Critically Hit: PoB's CritChance is
    overridden to f x 100 + (1 - f) x its own chance (MEDIUM, the charge flow). Not read (labelled there): side Attacks'
    crits (an undercount). PoB parses nothing of the line (ModCache 6636: nil), so nothing to negate.
  sources: ["builder/search/conditions.py (NEBULOCH_CRIT)", "builder/search/assumptions.py (NEBULOCH_TAG)"]
  status: proposed

