# The radius damage transforms (the brief's job 3; the manager's ruling: COV-A's item, jewels.py lent): engine/bridge.lua
# applyRadiusTransforms (the note above it). Each mod is two lines on the item ("Increases and Reductions to" and the
# rest); the first is matched alone only because no other carrier has it (checked: the audit's own sources for that
# text are the three JewelRadiusInc*To* mods; PoB's Data: only ModJewel.lua 360-362).
- id: model-read-cov49-radius-damage-transform
  title: '"Increases and Reductions to <A> and <B> Damage in Radius are transformed to apply to <C> Damage" (Time-Lost jewels; bridge applyRadiusTransforms, COV49)'
  kind: pob_gap
  model: radius_transform
  match: '^(?:Increases and Reductions to(?:\s+(?:Cold|Fire|Lightning) and (?:Cold|Fire|Lightning) Damage in Radius are transformed to apply to (?:Cold|Fire|Lightning) Damage)?|\s*(?:Cold|Fire|Lightning) and (?:Cold|Fire|Lightning) Damage in Radius are transformed to apply to (?:Cold|Fire|Lightning) Damage)$'
  replace: []
  confidence: theory
  notes: >-
    Game 26650308 Mods JewelRadiusIncColdFreToLightning / IncLightningColdToFire / IncLightningFireToCold (stats
    local_jewel_transform_damage_increases_from_cold_fire_to_lightning / cold_lightning_to_fire / fire_lightning_to_cold;
    spawn weight 0): the crafted line Ancient Concentrated Liquid Isolation (BaseItemTypes DistilledEmotionTimeLost10,
    a Delirium Liquid Emotion) adds to a Rare Time-Lost jewel, Emerald -> Lightning, Ruby -> Fire, Sapphire -> Cold
    (poe2db's Jewels and Liquid Emotions pages, current; no legacy mark). PoB parses none of it (ModCache 8322-8324)
    and runs no per-node function for Time-Lost jewels, so it counted 0. The bridge moves the passives' <A> / <B> Damage
    increases and reductions in the radius to <C> (PoB's own getSimpleConv move). UNVERIFIED readings, labelled in the
    bridge: "Elemental Damage" lines aren't moved; the Time-Lost "also grant" lines on those passives are; two
    transforms move an increase once. The search doesn't craft the line (no Liquid Emotion crafting; the rare
    generator skips spawn weight 0), so it's read on imported builds' jewels only.
  sources: ["engine/bridge.lua (applyRadiusTransforms)", "https://poe2db.tw/us/Ancient_Concentrated_Liquid_Isolation", "https://poe2db.tw/us/Jewels"]
  status: proposed

