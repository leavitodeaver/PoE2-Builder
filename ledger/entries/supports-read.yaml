# Support-gem stats PoB never reads that the tool's own code reads (COVE1, 12 Nov 2026). Kind `model` with `stats`:
# nothing is applied from here; the coverage audit counts the listed stats of the listed supports (`skill`, the names the
# data dump gives them) as "fed to a custom model". Each entry names where the code reads the stat, and what it doesn't.
# Found by searching builder/ and engine/bridge.lua for every support stat the audit had open (scratch/cove/reads.py).
#
# Left open on purpose (read only in part, or named in a comment but not read):
# - consume_parry_debuff_on_hit_to_gain_X_frenzy_charges (Frenzied Riposte): models.PARRY_CONSUMERS reads the consume
#   (Parried is eaten by the next hit), but the Frenzy Charge it grants isn't a charge source anywhere (conditions.py).
# - support_pin_pin_duration_+%_final (Pin III): models.py names it, but nothing rates the boss Pinned yet.
# - generic_ongoing_trigger_1_maximum_energy_per_Xms_total_cast_time on Curse on Block / Cast on Melee Stun / Cast on
#   Melee Kill / Reaper's Invocation: left open by COV2 (gem-stats-energy.yaml header).
# - rage_skip_consume_chance_% (Rageforged II, 30%): conditions.py doesn't read it.

- id: supports-read-zerphi-glory
  title: Zerphi's Infamy, Glory per use built from Life spent (usage requirements)
  kind: model
  model: usage
  stats: ["active_skill_requires_X_glory", "active_skill_generates_%_of_life_spent_as_glory"]
  skill: ["Zerphi's Infamy"]
  confidence: datamined
  notes: "builder/search/usage.py requirements(): GLORY (50 Glory a use, SupportZerphisLegacyPlayer) with
    GLORY_FROM_LIFE (5% of Life spent on other skills) becomes a 'glory from life' requirement, and the use rate of the
    supported skill is worked out from the build's Life spending (usage.py, the bridge's usageRules)."
  sources: ["builder/search/usage.py GLORY, GLORY_FROM_LIFE, requirements", "engine/bridge.lua usageRules (USAGE_STAT_WORDS 'as_glory', 'require')",
            "GrantedEffectStatSets SupportZerphisLegacyPlayer (build 26476662)"]
  status: proposed

