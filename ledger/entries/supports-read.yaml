  notes: "builder/search/conditions.py CHARGE_PROFUSION: Charge Profusion II's 15% (the game files' constant), a third
    to each of Power, Frenzy and Endurance (labelled assumption there: the random pick's pool isn't in the line)."
  sources: ["builder/search/conditions.py CHARGE_PROFUSION, _extra_charges", "GrantedEffectStatSets SupportChargeProfusionPlayerTwo"]
