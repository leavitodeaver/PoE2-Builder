- id: model-gem11-salvo-random-directions
  title: "Salvo: a Seal a second (up to 6), one extra projectile per Seal broken, and every projectile fired in a random direction"
  kind: model
  model: salvo
  stats: ["skill_additional_projectiles_per_seal_broken", "base_skill_seal_gain_interval_ms",
          "base_maximum_seals_for_skill", "random_projectile_direction", "base_skill_is_sealed_skill"]
  skill: [Salvo]
  confidence: LOW
  notes: >-
    PATCH_CHECK H1-6. PoB maps none of Salvo's stats (checked: SkillStatMap.lua and Modules/*.lua for each id; its
    HasSeals bonus acts only under Unleash's / Expand's flags), so it scores the supported skill aimed, with no extra
    projectiles. models.salvo_model: Seals broken a use = min(maximum, gain / PoB's Speed); projectiles a use N = PoB's
    ProjectileCount + Seals; each flies at the boss with chance q = asin(r / d) / pi; a use hits 1 - (1 - q)^N times
    (one projectile of a group per target, KeywordPopups Projectile) against PoB's 1, or N x q against PoB's
    ProjectileCount for a shotgun / sequence skill. Mostly a LOSS PoB never charges (an OVERCOUNT for a build with
    Salvo). LOW: the boss radius 1.5 m (SALVO_BOSS_RADIUS, no boss size in the exported tables), the directions spread
    over the full turn (the game text gives no arc; UNVERIFIED). Not counted: Pierce / Chain / Fork / Return bringing
    a missed projectile back; a non-main skill with Salvo (PoB's aimed number kept, said in the note).
  sources: ["vendor/PathOfBuilding-PoE2/src/Data/Skills/sup_dex.lua (SupportSalvoPlayer)",
            "data/game-26476662/files/data/statdescriptions/gem_stat_descriptions.csd (random_projectile_direction, skill_additional_projectiles_per_seal_broken)",
            "KeywordPopups Projectile (one projectile of a group per target)",
            "patch notes 0.5.0 Support Changes (Salvo: a Seal every 1 s, max 6, one projectile per Seal)",
            "poe2db Salvo (current values match)"]
  test_in_game: "Fire a Salvo-supported Lightning Arrow at a dummy 5 m away with 6 Seals: about 1 in 2 volleys should hit it; at 2 m, most."
  status: proposed

