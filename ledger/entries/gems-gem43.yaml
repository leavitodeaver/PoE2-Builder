# GEM43 (25 Nov 2026): gem stats read by our models (GEM lane).
- id: model-gem43-shockwave-totem-eruption-melee
  title: "Shockwave Totem's Jagged Ground Eruption counted as Melee (attack_is_melee_override; PoB's set lacked the melee flag)"
  kind: model
  model: set_flag
  stats: ["attack_is_melee_override"]
  skill: [Shockwave Slam]  # (the granted skill's name, ShockwaveTotemQuakePlayer: both its sets carry the stat)
  confidence: MEDIUM
  notes: >-
    RESEARCH59 R59-3 (research/shockwave-totem-melee-limit-r59.md, MEDIUM): the game's Eruption set
    (GrantedEffectStatSets ShockwaveTotemJaggedQuakePlayer, 26650308) has no stats of its own and the flag R59-3 reads as
    "inherits the set before" (on 122 of 8,284 sets, almost all secondary hits); the Slam set before it holds
    attack_is_melee_override, and the active skill's types hold Melee. PoB's copy (ShockwaveTotemQuakePlayer set 2) lists
    the stat but gives baseFlags totem / attack / area, no melee, and PoB reads the stat nowhere (SkillStatMap.lua,
    Modules/*.lua), so "Melee Damage" lines missed the set the search scores. engine/bridge.lua (installAttackSetFlags'
    readings) adds the melee flag to that set only; setRates gives its DPS without it (TotalDPSWithoutAdded);
    models.set_flag_model notes both (the row: not melee). Probe scratch/gem43/probe_eruption.py (Warbringer level 90):
    with "100% increased Melee Damage" the Eruption 44.22 -> 92.41 DPS (without the reading 44.22, as before). The other
    carriers (Fortifying Cry's Shield Wave, Shield Charge, Stampede, Shockwave Slam's Slam set) already have PoB's melee
    flag (read, not probed: GEM41), so they stay open here. Both Shockwave Slam sets carry the stat: the Slam's melee
    is PoB's own baseFlags, the Eruption's this reading.
  sources: ["engine/bridge.lua (installAttackSetFlags, bridge.setRates)", "builder/search/models.py (set_flag_model)",
            "C:/PROJECTS/PoE2 Builder/scratch/manager/research/shockwave-totem-melee-limit-r59.md (R59-3)",
            "scratch/gem43/probe_before.log", "scratch/gem43/probe_after.log"]
  test_in_game: "Shockwave Totem with and without a Melee Damage line: does the Jagged Ground eruption's damage change?"
  status: proposed

- id: gem-gem43-melee-override-pob-flags
  title: "attack_is_melee_override on Shield Wave (Fortifying Cry), Shield Charge and Stampede: PoB's sets already carry the melee flag (probed)"
  kind: gem_stat
  match: '^attack_is_melee_override$'
  replace: []
  stats: ["attack_is_melee_override"]
  skill: [Shield Wave, Shield Charge, Stampede]
  confidence: HIGH
  notes: >-
    PoB reads the stat nowhere (SkillStatMap.lua, Modules/*.lua), but its data gives every stat set of these skills
    baseFlags melee (act_str.lua: FortifyingCryShockwavePlayer "Shield Wave"; ShieldChargePlayer "Area of Effect" /
    "Collision"; StampedePlayer "Footsteps" / "Slam" / "Explosion"), which is what the stat does: Melee modifiers apply.
    Probe scratch/gem43/probe_melee_override.py (Warbringer level 90, Shield Charge with Fortifying Cry and Stampede
    groups; mace + shield), "100% increased Melee Damage" through PoB's own parser: Shield Wave's hit 76.1 -> 237.3,
    Shield Charge's Collision 115.4 -> 343.5 DPS, Stampede's Slam 56.9 -> 173.1 DPS (scratch/gem43/probe_melee.log). So
    no Melee modifier is withheld (COV58's "withheld" row was the audit's generic "PoB never reads this stat"); nothing
    to add. Shockwave Slam's Eruption, the one set PoB left without the flag, is model-gem43-shockwave-totem-eruption-melee.
  sources: ["vendor/PathOfBuilding-PoE2/src/Data/Skills/act_str.lua", "scratch/gem43/probe_melee.log"]
  test_in_game: "Not needed: PoB's flag is the game's reading."
  status: proposed

- id: gem-gem43-second-wind-doubled-uses
  title: "support_double_number_of_cooldown_uses (Second Wind I-III): the doubled uses refill one at a time, so PoB's steady rate stands"
  kind: gem_stat
  match: '^support_double_number_of_cooldown_uses$'
  replace: []
  stats: ["support_double_number_of_cooldown_uses"]
  skill: [Second Wind I, Second Wind II, Second Wind III]
  confidence: MEDIUM
  notes: >-
    RESEARCH60 R60-13 (research/second-wind-refill-r60.md, MEDIUM): "Supported Skills have twice as many Cooldown Uses"
    (gem_stat_descriptions); the game restores one Cooldown Use at a time (poedb's cooldown notes: 3 uses on an 8 s
    cooldown back after 24 s; Mobalytics' guide; R56-5 for Kelari's Deception; patch 0.2.0's Second Wind / Demon Form
    fix: the extra use's cooldown ticks on its own). So the sustained rate is one use per (slower) cooldown, which is
    what PoB scores (it reads base_cooldown_speed_+%_final, -50 / -40, and not the doubling): no steady-state
    undercount. Not counted: the doubled starting stock, an extra use or so early in a finite fight (a small UNDERCOUNT
    on short fights, named). Second Wind III's restore_%_life_on_skill_use_per_#_ms_cooldown (recovery) stays open.
  sources: ["C:/PROJECTS/PoE2 Builder/scratch/manager/research/second-wind-refill-r60.md (R60-13)"]
  test_in_game: "Not needed (R60-13)."
  status: proposed
