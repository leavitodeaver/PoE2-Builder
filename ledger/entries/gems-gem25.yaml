- id: model-gem25-profane-decay
  title: "Decaying Hex: Profane Decay on each curse landing, up its 8 s (PoB: 0 out of Full DPS, always up in it)"
  kind: model
  model: profane_decay
  stats: ["curse_triggers_decaying_hex", "base_chaos_damage_to_deal_per_minute"]
  skill: [Decaying Hex, Profane Decay]
  confidence: MEDIUM
  notes: >-
    models.profane_decay_model + curse_landings, assumptions.support_dots (GEM25). Game 26650308: Decaying Hex's one
    stat curse_triggers_decaying_hex ("Supported Skills trigger Profane Decay on each target Cursed"); Profane Decay
    (TriggeredDecayingHexPlayer) base_chaos_damage_to_deal_per_minute (17,217 at 20), 8 s. PoB maps an old support stat
    (Intelligence-based "decay") the game's support no longer carries (checked: Stats ids holding decaying_hex / decay;
    both effects' GrantedEffectStatSets), and counts Profane Decay's DoT only with its curse group in Full DPS, as always
    up (probe POE2T3564: 286.95 in, 0 out). One Decay at PoB's DoT x min(1, the curse's landings a second x its
    duration): recast by hand once a duration (each recast re-Curses and retriggers it, refreshing the one Decay:
    RESEARCH35 R35-18, MEDIUM-LOW; row "only on a new curse"), let run out, Hexblast's cycle, a meta's rate, an
    infinite curse once a fight (LOW). Under Blasphemy: 0 (R35-20, MEDIUM-HIGH: no Profane Decay under Blasphemy, forum
    3829544 on 0.5, no fix in the patch notes; row "if GGG fixed it silently", once a fight). Two supported curses: one
    Decay, the strongest (R35-19, MEDIUM; the sum a not-counted row). Added less PoB's own always-up figure where the score reads it (the group in Full DPS and the
    objective on Full DPS: probe POE2T3565).
  sources: ["builder/search/models.py (profane_decay_model, curse_landings)", "builder/search/assumptions.py (support_dots)",
            "data/game-26650308/tables (GrantedEffects 7713 / 7714, GrantedEffectStatSets 7515 / 7516)",
            "scratch/gem25/probe_dot.json"]
  test_in_game: "Optional: does recasting a curse on a boss that still carries it trigger a new Profane Decay?"
  status: proposed

