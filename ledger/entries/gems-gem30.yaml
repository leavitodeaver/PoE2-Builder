- id: model-gem30-concoctions-not-unarmed
  title: "The five Concoctions are not Unarmed Attacks: no Unarmed modifiers, no unarmed base damage (PoB gave them both)"
  kind: model
  model: concoctions_not_unarmed
  stats: ["replace_main_hand_unarmed_attack_stats_with_nothing_type"]
  skill: [Explosive Concoction, Acidic Concoction, Bleeding Concoction, Fulminating Concoction, Shattering Concoction]
  confidence: datamined
  notes: >-
    engine/bridge.lua installConcoctionsNotUnarmed (GEM30; plans/kw-unarmed.md group A, COVC3's open item in
    gems-active-batch3.yaml). The game's text on each: "This damage is not based on your unarmed damage, so this is not
    considered an Unarmed Attack"; the stat replaces the unarmed weapon with a "nothing" one. PoB doesn't read it and
    attacks with the class's unarmed weapon and its ModFlag.Unarmed (weaponTypes None): probe
    POE2T5792, "100% increased Damage with Unarmed Attacks" doubled Explosive Concoction's hit (313 -> 626) and took
    Acidic's 97 -> 292, "Adds 100 to 100 Physical Damage to Unarmed Attacks" +30 / +71: an OVERCOUNT for any build with
    Unarmed lines. After PoB builds the skill: ModFlag.Unarmed off its weapon flags and configs, the unarmed base
    Physical cancelled (BASE minus it). The attack rate stays PoB's (1.65 x 0.85 = 1.4025 a second against the
    game's 714 ms, 1.4006: gem-active-pob-concoction-attack-time; UNVERIFIED whether the game also applies the skill's
    -15% to the 714 ms, which would be 1.19 a second). The stat's other carriers (Caltrops,
    the Heralds, Fan the Flames ...) untouched (UNVERIFIED for them). A held weapon still disables a Concoction in PoB
    (UNVERIFIED whether the game allows it: research).
  sources: ["engine/bridge.lua (installConcoctionsNotUnarmed)", "vendor/PathOfBuilding-PoE2/src/Data/Skills/other.lua (the five Concoctions)",
            "vendor/PathOfBuilding-PoE2/src/Modules/Data.lua 606, 626-636", "vendor/PathOfBuilding-PoE2/src/Modules/CalcOffence.lua 2527-2530, 4135",
            "scratch/gem30/probe5792.log (GEM30's probe)"]
  test_in_game: "Explosive Concoction with and without a hand-wraps 'increased Unarmed damage' line: the throw's damage shouldn't change."
  status: proposed

- id: model-gem30-repeat-interval-skills
  title: "Ravenous Swarm's swarms alive and Hollow Focus's bells a second at their Cooldown-Recovery-scaled repeat interval"
  kind: model
  model: repeat_interval
  stats: ["base_cooldown_modifiable_repeat_interval_ms", "cooldown_recovery_modifiers_also_apply_to_repeat_interval",
          "ravenous_swarm_maximum_swarm_count", "spectral_bells_maximum_active_bells"]
  skill: [Ravenous Swarm, Hollow Focus]
  confidence: theory
  notes: >-
    models.repeat_interval_model + its hook beside gem_stat_model (GEM30; RESEARCH39 R39-13). The interval I = base /
    Cooldown Recovery (the game's text: Cooldown Recovery "also applies to Swarm spawning / bell appearance frequency").
    Ravenous Swarm: min(3, D / I) swarms alive (1.63 at base, 2.45 at +50%) where PoB counts one (probe POE2T5793: summon
    limit 1, FullDPS 75.83 with or without +50% Cooldown Recovery): x that on the swarms' damage (an UNDERCOUNT); 0 when
    the boss is beyond the swarms' radius of you plus its own radius (an OVERCOUNT for ranged builds before). Hollow
    Focus: PoB times its shockwave by the skill's attack rate (probe POE2T5793: 1.14 a second, unchanged by Cooldown
    Recovery); the game gives one per bell your Hits destroy, at most 1 / I (0.49 a second at base): x min(1 / I, PoB's
    rate) / PoB's rate x the share reaching the boss (LOW: 1 within 3 + 2.3 m + the boss's radius, else 0; a 0.5 row):
    an OVERCOUNT before. The Swarm's ramp-up at the fight's start not counted (LOW). Other carriers of the repeat stats
    (Align Fate, Ghost Dance, Mirror of Refraction, Time of Need) are not read here (open rows).
  sources: ["builder/search/models.py (repeat_interval_model)", "C:/PROJECTS/PoE2 Builder/scratch/manager/research/ravenous-swarm-hollow-focus-rate-r39.md",
            "scratch/gem30/probe5793.log (GEM30's probe)"]
