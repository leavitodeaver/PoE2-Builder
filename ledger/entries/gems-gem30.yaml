- id: gem-gem30-valakos-arc-electrocute-threshold
  title: "Valako's Charge: its Arc doubles the Electrocute Threshold it builds against, so half the Electrocute buildup (PoB ignores it)"
  kind: gem_stat
  skill: [Valako's Charge]
  match: '^electrocute_threshold_\+%_final$'
  replace: ["1% less Electrocute Buildup"]
  factor: 0.5
  confidence: theory
  notes: >-
    The Arc set of Valako's Charge (ValakosChargeArcPlayer; PoB's "Bolt" set, act_str.lua) has the constant stat
    electrocute_threshold_+%_final 100 beside base_lightning_damage_can_electrocute and never_shock. It is the only
    user of the stat (checked: Stats ids electrocute_threshold*, 5 ids; GrantedEffectStatSets Constant / Implicit /
    Base stats, game 26650308: only ValakosChargeArcPlayer, 100 at every level; RESEARCH39 R39-15 also checked Mods and
    passives). No game text describes it (no .csd line, R39-15); KeywordPopups ElectrocuteThreshold: "Electrocute
    Threshold determines how much Electrocute buildup is needed to Electrocute a target". The Arc hits enemies, so the
    threshold is the target's against the Arc's hits: +100% final doubles it, i.e. the Arc builds Electrocute at x0.5
    (R39-15, MEDIUM: the reading by the stat id and the set's other stats). PoB has no statMap for it (checked: grep of
    SkillStatMap.lua and Modules/ for electrocute_threshold / ElectrocuteThreshold: only CalcSections' display of the
    enemy's EnemyElectrocuteThreshold, which no calculation reads), so it scored the Arc's buildup at x2 of the game's:
    an OVERCOUNT wherever the Arc's buildup Electrocutes the boss (MECH-A's buildup_rate / buildup_others read PoB's
    ElectrocuteBuildupAvg). Counted as "50% less Electrocute Buildup" on the skill (the stat's 100 x factor 0.5:
    1 / (1 + 100%) = x0.5 exactly), which PoB's buildup multiplies in (CalcOffence 5573-5574, EnemyElectrocuteBuildup
    MORE). Row: PoB's x1 (the threshold not read).
  sources: ["data/game-26650308/tables/GrantedEffectStatSets.json (ValakosChargeArcPlayer)",
            "C:/PROJECTS/PoE2 Builder/scratch/manager/research/plans6-six-questions-r39.md (R39-15)",
            "vendor/PathOfBuilding-PoE2/src/Modules/CalcOffence.lua 5573-5574"]
  test_in_game: "Valako's Charge's Arc against a dummy: the Electrocute buildup a hit shows half that of an equal Lightning hit."
  status: proposed

