- id: gem-gem30-no-effect-flags-and-geometry
  title: "Gem stats that move no number against one boss: flags, geometry, travel time, delays and variance (PLANS7's triage)"
  kind: gem_stat
  skill: [Inexorable Critical I, Inexorable Critical II, Stampede, Adhesive Grenades I, Adhesive Grenades II,
          Charged Shockwave, Combust, Cross Slash, Firestorm, Forge Hammer, Glacial Cascade, Lightning Arrow,
          Long Fuse I, Long Fuse II, Oil Barrage, Rain of Arrows, Spear of Solaris, Thrashing Vines, Thunderstorm,
          Unearth, Vine Arrow, Whirling Slash, Raise Zombie]
  match: '^(supported_by_inevitable_criticals|shield_charge_extra_distance|grenade_skill_does_not_bounce_off_ground|charged_staff_bonus_width|damage_cannot_be_reflected|ice_chunk_refire_overshoot_(max|min)|ice_chunk_refire_search_radius|firestorm_fall_time_ms|forge_hammer_hammer_speed|cascade_attack_radius_per_stage_\+1_per_100|glacial_cascade_attack_final_spike_rect_length|skill_lightning_rod_burst_delay_ms_override_on_damaging_lightning_rod|skill_grenade_detonate_only_at_end_of_duration|barrage_base_spread_arc_override|rain_of_arrows_arrow_speed_\+%|solaris_spear_ground_expands_to_\+%_final_by_skill_end|awakened_forest_area_of_effect_\+%_final_when_wet|lightning_storm_hit_frequency_variance_ms|unearth_base_cone_speed_multiplier|vine_arrow_area_of_effect_\+%_final_when_wet|sandstorm_swipe_nova_radius_\+_per_stage|zombie_decay_rate_increase_\+%_final)$'
  replace: []
  confidence: theory
  notes: >-
    PLANS7 (plans/gs-triage-damage-speed.md) read each as moving no number in our boss fight; GEM30 kept its reasons
    (MEDIUM unless said). Flags: supported_by_inevitable_criticals marks the skill Inexorable Critical supports (its
    crit model, GEM10, reads the support's own stats). Travel / reach: Stampede's shield_charge_extra_distance (its
    quality: longer maximum travel; the boss is reached either way, as GEM23's Shield Charge entry);
    forge_hammer_hammer_speed, unearth_base_cone_speed_multiplier and rain_of_arrows_arrow_speed_+% (travel or fall
    time, not a rate). Delays: firestorm_fall_time_ms (0.5 s fall), Lightning Arrow's 0.1 s rod burst delay.
    Variance: lightning_storm_hit_frequency_variance_ms (+-150 ms around Thunderstorm's interval: the mean rate is
    unchanged). Geometry against a lone boss inside the area: charged_staff_bonus_width (Charged Shockwave's cone),
    Cross Slash's ice_chunk_refire_* (the flung fragments' count is Cross Slash's model's; these are distances),
    Glacial Cascade's per-stage radius and last spike's length, Spear of Solaris' growing Ground Spear (the boss at the
    landing point is inside from the start), Thrashing Vines' and Vine Arrow's area when Overgrown (no area-share model
    reads their size), Whirling Slash's sandstorm radius per stage (its stages and damage are read), Oil Barrage's 25
    degree spread (inside the boss's width at melee / close range; UNVERIFIED far off, the Nova circle precedent R39-12).
    Adhesive Grenades' no-bounce: grenades aimed at the boss land at it either way (its more damage is mapped by PoB).
    Long Fuse's end-of-duration detonation: no model of ours sets grenades off early (the Detonator code is for Storm
    Lance / Firestorm / Rapid Assault), so nothing is lost (its more damage is counted). Combust's
    damage_cannot_be_reflected: nothing reflects damage in the boss model. Raise Zombie's zombie decay: its zombies
    aren't counted today (models.py: "zombies from corpses not counted"), so nothing to cut NOW; it becomes a minion-
    uptime cut (an overcount guard) the day they are (gs-kill-fed-gem-stats item 6, MECH-B).
  sources: ["C:/PROJECTS/PoE2 Builder/scratch/manager/plans/gs-triage-damage-speed.md"]
  test_in_game: "Not needed for boss damage."
  status: proposed
