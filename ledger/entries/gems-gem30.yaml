  status: proposed

- id: support-gem30-delayed-gratification-harder-condition
  title: "Delayed Gratification: 2 uses per condition met, the condition 2.5x harder: x0.8 uses where the condition binds (PoB reads neither)"
  kind: gem_stat
  support: true
  skill: [Delayed Gratification]
  support_stats: ['difficulty_of_meeting_conditional_requirement_+%']
  match: '^difficulty_of_meeting_conditional_requirement_\+%$'
  replace: ['1% less Damage']
  factor: 0.1333333333
  confidence: theory
  notes: >-
    GEM30 (the manager 04:12, PLANS7 / plans/kw-difficulty.md: a support PoB doesn't read that looks FREE). Its only
    stats (SupportDelayedGratificationPlayer, game 26650308; PoB sup_dex.lua 1802): difficulty_of_meeting_conditional_
    requirement_+% 150 ("Conditional requirements of Supported Skills are {0}% harder to meet"),
    conditional_skill_additional_usages_after_meeting_requirement 1 and _duration_ms 10000 (one more use within 10 s).
    PoB has no statMap for any of them (grep of SkillStatMap.lua and Modules/; PLANS6) and usage.py ignores them, so the
    supported skill scored x1 and the support could fill a socket for nothing. In the game each condition met gives 2
    uses and costs 2.5 times as much: uses x (1 + 1) / (1 + 150%) = x0.8 where the condition sets the use rate, x1 where
    the press rate does. Headline x0.8 (MEDIUM: the condition taken as binding, the usual case for a skill gated by
    Combo, Glory or kills; "harder" scaling every kind of condition alike is UNVERIFIED), counted as "20% less Damage" on
    the supported skill (150 x factor 0.1333: fewer uses read as less damage a second, ailments alike); row: x1 if the
    press rate binds. The two-uses burst isn't scored.
  sources: ["vendor/PathOfBuilding-PoE2/src/Data/Skills/sup_dex.lua 1802 (Delayed Gratification)",
            "C:/PROJECTS/PoE2 Builder/scratch/manager/plans/kw-difficulty.md"]
  test_in_game: "Delayed Gratification on a Combo skill: the Combo needed for the first use (expect 2.5x) and the second use within 10 s."
  status: proposed

