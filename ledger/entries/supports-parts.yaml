# Support-gem stats acting only on a part of what the skill does that neither PoB nor the tool counts yet (COVE4,
# 12 Nov 2026). Kind `gem_stat`, `support: true`, `to: part:<name>`: models.gem_stat_model makes no line for them (the
# part they act on isn't counted, so today they move nothing); the model that counts the part (MECH-B: extra hits)
# reads them through models.support_part_scale(skill, part) and gets the multipliers and notes. Values are the game
# files' (GrantedEffectStatSets, build 26476662). Checked that the parts aren't counted: grep -i of cascade, mimic,
# fractured, offering_casted in PoB Modules/*.lua and Data/SkillStatMap.lua (only Storm Cascade's own trigger and Spell
# Echo's cascades, neither these supports') and of cascade, mimic, tricksters, kulemak in builder/search/*.py and
# engine/bridge.lua (none), 12 Nov 2026.

- id: support-spell-cascade-cascade-area
  title: Spell Cascade, 20% less Area of Effect on the Cascades
  kind: gem_stat
  support: true
  to: part:cascade
  skill: Spell Cascade
  support_stats: ['support_spell_cascade_area_of_effect_+%_for_cascade']
  match: '^support_spell_cascade_area_of_effect_\+%_for_cascade$'
  replace: ['1% more Area of Effect']
  confidence: datamined
  notes: >-
    "Cascades from Supported Skills have 20% less Area of Effect" (constant -20 on SupportSpellCascadePlayer), on top of
    the "20% less Area of Effect" and "30% less Damage" every use of the supported skill gets, which PoB reads (its stat
    map has both). The Cascades themselves ("Cascade to either side of the targeted Area along a random axis", one per
    side) aren't counted by PoB or the tool, so this has nothing to act on until MECH-B counts them: then each Cascade's
    area is 0.8 x 0.8 = 0.64 of the unsupported skill's, which decides how many of them reach a lone boss.
  sources: ["SupportSpellCascadePlayer, GrantedEffectStatSets (build 26476662)", "https://poe2db.tw/us/Spell_Cascade"]
  test_in_game: "Cast a supported area spell at a dummy: the side Cascades' radius against the centre one's (0.8x the area)."
  status: proposed

- id: support-kulemaks-dominion-offering-damage
  title: Kulemak's Dominion, 50% less Damage for spells around the Offerings
  kind: gem_stat
  support: true
  to: part:offering
  skill: Kulemak's Dominion
  support_stats: ['cascadeable_offering_support_offering_casted_spell_damage_+%_final']
  match: '^cascadeable_offering_support_offering_casted_spell_damage_\+%_final$'
  replace: ['1% more Damage']
  confidence: datamined
  notes: >-
    "Spells you cast which affect an area around you or a targeted location also affect an area around Supported
    Offerings; Spells deal 50% less damage when affecting areas around Offerings this way" (constant -50 on
    SupportKulemaksDominionPlayer). The support goes on the Offering; the penalty is on the copies of your other
    Cascadable spells around it, which PoB doesn't count (PoB maps neither stat), nor does the tool, so it has nothing to
    act on until MECH-B counts those copies. Then each copy is 0.5x the spell's own hit (support_part_scale on the
    Offering skill, part "offering").
  sources: ["SupportKulemaksDominionPlayer, GrantedEffectStatSets (build 26476662)", "https://poe2db.tw/us/Kulemaks_Dominion"]
  test_in_game: "Cast an area spell with a supported Offering out: the hit around the Offering against the spell's own (0.5x)."
  status: proposed

- id: support-tricksters-shard-mimic-damage
  title: Trickster's Shard, 50% less Damage for the Fractured Mimics' casts
  kind: gem_stat
  support: true
  to: part:mimic
  skill: Trickster's Shard
  support_stats: ['skill_used_by_fractured_mimic_spell_damage_+%_final']
  match: '^skill_used_by_fractured_mimic_spell_damage_\+%_final$'
  replace: ['1% more Damage']
  confidence: datamined
  notes: >-
    "Supported Spells deal 50% less Damage when cast by Fractured Mimics" (constant -50 on SupportTrickstersShardPlayer).
    Your own casts are at full damage. The Mimics (the spell "Triggers Fragment Self, creating a Fractured Mimic which will
    cast that Spell if you get enough of them") aren't counted by PoB (it maps neither stat) or the tool, so this has
    nothing to act on until MECH-B counts the Mimics' casts: then each is 0.5x the spell's hit.
  sources: ["SupportTrickstersShardPlayer, GrantedEffectStatSets (build 26476662)", "https://poe2db.tw/us/Tricksters_Shard"]
  test_in_game: "Cast the supported spell until a Mimic casts it: the Mimic's hit against yours (0.5x)."
  status: proposed

- id: support-spectral-volley-spectral-damage
  title: Spectral Volley, 20% more Damage for the Spectral Projectiles
  kind: gem_stat
  support: true
  to: part:spectral
  skill: Spectral Volley
  support_stats: ['support_spectral_arrows_damage_+%_final_with_spectral_projectiles']
  match: '^support_spectral_arrows_damage_\+%_final_with_spectral_projectiles$'
  replace: ['1% more Damage']
  confidence: datamined
  notes: >-
    "Supported Skills deal 20% more Damage when fired from Spectral Projectiles" (constant 20 on
    SupportSpectralVolleyPlayer). The Spectral Projectiles (one per attack, at most 5, fired once none has been created
    for 3 seconds, 0.1 s apart) aren't counted yet, so this waits for MECH-B. How often they fire is the player's choice
    (attack, then stop for 3 s): a play pattern with without/with rows, not a flat rate. Against the attack's own
    projectiles (60% less, supports-translated.yaml) each Spectral one is 1.2 / 0.4 = 3x.
  sources: ["SupportSpectralVolleyPlayer, GrantedEffectStatSets (build 26476662)", "https://poe2db.tw/us/Spectral_Volley"]
  test_in_game: "Attack a dummy 5 times, stop for 3 s: each Spectral Projectile's hit against the unsupported attack's (1.2x)."
  status: proposed

# COVE5 (12 Nov 2026, AUDIT6 A6-2 / A6-3): parts written ready for MECH-B's Warcry Echo and summed Aftershock models.
# Values from GrantedEffectStatSets SupportEchoingCryPlayer and SupportSlamAftershocksPlayer (build 26476662). Checked that
# neither part is counted: grep -i of echo and aftershock in builder/search/*.py, engine/bridge.lua and PoB Modules/Calc*.lua
# (12 Nov 2026: master's repeat_echo_model is for Spells only; PoB maps only slam_aftershock_chance_%; RULE_AUDIT A6-29).

- id: support-echoing-cry-echoes
  title: Echoing Cry, the supported Warcry Echoes 2 times
  kind: gem_stat
  support: true
  to: part:warcry_echo
  skill: Echoing Cry
  support_stats: ['base_warcry_echo_X_times']
  match: '^base_warcry_echo_X_times$'
  replace: ['mult:WarcryEchoes 1']
  confidence: datamined
  notes: >-
    "Supported Warcries Echo 2 times" (constant 2 on SupportEchoingCryPlayer; an Echo hits "the same targeted location again
    after a delay", KeywordPopups Cascadable / Echo). Each Echo carries the support's 40% less Damage and 50% less Area
    (supports-translated.yaml support-echoing-cry-penalties / -area, counted on the Warcry itself). Whether each Echo
    hits the boss (it repeats at the first use's location, 1.3 s later) is MECH-B's call (UNVERIFIED).
  sources: ["SupportEchoingCryPlayer, GrantedEffectStatSets (build 26476662)", "https://poe2db.tw/us/Echoing_Cry"]
  status: proposed

- id: support-echoing-cry-echo-area
  title: Echoing Cry, the Warcry's Echoes have 100% more Area of Effect per time they have Echoed
  kind: gem_stat
  support: true
  to: part:warcry_echo
  skill: Echoing Cry
  support_stats: ['warcry_echo_area_of_effect_+%_final_per_repeat']
  match: '^warcry_echo_area_of_effect_\+%_final_per_repeat$'
  replace: ['mult:EchoAreaMorePercentPerEcho 1']
  confidence: datamined
  notes: >-
    "100% more Area of Effect per time they have Echoed" (constant 100): read here as Echo n getting 1 + n x 100% (x2, then
    x3), on top of the support's 50% less Area (so 1.0x, then 1.5x the unsupported Warcry's area). That the per-time
    "more" adds up rather than multiplies (x2, x4) is the usual reading of "per" stacks (UNVERIFIED for this stat).
  sources: ["SupportEchoingCryPlayer, GrantedEffectStatSets (build 26476662)", "https://poe2db.tw/us/Echoing_Cry"]
  status: proposed

- id: support-echoing-cry-echo-delay
  title: Echoing Cry, 1.3 seconds between the Warcry and each Echo
  kind: gem_stat
  support: true
  to: part:warcry_echo
  skill: Echoing Cry
  support_stats: ['warcry_echo_delay_ms_from_support']
  match: '^warcry_echo_delay_ms_from_support$'
  replace: ['mult:WarcryEchoDelayMs 1']
  confidence: datamined
  notes: >-
    "with a 1.3 second delay" (warcry_echo_delay_ms_from_support 1300). For the Echo model: the boss must still be at the
    location after the delay, and a Warcry used again before its Echoes end (UNVERIFIED whether a new use cancels them).
  sources: ["SupportEchoingCryPlayer, GrantedEffectStatSets (build 26476662)", "https://poe2db.tw/us/Echoing_Cry"]
  status: proposed

- id: support-tectonic-slams-aftershock
  title: Tectonic Slams, 1 extra Aftershock with 45% less Damage and 30% less Area of Effect
  kind: gem_stat
  support: true
  to: part:tectonic_aftershock
  skill: Tectonic Slams
  support_stats: ['number_of_dual_cascade_aftershocks']
  match: '^number_of_dual_cascade_aftershocks$'
  replace: ['mult:TectonicAftershocks 1']
  confidence: datamined
  notes: >-
    number_of_dual_cascade_aftershocks 1 on SupportSlamAftershocksPlayer: "Supported Skills cause {0} additional
    Aftershock ahead and to each side of the initial area" (gem_stat_descriptions; PoB's gem description says "behind the
    Slam"). The game's "ahead" puts one in front of the Slam's area, so it may reach a large boss there; how much of a
    boss it overlaps is UNVERIFIED (RULE_AUDIT A6-3: for RESEARCH or an in-game test). If it hits, the Slam is worth about 0.85 x (1 + 0.55) =
    1.32x; if not, the 15% less Attack Speed (support-tectonic-slams-attack-speed) is the whole effect.
  sources: ["SupportSlamAftershocksPlayer, GrantedEffectStatSets (build 26476662)", "https://poe2db.tw/us/Tectonic_Slams"]
  status: proposed

- id: support-tectonic-slams-aftershock-damage
  title: Tectonic Slams, 45% less Damage on its Aftershock
  kind: gem_stat
  support: true
  to: part:tectonic_aftershock
  skill: Tectonic Slams
  support_stats: ['aftershock_damage_+%_final_from_support_dual_cascade_aftershocks']
  match: '^aftershock_damage_\+%_final_from_support_dual_cascade_aftershocks$'
  replace: ['1% more Damage']
  confidence: datamined
  notes: >-
    Constant -45 on SupportSlamAftershocksPlayer; the stat's name ties it to the support's own Aftershocks
    ("from_support_dual_cascade_aftershocks"), so it is kept to them, not to other Aftershocks of the Slam (UNVERIFIED
    beyond the name).
  sources: ["SupportSlamAftershocksPlayer, GrantedEffectStatSets (build 26476662)", "https://poe2db.tw/us/Tectonic_Slams"]
  status: proposed

- id: support-tectonic-slams-aftershock-area
  title: Tectonic Slams, 30% less Area of Effect on its Aftershock
  kind: gem_stat
  support: true
  to: part:tectonic_aftershock
  skill: Tectonic Slams
  support_stats: ['aftershock_area_of_effect_+%_final_from_support_dual_cascade_aftershocks']
  match: '^aftershock_area_of_effect_\+%_final_from_support_dual_cascade_aftershocks$'
  replace: ['1% more Area of Effect']
  confidence: datamined
  notes: Constant -30 on SupportSlamAftershocksPlayer, kept to the support's own Aftershocks as the damage one.
  sources: ["SupportSlamAftershocksPlayer, GrantedEffectStatSets (build 26476662)", "https://poe2db.tw/us/Tectonic_Slams"]
  status: proposed

# COVE5 (12 Nov 2026): Branching Fissures I/II act only on the branched Fissures, which PoB counts no hit for (checked:
# PoB's Volcanic Fissure / Molten Crash stat sets carry number_of_branching_fissures without a part or stat map, and no
# Modules/Calc*.lua line names fissure or branch; grep of fissure / branch in builder/search/*.py and engine/bridge.lua: none;
# 12 Nov 2026). Written ready for the model that counts branches (MECH-B): part branch_fissure.

- id: support-branching-fissures-branches
  title: Branching Fissures I/II, the supported skill's Fissures branch 2 more times
  kind: gem_stat
  support: true
  to: part:branch_fissure
  skill: [Branching Fissures I, Branching Fissures II]
  support_stats: ['number_of_branching_fissures']
  match: '^number_of_branching_fissures$'
  replace: ['mult:BranchingFissures 1']
  confidence: datamined
  notes: >-
    "Supported Skills' Fissures branch {0} times" (constant 2 on SupportBranchingFissuresPlayer / PlayerTwo). The skills'
    own branches (Volcanic Fissure's and Molten Crash's number_of_branching_fissures 2) aren't counted either (COV-C /
    MECH-B). How many branches reach a lone boss is the counting model's call (UNVERIFIED).
  sources: ["SupportBranchingFissuresPlayer, SupportBranchingFissuresPlayerTwo, GrantedEffectStatSets (build 26476662)"]
  status: proposed

