- id: gem-gem29-trigger-chance-100
  title: "Elemental Expression / Elemental Surge / Chaotic Surge / Gemini Surge: their chance to be triggered is 100% (nothing to count)"
  kind: gem_stat
  skill: [Elemental Expression, Elemental Surge, Chaotic Surge, Gemini Surge]
  match: '^(chance_to_be_trigger_elemental_expression_%|chance_to_be_triggered_by_(amazon_infusion|chaos_spear|reload_infusion)_%)$'
  replace: []
  confidence: datamined
  notes: >-
    Each stat is a constant 100 on every stat set of its skill (PoB other.lua ElementalExpressionTriggeredPlayer,
    AmazonTriggerElementalSurgePlayer, ChaosSpearTriggerChaosSurgePlayer; act_str.lua GeminiSurgePlayer; PoB's
    constantStats are the game's stat sets' constants). PoB never reads them and scores each trigger as made; at 100%
    reading them changes nothing. How often these skills trigger (their Surges, the Elemental Expression rate) is a
    separate question, not this stat's. Recorded so the rows aren't counted open.
  sources: ["vendor/PathOfBuilding-PoE2/src/Data/Skills/other.lua", "vendor/PathOfBuilding-PoE2/src/Data/Skills/act_str.lua"]
  status: proposed
