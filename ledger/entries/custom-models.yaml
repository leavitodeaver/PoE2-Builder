# Lines PoB ignores that feed a custom model (builder/search/models.py) instead of standing for a
# modifier of their own. On passives they become the model's inputs inside PoB:
#   flag:Name     switches ledger condition Name on (e.g. a source of Elemental Archon)
#   mult:Name N   adds N to the model input Name (PoB multiplier "LedgerName")
# so a what-if that adds or removes the passive sees the model's effect change. Lines on items are
# read by the model itself when the build is resolved. `model` names the model that uses the
# line; every effect it computes is listed in the result with its basis and confidence.
#
# Research (2026-10, PoE2 0.5.x): poe2db.tw (datamined) and PoB's skill data, quoted per entry.

# Archon buffs (model: archon) -----------------------------------------------------------------
# Elemental Archon: 25% more Elemental Damage with Spells, no non-elemental damage from Spells,
# removed by using a non-instant Attack; every Archon Buff lasts 10 s and is followed by a 20 s
# recovery period in which no Archon Buff can be gained (https://poe2db.tw/us/Elemental_Archon).

- id: archon-duration
  title: Archon Buff duration (Archon model input)
  kind: pob_gap
  model: archon
  match: '^(\d+)% increased Archon Buff duration$'
  replace: ['mult:ArchonDuration {1}']
  confidence: datamined
  sources: ["https://poe2db.tw/us/Elemental_Archon (10 s base duration)"]
  status: approved

- id: archon-duration-reduced
  title: Reduced Archon Buff duration (Archon model input)
  kind: pob_gap
  model: archon
  match: '^(\d+)% reduced Archon Buff duration$'
  replace: ['mult:ArchonDuration {g1*-1}']
  confidence: datamined
  sources: ["https://poe2db.tw/us/Elemental_Archon"]
  status: approved

