- id: archon-infernal-rest
  title: Seething Body's other lines (the Archon model keeps the normal duration)
  kind: pob_gap
  model: archon
  match: '^(Elemental Archon does not expire while on High Infernal Flame|Lose Elemental Archon on reaching maximum Infernal Flame)$'
  replace: []
  confidence: theory
  notes: >-
    How long a build stays on High Infernal Flame isn't modeled, so Seething Body's Archon keeps
    the normal duration and recovery: an undercount for builds that hold High Infernal Flame.
  sources: ["https://poe2db.tw/Seething_Body"]
  status: approved

- id: archon-no-boss-damage
  title: Archon lines with no effect on boss damage (immunities, movement, resistances while it lasts)
  kind: pob_gap
  model: archon
  match: '^(Immune to .+ while affected by an Archon Buff|Archon Buffs also grant \d+% increased Movement Speed|Archon Buffs also grant \+\d+% to all Elemental Resistances|\d+% faster start of Energy Shield Recharge while affected by an Archon Buff)$'
  replace: []
  confidence: reported
  notes: >-
    Resistances and recharge while an Archon Buff lasts aren't counted for defences: a boss's
    biggest hit can land while it's down, and floors use the worst case.
  sources: ["https://poe2db.tw/Invigorating_Archon", "https://poe2db.tw/Energising_Archon"]
  status: approved

# Meta-skill Energy (model: energy) -------------------------------------------------------------
# Cast on Critical gains 1 Energy per Power of the enemy it critically hits (Unique monsters have
# 20 Power), scaled by the share of the enemy's Ailment Threshold the hit deals, and triggers all
# socketed spells at maximum Energy: 10 per 0.1 s of their base cast time
# (https://poe2db.tw/us/Cast_on_Critical, https://poe2db.tw/us/Monster_Power).

- id: meta-energy
  title: Meta Skills gain increased Energy (Energy model input)
  kind: pob_gap
