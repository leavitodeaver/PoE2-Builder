# TRAIN 138's reader (MECH105, on origin/main 8181913f): the model reads the stat itself from PoB's levelStats.
- id: model-read-cov56-thunderous-leap-ground
  title: "Thunderous Leap's quality chance to leave Shocked Ground when Detonating Spears (conditions' Shocked Ground model)"
  kind: model
  model: shocked_ground
  stats: ["thunderous_leap_%_chance_for_shocked_ground_when_detonating"]
  skill: [Thunderous Leap]
  confidence: MEDIUM
  notes: >-
    1.5% a quality (PoB's qualityStats, applied to nothing by PoB). MECH105 (R54-6): conditions reads the gem's own value
    (THUNDEROUS_LEAP_STAT from activeSkills levelStats) and counts the ground at the Leaps a second that find a Spear at the
    boss (leap_ground_rate), into the Shocked Ground share. The model's own labels: other Detonators clearing Spears first
