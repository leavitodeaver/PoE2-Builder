- id: model-read-keep-elemental-infusions
  title: '"Skills have N% chance to not remove Elemental Infusions but still count as consuming them" (assumptions.KEEP_INFUSION; Snakepit''s outcome)'
  kind: pob_gap
  model: infusions
  match: '^Skills have (\(\d+-\d+\)|\d+(?:\.\d+)?)% chance to not remove Elemental Infusions but still count as consuming them$'
  replace: []
  confidence: theory
  notes: >-
    assumptions.KEEP_INFUSION, widened by MECHC33 to this wording (COV35's find), read at assumptions.py 4202 in the
    Infusion share: a consuming cast keeps the Infusion on that chance. PoB parses none of these lines (ModCache 9391 /
    9398 / 9400, {} with leftover text). Anchored at "them" so the belt craft "... if you've lost an Archon Buff in the
    past 6 seconds" (ModCache 9397) stays open: KEEP_INFUSION doesn't read it (it needs the Archon-loss share). The
    stand-in lets cultivated.outcome_lines offer Snakepit's Cultivated outcome UniqueMutatedVaalChanceToNotConsumeInfusion
    (the bridge rolls its "(5-10)%" before the model reads it). The tree's 10% / 5% nodes are passive rows this also closes.
