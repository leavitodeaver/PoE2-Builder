  kind: pob_gap
  model: charges
  match: '^Gain an? (Power|Frenzy|Endurance) Charge every Second if you haven''t lost \1 Charges Recently$'
  replace: []
  confidence: theory
  notes: >-
    conditions.NOT_LOST_RECENTLY / _while_not_lost (MECHC33), read in the charge count's rate (_charge_rate's "every
    second" branch): one a second only while no charge was lost in the past 4 s; with Redflare's own "Lose all Power
