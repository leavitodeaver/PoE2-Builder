  kind: model
  model: earthquake_patch_limit
  stats: ["base_number_of_earthquakes_allowed"]
  skill: [Earthquake]
  confidence: MEDIUM-LOW
  notes: >-
    The game (26650308, ActiveSkills earthquake), "The Jagged Ground erupts in a powerful Aftershock after a duration.
    Cannot create Jagged Ground on top of an existing patch, or if you already have the maximum number of active
    patches"; base_number_of_earthquakes_allowed, skill_jagged_ground_base_duration_ms 4000. Each patch erupts once, so
    the Aftershock set is held to min(1, (Limit / fuse) / attacks a second). Overabundance probably shortens the fuse to
    2.0 s (I) or 2.4 s (II) (RESEARCH56 R56-6, MEDIUM), the headline; the fuse unchanged is a row. Not counted, the
    Impact's own hit beside the Aftershock. Assumed, patches placed side by side each reach the boss (LOW; a row at one
    spot).
