# Lines PoB ignores that our own models read (COV22, 13 Nov 2026; MECHC15's "For other lanes"). Each reader was read
# on main (train 36+37) before crediting.

- id: model-life-when-stunned
  title: Regenerate N% of maximum Life over 1 second when Stunned (recovery model, at the boss's hits that Light Stun you)
  kind: pob_gap
  model: recovery
  match: '^Regenerate (\d+(?:\.\d+)?)% of maximum Life over 1 second when Stunned$'
  replace: []
  confidence: reported
  notes: >-
    MECHC15 (AUDIT27 A27-32, an UNDERCOUNT before: PoB parses the line to no mod, ModCache {nil, ...}). recovery.py
    STUNNED_LIFE reads it into LifeOnEventRecovery at recovery.stuns_taken's rate: the boss's landed hits a second x the
    game's Light Stun chance (each damage type's hit size after mitigation over PoB's StunThreshold, Physical 50% more,
    under 15% none: KeywordPopups LightStun / StunThreshold), less PoB's StunAvoidChance (LOW: each hit at its type's
    full size). A build that can't be Stunned gets 0, said in the recovery row. Carriers: the passives Quick Recovery
    and Chakra of Stability (the stat regenerate_%_life_over_1_second_when_stunned). The Energy Shield twin ("...
    maximum Energy Shield over 1 second when Stunned") isn't counted here: MECHC17 (MECH-C's branch) counts it; credited
    when it lands on main.
  sources: ["builder/search/recovery.py (STUNNED_LIFE, stuns_taken)", "data/game-26476662/tables/KeywordPopups.json (LightStun, StunThreshold)"]
  test_in_game: "Not needed for the shape: tests/test_recovery.py covers the Stun rate; the Light Stun floor (15% vs 10%) is the open game question."
  status: proposed
