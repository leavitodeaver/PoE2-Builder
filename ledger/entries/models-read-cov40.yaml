- id: model-read-djinn-command-grants
  title: 'The Disciple of Varashta''s "Grants Skill: <Command>" notables (models.djinn_commands_model, MECH83 / MECH84)'
  kind: pob_gap
  model: djinn_commands
  match: '^Grants Skill: (Kelari''s (Deception|Judgment)|Ruzhan''s (Trap|Reckoning|Fury)|Navira''s Fracturing)$'
  replace: []
  confidence: theory
  notes: >-
    The manager's ruling (COV39 brief, 16 Nov ~00:30: "enter the djinn Command passive rows MECH83 / MECH84 now score ...
    as model-read entries, once train 73 lands"). PoB parses these ascendancy lines as nothing (ModCache, {nil, nil}) and
    scores only each djinn minion's first skill. models.DJINN_COMMANDS lists each of these six as granted=True, and
    models.djinn_commands_available picks one up when the build holds its djinn and a "Grants Skill: <name>" line
    (GRANTS_SKILL); assumptions.djinn_commands (called from the hand-skills block, "Djinn Commands") scores it with the
    bridge's minionSkillHit at one use per cooldown under the button cap, less the Command's 0.4 s cast, and adds it to
    the boss DPS. Per Command (the model's own labels): Deception blast + clone explosion x its sequence bonus (capped
    x4); Judgment one full-channel shockwave (x4.75, its 2 s channel costs the main skill); Reckoning two hits; Fury two
    embers a use (all 40 a row); Fracturing only at the share the boss stands on your Chilled Ground; Trap 0, labelled
    LOW by MECH83 ("a moving boss would trigger them"), a modelled zero, not a dropped line. Not in this entry (left
    open): "Grants Skill: Navira's Oasis" and "Navira's Well", which the model's Command list doesn't hold (checked:
    models.DJINN_COMMANDS on d4920ab8; Navira's Oasis named "not counted" in the Overgrown note).
  sources: [builder/search/models.py (DJINN_COMMANDS, djinn_commands_available, djinn_commands_model), builder/search/assumptions.py (djinn_commands)]
  status: proposed

