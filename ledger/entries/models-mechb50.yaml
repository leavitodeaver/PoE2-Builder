    skill_wolf_pack_size; only their hits multiply (damage over time once: one Ignite / Bleed counts on a boss).
    Temporary minions with a duration (Raise Zombie) need the build's corpse / charge supply: PoB's one kept, labelled
    (UNVERIFIED, an undercount where the supply is there). Unearth and meta-triggered minions keep their own models.
  sources: ["builder/search/models.py (minion_alive_count, minion_count_scale)", "builder/search/assumptions.py (Assumptions.minion_counts)",
