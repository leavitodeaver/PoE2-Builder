  kind: model
  model: boss_power
  stats: ["melee_strike_bonus_attack_distance"]
  skill: [Raise Shield]
  confidence: MEDIUM
  notes: >-
    14 at every level (GrantedEffectStatSets ShieldBlockPlayer's constant stats, game 26650308) = the 1.4 m in
    SHIELD_BASH_RANGE 22 units (0.8 m unarmed + 1.4 m; RESEARCH26 R26-63, MEDIUM). shield_bash_reach adds the build's
    Melee Strike Range lines; challenge_share counts a Bash after each parried telegraphed hit only with the boss within
    that reach, which sets Runefather's Challenge share and so the boss's Power (models.boss_power: the Energy / Glory /
    roar models and PoB's EnemyPower readers). Only for Raise Shield (Parry / Hazardous Holdout carry the same 14 and
    aren't read). A link only.
