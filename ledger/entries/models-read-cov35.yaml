# Lines a model already reads that the coverage audit listed as open (COV35, 15 Nov 2026; the refreshed report's top
# rows): each model's own regex matches the line and is used in a live path (checked: git grep of each pattern's name;
# see each note). Empty replace: nothing is added to PoB, so no line counts twice. Written by
# scratch/cov35/make_entries.py.

- id: model-read-presence-seconds-damage
  title: conditions.PRESENCE_SECONDS_LINE reads it
  kind: pob_gap
  model: presence_seconds
  match: ^Deal (\(\d+-\d+\)|\d+)% increased Damage with Hits to Rare or Unique Enemies for each second they've ever been in
    your Presence, up to a maximum of (\(\d+-\d+\)|\d+)%$
  replace: []
  confidence: theory
  notes: 'conditions.PRESENCE_SECONDS_LINE (MECH-A): sets PoB''s enemyMultiplierEnemyPresenceSeconds box to the seconds whose
    Full DPS equals the fight''s average (the boss in your Presence from the start; 0 outside it). The Vile Knight, its Legacy
    rune, UniqueBuildDamageAgainstRareAndUnique1. This entry only says a model reads the line; it adds nothing to PoB (no
    second count).'
  sources:
  - builder/search/conditions.py (PRESENCE_SECONDS_LINE, PRESENCE_SECONDS_VAR)
  status: proposed
