# Support-gem stats that act only on enemies other than the one hit (COVE1, 12 Nov 2026). The tool rates one boss with
# no other enemy (PoB's boss preset; the same reading as gem-mana-tempest-split and gem-projectile-damage-if-pierced in
# coverage-batch1.yaml), so these move no number it calculates. Kind `gem_stat` with an empty `replace`. This is a
# statement about the tool's lone-boss rating, not about the game: with adds, these supports do work, and a clear-speed
# or multi-target rating would need them.
#
# Checked: each stat's own wording in the game files (gem_stat_descriptions.csd, build 26476662) names other/nearby
# enemies; poe2db's gem pages carry the same wording (Shock Conduction, Wildfire). The hit enemy itself gets nothing
# extra from these stats: Shock Conduction's own Shock is the hit's normal Shock; Wildfire spreads the Ignite "to other
# enemies"; the Deadeye marks support marks "another Enemy"; Impact Shockwave's
# Aftershock damages "other enemies" (poe2db's page reads the same).

- id: supports-other-targets
  title: Supports that act only on other enemies (none beside a lone boss)
  kind: gem_stat
  skill: [Shock Conduction, Shock Conduction II, Wildfire, SupportMetaDeadeyeMarksPlayer, Impact Shockwave]
  match: '^(?:support_%_chance_to_shock_nearby_enemy_on_shock|shock_nearby_enemy_base_area_of_effect_radius|support_ignite_proliferation_radius|your_marks_spread_to_a_nearby_enemies_on_consume_%_chance|support_impact_shockwave_base_non_slam_aftershock_on_heavy_stun_radius)$'
  replace: []
  confidence: datamined
  notes: "Game wording: Shock Conduction 'Shocking Hits from supported Skills have a 50% chance to also Shock enemies in a
    2.5 metre radius'; Wildfire 'Ignites inflicted by Supported Skills Spread to other enemies that stay within 1.5 metre
    for 1 second'; the Deadeye marks support '100% chance to Mark another Enemy within 3 Metres of Marked Enemy when
    Consumed'; Impact Shockwave 'cause an Aftershock when they Heavy Stun an enemy, Damaging other enemies within 1.5
    metres'. Shock Conduction II's always_shock_wet_enemies is not covered here (it shocks the hit target)."
  sources: ["gem_stat_descriptions.csd (build 26476662)", "https://poe2db.tw/us/Shock_Conduction", "https://poe2db.tw/us/Wildfire", "https://poe2db.tw/us/Impact_Shockwave"]
  test_in_game: "Not needed for single-boss damage."
  status: proposed

- id: supports-bounty-kill-charges
  title: Bounty I/II, Charm / Life / Mana Bounty, more flask and charm charges from killing blows (no kill before the lone boss dies)
  kind: gem_stat
  skill: [Bounty I, Bounty II, Charm Bounty, Life Bounty, Mana Bounty]
  match: '^support_(?:charm|life_flask|mana_flask)_charges_gained_\+%_final_from_killing_blow$'
  replace: []
  confidence: datamined
  notes: >-
    "Enemies killed by Hits from Supported Skills grant 50% / 100% more Charm charges / Life Flask Charges / Mana Flask
    Charges" (SupportBountyPlayer 50/50/50, ...PlayerTwo 100/100/100, SupportCharmBountyPlayer, SupportLifeFlaskPlayer,
    SupportManaFlaskPlayer 100: GrantedEffectStatSets, build 26476662). A "more" on the charges a kill grants: in the
    tool's lone-boss fight no enemy dies before the boss (the same reading as the on-kill sources in conditions.py and
    flasks.charges_per_second, "charges an item gains per second without kills"), so it multiplies 0 charges and moves
    no flask or charm uptime. A statement about the tool's rating, not the game: with adds (a boss that summons them,
    or mapping) these supports feed flasks and charms; a fight model that counts adds' deaths would need them (and the
    play guide could then say how the build feeds them). PoB reads none of them (checked: the stat ids in
    Data/SkillStatMap.lua and Modules/*.lua, 12 Nov 2026).
  sources: ["SupportBountyPlayer, SupportBountyPlayerTwo, SupportCharmBountyPlayer, SupportLifeFlaskPlayer, SupportManaFlaskPlayer, GrantedEffectStatSets (build 26476662)", "gem_stat_descriptions.csd"]
  test_in_game: "Not needed for a single boss."
  status: proposed
