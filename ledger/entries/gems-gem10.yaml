- id: no-effect-gem10-virtuous-barrier-mote-maximum
  title: "Virtuous Barrier's maximum Motes per Attribute (3 + its skills, single-Attribute ones twice): PoB counts it"
  kind: gem_stat
  match: '^skill_specific_stat_description_mode$'
  replace: []
  stats: ["skill_specific_stat_description_mode"]
  skill: [Virtuous Barrier]
  confidence: datamined
  notes: >-
    virtuous_barrier.csd, mode 3: "Maximum of each Attribute of Mote is {0} plus the number of Skills you have which
    require that Attribute / Single-Attribute Skills grant twice as many maximum Motes" ({0} is the mode's value, 3).
    PoB (Modules/CalcSetup.lua 1839-2284, 2535-2538) starts each of StrengthMoteSkillCount / Dexterity / Intelligence at
    3 and adds 2 per single-attribute skill gem, 1 per attribute of a multi-attribute one (item and tree skills not
    counted). Probe POE2T2068 (real PoB, scratch/gem10/probe_barrier.json): Strength Motes 3 -> 5 -> 7 -> 9 as
    Boneshatter, Infernal Cry and Sunder are added (Intelligence 5 = 3 + Spark's 2), Life 1,277 -> 1,323 -> 1,369 ->
    1,415 (2% increased maximum Life per Strength Mote). Not closed here: PoB keeps every Mote at that maximum all fight,
    while the game gains "a random Mote every second" (base_active_skill_buff_stack_gain_frequency_ms) and loses one when
    you are Hit; that stat stays open.
  sources: ["data/game-26476662/files/data/statdescriptions/specific_skill_stat_descriptions/virtuous_barrier.csd",
            "vendor/PathOfBuilding-PoE2/src/Modules/CalcSetup.lua 1839-2284, 2535-2538",
            "scratch/gem10/probe_barrier.json (POE2T2068)"]
  test_in_game: "Not needed: PoB matches the text on probe."
  status: proposed

