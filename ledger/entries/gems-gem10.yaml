# GEM10 (14 Nov 2026): skill_specific_stat_description_mode, more of GEM8's list (item 1). The stat's value only picks
# which text the game shows; each text describes a real effect, so each skill is checked against what PoB counts. Each
# entry is scoped to the skills named: the same stat on other skills stays open.

- id: model-gem10-emergency-reload-empowered-bolts
  title: "Emergency Reload: a clip of Empowered bolts with 12-31% more damage, and a reload skipped, each cooldown"
  kind: gem_stat
  match: '^emergency_reload_damage_\+%_final$'
  replace: ["1% more Damage"]
  share: emergency_reload
  to: main
  stats: ["emergency_reload_damage_+%_final", "skill_specific_stat_description_mode"]
  skill: [Emergency Reload]
  confidence: theory
  notes: >-
    emergency_reload.csd (game 26476662): "Empowers bolts with {0}% more damage", "duration is {0} seconds or until your
    Empowered bolts are expended", and its skill_specific_stat_description_mode 1 text "Number of each clip's Empowered
    bolts is equal to the maximum Ammunition of the clip". PoB maps emergency_reload_damage_+%_final to nothing (no
    SkillStatMap entry, no reader in Modules; checked: grep of vendor/PathOfBuilding-PoE2/src for the id), so it scores
    the bolts without it: an UNDERCOUNT. Counted on the main skill when it fires a Crossbow clip (PoB's BoltCount),
    from the build's own clip, firing rate, reload time and Emergency Reload's cooldown (models.emergency_reload_share):
    used on cooldown with the clip empty (the play pattern, LOW), it Empowers one clip (capped by 6 s of firing) and
    replaces one reload. Second source: patch 0.3.0 (the newest of its three entries) "Empowers each clip's Ammunition
    to deal increased damage for its duration or until you expend all your Empowered bolts. Now has Number of each
    clip's Empowered bolts is equal to the maximum Ammunition of the clip". Not counted (labelled): the build's other
    clips, Skill Effect Duration modifiers. ASSUMPTION (UNVERIFIED): a shot that consumes no Ammunition expends no
    Empowered bolt (PoB's EffectiveBoltCount is the clip).
  sources: ["data/game-26476662/files/data/statdescriptions/specific_skill_stat_descriptions/emergency_reload.csd",
            "vendor/PathOfBuilding-PoE2/src/Data/Skills/act_str.lua (EmergencyReloadPlayer)",
            "vendor/PathOfBuilding-PoE2/src/Modules/CalcOffence.lua 3022-3037 (BoltCount, Speed with reloads)",
            "patch notes 0.3.0 (Emergency Reload)"]
  test_in_game: "Fire a crossbow ammo skill at a training dummy with Emergency Reload: the Empowered bolts' hits should be 31% higher (gem level 20) for one clip, then normal."
  status: proposed

- id: model-gem10-kelari-beetles-per-corpse
  title: "Kelari's Malediction: 2 beetles per corpse consumed, each exploding once (PoB: one beetle a second, corpses or not)"
  kind: gem_stat
  match: '^skill_specific_stat_description_mode$'
  replace: ["Minions deal 1% more Damage"]
  share: kelari_beetles
  stats: ["skill_specific_stat_description_mode"]
  skill: [Kelari's Malediction]
  confidence: theory
  notes: >-
    corpse_beetles.csd (game 26476662): "Summons {0} Beetles per Corpse consumed" (this stat, 2), "{0} second duration
    between Corpse consumptions" (0.9 s at gem level 20); ActiveSkills: Corpse Beetle Minions burst forth from consumed
    corpses and "On your Command, they rush the target and explode". Probe POE2T2066 (real PoB, our models on; scratch/gem10/
    probe_kelari.json): PoB's FullDPS 374 is one beetle's Sandblast at minion Speed 1/s, with no corpse in it, and
    corpse_model's triggerRate doesn't reach a minion's damage: an OVERCOUNT on a lone boss (no corpse source: 100% less,
    the user's no-source-means-0 rule), an undercount where corpses come faster than PoB's one a second (up to 2.2
    explosions/s at level 20). Rate from the build's own corpse supply (models.corpse_supply, its even share among the
    corpse users), models.kelari_beetles_share. Not counted (labelled): Command's 0.4 s cast, the beetle limit; a
    non-main Kelari's is read against its 1 s cast, not its minion speed.
  sources: ["data/game-26476662/files/data/statdescriptions/specific_skill_stat_descriptions/corpse_beetles.csd",
            "vendor/PathOfBuilding-PoE2/src/Data/Skills/other.lua (CorpseBeetlesPlayer), minion.lua (CorpseBeetleExplode)",
            "scratch/gem10/probe_kelari.json (POE2T2066)"]
  test_in_game: "With a corpse source (Sacrifice and undead Reviving minions) against a boss: count the beetle explosions over 10 s (2 per corpse consumed, at most one consumption per 0.9 s)."
  status: proposed

- id: no-effect-gem10-virtuous-barrier-mote-maximum
  title: "Virtuous Barrier's maximum Motes per Attribute (3 + its skills, single-Attribute ones twice): PoB counts it"
  kind: gem_stat
  match: '^skill_specific_stat_description_mode$'
  replace: []
  stats: ["skill_specific_stat_description_mode"]
  skill: [Virtuous Barrier]
  confidence: datamined
  notes: >-
    virtuous_barrier.csd, mode 3: "Maximum of each Attribute of Mote is {0} plus the number of Skills you have which
    require that Attribute / Single-Attribute Skills grant twice as many maximum Motes" ({0} is the mode's value, 3).
    PoB (Modules/CalcSetup.lua 1839-2284, 2535-2538) starts each of StrengthMoteSkillCount / Dexterity / Intelligence at
    3 and adds 2 per single-attribute skill gem, 1 per attribute of a multi-attribute one (item and tree skills not
    counted). Probe POE2T2068 (real PoB, scratch/gem10/probe_barrier.json): Strength Motes 3 -> 5 -> 7 -> 9 as
    Boneshatter, Infernal Cry and Sunder are added (Intelligence 5 = 3 + Spark's 2), Life 1,277 -> 1,323 -> 1,369 ->
    1,415 (2% increased maximum Life per Strength Mote). Not closed here: PoB keeps every Mote at that maximum all fight,
    while the game gains "a random Mote every second" (base_active_skill_buff_stack_gain_frequency_ms) and loses one when
    you are Hit; that stat stays open.
  sources: ["data/game-26476662/files/data/statdescriptions/specific_skill_stat_descriptions/virtuous_barrier.csd",
            "vendor/PathOfBuilding-PoE2/src/Modules/CalcSetup.lua 1839-2284, 2535-2538",
            "scratch/gem10/probe_barrier.json (POE2T2068)"]
  test_in_game: "Not needed: PoB matches the text on probe."
  status: proposed

- id: model-gem10-righteous-descent-fragments
  title: "Righteous Descent: an Empowered leap per Fragment of Divinity (The Ordained: one every 4 s), off its cooldown"
  kind: gem_stat
  match: '^skill_specific_stat_description_mode$'
  replace: ["1% more Damage"]
  share: descent_fragments
  stat_sets: {Righteous Descent: [Empowered]}
  stats: ["skill_specific_stat_description_mode"]
  skill: [Righteous Descent]
  confidence: theory
  notes: >-
    Mode text "Will Consume a Fragment of Divinity within 3 metres of you or targeted location when you leap to become
    Empowered"; ActiveSkills: "This skill does not use up its Cooldown when empowered"; poe2db (14 Nov 2026): "Does not
    consume a Cooldown Use". Probe POE2T2069 (real PoB, our models on): both sets at Speed 0.0997 (one per 10.03 s
    cooldown), the search calculating Empowered (183.6 vs 94.8). Fragments: The Ordained, "Create a Fragment of Divinity
    in your Presence every 4 seconds", also the one grant of the skill found (checked: Stats ids holding divin +
    fragment and their Mods / PassiveSkills carriers: UniqueDivineFragments1 only; PoB's uniques; poe2db's page lists no
    other source). Counted on the Empowered set: 0.25 leaps/s against PoB's rate, about 2.5x (an UNDERCOUNT);
    models.descent_fragments_share. LOW: the player reaches each fragment. Not counted (labelled): the Impact uses on
    cooldown between fragments, the 10% Life / Mana recovered per consume, the leaps' time against other skills.
  sources: ["data/game-26476662/tables/ActiveSkills.json (righteous_descent)", "data/game-26476662/tables/KeywordPopups.json (DivineFragment)",
            "data/game-26476662/tables/Mods.json (UniqueDivineFragments1)", "vendor/PathOfBuilding-PoE2/src/Data/Uniques/spear.lua (The Ordained)",
            "poe2db.tw/us/Righteous_Descent (14 Nov 2026)", "scratch/gem10/probe_descent.json (POE2T2069)"]
  test_in_game: "With The Ordained against a boss, leap onto each Fragment of Divinity: count the Empowered leaps over 20 s (about 5, against 2 on cooldown)."
  status: proposed

- id: model-gem10-support-life-loss
  title: "Medved's Felling's and Paquate's Pact's Life lost on use, charged per second (PoB charges none)"
  kind: model
  model: gem_life_loss
  stats: ["lose_x%_of_life_per_5_rage_on_supported_skill_use",
          "support_corrupting_cry_%_life_cost_per_supported_skill_trigger_or_use_recently_up_to_30%"]
  skill: [Medved's Felling, Paquate's Pact]
  confidence: theory
  notes: >-
    PATCH_CHECK H1-2 / H1-3 (NOTES2, 0.5.0 notes): both supports make you lose Life on use, and PoB maps neither stat
    (checked: no SkillStatMap entry or Modules reader for either id; coverage.json mapped=false): an OVERCOUNT, the Life
    never charged. models.gem_life_loss / gem_stat_life_loss: per use, Medved's Felling 1% of Life per 5 Rage (PoB's Rage
    stat, the one its attack speed line reads), Paquate's Pact 10% of Life per use in the last 4 s up to 30% (the use
    itself counted: LOW, UNVERIFIED); times the supported skill's own use rate (PoB's Speed for the main skill, the
    bridge's useRates with the search's press share for a side skill), given to PoB as LifeDegen (taken off
    LifeRegenRecovery, which the recovery floors read). Not counted (labelled): Medved's Felling on a side skill (its Rage
    is read for the main skill only).
  sources: ["vendor/PathOfBuilding-PoE2/src/Data/Skills/other.lua (SupportMedvedsFelling)",
            "vendor/PathOfBuilding-PoE2/src/Data/Skills/sup_str.lua (SupportCorruptingCryPlayerThree)",
            "vendor/PathOfBuilding-PoE2/src/Modules/CalcDefence.lua 1746-1752 (LifeDegen)",
            "scratch/manager/PATCH_CHECK.md H1-2, H1-3 (patch 0.5.0)"]
  test_in_game: "Attack with a Medved's Felling skill at 30 Rage: each use should take 6% of maximum Life."
  status: proposed

- id: no-effect-gem10-conductive-runes-not-weapon
  title: "Conductive Runes' explosion isn't based on weapon damage: PoB's Explosion set is a non-weapon attack"
  kind: gem_stat
  match: '^replace_main_hand_unarmed_attack_stats_with_nothing_type$'
  replace: []
  stats: ["replace_main_hand_unarmed_attack_stats_with_nothing_type"]
  skill: [Conductive Runes]
  confidence: datamined
  notes: >-
    The stat sits on Conductive Runes' Explosion set, whose PoB baseFlags hold nonWeaponAttack (Data/Skills: the
    Explosion statSet), so PoB uses no weapon or unarmed damage there. Patch 0.5.2 (newest of its entries,
    grep_notes.py --history): "Improved Conductive Runes' description to explicitly state that its damage is not based
    on your weapon's damage". The two agree: PoB counts it (PATCH_CHECK H4's closable item; closes
    gems-active-batch3.yaml's UNVERIFIED for this skill; Caltrops stay open).
  sources: ["vendor/PathOfBuilding-PoE2/src/Data/Skills (Conductive Runes, Explosion set)", "patch notes 0.5.2"]
  test_in_game: "Not needed: the game text and PoB agree."
  status: proposed

- id: model-gem10-muster-reviving-kinds
  title: "Muster (and At your Command) count different kinds of Reviving minions, not every Persistent minion skill"
  kind: model
  model: muster_kinds
  stats: ["support_varied_troops_damage_+%_final_per_different_persistent_ominion"]
  skill: [Muster]
  confidence: datamined
  notes: >-
    PATCH_CHECK K5-1 (NOTES2). The game: "Supported Minions deal more Damage the more different kinds of Reviving Minions
    you have summoned"; patch 0.3.0 Hotfix 13 (newest, --history "Muster"): "Fixed a bug where Muster Support and the 'At
    your Command' Passive node were incorrectly counting Persistent Minions". PoB still counts every active skill typed
    Minion + Persistent (CalcPerform.lua 1393-1397), including Raging Spirits, Ravenous Swarm, Azmerian Swarms, Kelari's
    Malediction, Supporting Fire, Verisium Manifestations, Sacrifice, Cast on Minion Death and Grim Feast, none of which
    carry PoB's RevivingMinion flag (the game's is_resummoning_minion: checked, every PoB skill holding it, 23): an
    OVERCOUNT. models.muster_kinds_model overrides PoB's Multiplier:PersistentMinionTypes with the build's different
    skills whose minions carry that flag (the bridge's summon.reviveSpeed), while a skill has Muster socketed; both
    of its readers are the ones the hotfix fixed, but At your Command alone keeps PoB's count (COV-A's line). At your Command's tree text still says "Persistent Minion" (COV-A's line; the hotfix says it was fixed too).
  sources: ["vendor/PathOfBuilding-PoE2/src/Modules/CalcPerform.lua 1393-1397",
            "vendor/PathOfBuilding-PoE2/src/Data/Skills/sup_int.lua (Muster, 7132)",
            "vendor/PathOfBuilding-PoE2/src/Data/SkillStatMap.lua (is_resummoning_minion -> RevivingMinion)",
            "patch notes 0.3.0, 0.3.0 Hotfix 13", "scratch/manager/PATCH_CHECK.md K5-1"]
  test_in_game: "Muster on Skeletal Warriors with Raging Spirits and Sacrifice also active: the Warriors' damage shouldn't rise when those two are turned on."
  status: proposed
