- id: model-read-cov58c-blind-on-hit
  title: "Blind on Hit from the skills' own stats (attacks_chance_to_blind_on_hit_%: Twister, Flash Grenade) read by Conditions._skill_blind (MECH109)"
  kind: model
  model: blind
  stats: ["attacks_chance_to_blind_on_hit_%"]
  confidence: MEDIUM
  notes: >-
    conditions.BLIND_HIT_STATS: _skill_blind reads every enabled active skill's level stats and supports for the chance
    (the attack stat on attacks only; Blindside's cannot_inflict_blind excluded), x its hits on the boss, 4 s each, into
    the share of the fight the boss is Blinded (the "vs Blinded" lines, Blind's own effects). Every carrier (Twister,
    Flash Grenade, their stat sets) goes through the same reader, so no skill limit. global_chance_to_blind_on_hit_% is
    PoB-read already (status pob). A link only.
  sources: ["builder/search/conditions.py (BLIND_HIT_STATS, Conditions._skill_blind)"]
  status: proposed

