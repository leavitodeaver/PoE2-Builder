- id: gem-cov58c-delays-keep-the-rate
  title: "A fixed delay before a hit keeps the hits a second over a fight (Pounce / Cross Slash's shockwave, Decompose's explosion, Rampage's aftershock)"
  kind: gem_stat
  match: '^(wolf_pounce_mark_shockwave_delay_ms|explosion_delay_ms|aftershock_delay_ms)$'
  replace: []
  skill: [Pounce, Cross Slash, Decompose, Rampage]
  confidence: theory
  notes: >-
    The manager's ruling (25 Nov 13:23, item 3: settled, no change; MECHB63 / MECHB64 with RESEARCH59 R59-12,
    delayed-hit-cancel-r59.md, MEDIUM-LOW): nothing the player does cancels a queued delayed hit (no game text cancels
    either; past failures were bugs GGG fixed: 0.2.0 Shattering Palm, 0.5.5 Bitter Dead, 0.3.0 fungus), so a fixed delay
    (150 ms shockwave, 400 ms explosion, Rampage's aftershock) shifts each hit later and keeps the rate; only the boss
    leaving the area in the delay or a phase immunity loses one (under ~5% for Decompose at the cloud's edge, not
    modelled). No model needed; decided, not open. Other carriers of explosion_delay_ms / aftershock_delay_ms weren't
    researched and stay open.
  sources: ["scratch/manager/research/delayed-hit-cancel-r59.md (R59-12)", "the manager's 13:23 note, item 3"]
  status: proposed
