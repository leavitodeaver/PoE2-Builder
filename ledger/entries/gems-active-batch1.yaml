# Active-gem stats PoB never reads, batch 1 (COVC1, 12 Nov 2026): the top of the coverage audit's gem-stat ranking.
# Skill lists are the active skills (not supports: COV-E's) whose stat set carries the stat in the data dump
# (data/pob-bb52d6b368/coverage.json); the same stat on any other skill stays open.
#
# Three kinds of record:
# 1. PoB counts it another way (kind gem_stat, `stats` + `skill`, empty replace): the stat is a flag or a number PoB
#    takes from another field of its skill data. Each was checked skill by skill and stat set by stat set
#    (scratch/covc/flagcheck.py); the skills where PoB's other field is missing are left open and listed in COVC1's report.
# 2. Read by one of our models (kind model, `stats` + `skill`): the model's code names the skills and takes the number
#    from the game files.
# 3. Changes nothing the tool calculates (kind gem_stat, empty replace): aiming, animation, input queueing, spawn
#    position, UI. Evidence for each: the game's stat descriptions (data/game-26476662/files, every .csd) have no line for
#    it, so the game shows the player nothing; PoB reads it nowhere (vendor src, every .lua outside the skill data); our
#    code reads it nowhere; poe2db's gem page lists it as a bare internal stat with no text (Glacial Bolt, fetched
#    12 Nov 2026). What the name says it does is a reading of the id, so these carry confidence `theory`.


