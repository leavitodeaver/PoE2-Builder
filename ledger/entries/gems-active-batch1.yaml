          "Hammer of the Gods", "Spear of Solaris", "Starborn Onslaught", "War Banner"]
  confidence: datamined
  notes: >-
    models.GLORY_SKILLS: each event gives the stat's 100% of the boss's monster Power (20) = 20 Glory (banners: attack
    hits; Spear of Solaris and Starborn Onslaught: Freezes; Archon of Chayula: Chaos hits; Apocalypse: Elemental hits;
    Hammer of the Gods: Heavy Stuns; Ancestral Cry: Ignites), events from the main skill (glory_events). The banners'
    active_skill_can_generate_glory_even_if_an_instance_of_this_skill_is_active is what lets the model keep building
    Glory while a banner stands, as it does. Undercounts the model labels: Glory from other skills' hits, increased
    Glory generation.
  sources: ["builder/search/models.py GLORY_SKILLS, glory_events"]
  test_in_game: "Not needed for boss damage."
  status: proposed

