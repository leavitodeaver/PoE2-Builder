# Unique items' lines, third batch (COVD3, 12 Nov 2026): Hrimnor's Hymn's Aftershock (RESEARCH7 #43), Drillneck's
# per-Pierce lines (plans/kw-pierce.md, with PLANS3's correction), then the coverage audit's open unique lines from
# about rank 140 (builder/ledger/coverage.py; the ranking as of origin/main 4dfe466 + uniques-batch1/2.yaml).
#
# Game files: data/game-26476662/tables (Mods.json, Stats.json, KeywordPopups.json). Unique texts: PoB's export
# (data/pob-bb52d6b368/uniques.json). Patterns accept a roll range or a rolled number: (\(\d+-\d+\)|\d+).
# PoE2 0.5.x; recheck at the 1.0 refresh.

# Aftershocks ------------------------------------------------------------------------------------------------------

- id: uniques-hrimnors-hymn-aftershock
  title: Hrimnor's Hymn, Slam Skills you use yourself cause an additional Aftershock (100% chance)
  kind: pob_gap
  match: '^Slam Skills you use yourself cause an additional Aftershock$'
  replace: ['Slam Skills have 100% more DPS']
  confidence: datamined
  notes: >-
    The line is Mods UniqueAftershockChance1: stat 21650 your_slam_aftershock_chance_% at 100 (the same stat as
    Earthbreaker's 25% and UniqueMutatedVaalAftershockChance's 5-10%, which ledger aftershock-chance translates).
    KeywordPopups Aftershock: "If not otherwise specified, the Aftershock will deal the same damage as the initial
    impact, in the same area", so a boss inside the slam is hit twice by every slam: x2 slam hit damage. PoB leaves
    the line unparsed (ModCache: nil), so before COVD3 the build got x1.
    FORM (COVD6, AUDIT8 A8-1): a second hit is a second application, not a bigger one. "Slam Skills deal 100% more
    Damage" (COVD3's form) doubled the Ignite, Bleed and Poison too, since PoB takes an ailment's base from the hit's
    stored damage (CalcOffence.lua 5040-5061, StoredHitMin / Max). "more Damage with Hits" does the same (KeywordFlag
    Hit, but the stored hit already holds it): measured with Ignite, Bleed and Poison, "more Damage" gave Ignite,
    Bleed and Poison x2.0 on Sunder, and "more Damage with Hits" gave exactly the same numbers on Earthquake. KeywordPopups Debuff: "Unless otherwise stated, Debuffs of the same type do not stack
    - only the copy with the strongest effect applies"; the Ignite, Bleeding and Poison definitions state no
    stacking, and PoB starts every build at one Poison (CalcSetup.lua 57 PoisonStacksMax 1; more only from lines
    such as "Targets can be affected by +N of your Poisons", stats number_of_additional_poison_stacks,
    poisons_can_stack_infinitely). So a second equal hit adds a second chance to apply and a second roll, not a
    bigger ailment (the audit's "Poison stacks" holds only with such a line; checked: KeywordPopups Debuff, Ignite,
    Bleeding, Poison; Stats.json ids with poison + stack / additional; PoB CalcSetup and ModParser 3258 / 3974).
    PoB's "DPS" MORE (the mod Supercharged Slam's stages use, act_str.lua 18913) is that: it multiplies hits per
    second (TotalDPS, CalcOffence 4576) and ailment applications (ailmentStacks 5254, capped by the max stacks at
    5398); it leaves the ailment's base (the stored hit) alone. Measured on Sunder (Ignite, Bleed, Poison, 25-100% chances): hit DPS x2.00,
    Ignite x1.15, Poison x1.25 (one stack; from the higher roll that wins), Bleed x1.84 (its uptime was 0.9 and its
    roll range is wide); with extra Poison stacks Poison rises with the applications, up to x2.
    Not counted: a second chance at Shock / Freeze / Electrocute / stun buildup per slam (PoB's buildup reads the
    per-hit damage): a small undercount.
    SKILL DoT NOT MULTIPLIED (COVD8, RESEARCH16 aftershock-ground-dot.md: an Aftershock repeats the damage burst, not
    the skill's ground or own damage over time): PoB multiplies TotalDot by DpsMultiplier only inside
    `if skillModList:Flag(nil, "DotCanStack")` (CalcOffence 6129-6139); otherwise TotalDot = TotalDotInstance (6179),
    untouched. Nothing in this PoB sets DotCanStack (checked: grep -rni "canstack" over vendor/PathOfBuilding-PoE2/src,
    every .lua incl. Data/ModCache.lua, Data/Skills/*.lua and Modules: only CalcOffence reads it, plus the
    DotCanStackAsTotems flag that nothing sets either; the PoisonCanStack / ChillCanStack / ShockCanStack hits are
    other flags). So the form leaves a slam's own DoT alone, as the game does. The other DpsMultiplier reads are per
    hit (culling 4067, leech 4950, Impale 6361-6365): right for an extra hit. AILMENTS (RESEARCH16's stack worry):
    PoB's active ailments are min(applications, max stacks) (CalcOffence 5399), so with one Poison / Ignite / Bleed
    slot the extra Aftershock never adds a stack: it adds uptime where the build is below full uptime, and above it
    shifts the kept copy to the higher roll ((S - (max-1)/2) / (S + 1), 5313; the measured Poison x1.25 / Ignite x1.15
    on Sunder are this roll shift, at S >= 1). Two labelled residuals, routed to MECH-B (aftershocks): (a) PoB counts
    a slam's applications as 2p per slam where the impact and its Aftershock land together, so the real chance of at
    least one is 1 - (1-p)^2: below full uptime that's an OVERCOUNT of the ailment part by up to 2 / (2 - p) (x1.33
    at p = 0.5, none at full uptime or p near 0); (b) the roll shift assumes the Aftershock rolls its damage apart from
    the impact ("the same damage as the initial impact" may mean the same roll: UNVERIFIED; if so, Poison / Ignite
    gain only uptime). SCREENING: for slams PoB shows as an average hit (showAverage, e.g. Sunder, Earthquake),
    CombinedDPS is the per-use damage and no "DPS" multiplier reaches it; the finalists' FullDPS has it. Routed to
    SEARCH (the same holds for attack speed on those skills).
    Same two known gaps as aftershock-chance: (1) "you use yourself" is dropped (a triggered or totem slam gets the
    more too, an overcount for those builds); (2) STACKING: the game sums every your_slam_aftershock_chance_% source
    into one chance and rolls it once (RESEARCH7 aftershock-chance-stacking.md), while each ledger line here is its
    own MORE. With Hrimnor's Hymn at 100% any other chance line likely adds nothing (over 100% assumed capped at one
    extra Aftershock: UNVERIFIED, research INDEX #40), so Hymn + Earthbreaker reads x2.5 where the capped game gives
    x2 until COV-A's summed model, min(1, total chance / 100), replaces the per-line MOREs. That model must count
    this line as 100.
  sources: ["https://poe2db.tw/us/Hrimnors_Hymn", "data/game-26476662/tables/Mods.json (UniqueAftershockChance1)",
            "data/game-26476662/tables/KeywordPopups.json (Aftershock)",
            "scratch/manager/research/aftershock-chance-stacking.md (RESEARCH7)",
            "vendor/PathOfBuilding-PoE2/src/Data/Uniques/mace.lua (Hrimnor's Hymn)",
            "vendor/PathOfBuilding-PoE2/src/Modules/CalcOffence.lua (4065, 5040-5061, 5254, 5398)"]
  test_in_game: "Slam a training dummy with Hrimnor's Hymn: every slam shows a second impact in the same place for the same damage. Then add Earthbreaker: does any slam ever show a third impact?"
  status: proposed

# Pierce (plans/kw-pierce.md groups A and B) -------------------------------------------------------------------------

- id: uniques-drillneck-per-pierce-damage
  title: Drillneck, Projectiles deal (42-64)% increased Damage with Hits for each time they have Pierced (0 on a lone boss)
  kind: pob_gap
  match: '^Projectiles deal (\(\d+-\d+\)|\d+)% increased Damage with Hits for each time they have Pierced$'
  replace: []
  confidence: datamined
  notes: >-
    No effect on the boss score: a projectile hitting a lone boss has Pierced nothing yet when the hit lands
    (KeywordPopups Pierce: "Projectiles that Pierce can pass through a target while still damaging them"; the pierce
    happens at that hit, and a lone boss leaves no second target after it). PoB doesn't apply the line either:
    ModCache 8995-8997 parse it with the leftover " for each time they have Pierced ", and Classes/Item.lua applies
    no line with leftover text (`not modLine.extra`, 2785 / 2839; PLANS3's correction at the top of
    plans/kw-pierce.md: the plan's "PoB applies it in full" was wrong). So this records the 0 rather than changing a
    number: the audit stops listing it, and if a later PoB learns the sentence the boss score still gets nothing.
    Not counted: the one hit that can come after a Pierce on a lone boss, a returning projectile's second hit
    (MECH-B's return model, from another Return source such as Breachlord's Amalgam; Drillneck's own Return needs
    2-4 Pierces): it would get this bonus once. Routed to MECH-B (small undercount, only Drillneck plus another
    Return source).
  sources: ["https://poe2db.tw/us/Drillneck", "data/game-26476662/tables/Mods.json (UniqueProjectileIncreasedDamagePerPierce1)",
            "data/game-26476662/tables/KeywordPopups.json (Pierce)",
            "vendor/PathOfBuilding-PoE2/src/Data/ModCache.lua (8995-8997)",
            "vendor/PathOfBuilding-PoE2/src/Classes/Item.lua (2785, 2839: not modLine.extra)"]
  test_in_game: "Not needed for boss damage. On a pack, a projectile's second and later targets take the line's value more per target pierced."
  status: proposed

