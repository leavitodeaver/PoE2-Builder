# Aftershocks ------------------------------------------------------------------------------------------------------

- id: uniques-hrimnors-hymn-aftershock
  title: Hrimnor's Hymn, Slam Skills you use yourself cause an additional Aftershock (100% chance)
  kind: pob_gap
  match: '^Slam Skills you use yourself cause an additional Aftershock$'
  replace: ['Slam Skills deal 100% more Damage']
  confidence: datamined
  notes: >-
    The line is Mods UniqueAftershockChance1: stat 21650 your_slam_aftershock_chance_% at 100 (the same stat as
    Earthbreaker's 25% and UniqueMutatedVaalAftershockChance's 5-10%, which ledger aftershock-chance already
    translates). KeywordPopups Aftershock: "If not otherwise specified, the Aftershock will deal the same damage as
    the initial impact, in the same area", so a boss inside the slam is hit twice by every slam: x2 slam damage.
    PoB leaves the line unparsed (ModCache: nil; the audit lists it "PoB ignores the line"), so before this entry
    the build got x1. Same translation and the same two known gaps as aftershock-chance: (1) "you use yourself" is
    dropped (a triggered or totem slam gets the more too, an overcount for those builds, as aftershock-chance has
    today); (2) STACKING: the game sums every your_slam_aftershock_chance_% source into one chance and rolls it once
    (RESEARCH7 aftershock-chance-stacking.md, the virtual_*_slam_aftershock_chance_% stats), while each ledger line
    here is its own MORE. With Hrimnor's Hymn at 100% any other chance line likely adds nothing (over 100% assumed
    capped at one extra Aftershock: UNVERIFIED, research INDEX #40), so Hymn + Earthbreaker reads x2.5 where the
    capped game gives x2 (+25% overcount) until COV-A's summed model, min(1, total chance / 100), replaces the
    per-line MOREs. That model must count this line as 100.
  sources: ["https://poe2db.tw/us/Hrimnors_Hymn", "data/game-26476662/tables/Mods.json (UniqueAftershockChance1)",
            "data/game-26476662/tables/KeywordPopups.json (Aftershock)",
            "scratch/manager/research/aftershock-chance-stacking.md (RESEARCH7)",
            "vendor/PathOfBuilding-PoE2/src/Data/Uniques/mace.lua (Hrimnor's Hymn)"]
  test_in_game: "Slam a training dummy with Hrimnor's Hymn: every slam shows a second impact in the same place for the same damage. Then add Earthbreaker: does any slam ever show a third impact?"
  status: proposed

# Pierce (plans/kw-pierce.md groups A and B) -------------------------------------------------------------------------

- id: uniques-drillneck-per-pierce-damage
  title: Drillneck, Projectiles deal (42-64)% increased Damage with Hits for each time they have Pierced (0 on a lone boss)
  kind: pob_gap
  match: '^Projectiles deal (\(\d+-\d+\)|\d+)% increased Damage with Hits for each time they have Pierced$'
  replace: []
  confidence: datamined
  notes: >-
    No effect on the boss score: a projectile hitting a lone boss has Pierced nothing yet when the hit lands
    (KeywordPopups Pierce: "Projectiles that Pierce can pass through a target while still damaging them"; the pierce
    happens at that hit, and a lone boss leaves no second target after it). PoB doesn't apply the line either:
    ModCache 8995-8997 parse it with the leftover " for each time they have Pierced ", and Classes/Item.lua applies
    no line with leftover text (`not modLine.extra`, 2785 / 2839; PLANS3's correction at the top of
    plans/kw-pierce.md: the plan's "PoB applies it in full" was wrong). So this records the 0 rather than changing a
    number: the audit stops listing it, and if a later PoB learns the sentence the boss score still gets nothing.
    Not counted: the one hit that can come after a Pierce on a lone boss, a returning projectile's second hit
    (MECH-B's return model, from another Return source such as Breachlord's Amalgam; Drillneck's own Return needs
    2-4 Pierces): it would get this bonus once. Routed to MECH-B (small undercount, only Drillneck plus another
    Return source).
  sources: ["https://poe2db.tw/us/Drillneck", "data/game-26476662/tables/Mods.json (UniqueProjectileIncreasedDamagePerPierce1)",
            "data/game-26476662/tables/KeywordPopups.json (Pierce)",
            "vendor/PathOfBuilding-PoE2/src/Data/ModCache.lua (8995-8997)",
            "vendor/PathOfBuilding-PoE2/src/Classes/Item.lua (2785, 2839: not modLine.extra)"]
  test_in_game: "Not needed for boss damage. On a pack, a projectile's second and later targets take the line's value more per target pierced."
  status: proposed

