  kind: pob_gap
  match: '^Inflict Corrupted Blood for (\(\d+-\d+\)|\d+) seconds on Block, dealing (\(\d+-\d+\)|\d+)% of$'
  replace: ['Inflict Corrupted Blood for {1} seconds on Block, dealing {2}% of your maximum Life as Physical damage per second']
  confidence: datamined
  notes: >-
    As uniques-rampart-raptor-ammo: PoB's item parser joins the two lines itself (Classes/Item.lua 1240-1251) and the
    whole sentence is in ModCache (8344: ExtraSkill BloodbarrierPlayer with its duration and %-of-Life stats), so PoB
    already grants the skill; this writes the join out. The skill's damage to the boss is a separate skill fired on
