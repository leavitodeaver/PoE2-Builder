# Two-line mods PoB's own item parser joins (ranks 150, 207-208) -----------------------------------------------------

- id: uniques-rampart-raptor-ammo
  title: Rampart Raptor, Bolts fired by Crossbow Attacks have 100% chance to not expend Ammunition if you've Reloaded Recently (first half of a two-line mod)
  kind: pob_gap
  match: '^Bolts fired by Crossbow Attacks have (\(\d+-\d+\)|\d+)% chance to not$'
  replace: ["Bolts fired by Crossbow Attacks have {1}% chance to not expend Ammunition if you've Reloaded Recently"]
  confidence: datamined
  notes: >-
    PoB's export breaks the mod over two lines. The audit parses each line alone and lists both as ignored, but PoB's
    item parser itself joins a line that fails to parse with the next one (Classes/Item.lua 1240-1251, "Try to combine
    it with the next line"), and the whole sentence is in ModCache (6762: ChanceToNotConsumeAmmo BASE 100, Crossbow
    ammo skills, Condition ReloadedRecently). So PoB already counts it; this entry writes the join out so the result
    doesn't depend on that fallback (same as uniques-waveshaper-mana-regen-to-es-recharge). The tool never sets
    ReloadedRecently (checked: grep over builder/search: no ReloadedRecently), so the bonus stays off in our numbers:
    routed (crossbow reload cycle, MECH-B / SEARCH).
  sources: ["https://poe2db.tw/us/Rampart_Raptor", "data/pob-bb52d6b368/uniques.json (Rampart Raptor)",
            "vendor/PathOfBuilding-PoE2/src/Data/ModCache.lua (6762)",
            "vendor/PathOfBuilding-PoE2/src/Classes/Item.lua (1240-1251)"]
  test_in_game: "Not needed: the sentence is the game's own mod text."
  status: proposed

- id: uniques-rampart-raptor-ammo-second-line
  title: Rampart Raptor, second half of the two-line mod ("expend Ammunition if you've Reloaded Recently")
  kind: pob_gap
  match: "^expend Ammunition if you've Reloaded Recently$"
  replace: []
  confidence: datamined
  notes: "Carried by uniques-rampart-raptor-ammo, which translates the whole sentence from its first line."
  sources: ["data/pob-bb52d6b368/uniques.json (Rampart Raptor)"]
  test_in_game: "As uniques-rampart-raptor-ammo."
  status: proposed

- id: uniques-bloodbarrier-corrupted-blood
  title: Bloodbarrier, Inflict Corrupted Blood for 5 seconds on Block, dealing 50% of your maximum Life as Physical damage per second (first half of a two-line mod)
  kind: pob_gap
  match: '^Inflict Corrupted Blood for (\(\d+-\d+\)|\d+) seconds on Block, dealing (\(\d+-\d+\)|\d+)% of$'
  replace: ['Inflict Corrupted Blood for {1} seconds on Block, dealing {2}% of your maximum Life as Physical damage per second']
  confidence: datamined
  notes: >-
    As uniques-rampart-raptor-ammo: PoB's item parser joins the two lines itself (Classes/Item.lua 1240-1251) and the
    whole sentence is in ModCache (8344: ExtraSkill BloodbarrierPlayer with its duration and %-of-Life stats), so PoB
    already grants the skill; this writes the join out. The skill's damage to the boss is a separate skill fired on
    Block, not the main skill: whether the search adds it to the boss DPS (at the build's block rate against the
    boss preset's hits) is routed to MECH-B (triggered skills from items) and MECH-A (Corrupted Blood).
  sources: ["https://poe2db.tw/us/Bloodbarrier", "data/pob-bb52d6b368/uniques.json (Bloodbarrier)",
            "vendor/PathOfBuilding-PoE2/src/Data/ModCache.lua (8343-8344)",
            "vendor/PathOfBuilding-PoE2/src/Modules/ModParser.lua (inflict corrupted blood for ... on block)"]
  test_in_game: "Not needed: the sentence is the game's own mod text."
  status: proposed

- id: uniques-bloodbarrier-corrupted-blood-second-line
  title: Bloodbarrier, second half of the two-line mod ("your maximum Life as Physical damage per second")
  kind: pob_gap
  match: '^your maximum Life as Physical damage per second$'
  replace: []
  confidence: datamined
  notes: "Carried by uniques-bloodbarrier-corrupted-blood, which translates the whole sentence from its first line."
