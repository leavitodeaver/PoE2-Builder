# Lines a model already reads (rank 175) -------------------------------------------------------------------------------

- id: uniques-model-sculpted-suffering-armour-break
  title: Sculpted Suffering, Breaks Armour equal to 40% of damage from Hits with this weapon (Armour Break uptime)
  kind: pob_gap
  model: debuff_uptimes
  match: '^Breaks Armour equal to (\(\d+-\d+\)|\d+)% of damage from Hits with this weapon$'
  replace: []
  confidence: datamined
  notes: >-
    builder/search/conditions.py reads it for the Armour Broken box: ARMOUR_BREAK_LINE matches "Breaks Armour", and
    _armour_break_source takes "equal to 40% of damage from hits" as 40% of the main skill's average hit x its hits per
    second (checked by running _armour_break_source on the line). PoB ignores the line. Known gap, routed to MECH-A:
    "with this weapon" isn't kept: conditions.qualifies passes the line for a Spell main skill too (checked: qualifies
    returns True for {Spell, Projectile}), so a Warpick wielder whose main skill is a spell gets breaks the game
    wouldn't give (an overcount of the Armour Broken share for that rare case).
  sources: ["https://poe2db.tw/us/Sculpted_Suffering", "builder/search/conditions.py (ARMOUR_BREAK_LINE, _armour_break_source)",
            "data/pob-bb52d6b368/uniques.json (Sculpted Suffering)"]
  test_in_game: "Hit a dummy with the Warpick: its Armour bar drops by 40% of each hit's damage."
  status: proposed
