  sources: ["https://poe2db.tw/us/Drillneck", "data/game-26476662/tables/Mods.json (UniqueProjectileIncreasedCriticalHitChancePerPierce1)",
            "vendor/PathOfBuilding-PoE2/src/Data/ModCache.lua (9047, 9050)"]
  test_in_game: "As uniques-drillneck-per-pierce-damage."
  status: proposed

- id: uniques-drillneck-return-after-pierces
