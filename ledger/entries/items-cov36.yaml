- id: model-melee-range-if-projectile-hit-recently
  title: '"+N metres to Melee Strike Range if you''ve dealt a Projectile Attack Hit in the past eight seconds" at the build''s own share'
  kind: pob_gap
  model: projectile_hit_recently
  match: '^\+(\d+(?:\.\d+)?) metres to Melee Strike Range if you''ve dealt a Projectile Attack Hit in the past eight seconds$'
  replace: []
  confidence: theory
  notes: >-
    Adaptable Assault (passive notable). PoB parses it (ModCache 93) under Condition:HitProjectileRecently, which only its
    unset Configuration box sets: 0 before. models.projectile_hit_recently_model (COV35's, widened by COV36) adds
    "+N metres to Melee Strike Range" at N x the share of the fight with a Projectile Attack Hit in the past 8 s
    (1 - e^(-8 s x the build's Projectile Attack hits/s); none: 0). PoB reads strike range only for skills whose area is
    the weapon's range (CalcOffence 570 / 1516). Empty replace: the model's line is the only count.
  sources: ["builder/search/models.py (PROJECTILE_HIT_RANGE, projectile_hit_recently_model)",
            "vendor/PathOfBuilding-PoE2/src/Data/ModCache.lua 93"]
  status: proposed

