# COV36 (COV-A), 16 Nov 2026: item-line entries.

- id: parse-hand-wraps-attack-crit-chance-is
  title: '"Critical Hit chance for Attacks is X%" (Maligaro''s hand wraps): PoB sets the final chance (UNVERIFIED)'
  kind: parse_checked
  match: '^Critical Hit chance for Attacks is [(\d.\-)]+%$'
  confidence: theory
  notes: >-
    The line is the hand-wraps form of Maligaro's Virtuosity (Way of the Stonefist; game Mods
    HandWrapsUniqueCriticalStrikeMultiplierOverride1, stat attack_crit_chance_override_% 25-40, builds 26476662 and
    26650308). PoB parses it as CritChance OVERRIDE for Attacks (ModCache "Critical Hit chance for Attacks is 33%":
    flags 1 = Attack, type OVERRIDE), so every increased / more crit chance modifier does nothing for attacks while it is
    worn, and "Base Critical Hit Chance ... is N%" / "This Weapon's Critical Hit Chance is N%" lines are overridden too.
    That matches the wording by the user's working rule (memory mod-wording-sets-vs-adds.md, MEDIUM: "X is N" with no
    "Base" sets the final value; a stat id's "override" doesn't decide, Gloamgown's 0.3.0 fix), but no test or developer
    statement settles it (RESEARCH27, wording-rule-exceptions.md "Hand wraps ...": UNVERIFIED; the manager, 15 Nov 23:30:
    "PoB treats it as the final chance, which matches the wording but is untested. Label it in the ledger"). If the game
    treats it as a base that increases still scale, PoB under-counts attack crit with it. Left as PoB parses it.
  sources: ["vendor/PathOfBuilding-PoE2/src/Data/ModCache.lua (Critical Hit chance for Attacks is 33%)",
            "data/game-26476662/tables/Mods.json (HandWrapsUniqueCriticalStrikeMultiplierOverride1)",
            "C:/PROJECTS/PoE2 Builder/scratch/manager/research/wording-rule-exceptions.md (RESEARCH27, R27-5)"]
  test_in_game: "With the hand wraps on, the attack's crit chance on its tooltip stays at the line's roll when an increased Critical Hit Chance modifier is added or removed (final), or rises with it (a base)."
  status: proposed

- id: items-minions-revive-slower
  title: '"Minions Revive N% slower": PoB reads only "faster", so the downside was dropped (an OVERCOUNT for minion builds)'
  kind: pob_gap
  match: '^Minions Revive (-?\d+(?:\.\d+)?)% slower$'
  replace: ['mod:MinionRevivalSpeed INC {-g1}']
  confidence: datamined
  notes: >-
    The game stat minion_resummon_speed_+% (Mods: MinionReviveSpeed1-4, JewelMinionReviveSpeed, UniqueMinionReviveSpeed1-3,
    UniqueHeartPrefixMinionReviveSpeed, UniqueLoreweaveHeartbound2 / 2BigRange; build 26476662, unchanged in 26650308)
    reads "Minions Revive N% faster" for a positive value and "N% slower" for a negative one (UniqueMinionReviveSpeed3
    -50; Loreweave's Heartbound effect with Ventor's wider roll, -25 to 25). PoB's ModParser has only
    "minions revive (%d+)% faster" -> MinionRevivalSpeed INC (4748), so "slower" lines parse to nothing (ModCache 8624 /
    8629 keep the leftover text) and every reader of MinionRevivalSpeed (CalcOffence 1616's revival time, which the
    bridge reports as summon.reviveSpeed for models.revive_seconds: minion deaths, Cast on Minion Death, Grim Feast) saw
    the faster revival. The line is the raw modifier MinionRevivalSpeed INC -N (a negative N, "-10% slower", is +10).
  sources: ["vendor/PathOfBuilding-PoE2/src/Modules/ModParser.lua 4748", "vendor/PathOfBuilding-PoE2/src/Data/ModCache.lua 8624-8632",
            "data/game-26476662/tables/Mods.json (minion_resummon_speed_+%)"]
  test_in_game: "A Reviving minion's revive time with the line is longer by 1 / (1 - N/100) against without it."
  status: proposed

