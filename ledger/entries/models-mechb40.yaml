- id: model-mechb40-forced-revives
  title: "Forced revives (Replenishing Horde, Citaqualotl's Thesis' Offering line, the Mana Flask line): fallen minions back at once (models.forced_revives)"
  kind: pob_gap
  model: forced_revives
  match: '^(\d+(?:\.\d+)?% Chance to revive a random Permanent Minion whenever you use a Command Skill|One of your Persistent Minions revives when an Offering expires|Using a Mana Flask revives one of your Persistent Minions)$'
  replace: []
  confidence: theory
  notes: >-
    PoB has no mod for these lines. They matter where the build kills its own Reviving minions (Sacrifice, Minion Pact,
    Explosive Demise), whose damage now counts only while alive (models.minion_alive_model, an OVERCOUNT before): each
    forced revive takes one fallen minion off the floor at the build's own rate, Replenishing Horde's chance x the
    Command uses (command_uses, each on its cooldown), an Offering's base duration (OFFERING_SECONDS), the Mana flask's
    uses a second (flasks.uses_per_second); Skeletal Clerics' Revive (every 5 s, game files) too. MEDIUM: each taken to
    find a fallen minion. Not yet fed into minion_deaths' cap (the deaths-fed Energy / buffs: an undercount, said).
  sources: [builder/search/models.py (forced_revives, minion_alive_model), builder/search/assumptions.py (mana_flask_uses)]
  status: proposed

