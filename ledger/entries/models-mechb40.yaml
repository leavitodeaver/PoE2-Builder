# MECH-B's model entries (MECHB40).

- id: model-mechb40-tawhoa-vengeance
  title: "Tawhoa's Vengeance: a blast of 20% of the totem's Life as Physical each time a supported totem dies (models.tawhoa_model)"
  kind: model
  model: tawhoa
  stats: ["base_physical_damage_equal_to_%_of_totem_life", "triggered_on_death_%",
          "support_hardy_totems_trigger_splinter_explosion_on_death_chance_%"]
  skill: ["Tawhoa's Vengeance", "Tawhoa's Tending"]
  confidence: theory
  notes: >-
    PoB has the skill (TriggeredSplinterExplosionHardyTotems) but no code reads its damage stat (checked: the stat id
    appears in vendor PoB src only in sup_str.lua and its stat description file) and nothing gives it a trigger rate:
    it scored 0 (probe POE2T3395, an UNDERCOUNT for totem builds with the support). Now each death of a totem from the
    supported group's skill (models.totem_deaths' own count for that skill: expiring or replaced counts as dying,
    RESEARCH31 R31-2, MEDIUM) sets off one blast of 20% (the skill's own stat) of that totem's Life (the bridge's useRates
    totemLife: PoB's TotemLife on the totem-summoning skill, with the support's 25% more) as base Physical, scored by PoB
    as the group's triggered hit (SkillData Physical Min / Max, triggerRate; its group in Full DPS). Probe POE2T4602:
    Shockwave Totem 3,113 Life, 0.0625 deaths a second: +16.7 DPS. "Totem Life" read as maximum Life (MEDIUM); the boss
    inside the 3 m blast (MEDIUM). The flags base_skill_is_totemified and skill_disabled_unless_cloned are left as they
    are (PoB scores the hit once given a base: probe POE2T4602).
  sources: [builder/search/models.py (TAWHOA, tawhoa_model, totem_deaths each), builder/search/assumptions.py (totem_deaths out, the tawhoa call),
            engine/bridge.lua (useRates totemLife), vendor/PathOfBuilding-PoE2/src/Data/Skills/sup_str.lua 7299-7374]
  test_in_game: "Not needed for the shape; RESEARCH: does an expiring / replaced totem set it off, and is 'Totem Life' the maximum?"
  status: proposed

