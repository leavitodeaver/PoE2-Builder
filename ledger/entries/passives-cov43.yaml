# COV43 (COV-A, the audit's owner; COV-B, whose category this is, has been paused since 12 Nov): passive-tree lines a custom
# model already reads (model-read entries, `replace: []`). Each was checked to feed a number (charges, Rage, Glory,
# banners, ailments and grounds on the boss, recovery, a defence), not a play row alone: the function in `sources` reads
# the line and its result reaches the score. Left open on purpose (read, but no number moves): Bulwark's "Take N% less
# Damage from Hits while Dodge Rolling" (recovery.rolling_less_row: a row), sprint lines (recovery.sprint_row: a row),
# "Apply Debilitate to Enemies N Metres in front of you while your Shield is raised" (models.raised_plan rates Blind
# only), "-N seconds to current Energy Shield Recharge delay per Combo expended" (conditions.CURRENT_ES_LINE only
# flags a current-Energy-Shield line), "Allies in your Presence Regenerate N Rage per second ..." (conditions._rage_gain
# leaves allies' Rage out), Grinning Immolation's "Become Ignited when you deal a Critical Hit, taking 15% ... per second"
# (conditions._self_ignited sets the Ignited box from it, but no model found counting the burn: routed as an OVERCOUNT
# candidate, so not marked read).

- id: model-read-charges-instead
  title: '"Gain <kind> Charges instead of <kind> Charges" (conditions._charge_sources)'
  kind: pob_gap
  model: charges
  match: '^Gain (Power|Frenzy|Endurance) Charges instead of (Power|Frenzy|Endurance) Charges$'
  replace: []
  confidence: theory
  notes: >-
    conditions.CHARGE_INSTEAD redirects the build's gains of one kind to the other (_charge_sources), so the charges
    held of both kinds.
  sources: ["builder/search/conditions.py (CHARGE_INSTEAD, _charge_sources)"]
  status: proposed

- id: model-read-banner-limit
  title: '"There is no Limit on the number of Banners you can place" / "+N to maximum number of placed Banners" (conditions.banner_limit)'
  kind: pob_gap
  model: glory
  match: '^(There is no Limit on the number of Banners you can place|\+\d+ to maximum number of placed Banners)$'
  replace: []
  confidence: theory
  notes: >-
    conditions.BANNER_UNLIMITED / BANNER_MORE set how many banners stand at once (banner_limit), which scales PoB's one
    BannerPlanted box when the build has more banners than the limit (MECHC27).
  sources: ["builder/search/conditions.py (BANNER_UNLIMITED, BANNER_MORE, banner_limit)"]
  status: proposed

