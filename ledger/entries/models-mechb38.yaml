# MECH-B's model entries (MECHB38).

- id: model-read-valakos-charge-lightning-taken
  title: '"Grants Skill: Level (1-20) Valako''s Charge" (Lightning Coil; models.valako_model)'
  kind: pob_gap
  model: valako
  match: '^Grants Skill: Level \(?\d+(?:-\d+)?\)? Valako''s Charge$'
  replace: []
  confidence: theory
  notes: >-
    Valako's Charge triggers when the Lightning damage you take from hits reaches its threshold (17 at level 1, 628 at
    20; game files 26650308), at most once per its 1 s Cooldown. PoB's "cast when damage taken" trigger fires it every
    Cooldown whatever you take (an OVERCOUNT as the main skill), and beside a main skill its group is fromItem, never in
    Full DPS (0, an UNDERCOUNT). models.valako_model: the boss's landed hits a second at the "when hit" pace that carry
    Lightning after the build's "taken as" lines (PoB's EnemyDamage / TakenDamage shift and LightningTakenHit), ceil(
    threshold / hit) of them a charge, the next past the Cooldown; as the main skill a DPS "more" of rate / PoB's rate,
    beside it its Bolt set in Full DPS at that rate. MEDIUM.
  sources: [builder/search/models.py (VALAKO_SKILL, valako_rate, valako_model), scratch/mechb38/p3337.log]
  status: proposed

