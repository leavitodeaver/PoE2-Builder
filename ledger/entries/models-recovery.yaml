# Life and Mana recovery lines PoB doesn't parse that builder/search/recovery.py (MECHC12) turns into a rate at the
# build's own events (Assumptions.life_mana_income: kills, Remnants, charm uses, Warcries, Heavy Stuns, Ignites,
# Shocks). The model reads the lines itself, on items and passives, through bridge.sourceLines, so these entries
# record the route for the coverage audit and add nothing (replace: []). The rates go to build.recovery_sources and
# the result's note; the sustain and recovery floors read them once SEARCH merges build.recovery_sources
# (FIX_QUEUE, MECHC12's findings): until then they move the note, not the score.
# PoB parses none of these lines (MECHC12: checked, ModCache nil; this audit's records: status "none" for each, COV17).
#
# Not here, so still counted by nothing: recovery.EVENT_UNREAD (lines no rate reads yet: Power / Endurance Charge
# consumed, Glory, Combo, corpses, Offerings, Revived minions, traps, Rage on Shapeshift, a Mana Flask's use, "Recover
# all Mana when Used"), and Indigon's "Mana Recovery other than Regeneration cannot Recover Mana": recovery.restrict
# zeroes the model's own Mana parts only, not PoB's Mana leech, Mana on hit or Mana flasks (COV17's report, for MECH-C).

- id: recovery-enemy-dies-in-presence
  title: Recover % of maximum Life / Mana when an Enemy dies in your Presence (recovery model, at the boss preset's kills)
  kind: pob_gap
  model: recovery
  match: '^Recover (\d+(?:\.\d+)?)% of your maximum (Life|Mana) when an Enemy dies in your Presence$'
  replace: []
  confidence: reported
  notes: >-
    recovery.on_kill: the % x maximum Life / Mana x the enemies the build kills a second (models.kill_rate: the boss
    preset's adds; 0 against a lone boss). Every add's death taken as in your Presence (LOW). Was
    no-effect-enemy-death-and-recoup until COV17 (now Recoup only).
  sources: ["builder/search/recovery.py (PRESENCE_DEATH, on_kill)", "https://poe2db.tw/us/Heart_of_the_Well"]
  test_in_game: "Kill an add in your Presence with Life missing: Life rises by the % of maximum."
  status: proposed

- id: recovery-remnant-collected
  title: Recover % of Maximum Life / Mana when you collect a Remnant (recovery model, at the build's Remnants)
  kind: pob_gap
  model: recovery
  match: '^Recover (\d+(?:\.\d+)?)% of Maximum (Life|Mana) when you collect a Remnant$'
  replace: []
  confidence: reported
  notes: >-
    recovery.remnant_income: on the Remnants the build's Life / Mana Remnants skills make (their own hit / crit spawn
    timers and on-kill chances), every Remnant taken as collected (MEDIUM-LOW; the play guide says to walk onto each).
    Remnants from other skills aren't counted here (an undercount).
  sources: ["builder/search/recovery.py (REMNANT_PICKUP, remnant_income)", "https://poe2db.tw/us/Vigorous_Remnants"]
  test_in_game: "Collect a Life Remnant with Life missing: Life rises by the Remnant's amount plus the %."
  status: proposed

- id: recovery-charm-own
  title: A charm's Recover N Life / Mana when Used (recovery model, at the charm's uses)
  kind: pob_gap
  model: recovery
  match: '^Recover (\d+(?:\.\d+)?) (Life|Mana) when Used$'
  replace: []
  confidence: reported
  notes: >-
    recovery.charm_income: read from each equipped charm's own lines, x that charm's uses a second
    (flasks.uses_per_second: its trigger and the charges the build gains). On a flask the line would not be read.
  sources: ["builder/search/recovery.py (CHARM_OWN, charm_income)", "builder/search/flasks.py (uses_per_second)"]
  test_in_game: "Trigger the charm with Life missing: Life rises by N."
  status: proposed

