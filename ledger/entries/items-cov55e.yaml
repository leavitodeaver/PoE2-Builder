  kind: pob_gap
  model: aggravate
  match: '^(\(\d+-\d+\)|\d+(?:\.\d+)?)% chance for Bleeding to be Aggravated when Inflicted against Enemies on Jagged Ground$'
  replace: []
  confidence: theory
  notes: >-
    Each Bleed rolls the chance x the build's Jagged Ground share, joined with the other Aggravate sources (MECH104). It
    replaces the retired aggravate-bleed-jagged-ground (pob-gaps-boss.yaml). Its model is AGGRAVATE_MODEL, so aggravate_model's
    own guards (ours / ledger_counts) still count the line. A link only.
  sources: ["builder/search/models.py (PERFORATION, aggravate_model)"]
  status: proposed

