# The mechanics catalog's reviewed entries (builder/ledger/mechanics.py). One entry per game mechanic, not per line.
# Fields: name, terms (other names its lines use), category, game (what the game does) and game_source (poe2db first:
# datamined; checked against the 0.5 dump), pob (none | config-only | partial | wrong | full, checked against PoB's code
# or its calculations: pob_check says how), handling (ours now), plan {approach, how, inputs, sustain}, what_if (visible |
# invisible | n/a), guide_note, impact (1-5: how much damage or defence it moves), effort (S | M | L), configs (PoB options).
# Written 7 Nov 2026 (PoE2 0.5.x data). The line counts, gems and PoB options per mechanic are worked out each run.

# --- Charges and resources -----------------------------------------------------------------------------------------------

- id: charges
  name: Power, Frenzy and Endurance Charges
  terms: [Power Charge, Frenzy Charge, Endurance Charge, Maximum Power Charges, Maximum Frenzy Charges, Maximum Endurance Charges]
  category: charges and resources
  game: "Charges last a duration and come from specific sources (on hit, on crit, on block, every N s, on kill ...); some skills consume them for a bonus."
  game_source: https://poe2db.tw/us/Charges
  game_check: "Duration: PoB's data has 15 s base (CalcSetup ChargeDuration), each charge's own duration modifiers applied (PowerChargesDuration ...); the generator lines and their numbers are the 0.5 dump's own (coverage.json). poe2db's page not yet read for the base duration: to check."
  pob: config-only
  pob_check: "ConfigOptions usePowerCharges / useFrenzyCharges / useEnduranceCharges: the maximum when on; overrideXCharges sets a count, but PoB reads 0 as not set (checked in the engine, 7 Nov)."
  handling: "Model (builder/search/conditions.py _charges_held, 7 Nov): held from the build's sources' gains per second (MECH44, 11 Nov: the game files' KeywordPopups Charges, 'lasts 15 seconds by default, refreshing whenever you gain another charge of the same type', so all drop together after one duration without a gain: conditions.charges_with_refresh, the expected gains since the last such gap at most the maximum, gains taken as random arrivals, assumed; before, min(maximum, gains x duration), as if each charge expired on its own; beside a consumer still the older count, labelled): chance x hits/s on hit, x crits/s on crit, x the boss's hits x block on block, 1/N every N s, none on kill, when you freeze / electrocute / pin / stun the boss, models.immobilise_rate (MECH24: Freeze and Electrocute from PoB's buildup per hit x hits/s with the Arbiter of Ash threshold and the game constants' x6 threshold for 14 / 15 s after each (GameConstants Freeze/ElectrocuteThresholdModifier, ModifierDuration), stuns at heavy_stun_rate with light stuns not counted, Pins from PoB's Pin buildup, 0 when the main skill can't Pin (MECH46: was one per 30 s for every build, an overcount)), a flask's or charm's own 'on use' line at that item's uses (its generated charges / charges per use, at most once per its effect; MECH48), 'when you use a (Life/Mana) Flask' at the build's flasks' uses, 'if an Attack Ignites' at the main Attack's hits x Ignite chance (0 for a non-Attack main skill, other Attacks not counted), 'on reaching maximum Power Charges' 0 while the maximum is held, gains / maximum when all are lost on reaching it, a consumer's spends when one refills it (LOW), Warcry / Totem / Mark events at the build's own skills (MECH47), one per 4 s (LOW) for any other source whose rate its line doesn't give. None held switches the box off. Consumers (cef52f6): skills of PoB type SkillConsumes<Kind>ChargesOnUse spend one per use (the main skill, or a support in its group, at its speed; any other at its group's rate: its cooldown, else its duration, else one per models.PRESS_EVERY s, LOW; MECH48, was one per 4 s); what they spend isn't held, and a consumer whose uses mostly find a charge keeps the charged use counted. Extra charges (MECH44, 11 Nov): 'X% chance when you gain a Charge to gain an additional' multiplies the gain rate by 1 + X% (summed, at most one extra per gain; a random extra Charge a third to each kind, assumed; Charge Profusion I/II's 30% / 15% random on the skills it supports; the per-10-Tribute lines labelled, not counted); 'X% chance that if you would gain Charges, you instead gain up to your maximum' holds the maximum from a fill until the charges drop, labelled and not counted beside a consumer."
  plan: {approach: custom model, how: "Done: generation and consumption. Next: how many charges a consumer spends per use when its line says (one assumed now), and the crit-rate change a what-if makes before the next resolve.", inputs: [hit rate, crit rate, block chance, charge duration, consumers' use rate], sustain: "a source a boss fight feeds"}
  what_if: visible
  what_if_note: "The count is a Configuration value set at each resolve. A support or passive that adds a source gets a real trial (sources.worth probes the count up to its maximum, cef52f6); a what-if that only raises crit or hit rate sees the extra charges from the next resolve."
  guide_note: "Charges counted at N of M: from your sources at your hit and crit rate (no kills on a boss)."
  impact: 5
  effort: M

- id: rage
  name: Rage
  terms: [Maximum Rage, Rage spent]
  category: charges and resources
  game: "Rage builds from hits (usually melee) and decays when not gaining it; each Rage gives a bonus; some skills spend it."
  game_source: https://poe2db.tw/us/Rage
  pob: config-only
  pob_check: "ConfigOptions multiplierRage: a number the user sets."
  handling: "conditions.rage_held (MECH27, 9 Nov): Rage held from the build's gains and spends, by the game files' rule (KeywordPopups Rage: 1 lost per 0.2 s, the loss paused 4 s on a gain or a hit taken, one Hit per 0.5 s gains). Gains per line: on hit / crit / Ignite from the main skill's rates ('on Melee Hit' only when the main skill is Melee, 'on Melee Axe Hit' only with an Axe too: PoB's parse drops the restriction, MECH48), capped at 2 a second and by 'no more than once every # s'; when hit or crit by the boss from its hits that land; regeneration; on kill 0; Warcry gains at the build's Warcries (MECH47), Life Flask gains at its flasks' uses and a flask's or charm's own 'on use' gains at that item's uses (MECH48), Mana-spent gains once per 4 s (assumed, labelled). Spends: Molten Crash, Furious Slam and Rageforged 10 per use, Fury of the Mountain 10 (assumed), Rampage 5/s and Flame Breath 6/s while channelled (and their own hits gain none), at the main skill's uses per second, any other at one per 4 s. The maximum is held while gains outrun spends and gains or landed boss hits come at least once per 4 s; else each gain held 4 s then decaying, averaged; none if spends eat it. Not counted: 'No inherent loss of Rage' lines, Rage Leech, Primal Hunger's regeneration from Rage spent, Rage cost of Vaal skills."
  plan: {approach: custom model, how: "Rage held = min(maximum, gain per hit x hits/s x the time to decay); spending skills reduce it per use.", inputs: [hits per second, Rage per hit, spend per use]}
  what_if: invisible
  guide_note: "Rage counted at its maximum while you keep hitting."
  impact: 3
  effort: S

