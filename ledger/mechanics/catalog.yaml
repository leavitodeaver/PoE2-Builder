- id: damaging-ailments
  name: Ignite, Bleed, Poison, Shock and Chill uptime
  terms: [Ignite, Ignited, Bleeding, Poison, Poisoned, Shock, Shocked, Chill, Chilled, Elemental Ailment]
  category: stun and ailments
  game: "Hits inflict ailments with a chance; damaging ailments deal damage over time; Shock and Chill change damage taken and speed."
  game_source: https://poe2db.tw/us/Ailments
  pob: partial
  pob_check: "PoB calculates ailment damage and magnitudes; the enemy being Shocked / Ignited / Poisoned for conditions is a Configuration box."
  handling: "The resolver turns the boxes on from PoB's chance per hit, the hits that land (uses per second x hit chance) and each ailment's own duration (PoB's {Ailment}Duration with the build's modifiers; else the 0.5 constants Ignite 4 s, Bleed 5 s, Poison 2 s, Shock 8 s): the uptime is the chance at least one hit lands in the duration (conditions.ailment_uptime). Counted at the real share (MECH30, 9 Nov 2026, the user: 'Count the real share'; was all or nothing at 90%): the box is on from 0.5% uptime, and the headline is DPS with every such effect on x the product of (u + (1 - u) x DPS without it / DPS with it) (Search.weigh_uptimes, objective.uptime_factor: one recalculation per effect, refreshed each conditions round, exact at finalize; effects taken as independent, labelled: those adding into one pool, like Shock's and Intimidate's damage taken, interact a little); from 99.5% simply on. The floors are checked with each partial effect off (objective.floor_deltas); the guide shows its uptime, its DPS share and the time-weighted defence. Shock checked (MECH30): KeywordPopups Shock is 20% increased damage taken, 8 s on non-players; PoB adds ShockBase 20 x the skill's Shock magnitude to the enemy's DamageTaken INC while it is Shocked (CalcSetup, CalcPerform), the right pool. Only the main skill's Shocks are counted (other skills' Shocks: an undercount, labelled)."
  game_check: "Base durations from the 0.5 data as PoB reads it (Data/Misc.lua BaseIgniteDuration and the rest); poe2db's ailment pages not yet read against them (Shock 8 s on enemies, 4 s on players, is the dump's)."
  plan: {approach: condition resolver, how: "Done with own durations. Partial uptimes counted at their share (MECH30, Search.weigh_uptimes; PoB's Shock effect option can't lower a Shock, since PoB keeps the larger of it and the skill's own, so it is blended by recalculation instead), with the 'against Ignited' lines at the uptime.", inputs: [chance per hit, hits per second, hit chance, duration]}
  what_if: visible
  guide_note: "Boss Shocked / Ignited counted from your chance per hit."
  impact: 3
  effort: S

