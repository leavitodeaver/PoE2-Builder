# The mechanics catalog's reviewed entries (builder/ledger/mechanics.py). One entry per game mechanic, not per line.
# Fields: name, terms (other names its lines use), category, game (what the game does) and game_source (poe2db first:
# datamined; checked against the 0.5 dump), pob (none | config-only | partial | wrong | full, checked against PoB's code
# or its calculations: pob_check says how), handling (ours now), plan {approach, how, inputs, sustain}, what_if (visible |
# invisible | n/a), guide_note, impact (1-5: how much damage or defence it moves), effort (S | M | L), configs (PoB options).
# Written 7 Nov 2026 (PoE2 0.5.x data). The line counts, gems and PoB options per mechanic are worked out each run.

# --- Charges and resources -----------------------------------------------------------------------------------------------

- id: charges
  name: Power, Frenzy and Endurance Charges
  terms: [Power Charge, Frenzy Charge, Endurance Charge, Maximum Power Charges, Maximum Frenzy Charges, Maximum Endurance Charges]
  category: charges and resources
  game: "Charges last a duration and come from specific sources (on hit, on crit, on block, every N s, on kill ...); some skills consume them for a bonus."
  game_source: https://poe2db.tw/us/Charges
  game_check: "Duration: PoB's data has 15 s base (CalcSetup ChargeDuration), each charge's own duration modifiers applied (PowerChargesDuration ...); the generator lines and their numbers are the 0.5 dump's own (coverage.json). poe2db's page not yet read for the base duration: to check."
  pob: config-only
  pob_check: "ConfigOptions usePowerCharges / useFrenzyCharges / useEnduranceCharges: the maximum when on; overrideXCharges sets a count, but PoB reads 0 as not set (checked in the engine, 7 Nov)."
  handling: "Model (builder/search/conditions.py _charges_held, 7 Nov): held = min(maximum, generation per second x duration) from the build's sources: chance x hits/s on hit, x crits/s on crit, x the boss's hits x block on block, 1/N every N s, none on kill, when you freeze / electrocute / pin / stun the boss, models.immobilise_rate (MECH24: Freeze and Electrocute from PoB's buildup per hit x hits/s with the Arbiter of Ash threshold and the game constants' x6 threshold for 14 / 15 s after each (GameConstants Freeze/ElectrocuteThresholdModifier, ModifierDuration), stuns at heavy_stun_rate with light stuns not counted, Pins one per 30 s assumed since PoB works out no Pin buildup), one per 4 s for a source whose rate its line doesn't give. None held switches the box off. Consumers (cef52f6): skills of PoB type SkillConsumes<Kind>ChargesOnUse spend one per use (the main skill at its speed, any other one per 4 s); what they spend isn't held, and a consumer whose uses mostly find a charge keeps the charged use counted."
  plan: {approach: custom model, how: "Done: generation and consumption. Next: how many charges a consumer spends per use when its line says (one assumed now), and the crit-rate change a what-if makes before the next resolve.", inputs: [hit rate, crit rate, block chance, charge duration, consumers' use rate], sustain: "a source a boss fight feeds"}
  what_if: visible
  what_if_note: "The count is a Configuration value set at each resolve. A support or passive that adds a source gets a real trial (sources.worth probes the count up to its maximum, cef52f6); a what-if that only raises crit or hit rate sees the extra charges from the next resolve."
  guide_note: "Charges counted at N of M: from your sources at your hit and crit rate (no kills on a boss)."
  impact: 5
  effort: M

- id: rage
  name: Rage
  terms: [Maximum Rage, Rage spent]
  category: charges and resources
  game: "Rage builds from hits (usually melee) and decays when not gaining it; each Rage gives a bonus; some skills spend it."
  game_source: https://poe2db.tw/us/Rage
  pob: config-only
  pob_check: "ConfigOptions multiplierRage: a number the user sets."
  handling: "conditions.rage_held (MECH27, 9 Nov): Rage held from the build's gains and spends, by the game files' rule (KeywordPopups Rage: 1 lost per 0.2 s, the loss paused 4 s on a gain or a hit taken, one Hit per 0.5 s gains). Gains per line: on hit / crit / Ignite from the main skill's rates, capped at 2 a second and by 'no more than once every # s'; when hit or crit by the boss from its hits that land; regeneration; on kill 0; Warcry, Life Flask, on use and Mana-spent gains once per 4 s (assumed, labelled). Spends: Molten Crash, Furious Slam and Rageforged 10 per use, Fury of the Mountain 10 (assumed), Rampage 5/s and Flame Breath 6/s while channelled (and their own hits gain none), at the main skill's uses per second, any other at one per 4 s. The maximum is held while gains outrun spends and gains or landed boss hits come at least once per 4 s; else each gain held 4 s then decaying, averaged; none if spends eat it. Not counted: 'No inherent loss of Rage' lines, Rage Leech, Primal Hunger's regeneration from Rage spent, Rage cost of Vaal skills."
  plan: {approach: custom model, how: "Rage held = min(maximum, gain per hit x hits/s x the time to decay); spending skills reduce it per use.", inputs: [hits per second, Rage per hit, spend per use]}
  what_if: invisible
  guide_note: "Rage counted at its maximum while you keep hitting."
  impact: 3
  effort: S

- id: glory
  name: Glory
  terms: [Glory generation, Requires Glory]
  category: charges and resources
  game: "Glory builds from specific actions (hitting with certain skills, Rage at maximum ...); skills that require Glory spend it."
  game_source: https://poe2db.tw/us/Glory
  pob: partial
  pob_check: "PoB calculates Glory skills as if usable at will; no Glory generation rate."
  handling: "models.glory_uses (9 Nov): each Glory skill's cost and sources from the game files (per hit, Heavy Stun, Freeze, Ignite, Shock, Life spent; 20 Glory per event at a boss's Power of 20), events from the main skill. The ledger's GlorySkill lines (one use per 6 s) count only when the build's Glory pays for that rate. Glory skills as main skills stay blocked unless Life-built (usage.py). Not counted: other skills' hits, armour breaks, Ward spent, increased Glory generation, Daresso's Passion. A Glory skill as the main skill (MECH24, Assumptions.glory_main): its uses per second, from the Glory the first other enabled skill (main group, else a Full DPS group) builds, calculated as the main skill for a moment, become its trigger rate (capped at one per cast time); with no other skill, its own hits (assumed to count) make it at will or never. Screening no longer blocks these main skills. Time spent on the builder isn't taken from the builder's DPS (labelled)."
  plan: {approach: custom model, how: "Uses per second = Glory generated per second / Glory per use, from the build's generators; the Glory skill's damage x its use rate.", inputs: [Glory per hit, hits per second, Glory per use]}
  what_if: invisible
  guide_note: "Glory skill used every X s from your Glory generation."
  impact: 4
  effort: M

- id: combo
  name: Combo
  terms: [Combo expended, build Combo]
  category: charges and resources
  game: "Combo builds on hits with certain skills (Monk); Combo-consuming skills require a number of Combo to use."
  game_source: https://poe2db.tw/us/Combo
  pob: partial
  pob_check: "PoB calculates Combo consumers at the Combo they require, as if always reached; no build rate."
  handling: "Checked 9 Nov (MECH29): no Combo count is assumed reached. Skills and supports that need Combo built by other skills (Tempest Bell 4, Mantra of Destruction 8, Combo Finisher I/II 3/5: GrantedEffectStatSets *required_number_of_combo_stacks) are never chosen (usage.py: their use rate isn't modelled; an undercount). PoB's Combo box (multiplierCombo) is never set, so the per-Combo payoffs count 0: Culmination I/II's more Damage per Combo, 'increased Damage per Combo consumed' (also 0 in game while the main skill is used back to back: other Strikes build it); Vruun's Inevitability's area per Combo isn't mapped in PoB either. Extra-Combo lines are absorbed (absorbed_by): nothing they speed up is counted. Undercount until the rotation model (plan) exists."
  plan: {approach: custom model, how: "Consumer uses per second = Combo per second / Combo required; damage x that rate in Full DPS.", inputs: [hits per second, Combo per hit, required Combo]}
