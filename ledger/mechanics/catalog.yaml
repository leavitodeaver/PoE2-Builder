- id: infusions
  name: Elemental Infusions and Remnants
  terms: [Infusion, Elemental Infusion, Remnant, Remnants, Infused, Verisium Infusion]
  category: charges and resources
  game: "Some skills create Remnants that grant an Infusion when collected; Infused skills consume it for a stronger version."
  game_source: https://poe2db.tw/us/Elemental_Infusion
  pob: config-only
  pob_check: "Infused stat sets are PoB stat sets the user picks; no Infusion supply."
  handling: "A Fire-, Cold- or Lightning-Infused stat set (Ball Lightning, Comet, Frost Wall, Ice Nova, Spark) is a choice only while the build makes that element's Infusions on a lone boss, its damage counted as plain + share x the Infused gain, share = Infusions per second / casts per second (Gems.choose_active_skill, Assumptions.infusion_share, assumptions.infusion_supply, 9 Nov). Sources by the game files' skill descriptions: Frost Bomb Cold, Orb of Storms Lightning, Living Bomb Fire (assumed one seed per 5 s), Snap the element of the ailment it consumes (each ailment at its share of the fight, MECH36: Snap finds one when any is up, the element split by uptime); Elemental Equilibrium shifts their element; additional Infusion Remnants and Infusions, Storm's Recollection, another-different-Infusion chances (assumed either other element) and timed Verisium Infusions (any element) add to it; chances not to remove an Infusion lower the need. Siphon Elements adds Cold Infusions, one per Freeze of the boss (5% per Power, 20 Power; Freezes from models.buildup_rate, 9 Nov). Not counted yet (named as undercounts): Siphon Elements' Ignite/Shock Infusions, Powered by Verisium (Ward spent), on-kill Verisium Remnants, the Archon-conditional keep chance. With no source the result says the Infused cast isn't counted (assumptions.INFUSED_NOTE; was an overcount, chosen by score alone). Explosive Transmutation's trigger rate sums every Remnant source the build has (assumptions.REMNANT_SOURCES, 13 sources found by an exhaustive game-files search, 8 Nov): Into the Breach, Wildwood's Gifts, Sanguine Revelry, Mana and Life Remnants, Snap, Frost Bomb, Orb of Storms at the files' level-20 rates; Lingering Illusion, Living Bomb, Grim Feast (at the build's own minion-kill rate, models.minion_deaths: no flat rate) and Remnants of Kalguur at labelled assumed cadences, Kalguur's capped at one per 3 s (its ward_remnants_spawn_remnant_on_stun_cooldown_ms; uncapped it was an overcount, 9 Nov); Siphon Elements one per Freeze of the boss (assumptions.siphon_freezes); kill-only sources (Rip, Runic Extraction) none. Additional-Remnant chances and Storm's Recollection (each Remnant collected twice) multiply the supply, and so does the chance for Remnants you pick up to count as an additional one (created_remnants_have_%_chance_to_duplicate_pick_up_results: Empowering Remnants, item suffixes; also multiplies Infusions; 9 Nov); the explosion's cooldown caps it. Re-searched 9 Nov (MECH26): every table and stat-description line of build 26476662 naming Remnant; no source beyond these. 'If you have consumed an Elemental Infusion Recently' (Empowering Infusions, Infused Spell Damage; PoB's InfusionConsumedRecently box, set by nothing before 12 Nov) is on at the share of the fight an Infusion was consumed in the past 4 s: the build's consumers (conditions.INFUSION_CONSUMERS, the 13 player skills whose stat sets hold active_skill_consumes_<element>_infusion in the game files: the main skill at its casts, others at their group's rate) take the same supply, at most one per cast, consumptions taken as evenly random (LOW; MECH49)."
  plan: {approach: custom model, how: "Infusions per second from the build's Remnant sources (rates per source, as Explosive Transmutation's); an Infused stat set counts at uses per second = min(supply, use rate).", inputs: [Remnant sources, pickup assumption]}
  what_if: invisible
  guide_note: "Infused casts counted on the share of casts your Infusion Remnants cover (you collect each as it appears)."
  impact: 4
  effort: M

