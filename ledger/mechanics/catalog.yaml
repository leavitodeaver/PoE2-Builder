  game_source: https://poe2db.tw/us/Freeze
  pob: config-only
  pob_check: "conditionEnemyFrozen / Electrocuted / Pinned / Immobilised are boxes PoB never sets from the build."
  handling: "Frozen and Electrocuted (MECH38): each box at the share of the fight the boss carries it (models.immobilised_share): the main skill's buildup per hit x hits/s against the Arbiter of Ash's threshold, 4 s Frozen (x FreezeDurationMod) / 5 s Electrocuted (KeywordPopups), the threshold x6 for 14 / 15 s after each, buildup paused while it lasts (the user, 11 Nov 2026; the game files don't say: MEDIUM); so Electrocution's damage taken, the per-Elemental-Ailment-type lines and every against-Frozen/Electrocuted line count at that share. Other skills' buildup isn't counted (an undercount). Pinned and Immobilised boxes: still never set (labelled). Electrocuting Arrow's Rods (MECH40, RULE_AUDIT 13): PoB counts the Rod's quality stats (Targets with attached Rods take X% increased damage; extra Lightning against debuffed targets) always on; models.rod_model scales them (a skill-tagged DebuffEffect / BuffEffect MORE) to the share a Rod is attached: each Electrocute removes it until Electrocuting Arrow's next hit (0.5 / hits per second as the main skill; 0.5 s + its use time when pressed), Electrocutes from the main skill's buildup; a Rod attaching during Electrocution is UNVERIFIED. The Rod making all Lightning damage build up Electrocution isn't modelled (an undercount)."
  plan: {approach: custom model, how: "As heavy-stun: buildup per second against the boss's ailment threshold gives how often and how long it is immobilised; 'against Frozen / Immobilised' lines count at that uptime.", inputs: [buildup, threshold, durations]}
  what_if: invisible
