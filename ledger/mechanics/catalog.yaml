  plan: {approach: custom model, how: "Next: Cast on Dodge (dodge rolls per fight assumed from the boss's telegraphed hits), Barrier Invocation (Energy Shield damage taken per second from the boss's hits), Cast on Charm Use (charm uses from the flask model), Ritual Cadence; Energy from the gem's own level instead of level 20.", inputs: [crits/s, ailments/s, blocks/s, melee hits/s, casts/s, heavy stuns, Energy multipliers]}
  what_if: visible
  guide_note: "Triggered spells counted at X per second from your Energy."
  impact: 4
  effort: M

