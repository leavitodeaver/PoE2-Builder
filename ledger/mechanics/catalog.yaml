  name: Exposure, Withered and Curses
  terms: [Exposure, Withered, Curse, Curses, Curse Magnitudes, Hex, Mark]
  category: stun and ailments
  game: "Debuffs that raise damage taken or lower resistances; Withered stacks to 10 (5% chaos damage taken each)."
  game_source: https://poe2db.tw/us/Withered
  pob: partial
  pob_check: "PoB applies curses the build has; Exposure and Withered are Configuration options."
  handling: "Exposure (MECH28, 9 Nov 2026): conditions._exposure_uptime rates each line's uptime per element, 1 - (1 - chance)^(events x 4 s) (KeywordPopups Exposure: -20%, 4 s by default), events from the main skill's hits, crits, Shocks and Ignites (PoB's chance per hit), Full Breaks of the boss's Armour (armour_broken_share), and 'to Enemies 3 metres in front of you' while the boss stands that close; 'Elemental Exposure' counts for all three; counted at its uptime (the real share, MECH30, as the ailments entry). Not read (labelled): Exposure duration modifiers, other trigger wordings (0); a line's own condition (Devotion, socketed jewels) is left to PoB, which applies the box only with a source it accepts. Withered stacks from the build's lines (chance x hits x duration; 10 with Blackflame). Curses (MECH33, 10 Nov 2026): PoB counts every enabled curse always up and sets the enemy Cursed with any curse or Mark. models.curse_uses rates each by how the build applies it: cast by hand, recast every 7.4 s (base_skill_effect_duration at level 20; 1.5 s curse delay; game files), always up, its cast time taken from the main skill as less Attack and Cast Speed; in a Blasphemy group an Aura on enemies 'nearby', taken as your Presence (up while the boss stands inside it); with a Meta gem, triggered and assumed applied when needed (labelled); 'Curse ... with X on Hit' while the main skill hits. A curse's effect is scaled to its share; 'Enemies you Curse take X% increased Damage', '... have X% to Chaos Resistance' and 'increased duration of Ailments against Cursed Enemies' count at the share the boss is cursed (0 with a Mark alone); chance lines against Cursed enemies aren't scaled (listed). Not read: curse duration and delay modifiers, the level cap of gems under 18, Blasphemy's base radius stat, 'if 75% of Curse Duration expired'. Predator's Mark (MECH34, models.mark_model): Pounce with no Mark gem in it; 3% increased damage taken per enemy of the boss within 6 m, up to 45% (game files), counted as you (when the boss's distance is 6 m or less) plus PoB's count of your minions at their limit (assumed within 6 m), where PoB counts the minions only; marked while Pounce is recast as it runs out (8 s), each Cross Slash consumes it; 0 when PoB disables Pounce for the wrong weapon (PoB still applies it). The mark round tries Pounce alone."
  plan: {approach: condition resolver, how: "Done for Withered and Exposure; Exposure duration modifiers next.", inputs: [application rate, duration]}
  what_if: invisible
  guide_note: "Withered N stacks; Exposure up X%."
