- id: heavy-stun
  name: Heavy Stun
  terms: [Stun Buildup, Heavy Stunned, Primed for Stun, Crushing Blow, Stun Threshold, Daze, Dazed]
  category: stun and ailments
  game: "Hits build stun on the target relative to its stun threshold (Physical and melee 50% more each); a Unique is Primed at 70%; a Heavy Stun follows when full."
