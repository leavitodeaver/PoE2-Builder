  handling: "Custom model (models.energy_model) for Cast on Critical, Cast on Elemental Ailment, Elemental Invocation; Cast on Block (Svalinn; 25 Energy per block of the boss's hits that land), Thundergod's Wrath (Mjolner; 3 per Power per melee hit), Spellslinger (Dueling Wand; 0.2 per 10 ms of the cast spell's base cast time), Barrier Invocation (gem, and on Lament Amulet; 1 Energy per 10 Energy Shield the boss's hits take after mitigation, each damage type weighted by its share of the boss's hits, boss_hits.type_taken: MECHB9, it had counted one hit of every type at once, an overcount), and (7 Nov) Cast on Dodge: 2 Energy per metre (its in-game text) over the dodge roll's base 4.6 m (dodge_roll_base_travel_distance 46 units, game files; the user had heard 3.7 m), at the user's default of one roll per 2 s against a boss; a build counting on it loses the roll time (0.75 s per roll, DodgeRollPlayer's cast time) from its main skill as less Attack and Cast Speed; both said in the guide. Reaper's Invocation (MECHB9): 30 Energy per monster Power per Melee kill (melee_kill_invocation_gain_X_centienergy_per_monster_power_on_melee_kill 3000), only with a Melee Attack main skill, at the add kill rate (build.kills' enemies only; an add's Power assumed 1, KeywordPopups Power, LOW): 0 against a lone boss. Cast on Minion Death (MECH44, 11 Nov; before, none on a boss): 50 Energy per Persistent minion Killed (its description; KeywordPopups MinionDeath: expiring or despawned minions aren't Killed; the minion's Power at 100% assumed, LOW), at the rate the build itself kills them (models.minion_deaths, MECH45; the flat one every 10 s is gone, the user 11 Nov): Sacrifice with a corpse-consuming main skill (one minion per use, LOW), Explosive Demise on its cooldown (LOW), capped by Reviving (7.5 s after the last death); 0 with a note when nothing in the build kills its minions. Not counted yet (undercounts): the boss killing minions, damage taken for you, Dark Pact, Offerings, the search adding a source on purpose. Deprecated by the game files and poe2db together: Curse on Block, Cast on Melee Stun, Cast on Melee Kill. Inventory from the 0.5 game files (docs/GAMEFILES.md): 25 live Meta gems, 17 socketable. The search proposes Cast on Critical, Cast on Elemental Ailment (Energy: 1 per Power per Shock or Ignite, 10 per Freeze of the boss at models.buildup_rate, MECH41, game files) and Cast on Dodge with a spell (Gems.meta_round, candidates from the gem data); every other Meta gem is reported with why (models.meta_handling: not modeled yet, no Energy on a boss, or not a trigger the search sets up yet), and PLAN.md has the slices for the rest. Ritual Cadence: not modeled yet. The main skill's own active_skill_energy_generated_+%_final (Incinerate and Wyvern Flame Breath -98, Flame Wall and Solar Orb -50; game files, PoB reads none) scales the Energy its hits, crits, ailments and casts earn (MECHB4; its reach UNVERIFIED: no game text); an Invocation never triggers a spell costing more than its 500 Energy store (MECHB4)."
