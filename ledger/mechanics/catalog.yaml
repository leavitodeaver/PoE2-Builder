  impact: 3
  effort: M

- id: infusions
  name: Elemental Infusions and Remnants
  terms: [Infusion, Elemental Infusion, Remnant, Remnants, Infused, Verisium Infusion]
  category: charges and resources
  game: "Some skills create Remnants that grant an Infusion when collected; Infused skills consume it for a stronger version."
  game_source: https://poe2db.tw/us/Elemental_Infusion
  pob: config-only
  pob_check: "Infused stat sets are PoB stat sets the user picks; no Infusion supply."
  handling: "A Fire-, Cold- or Lightning-Infused stat set (Ball Lightning, Comet, Frost Wall, Ice Nova, Spark) is a choice only while the build makes that element's Infusions on a lone boss, its damage counted as plain + share x the Infused gain, share = Infusions per second / casts per second (Gems.choose_active_skill, Assumptions.infusion_share, assumptions.infusion_supply, 9 Nov). Sources by the game files' skill descriptions: Frost Bomb Cold, Orb of Storms Lightning, Living Bomb Fire (assumed one seed per 5 s), Snap the element of the ailment it consumes (split between those the build keeps up); Elemental Equilibrium shifts their element; additional Infusion Remnants and Infusions, Storm's Recollection, another-different-Infusion chances (assumed either other element) and timed Verisium Infusions (any element) add to it; chances not to remove an Infusion lower the need. Siphon Elements adds Cold Infusions, one per Freeze of the boss (5% per Power, 20 Power; Freezes from models.buildup_rate, 9 Nov). Not counted yet (named as undercounts): Siphon Elements' Ignite/Shock Infusions, Powered by Verisium (Ward spent), on-kill Verisium Remnants, the Archon-conditional keep chance. With no source the result says the Infused cast isn't counted (assumptions.INFUSED_NOTE; was an overcount, chosen by score alone). Explosive Transmutation's trigger rate sums every Remnant source the build has (assumptions.REMNANT_SOURCES, 13 sources found by an exhaustive game-files search, 8 Nov): Into the Breach, Wildwood's Gifts, Sanguine Revelry, Mana and Life Remnants, Snap, Frost Bomb, Orb of Storms at the files' level-20 rates; Lingering Illusion, Living Bomb, Grim Feast (with minions) and Remnants of Kalguur at labelled assumed cadences, Kalguur's capped at one per 3 s (its ward_remnants_spawn_remnant_on_stun_cooldown_ms; uncapped it was an overcount, 9 Nov); Siphon Elements one per Freeze of the boss (assumptions.siphon_freezes); kill-only sources (Rip, Runic Extraction) none. Additional-Remnant chances and Storm's Recollection (each Remnant collected twice) multiply the supply, and so does the chance for Remnants you pick up to count as an additional one (created_remnants_have_%_chance_to_duplicate_pick_up_results: Empowering Remnants, item suffixes; also multiplies Infusions; 9 Nov); the explosion's cooldown caps it. Re-searched 9 Nov (MECH26): every table and stat-description line of build 26476662 naming Remnant; no source beyond these."
  plan: {approach: custom model, how: "Infusions per second from the build's Remnant sources (rates per source, as Explosive Transmutation's); an Infused stat set counts at uses per second = min(supply, use rate).", inputs: [Remnant sources, pickup assumption]}
  what_if: invisible
  guide_note: "Infused casts counted on the share of casts your Infusion Remnants cover (you collect each as it appears)."
  impact: 4
  effort: M

- id: energy
  name: Meta-skill Energy and Invocations
  terms: [Energy, Invocation, Invoked, Cast on Critical, Cast on Elemental Ailment, Curse on Block, Cast on Melee Stun]
  category: charges and resources
  game: "Meta gems gain Energy from their condition and trigger socketed spells when full."
  game_source: https://poe2db.tw/us/Energy
  pob: partial
  pob_check: "PoB counts the socketed spells at their full self-cast rate."
  handling: "Custom model (models.energy_model) for Cast on Critical, Cast on Elemental Ailment, Elemental Invocation; Cast on Block (Svalinn; 25 Energy per block of the boss's hits that land), Thundergod's Wrath (Mjolner; 3 per Power per melee hit), Spellslinger (Dueling Wand; 0.2 per 10 ms of the cast spell's base cast time), Barrier Invocation (gem, and on Lament Amulet; 1 Energy per 10 Energy Shield the boss's hits take after mitigation), and (7 Nov) Cast on Dodge: 2 Energy per metre (its in-game text) over the dodge roll's base 4.6 m (dodge_roll_base_travel_distance 46 units, game files; the user had heard 3.7 m), at the user's default of one roll per 2 s against a boss; a build counting on it loses the roll time (0.75 s per roll, DodgeRollPlayer's cast time) from its main skill as less Attack and Cast Speed; both said in the guide. Energy on kills (Reaper's Invocation) and minion deaths (Cast on Minion Death) counts none on a boss. Deprecated by the game files and poe2db together: Curse on Block, Cast on Melee Stun, Cast on Melee Kill. Inventory from the 0.5 game files (docs/GAMEFILES.md): 25 live Meta gems, 17 socketable. The search proposes Cast on Critical, Cast on Elemental Ailment and Cast on Dodge with a spell (Gems.meta_round, candidates from the gem data); every other Meta gem is reported with why (models.meta_handling: not modeled yet, no Energy on a boss, or not a trigger the search sets up yet), and PLAN.md has the slices for the rest. Ritual Cadence: not modeled yet."
  game_check: "Energy per event from the 0.5 skill data as PoB reads it (constantStats ..._centienergy_..., 100 centienergy = 1 Energy; energy_generated_+% at level 20 plus quality 20), checked against poe2db's gem pages and the game files (7 Nov: Cast on Dodge and Cast on Critical +57% at level 20)."
  plan: {approach: custom model, how: "Next: Cast on Dodge (dodge rolls per fight assumed from the boss's telegraphed hits), Barrier Invocation (Energy Shield damage taken per second from the boss's hits), Cast on Charm Use (charm uses from the flask model), Ritual Cadence; Energy from the gem's own level instead of level 20.", inputs: [crits/s, ailments/s, blocks/s, melee hits/s, casts/s, heavy stuns, Energy multipliers]}
  what_if: visible
  guide_note: "Triggered spells counted at X per second from your Energy."
  impact: 4
  effort: M

# --- Stun, ailments and debuffs ------------------------------------------------------------------------------------------

- id: heavy-stun
  name: Heavy Stun
  terms: [Stun Buildup, Heavy Stunned, Primed for Stun, Crushing Blow, Stun Threshold, Daze, Dazed]
  category: stun and ailments
  game: "Hits build stun on the target relative to its stun threshold (Physical and melee 50% more each); a Unique is Primed at 70%; a Heavy Stun follows when full."
  game_source: https://poe2db.tw/us/Heavy_Stun
  pob: config-only
  pob_check: "conditionEnemyHeavyStunned is a box. PoB computes a hit's buildup (HeavyStunBuildupAvg) against its Pinnacle preset's threshold, but counts Cold (the game says Cold builds none), uses x9.38 for Xesht where the game files' variety has x17.00, and ignores the +500% threshold for 16.5 s after a Heavy Stun (game constants HeavyStunThresholdModifier/ModifierDuration)."
  handling: "models.heavy_stun_rate (9 Nov): Heavy Stuns per second from the main skill's own buildup, PoB's three faults corrected; used by Guided Hand, Remnants of Kalguur and Glory from Heavy Stuns. The boss is the Arbiter of Ash (the game files' x12.35 threshold; the user's choice, 9 Nov), not Xesht's x17.00. Other skills' buildup, the bar's decay and the first stun's shorter wait aren't counted; 'against Heavy Stunned' / Primed lines still need the box."
  plan: {approach: custom model, how: "Buildup per second = hit damage x buildup modifiers / the boss's stun threshold (the boss's life from a table by area level, a labelled assumption); Heavy Stuns per second and their duration give the uptime of 'Heavy Stunned' and 'Primed'.", inputs: [hit damage, buildup modifiers, boss life table], sustain: "enough buildup to fill the bar"}
  what_if: invisible
  guide_note: "Boss Heavy Stunned X% of the fight (one per Y s) at your stun buildup."
  impact: 4
  effort: L

